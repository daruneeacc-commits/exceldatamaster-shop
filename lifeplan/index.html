/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>iso(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
const th=s=>{if(!s)return'';const d=pd(s);return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543)};
const thym=m=>{const[y,mm]=m.split('-').map(Number);return TH_MF[mm-1]+' '+(y+543)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const money=n=>(+n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- calcs ---------- */
function monthSum(m){const tin=D.tx.filter(x=>x.type==='in'&&x.date.startsWith(m)),tout=D.tx.filter(x=>x.type==='out'&&x.date.startsWith(m)),sl=D.sales.filter(x=>x.date.startsWith(m));
 const inc=sum(tin,x=>x.amt)+sum(sl,x=>x.amt),out=sum(tout,x=>x.amt);return{inc,out,net:inc-out,sales:sum(sl,x=>x.amt),tout}}
function hDone(id,d){return(D.hlog[d]||[]).includes(id)}
function streak(id){let d=TODAY(),n=0;if(!hDone(id,d))d=addD(d,-1);while(hDone(id,d)){n++;d=addD(d,-1)}return n}
