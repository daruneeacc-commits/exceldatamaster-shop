<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่เต็ม?)");return false}}};
const K={emps:"edm_att_emps",rec:"edm_att_rec",cfg:"edm_att_cfg",ui:"edm_att_ui"};
const CODES=["P","S","A","L"],CN={P:"มา",S:"สาย",A:"ขาด",L:"ลา"},CC={P:"#1E9E5A",S:"#C98A12",A:"#D64545",L:"#2F72C4"};
const WD=["อา","จ","อ","พ","พฤ","ศ","ส"],MN=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],MF=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
let E=LS.get(K.emps,[])||[],R=LS.get(K.rec,{})||{},C=Object.assign({name:"",off:[0],hol:{},demo:false},LS.get(K.cfg,{})||{});
const pad=n=>String(n).padStart(2,"0"),todayS=()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
let ui=Object.assign({v:innerWidth<700?"today":"month",m:todayS().slice(0,7),day:todayS(),br:"cy",dep:""},LS.get(K.ui,{})||{});
if(!ui.m)ui.m=todayS().slice(0,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const save=()=>{LS.set(K.emps,E);LS.set(K.rec,R)},saveC=()=>LS.set(K.cfg,C),saveUi=()=>LS.set(K.ui,ui);
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function dim(ym){const[y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()}
function wdOf(ym,d){const[y,m]=ym.split("-").map(Number);return new Date(y,m-1,d).getDay()}
function isOff(ym,d){return C.off.includes(wdOf(ym,d))||!!C.hol[ym+"-"+pad(d)]}
function mAdd(ym,n){let[y,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)}
function mLabel(ym){const[y,m]=ym.split("-").map(Number);return MF[m-1]+" "+(y+543)}
function get(ym,id,d){const s=(R[ym]||{})[id];return s?(s[d-1]||".").replace(".",""):""}
function put(ym,id,d,v){R[ym]=R[ym]||{};let s=(R[ym][id]||"").padEnd(dim(ym),".").split("");s[d-1]=v||".";R[ym][id]=s.join("");if(!/[PSAL]/.test(R[ym][id]))delete R[ym][id];if(C.demo){C.demo=false;saveC()}}
const act=()=>E.filter(e=>!e.x),depts=()=>[...new Set(E.map(e=>e.dept).filter(Boolean))];
const fil=()=>act().filter(e=>!ui.dep||e.dept===ui.dep);
function lastDay(ym){const t=todayS();if(ym<t.slice(0,7))return dim(ym);if(ym>t.slice(0,7))return 0;return +t.slice(8)}
function cnt(ym,id){const o={P:0,S:0,A:0,L:0};const s=(R[ym]||{})[id]||"";for(const ch of s)if(o[ch]!=null)o[ch]++;return o}
function sum(ym,list){const o={P:0,S:0,A:0,L:0};list.forEach(e=>{const c=cnt(ym,e.id);CODES.forEach(k=>o[k]+=c[k])});o.come=o.P+o.S;o.all=o.P+o.S+o.A+o.L;o.rate=o.all?o.come/o.all*100:0;return o}
const pct=v=>(Math.round(v*10)/10).toFixed(1)+"%";
function workDays(ym,upto){let n=0;for(let d=1;d<=upto;d++)if(!isOff(ym,d))n++;return n}

/* ---------- หน้า ---------- */
function render(){$$("#tabs [data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===ui.v));const M=$("#main");
  if(!E.length&&ui.v!=="set"&&ui.v!=="emps"){M.innerHTML=`<div class="card" style="text-align:center;align-items:center;padding:34px 16px"><div style="font-size:3rem">✅</div><h2 style="justify-content:center">เริ่มเช็กชื่อพนักงานกันเลย</h2><p class="note" style="max-width:460px;margin:0">เพิ่มรายชื่อพนักงาน (วางจาก Excel ได้ทีเดียวทั้งหมด) แล้วแตะช่องในตารางเพื่อใส่ มา · ขาด · ลา · สาย ระบบสรุปรายเดือนให้อัตโนมัติ</p><div class="bar" style="justify-content:center"><button class="btn main" id="e0">＋ เพิ่มพนักงาน</button><button class="btn ghost" id="p0">📋 วางรายชื่อจาก Excel</button><button class="btn ghost" id="d0">✨ ดูข้อมูลตัวอย่าง</button></div></div>`;$("#e0").onclick=()=>empDlg();$("#p0").onclick=pasteDlg;$("#d0").onclick=demo;return}
  ({today:vToday,month:vMonth,dash:vDash,emps:vEmps,set:vSet}[ui.v]||vMonth)(M)}
function depSel(){const D=depts();if(!D.length)return"";return`<select class="in-" id="dep" style="width:auto"><option value="">ทุกแผนก</option>${D.map(d=>`<option${d===ui.dep?" selected":""}>${esc(d)}</option>`).join("")}</select>`}
function bindDep(){const s=$("#dep");if(s)s.onchange=()=>{ui.dep=s.value;saveUi();render()}}
function hello(t,sub){return`<div class="hello"><div><h1>${esc(t)}</h1><p>${sub}</p></div></div>`}

function vToday(M){const ds=ui.day||todayS(),ym=ds.slice(0,7),d=+ds.slice(8),L=fil(),o={P:0,S:0,A:0,L:0,"":0};L.forEach(e=>o[get(ym,e.id,d)]++);
  const dt=new Date(ds+"T00:00"),off=isOff(ym,d),hn=C.hol[ds];
  M.innerHTML=`${hello((C.name?C.name+" · ":"")+"เช็กชื่อวันนี้",`วัน${["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][dt.getDay()]}ที่ ${d} ${MF[dt.getMonth()]} ${dt.getFullYear()+543}${off?` · <b style="color:var(--S)">${hn?esc(hn):"วันหยุด"}</b>`:""}`)}
  <div class="card"><div class="bar"><button class="btn ghost sm" id="dp">‹</button><input type="date" class="in-" id="dd" value="${ds}" style="width:auto"><button class="btn ghost sm" id="dn">›</button><button class="btn ghost sm" id="dt">วันนี้</button>${depSel()}<span style="flex:1"></span><button class="btn main" id="all">✓ ที่เหลือ = มาทั้งหมด</button></div>
  <div class="cnt"><span style="color:var(--P)">มา ${o.P}</span><span style="color:var(--S)">สาย ${o.S}</span><span style="color:var(--A)">ขาด ${o.A}</span><span style="color:var(--L)">ลา ${o.L}</span><span style="color:var(--muted)">ยังไม่เช็ก ${o[""]}</span></div>
  <div class="dl">${L.map(e=>{const v=get(ym,e.id,d);return`<div class="de ${v}" data-id="${e.id}"><span class="av">${esc((e.name||"?").replace(/^(นาย|นางสาว|นาง|น\.ส\.)\s*/,"").slice(0,1))}</span><div class="t"><b>${esc(e.name)}</b><small>${esc([e.code,e.dept].filter(Boolean).join(" · "))}</small></div><div class="seg">${CODES.map(k=>`<button type="button" class="${k}${v===k?" on":""}" data-k="${k}">${k}<small>${CN[k]}</small></button>`).join("")}</div></div>`}).join("")}</div>
  <p class="note">แตะปุ่มอีกครั้งเพื่อลบ · P มา · S สาย (นับเป็นมา) · A ขาด · L ลา</p></div>`;
  const go=s=>{ui.day=s;saveUi();render()};const sh=n=>{const x=new Date(ds+"T00:00");x.setDate(x.getDate()+n);go(x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()))};
  $("#dp").onclick=()=>sh(-1);$("#dn").onclick=()=>sh(1);$("#dt").onclick=()=>go(todayS());$("#dd").onchange=e=>e.target.value&&go(e.target.value);bindDep();
  $("#all").onclick=()=>{let n=0;L.forEach(e=>{if(!get(ym,e.id,d)){put(ym,e.id,d,"P");n++}});save();render();toast(n?`ใส่ "มา" ให้ ${n} คน`:"ทุกคนเช็กแล้ว")};
  $$(".de .seg button").forEach(b=>b.onclick=()=>{const id=b.closest(".de").dataset.id,k=b.dataset.k;put(ym,id,d,get(ym,id,d)===k?"":k);save();render()});
}

function vMonth(M){const ym=ui.m,n=dim(ym),L=fil(),t=todayS(),td=t.slice(0,7)===ym?+t.slice(8):0,S=sum(ym,L);
  const hd=[...Array(n)].map((_,i)=>i+1);
  M.innerHTML=`${hello("ตารางเช็กชื่อรายเดือน",`${mLabel(ym)} · ${L.length} คน · วันทำงาน ${workDays(ym,n)} วัน · อัตรามาทำงาน <b>${pct(S.rate)}</b>`)}
  <div class="card"><div class="bar"><div class="mnav"><button class="btn ghost sm" id="mp">‹</button><b>${mLabel(ym)}</b><button class="btn ghost sm" id="mn">›</button></div>${depSel()}
  <div class="brush noprint" id="brush" title="เลือกแล้วแตะช่อง">${[["cy","🔁 วน"],["P","P มา"],["S","S สาย"],["A","A ขาด"],["L","L ลา"],["","⌫ ลบ"]].map(([k,l])=>`<button type="button" data-b="${k}" class="${ui.br===k?"on":""}">${l}</button>`).join("")}</div>
  <span style="flex:1"></span><button class="btn sm main noprint" id="fill">✓ เติม "มา" ช่องว่างถึงวันนี้</button><button class="btn sm ghost noprint" id="csv">⬇ CSV</button><button class="btn sm ghost noprint" id="prt">🖨 พิมพ์</button></div>
  <div class="tw"><table class="gr" id="gr"><thead><tr><th class="st" rowspan="2">รหัส</th><th class="st2" rowspan="2">ชื่อพนักงาน</th>${hd.map(d=>`<th class="${isOff(ym,d)?"off":""}${d===td?" td":""}">${d}</th>`).join("")}${CODES.map(k=>`<th class="sm ${k}" rowspan="2">${k}</th>`).join("")}<th class="pc" rowspan="2">%มา</th></tr>
  <tr>${hd.map(d=>`<th class="wd ${isOff(ym,d)?"off":""}" title="${esc(C.hol[ym+"-"+pad(d)]||"")}">${WD[wdOf(ym,d)]}</th>`).join("")}</tr></thead>
  <tbody>${L.map(e=>{const c=cnt(ym,e.id),all=c.P+c.S+c.A+c.L;return`<tr data-id="${e.id}"><td class="st">${esc(e.code||"")}</td><td class="st2" title="${esc(e.name)}">${esc(e.name)}</td>${hd.map(d=>{const v=get(ym,e.id,d);return`<td class="c ${v}${isOff(ym,d)?" off":""}" data-d="${d}">${v||(isOff(ym,d)?"·":"")}</td>`}).join("")}${CODES.map(k=>`<td class="sm ${k}">${c[k]||""}</td>`).join("")}<td class="pc">${all?pct((c.P+c.S)/all*100):"–"}</td></tr>`}).join("")}</tbody>
  <tfoot><tr><td class="st"></td><td class="st2">มา / ทั้งหมด</td>${hd.map(d=>{let a=0,b=0;L.forEach(e=>{const v=get(ym,e.id,d);if(v){b++;if(v==="P"||v==="S")a++}});return`<td${isOff(ym,d)?' class="off"':""}>${b?a:""}</td>`}).join("")}${CODES.map(k=>`<td class="sm ${k}">${S[k]}</td>`).join("")}<td class="pc">${pct(S.rate)}</td></tr></tfoot></table></div>
  <div class="leg"><span><i class="cd P">P</i>มา</span><span><i class="cd S">S</i>สาย</span><span><i class="cd A">A</i>ขาด</span><span><i class="cd L">L</i>ลา</span><span><i class="cd" style="background:var(--off);color:#9AA6B2">·</i>วันหยุด (ตั้งได้ที่ ⚙️)</span><span class="hide-m">แตะช่องเพื่อเปลี่ยน · ลากผ่านหลายช่องได้เมื่อเลือก P/S/A/L</span></div></div>`;
  $("#mp").onclick=()=>{ui.m=mAdd(ym,-1);saveUi();render()};$("#mn").onclick=()=>{ui.m=mAdd(ym,1);saveUi();render()};bindDep();
  $$("#brush [data-b]").forEach(b=>b.onclick=()=>{ui.br=b.dataset.b;saveUi();$$("#brush [data-b]").forEach(x=>x.classList.toggle("on",x===b))});
  const gr=$("#gr");let drag=false;
  const paint=(td,first)=>{const id=td.parentNode.dataset.id,d=+td.dataset.d,cur=get(ym,id,d);let v=ui.br;if(v==="cy"){if(!first)return;v=CODES[(CODES.indexOf(cur)+1)]||"";if(!cur)v="P"}put(ym,id,d,v);td.className="c "+v+(isOff(ym,d)?" off":"");td.textContent=v||(isOff(ym,d)?"·":"")};
  gr.addEventListener("pointerdown",e=>{const td=e.target.closest("td.c");if(!td)return;drag=ui.br!=="cy";paint(td,true);if(drag)e.preventDefault()});
  gr.addEventListener("pointerover",e=>{if(!drag)return;const td=e.target.closest("td.c");if(td)paint(td,false)});
  const end=()=>{drag=false;save();clearTimeout(vMonth.t);vMonth.t=setTimeout(()=>{if(ui.v==="month"){const sx=$(".tw")?$(".tw").scrollLeft:0,sy=$(".tw")?$(".tw").scrollTop:0;render();const w=$(".tw");if(w){w.scrollLeft=sx;w.scrollTop=sy}}},700)};
  gr.addEventListener("pointerup",end);gr.addEventListener("pointerleave",()=>{if(drag)end()});
  $("#fill").onclick=()=>{const up=lastDay(ym);if(!up)return toast("เดือนนี้ยังไม่ถึง");let k=0;L.forEach(e=>{for(let d=1;d<=up;d++)if(!isOff(ym,d)&&!get(ym,e.id,d)){put(ym,e.id,d,"P");k++}});save();render();toast(k?`เติม "มา" ${k} ช่อง`:"ไม่มีช่องว่าง")};
  $("#csv").onclick=()=>{const rows=[["รหัส","ชื่อ","แผนก",...hd.map(String),"มา","สาย","ขาด","ลา","%มา"]];L.forEach(e=>{const c=cnt(ym,e.id),all=c.P+c.S+c.A+c.L;rows.push([e.code||"",e.name,e.dept||"",...hd.map(d=>get(ym,e.id,d)),c.P,c.S,c.A,c.L,all?((c.P+c.S)/all*100).toFixed(1):""])});dl("เช็กชื่อ-"+ym+".csv","﻿"+rows.map(r=>r.map(x=>/[",\n]/.test(String(x))?'"'+String(x).replace(/"/g,'""')+'"':x).join(",")).join("\n"),"text/csv")};
  $("#prt").onclick=()=>print();
  if(td){const w=$(".tw"),c=w.querySelector("thead th.td"),st=w.querySelector("thead .st2");if(c&&st){const vis=w.clientWidth-(st.offsetLeft+st.offsetWidth);w.scrollLeft=Math.max(0,c.offsetLeft-(st.offsetLeft+st.offsetWidth)-Math.max(0,vis-c.offsetWidth*3))}}
}
function dl(n,t,ty){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function donut(o){const T=CODES.reduce((s,k)=>s+o[k],0);let a=-Math.PI/2,p="";const R1=70,R2=46,cx=80,cy=80;
  if(!T)return`<svg viewBox="0 0 160 160" width="170"><circle cx="80" cy="80" r="58" fill="none" stroke="#E6ECF3" stroke-width="24"/><text x="80" y="86" text-anchor="middle" font-size="15" fill="#8B97A5">ยังไม่มีข้อมูล</text></svg>`;
  CODES.forEach(k=>{const v=o[k];if(!v)return;const b=a+v/T*Math.PI*2-(v===T?1e-4:0),la=b-a>Math.PI?1:0,P=(r,t)=>`${(cx+r*Math.cos(t)).toFixed(2)} ${(cy+r*Math.sin(t)).toFixed(2)}`;p+=`<path d="M${P(R1,a)} A${R1} ${R1} 0 ${la} 1 ${P(R1,b)} L${P(R2,b)} A${R2} ${R2} 0 ${la} 0 ${P(R2,a)}Z" fill="${CC[k]}"/>`;a=b});
  return`<svg viewBox="0 0 160 160" width="170">${p}<text x="80" y="82" text-anchor="middle" font-size="26" font-weight="700" fill="#1D2A36">${Math.round(o.rate)}%</text><text x="80" y="102" text-anchor="middle" font-size="11" fill="#5F7182">มาทำงาน</text></svg>`}
function dayBars(ym,L){const n=dim(ym),W=720,H=200,pl=28,pb=24,bw=(W-pl)/n,mx=Math.max(1,L.length);let s="";
  for(let g=0;g<=4;g++){const y=H-pb-(H-pb-8)*g/4;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E6ECF3"/><text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#8B97A5">${Math.round(mx*g/4)}</text>`}
  for(let d=1;d<=n;d++){const x=pl+(d-1)*bw;let yb=H-pb;if(isOff(ym,d))s+=`<rect x="${x}" y="8" width="${bw}" height="${H-pb-8}" fill="#F3F5F8"/>`;
    ["P","S","L","A"].forEach(k=>{let c=0;L.forEach(e=>{if(get(ym,e.id,d)===k)c++});if(!c)return;const h=(H-pb-8)*c/mx;yb-=h;s+=`<rect x="${(x+bw*.15).toFixed(1)}" y="${yb.toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${h.toFixed(1)}" fill="${CC[k]}" rx="1.5"><title>${d} ${MN[+ym.slice(5)-1]} · ${CN[k]} ${c} คน</title></rect>`});
    if(n<=31&&(d%2===1||bw>22))s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="10" fill="#5F7182">${d}</text>`}
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="height:210px">${s}</svg>`}
function trend(L){const ms=[...Array(6)].map((_,i)=>mAdd(ui.m,i-5)),W=520,H=190,pl=34,pb=26,bw=(W-pl)/6;let s="";
  for(let g=0;g<=4;g++){const y=H-pb-(H-pb-14)*g/4;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E6ECF3"/><text x="${pl-5}" y="${y+4}" text-anchor="end" font-size="10" fill="#8B97A5">${g*25}%</text>`}
  ms.forEach((m,i)=>{const o=sum(m,L),x=pl+i*bw,h=(H-pb-14)*o.rate/100;s+=`<rect x="${x+bw*.22}" y="${H-pb-h}" width="${bw*.56}" height="${h}" rx="5" fill="${m===ui.m?"#2F72C4":"#A9C7EC"}"/>`+(o.all?`<text x="${x+bw/2}" y="${H-pb-h-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#1D2A36">${Math.round(o.rate)}%</text>`:"")+`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="#5F7182">${MN[+m.slice(5)-1]}</text>`});
  return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="height:200px">${s}</svg>`}
function rank(ym,L,k){const a=L.map(e=>({e,v:cnt(ym,e.id)[k]})).filter(x=>x.v).sort((x,y)=>y.v-x.v).slice(0,5),mx=a.length?a[0].v:1;
  return a.length?`<ul class="rk">${a.map(x=>`<li><span class="n">${esc(x.e.name)}</span><span class="b"><i style="width:${x.v/mx*100}%;background:${CC[k]}"></i></span><em style="color:${CC[k]}">${x.v}</em></li>`).join("")}</ul>`:`<p class="note" style="margin:0">ไม่มีใคร${CN[k]}เดือนนี้ 🎉</p>`}

function vDash(M){const ym=ui.m,L=fil(),o=sum(ym,L),pm=sum(mAdd(ym,-1),L),up=lastDay(ym);
  const dif=(a,b,good,isP)=>{if(!pm.all)return"";const d=Math.round((a-b)*10)/10;if(!d)return"เท่าเดือนก่อน";return`<span style="color:${(d>0)===good?"var(--P)":"var(--A)"}">${d>0?"▲":"▼"} ${Math.abs(d)}${isP?"%":""}</span> จากเดือนก่อน`};
  const D=depts(),dRows=D.map(d=>{const x=sum(ym,act().filter(e=>e.dept===d));return{d,x,n:act().filter(e=>e.dept===d).length}});
  M.innerHTML=`${hello("สรุปการมาทำงาน",`${mLabel(ym)}${ui.dep?" · "+esc(ui.dep):""} · บันทึกถึงวันที่ ${up||"–"}`)}
  <div class="card"><div class="bar"><div class="mnav"><button class="btn ghost sm" id="mp">‹</button><b>${mLabel(ym)}</b><button class="btn ghost sm" id="mn">›</button></div>${depSel()}</div>
  <div class="kpis"><div class="kpi" style="--k:#5F7182"><span>พนักงาน</span><b>${L.length}</b><small>วันทำงาน ${workDays(ym,dim(ym))} วัน</small></div>
  <div class="kpi" style="--k:var(--P)"><span>มา (P)</span><b style="color:var(--P)">${o.P}</b><small>คน-วัน</small></div>
  <div class="kpi" style="--k:var(--S)"><span>สาย (S)</span><b style="color:var(--S)">${o.S}</b><small>${dif(o.S,pm.S,false)}</small></div>
  <div class="kpi" style="--k:var(--A)"><span>ขาด (A)</span><b style="color:var(--A)">${o.A}</b><small>${dif(o.A,pm.A,false)}</small></div>
  <div class="kpi" style="--k:var(--L)"><span>ลา (L)</span><b style="color:var(--L)">${o.L}</b><small>${dif(o.L,pm.L,false)}</small></div>
  <div class="kpi" style="--k:var(--accent)"><span>อัตรามาทำงาน</span><b>${pct(o.rate)}</b><small>${pm.all?dif(o.rate,pm.rate,true,1):"(มา+สาย) ÷ ที่บันทึก"}</small></div></div></div>
  <div class="g2"><div class="card"><h2>มาทำงานรายวัน <small>จำนวนคน · แถบเทา = วันหยุด</small></h2>${dayBars(ym,L)}<div class="leg">${CODES.map(k=>`<span><i class="cd ${k}">${k}</i>${CN[k]}</span>`).join("")}</div></div>
  <div class="card"><h2>สัดส่วนทั้งเดือน</h2><div class="dn">${donut(o)}<ul>${CODES.map(k=>`<li><i style="background:${CC[k]}"></i>${CN[k]} (${k})<b>${o[k]}</b></li>`).join("")}</ul></div></div></div>
  <div class="g3"><div class="card"><h2>ขาดมากที่สุด</h2>${rank(ym,L,"A")}</div><div class="card"><h2>ลามากที่สุด</h2>${rank(ym,L,"L")}</div><div class="card"><h2>สายมากที่สุด</h2>${rank(ym,L,"S")}</div></div>
  <div class="g2"><div class="card"><h2>อัตรามาทำงาน 6 เดือน</h2>${trend(L)}</div>
  <div class="card"><h2>แยกตามแผนก</h2>${D.length?`<table class="yr"><tr><th>แผนก</th><th>คน</th><th>ขาด</th><th>ลา</th><th>สาย</th><th>%มา</th></tr>${dRows.map(r=>`<tr><td>${esc(r.d)}</td><td>${r.n}</td><td style="color:var(--A)">${r.x.A}</td><td style="color:var(--L)">${r.x.L}</td><td style="color:var(--S)">${r.x.S}</td><td><b>${r.x.all?pct(r.x.rate):"–"}</b></td></tr>`).join("")}</table>`:`<p class="note" style="margin:0">ใส่แผนกให้พนักงาน (แท็บ 👥) เพื่อดูสรุปแยกแผนก</p>`}</div></div>`;
  $("#mp").onclick=()=>{ui.m=mAdd(ym,-1);saveUi();render()};$("#mn").onclick=()=>{ui.m=mAdd(ym,1);saveUi();render()};bindDep()}

function vEmps(M){const A=act().length;
  M.innerHTML=`${hello("รายชื่อพนักงาน",`ใช้งาน ${A} คน${E.length>A?` · พักไว้ ${E.length-A} คน`:""}`)}
  <div class="card"><div class="bar"><button class="btn main" id="add">＋ เพิ่มพนักงาน</button><button class="btn ghost" id="pst">📋 วางรายชื่อจาก Excel</button></div>
  ${E.length?`<div class="el">${E.map(e=>`<div class="ei${e.x?" x":""}"><div class="t"><b>${esc(e.name)}</b><small>${esc([e.code,e.dept,e.pos].filter(Boolean).join(" · "))}${e.x?" · พักไว้ (ไม่แสดงในตาราง)":""}</small></div><button class="btn sm ghost" data-ed="${e.id}">แก้ไข</button></div>`).join("")}</div>`:`<p class="empty">ยังไม่มีพนักงาน</p>`}</div>`;
  $("#add").onclick=()=>empDlg();$("#pst").onclick=pasteDlg;$$("[data-ed]").forEach(b=>b.onclick=()=>empDlg(E.find(e=>e.id===b.dataset.ed)))}
function dlg(t,h){$("#dlgT").textContent=t;$("#dlgB").innerHTML=h;const d=$("#dlg");if(!d.open)d.showModal();return d}
$("#dlgX").onclick=()=>$("#dlg").close();
function empDlg(e){const n=!e;e=e||{};dlg(n?"เพิ่มพนักงาน":"แก้ไขพนักงาน",`<div class="row"><div class="f"><label>รหัส</label><input class="in-" id="ec" value="${esc(e.code||"")}" placeholder="เช่น 5431"></div><div class="f"><label>ชื่อ-นามสกุล *</label><input class="in-" id="en" value="${esc(e.name||"")}"></div></div>
  <div class="row"><div class="f"><label>แผนก</label><input class="in-" id="ed" list="dlD" value="${esc(e.dept||"")}"><datalist id="dlD">${depts().map(d=>`<option>${esc(d)}</option>`).join("")}</datalist></div><div class="f"><label>ตำแหน่ง</label><input class="in-" id="ep" value="${esc(e.pos||"")}"></div></div>
  ${n?"":`<label class="note" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ex"${e.x?" checked":""}> พักไว้ / ลาออกแล้ว (เก็บประวัติไว้ ไม่แสดงในตาราง)</label>`}
  <div class="bar"><button class="btn main" id="es">บันทึก</button>${n?"":`<button class="btn ghost danger" id="edel">ลบ</button>`}</div>`);
  setTimeout(()=>$("#en").focus(),50);
  $("#es").onclick=()=>{const nm=$("#en").value.trim();if(!nm)return toast("ใส่ชื่อก่อน");const o={code:$("#ec").value.trim(),name:nm,dept:$("#ed").value.trim(),pos:$("#ep").value.trim()};if(n){E.push(Object.assign({id:uid()},o))}else{Object.assign(e,o);e.x=$("#ex").checked}if(C.demo){C.demo=false;saveC()}save();$("#dlg").close();render();toast("บันทึกแล้ว")};
  if(!n)$("#edel").onclick=()=>{if(!confirm("ลบ "+e.name+" และประวัติเช็กชื่อทั้งหมดของคนนี้?"))return;E=E.filter(x=>x!==e);Object.values(R).forEach(m=>delete m[e.id]);save();$("#dlg").close();render()}}
function pasteDlg(){dlg("วางรายชื่อจาก Excel",`<p class="note" style="margin:0">คัดลอกจาก Excel / Google Sheets มาวางได้เลย หนึ่งบรรทัดต่อหนึ่งคน · ลำดับคอลัมน์ <b>รหัส · ชื่อ · แผนก · ตำแหน่ง</b> (มีแค่ชื่อก็ได้)</p><textarea class="in-" id="pt" rows="9" placeholder="5431&#9;สมชาย ใจดี&#9;ขาย&#10;6446&#9;อรวรรณ ศรีสุข&#9;บัญชี"></textarea><button class="btn main" id="pg">เพิ่มรายชื่อ</button>`);
  $("#pg").onclick=()=>{let k=0;$("#pt").value.split(/\r?\n/).forEach(l=>{const c=l.split(/\t|,(?=\S)/).map(s=>s.trim());if(!c.join(""))return;let code="",name,dept="",pos="";if(c.length===1)name=c[0];else if(/^[A-Za-z0-9\-_.\/]+$/.test(c[0])){[code,name,dept="",pos=""]=c}else{[name,dept="",pos=""]=c}if(!name||/^(ชื่อ|name)/i.test(name))return;E.push({id:uid(),code,name,dept,pos});k++});if(C.demo){E=E.filter(e=>!e.demo);R={};C.demo=false;saveC()}save();$("#dlg").close();render();toast(`เพิ่ม ${k} คน`)}}

function vSet(M){const hl=Object.keys(C.hol).sort();
  M.innerHTML=`${hello("ตั้งค่า","วันหยุด ชื่อกิจการ และสำรองข้อมูล")}
  <div class="card"><h2>ชื่อกิจการ</h2><input class="in-" id="cn" value="${esc(C.name)}" placeholder="เช่น บริษัท ใจดี จำกัด"></div>
  <div class="card"><h2>วันหยุดประจำสัปดาห์ <small>แสดงเป็นช่องสีเทา ไม่นับเป็นวันทำงาน</small></h2><div class="chk">${WD.map((w,i)=>`<label><input type="checkbox" data-w="${i}"${C.off.includes(i)?" checked":""}> ${["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัส","ศุกร์","เสาร์"][i]}</label>`).join("")}</div></div>
  <div class="card"><h2>วันหยุดพิเศษ / นักขัตฤกษ์</h2><div class="bar"><input type="date" class="in-" id="hd" style="width:auto"><input class="in-" id="hn" placeholder="ชื่อวันหยุด" style="flex:1;min-width:160px"><button class="btn main" id="ha">＋ เพิ่ม</button></div>
  ${hl.length?`<div class="el">${hl.map(d=>`<div class="ei"><div class="t"><b>${esc(C.hol[d]||"วันหยุด")}</b><small>${+d.slice(8)} ${MN[+d.slice(5,7)-1]} ${+d.slice(0,4)+543}</small></div><button class="btn sm ghost danger" data-hx="${d}">ลบ</button></div>`).join("")}</div>`:`<p class="note" style="margin:0">ยังไม่มีวันหยุดพิเศษ</p>`}</div>
  <div class="card"><h2>สำรอง / ย้ายข้อมูล</h2><p class="note" style="margin:0">ข้อมูลเก็บในเครื่องนี้และซิงก์กับบัญชีสมาชิก · ดาวน์โหลดไฟล์สำรองเก็บไว้เป็นระยะ</p><div class="bar"><button class="btn ghost" id="bk">⬇ ดาวน์โหลดไฟล์สำรอง</button><button class="btn ghost" id="im">⬆ นำเข้าไฟล์สำรอง</button><button class="btn ghost" id="dm">✨ ข้อมูลตัวอย่าง</button><button class="btn ghost danger" id="clr">ล้างข้อมูลทั้งหมด</button></div></div>`;
  $("#cn").onchange=e=>{C.name=e.target.value.trim();saveC();toast("บันทึกแล้ว")};
  $$("[data-w]").forEach(c=>c.onchange=()=>{C.off=$$("[data-w]").filter(x=>x.checked).map(x=>+x.dataset.w);saveC()});
  $("#ha").onclick=()=>{const d=$("#hd").value;if(!d)return toast("เลือกวันที่");C.hol[d]=$("#hn").value.trim()||"วันหยุด";saveC();render()};
  $$("[data-hx]").forEach(b=>b.onclick=()=>{delete C.hol[b.dataset.hx];saveC();render()});
  $("#bk").onclick=()=>dl("สำรอง-เช็กชื่อ-"+todayS()+".json",JSON.stringify({app:"edm-att",v:1,at:new Date().toISOString(),emps:E,rec:R,cfg:C}),"application/json");
  $("#im").onclick=()=>$("#impF").click();
  $("#dm").onclick=demo;
  $("#clr").onclick=()=>{if(!confirm("ล้างรายชื่อและการเช็กชื่อทั้งหมด? (ควรดาวน์โหลดไฟล์สำรองก่อน)"))return;E=[];R={};C.demo=false;save();saveC();render()}}
$("#impF").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.app!=="edm-att"||!Array.isArray(j.emps))throw 0;if(!confirm(`นำเข้า ${j.emps.length} คน แทนข้อมูลปัจจุบัน?`))return;E=j.emps;R=j.rec||{};C=Object.assign(C,j.cfg||{});save();saveC();render();toast("นำเข้าแล้ว")}catch(x){alert("ไฟล์ไม่ถูกต้อง")}};r.readAsText(f);e.target.value=""};

/* ---------- ข้อมูลตัวอย่าง (สมมติ) ---------- */
function demo(){if(E.length&&!C.demo&&!confirm("แทนที่ด้วยข้อมูลตัวอย่าง? (ข้อมูลเดิมจะหาย)"))return;
  const N=[["5431","สมชาย ใจดี","ขาย"],["6446","อรวรรณ ศรีสุข","บัญชี"],["9597","ธนพล วัฒนะ","คลังสินค้า"],["7870","รัชฎา พิมพ์ทอง","ขาย"],["1977","กฤษฎา สุขสันต์","คลังสินค้า"],["6319","มาลิสา อารี","บัญชี"],["3199","ณัฐ ยอดเยี่ยม","ขาย"],["6548","เอมอร ชัยวัฒน์","ธุรการ"]];
  E=N.map(([code,name,dept],i)=>({id:"d"+i,code,name,dept,pos:"",demo:1}));R={};let s=7;const rnd=()=>(s=(s*16807)%2147483647)/2147483647;
  const t=todayS();for(let k=5;k>=0;k--){const ym=mAdd(t.slice(0,7),-k),up=lastDay(ym);E.forEach((e,i)=>{for(let d=1;d<=up;d++){if(isOff(ym,d))continue;const r=rnd(),bad=i===1||i===6?2:1;put(ym,e.id,d,r<.035*bad?"A":r<.035*bad+.05?"L":r<.035*bad+.05+.05*bad?"S":"P")}})}
  C.demo=true;C.name=C.name||"บริษัท ตัวอย่าง จำกัด";save();saveC();render();toast("ใส่ข้อมูลตัวอย่างแล้ว (ชื่อสมมติ)")}

$$("#tabs [data-v]").forEach(b=>b.onclick=()=>{ui.v=b.dataset.v;saveUi();render()});
if(/[?&]demo=1/.test(location.search)&&(!E.length||C.demo))demo();else render();
window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith("edm_att_")){E=LS.get(K.emps,[])||[];R=LS.get(K.rec,{})||{};C=Object.assign(C,LS.get(K.cfg,{})||{});render()}});
})();
</script>

<script>/* ไอคอนวาดเองบนแท็บ/โลโก้ */(function(){if(!window.EDM_ICON)return;var I={today:["check","#1E9E5A"],month:["calendar","#2F72C4"],dash:["chart","#9B7BD4"],emps:["users","#0E8C94"],set:["sliders","#5B6B7F"]};document.querySelectorAll("#tabs [data-v]").forEach(function(b){var k=I[b.dataset.v];if(!k)return;b.innerHTML=EDM_ICON(k[0],{color:k[1]})+"<span>"+b.textContent.trim().replace(/^\S+\s*/,"")+"</span>"});var br=document.querySelector("header .brand");if(br&&br.firstChild&&br.firstChild.nodeType===3){br.firstChild.textContent=br.firstChild.textContent.replace(/^\S+\s*/,"");br.insertAdjacentHTML("afterbegin",EDM_ICON("check",{color:"#2F72C4"}))}})()</script>
