<style>
:root{--bg:#F4F6F5;--card:#fff;--ink:#0F1513;--muted:#66706B;--line:#E2E6E4;--soft:#F4F6F5;--accent:#127A4B;--accent-ink:#fff;--warn:#8A5A00;--warnbg:#FFF4DC;--danger:#B3261E;--dangerbg:#FDECEA;--info:#1E4FA8;--infobg:#E8EFFB;--okbg:#E4F3EA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1110;--card:#161C1A;--ink:#EEF2F0;--muted:#97A29D;--line:#26302C;--soft:#1C2421;--accent:#4CC48A;--accent-ink:#06120C;--warn:#F0C27A;--warnbg:#2A2416;--danger:#F2867E;--dangerbg:#2C1715;--info:#8DB0F0;--infobg:#17213A;--okbg:#14261C}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px}.brand small{font-weight:500;color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--soft);color:var(--ink);font-size:.9rem;min-height:40px}
.btn:hover{filter:brightness(.97)}.btn.main{background:var(--accent);color:var(--accent-ink)}.btn.dark{background:var(--ink);color:var(--bg)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.btn.sm{padding:6px 12px;font-size:.84rem;min-height:34px}.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.tabs{max-width:1400px;margin:12px auto 0;padding:0 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:none;border:0;border-radius:999px;padding:9px 16px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);box-shadow:none}
main{max-width:1400px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}.card h2 small{font-weight:400;color:var(--muted);font-size:.82rem}
.card h3{font-size:.92rem;margin:4px 0 0}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.f{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1 1 150px}.f label{font-size:.8rem;font-weight:600;color:var(--muted)}
.in-{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;outline:none;min-height:42px}.in-:focus{border-color:var(--accent)}
.chk{display:flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}.chk input{width:18px;height:18px;accent-color:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--line)}.stat small{display:block;color:var(--muted);font-size:.8rem}.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--okbg);color:var(--accent)}.chip.late{background:var(--warnbg);color:var(--warn)}.chip.abs{background:var(--dangerbg);color:var(--danger)}.chip.open{background:var(--infobg);color:var(--info)}.chip.leave{background:var(--infobg);color:var(--info)}
.tw{overflow-x:auto;border-radius:12px;box-shadow:0 0 0 1px var(--line)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
.t th,.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.t th{background:var(--soft);font-weight:600;font-size:.8rem;color:var(--muted);position:sticky;top:0}
.t td.r,.t th.r{text-align:right}.t tr.we td{background:color-mix(in srgb,var(--soft) 70%,transparent)}.t tfoot td{font-weight:700;background:var(--soft)}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
/* kiosk */
.clock{text-align:center;padding:10px 0 4px}.clock b{display:block;font-size:clamp(3rem,12vw,6rem);line-height:1;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}.clock span{color:var(--muted)}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.kemp{border:0;background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:16px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center;min-height:132px}
.kemp:hover{box-shadow:0 0 0 2px var(--accent)}.kemp .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:1.2rem;background:var(--soft)}
.kemp.in .av{background:var(--accent);color:var(--accent-ink)}.kemp b{font-size:.95rem;line-height:1.3}.kemp small{color:var(--muted);font-size:.78rem;line-height:1.3}
dialog{border:0;border-radius:20px;padding:0;background:var(--card);color:var(--ink);width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,15,13,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:14px}.dlg h3{margin:0;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.bigbtn{width:100%;border:0;border-radius:18px;padding:22px;font-size:1.4rem;font-weight:700;cursor:pointer}
.bigbtn.in{background:var(--accent);color:var(--accent-ink)}.bigbtn.out{background:var(--ink);color:var(--bg)}
.pin{font-size:1.8rem;text-align:center;letter-spacing:.4em}
.done{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:color-mix(in srgb,var(--bg) 92%,transparent);text-align:center;padding:24px}
.done .ic{width:96px;height:96px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin:0 auto 14px}
.done b{display:block;font-size:2rem}.done p{margin:6px 0 0;font-size:1.1rem;color:var(--muted)}
.sess{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;align-items:end}
.days{display:flex;gap:4px;flex-wrap:wrap}.days label{display:inline-flex}.days input{position:absolute;opacity:0;pointer-events:none}
.days span{border-radius:999px;padding:6px 11px;background:var(--soft);font-weight:600;font-size:.84rem;cursor:pointer;box-shadow:inset 0 0 0 1px var(--line)}.days input:checked+span{background:var(--accent);color:var(--accent-ink);box-shadow:none}
.days input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.55}
.info{background:var(--infobg);color:var(--info);border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.55}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:70;max-width:calc(100vw - 32px)}
body.kiosk header.top .nav,body.kiosk .tabs{display:none}
#printArea{display:none}
@media print{@page{size:A4;margin:10mm}body{background:#fff}header.top,.tabs,main,.toast,dialog,.edm-bar,.edm-gate,.edm-chip{display:none!important}#printArea{display:block}}
.pr{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:#000;font-size:9.5pt}.pr h1{font-size:13pt;margin:0}.pr .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:6px}
.pr table{width:100%;border-collapse:collapse}.pr th,.pr td{border:1px solid #888;padding:2px 4px;text-align:left}.pr th{background:#eee}.pr td.r,.pr th.r{text-align:right}.pr tfoot td{font-weight:700;background:#f2f2f2}.pr tr{page-break-inside:avoid}
.pr .mx td,.pr .mx th{padding:1px 2px;text-align:center;font-size:7.5pt}.pr .mx td:first-child,.pr .mx th:first-child{text-align:left;white-space:nowrap}

<script src="../assets/timecalc.js?v=1"></script>
<script>
(function(){
"use strict";
const T=window.EDM_TIME,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const {pad,ymd,hm2m,m2hm,dur,r2,num}=T;
const MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DOW=["อา","จ","อ","พ","พฤ","ศ","ส"];
const TYPES={m:"รายเดือน",d:"รายวัน",h:"รายชั่วโมง",p:"ตามชิ้นงาน",f:"ฟรีแลนซ์"};
const ST={ok:["ok","ปกติ"],late:["late","สาย/ออกก่อน"],abs:["abs","ขาด"],leave:["leave","ลา"],open:["open","กำลังทำงาน"],noout:["late","ลืมตอกออก"],hol:["","วันหยุดนักขัตฯ"],off:["","วันหยุด"],nowork:["","-"],wait:["","ยังไม่มา"],future:["",""]};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const thD=d=>{if(!d)return"";const x=new Date(T.midnight(d));return x.getDate()+" "+MONTHS[x.getMonth()].slice(0,3)+". "+String(x.getFullYear()+543).slice(2)};
const thDL=d=>{const x=new Date(T.midnight(d));return "วัน"+["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"][x.getDay()]+"ที่ "+x.getDate()+" "+MONTHS[x.getMonth()]+" "+(x.getFullYear()+543)};
const ymOf=d=>d.slice(0,7), ymTh=ym=>MONTHS[+ym.slice(5)-1]+" "+(+ym.slice(0,4)+543);
const tm=(base,ts)=>{if(!ts)return"-";const x=new Date(ts);let s=pad(x.getHours())+":"+pad(x.getMinutes());if(ymd(x)!==base)s+=" (+1)";return s};
const hrs=m=>m?r2(m/60).toLocaleString("th-TH",{maximumFractionDigits:2}):"-";
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- state ---------- */
let c=T.cfg();
const UIK="edm_time_ui";
let ui=Object.assign({tab:"kiosk",ym:ymd(new Date()).slice(0,7),emp:"",rep:"sum",dept:"",br:"",from:"",to:"",q:"",kiosk:false},T.get(UIK,{}));
const svUi=()=>T.set(UIK,ui), svCfg=()=>T.set(T.K.cfg,c);
const emps=()=>T.emps().filter(e=>T.active(e,ui.ym));
const brOf=id=>(c.emp[id]||{}).branch||"";
const co=()=>T.get(T.K.co,{})||{};
const hasPay=()=>{try{return !!localStorage.getItem("edm_pay_company")||Object.keys(JSON.parse(localStorage.getItem("edm_pay_records")||"{}")).length>0}catch(e){return false}};
function getLog(){return T.get(T.K.log,{})||{}}
function setLog(L){T.set(T.K.log,L)}
function getMarks(){return T.get(T.K.day,{})||{}}
function audit(e,d,act,before,after,note){const A=T.get(T.K.audit,[])||[];A.push({ts:Date.now(),e,d,act,before,after,note:note||""});if(A.length>3000)A.splice(0,A.length-3000);T.set(T.K.audit,A)}

/* ---------- PIN เจ้าของร้าน (ใช้ PIN เดียวกับล็อกหน้าจอ) ---------- */
function hex(b){return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function lockHash(salt,pin){const enc=new TextEncoder();let h=await crypto.subtle.digest("SHA-256",enc.encode(salt+"|"+pin));for(let n=1;n<2000;n++)h=await crypto.subtle.digest("SHA-256",new Uint8Array([...new Uint8Array(h),...enc.encode(salt)]));return hex(h)}
async function empHash(pin){if(!c.salt){c.salt=hex(crypto.getRandomValues(new Uint8Array(12)));svCfg()}return hex(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(c.salt+"|"+pin)))}
function lockCfg(){try{return JSON.parse(localStorage.getItem("edm_lock")||"null")}catch(e){return null}}
function adminFresh(){try{return Date.now()-Number(sessionStorage.getItem("edm_time_admin")||0)<20*60000}catch(e){return false}}
function adminOk(){if(!lockCfg()||adminFresh())return Promise.resolve(true);
  return new Promise(res=>{openDlg(`<h3>🔒 สำหรับเจ้าของร้าน <button class="btn sm ghost" data-x type="button">ปิด</button></h3><p class="muted small" style="margin:0">ใส่ PIN ล็อกหน้าจอ (ตั้งไว้ที่หน้าสำรองข้อมูล) เพื่อเข้าเมนูนี้</p>
    <input class="in- pin" id="apin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN เจ้าของร้าน"><button class="btn main" id="aok" type="button">ยืนยัน</button>`);
    const go=async()=>{const L=lockCfg(),v=$("#apin").value.trim();if(!v)return;const ok=L?await lockHash(L.s,v)===L.h:true;if(ok){try{sessionStorage.setItem("edm_time_admin",String(Date.now()))}catch(e){}closeDlg();res(true)}else{toast("PIN ไม่ถูกต้อง");$("#apin").value=""}};
    $("#aok").onclick=go;$("#apin").onkeydown=e=>{if(e.key==="Enter")go()};$("#dlg").onclose=()=>res(adminFresh());setTimeout(()=>$("#apin").focus(),50)})}

/* ---------- dialog ---------- */
function openDlg(h){const d=$("#dlg");$("#dlgBody").innerHTML=h;d.onclose=null;$$("#dlgBody [data-x]").forEach(b=>b.onclick=closeDlg);if(!d.open)d.showModal()}
function closeDlg(){const d=$("#dlg");if(d.open)d.close()}

/* ---------- ตอกบัตร ---------- */
function openSessionOf(id){const L=getLog(),now=Date.now();for(const ym of Object.keys(L).sort().slice(-2).reverse()){const s=(L[ym]||[]).filter(x=>x.e===id&&!x.del&&!x.out&&now-x.in<20*3600000).sort((a,b)=>b.in-a.in)[0];if(s)return{ym,s}}return null}
function todaySess(id){const d=T.today();return T.logOf(ymOf(d)).filter(s=>s.e===id&&s.d===d)}
function shiftDateFor(id,now){const sh=T.shiftOf(c,id),sp=T.shiftSpan(sh),d=new Date(now);
  if(sp&&sp.E>1440){const mins=d.getHours()*60+d.getMinutes();if(mins<sp.E-1440+60){const y=new Date(now-86400000);return ymd(y)}}return ymd(d)}
function punch(id){const now=Date.now(),L=getLog(),o=openSessionOf(id);let kind,s;
  if(o){s=L[o.ym].find(x=>x.id===o.s.id);s.out=now;kind="out"}
  else{const d=shiftDateFor(id,now),ym=ymOf(d);(L[ym]=L[ym]||[]).push(s={id:uid(),e:id,d,in:now,out:null,src:"kiosk"});kind="in"}
  setLog(L);return{kind,s}}
function kioskCard(e){const o=openSessionOf(e.id),ts=todaySess(e.id),last=ts.filter(s=>s.out).sort((a,b)=>b.out-a.out)[0];
  const st=o?`ทำงานอยู่ ตั้งแต่ ${tm(o.s.d,o.s.in)}`:last?`ออกแล้ว ${tm(last.d,last.out)}`:"ยังไม่เข้างาน";
  return`<button class="kemp ${o?"in":""}" data-k="${esc(e.id)}" type="button"><span class="av" aria-hidden="true">${esc((e.name||"?").trim().charAt(0))}</span><b>${esc(e.name||e.code)}</b><small>${esc(e.pos||e.dept||"")}</small><small>${esc(st)}</small></button>`}
function vKiosk(){const list=emps().filter(e=>!ui.q||(e.name+" "+e.code+" "+(e.dept||"")).toLowerCase().includes(ui.q.toLowerCase()));
  return`<section class="card"><div class="clock" aria-live="off"><b id="clk">--:--:--</b><span id="clkD"></span></div>
  ${T.emps().length>8?`<input class="in-" id="kq" placeholder="🔍 ค้นหาชื่อหรือรหัสพนักงาน" value="${esc(ui.q)}" aria-label="ค้นหาพนักงาน">`:""}
  ${list.length?`<div class="kgrid">${list.map(kioskCard).join("")}</div>`:`<div class="empty">ยังไม่มีพนักงาน · เจ้าของร้านเพิ่มรายชื่อได้ที่เมนู ⚙️ ตั้งค่า</div>`}
  <p class="muted small" style="margin:0;text-align:center">แตะชื่อตัวเองเพื่อเข้างาน / ออกงาน · เวลาอ้างอิงจากนาฬิกาของเครื่องนี้</p></section>`}
function bindKiosk(){const tick=()=>{const n=new Date(),k=$("#clk");if(!k)return clearInterval(bindKiosk.t);k.textContent=pad(n.getHours())+":"+pad(n.getMinutes())+":"+pad(n.getSeconds());$("#clkD").textContent=thDL(ymd(n))};
  clearInterval(bindKiosk.t);tick();bindKiosk.t=setInterval(tick,1000);
  if($("#kq"))$("#kq").oninput=e=>{ui.q=e.target.value;svUi();const p=e.target.selectionStart;render();const q=$("#kq");q.focus();q.setSelectionRange(p,p)};

async function editDay(id,d){if(!await adminOk())return;const e=T.emps().find(x=>x.id===id);if(!e)return;const ym=ymOf(d),L=getLog(),MK=getMarks();

   <p class="muted small" style="margin:0">วันหยุดทางศาสนา (มาฆบูชา วิสาขบูชา อาสาฬหบูชา เข้าพรรษา) และวันหยุดชดเชย เปลี่ยนทุกปี ให้เพิ่มเองตามประกาศของร้าน (กฎหมายกำหนดอย่างน้อย 13 วันต่อปี)</p>
   ${c.hol.length?`<div class="tw"><table class="t"><tbody>${c.hol.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(h=>`<tr><td>${esc(thD(h.d))}</td><td>${esc(h.n)}</td><td class="r"><button class="btn sm ghost danger" data-hdel="${esc(h.d)}" type="button">ลบ</button></td></tr>`).join("")}</tbody></table></div>`:""}</section>
  <section class="card"><h2>💾 ข้อมูลลงเวลา</h2><p class="muted small" style="margin:0">ข้อมูลเก็บในเครื่องนี้ และสำรองขึ้นระบบอัตโนมัติเมื่อเข้าสู่ระบบสมาชิก · ใช้เครื่องเดียวเป็นจุดตอกบัตรประจำร้าน (แท็บเล็ตหรือมือถือที่ตั้งไว้หน้าร้าน)</p>
   <div class="row"><button class="btn ghost" id="dExp" type="button">⬇️ สำรองข้อมูลลงเวลา</button><label class="btn ghost" for="dImp">⬆️ นำเข้า</label><input type="file" id="dImp" accept="application/json" hidden></div>
   ${T.emps().length&&!Object.keys(getLog()).length?`<button class="btn ghost" id="dDemo" type="button">✨ สร้างข้อมูลตัวอย่างเดือนนี้ (ดูรายงานก่อนใช้จริง)</button>`:""}</section></div>`}
function bindSet(){const save=()=>{svCfg();toast("บันทึกแล้ว")};
  $$("[data-sh]").forEach(card=>{const s=c.shifts[+card.dataset.sh];card.querySelectorAll("[data-s]").forEach(i=>i.onchange=()=>{s[i.dataset.s]=i.dataset.s==="brk"?num(i.value):i.value;save();render()});
    card.querySelectorAll("[data-dow]").forEach(i=>i.onchange=()=>{const j=+i.dataset.dow;s.days=(s.days||[]).filter(x=>x!==j);if(i.checked)s.days.push(j);s.days.sort();save()})});
  $("#shAdd").onclick=()=>{c.shifts.push({id:"s"+uid(),name:"กะ "+(c.shifts.length+1),start:"20:00",end:"05:00",brk:60,days:[0,1,2,3,4,5,6]});save();render()};
  $$("[data-shdel]").forEach(b=>b.onclick=()=>{const s=c.shifts[+b.dataset.shdel];if(!confirm(`ลบกะ "${s.name}"? พนักงานในกะนี้จะย้ายไปกะแรก`))return;c.shifts.splice(+b.dataset.shdel,1);Object.values(c.emp).forEach(x=>{if(x.shift===s.id)delete x.shift});save();render()});
  const g=(id,k,f)=>{const el=$(id);el.onchange=()=>{c[k]=f(el);save()}};
  g("#gGrace","grace",e=>num(e.value));g("#gLate","lateMode",e=>e.value);g("#gOtA","otAfter",e=>num(e.value));g("#gOtR","otRound",e=>num(e.value));g("#gOtM","otMode",e=>e.value);
  g("#gEarly","earlyCount",e=>e.checked);g("#gBrk","brkAuto",e=>e.checked);g("#gPin","needPin",e=>e.checked);
  const ce=id=>c.emp[id]||(c.emp[id]={});
  $$("[data-esh]").forEach(s=>s.onchange=()=>{ce(s.dataset.esh).shift=s.value;save()});
  $$("[data-ebr]").forEach(s=>s.onchange=()=>{ce(s.dataset.ebr).branch=s.value.trim();save()});
  $$("[data-epin]").forEach(b=>b.onclick=async()=>{const v=prompt("ตั้ง PIN ตอกบัตร 4–6 หลัก (ตัวเลข)");if(v==null)return;if(!/^\d{4,6}$/.test(v.trim()))return toast("PIN ต้องเป็นตัวเลข 4–6 หลัก");ce(b.dataset.epin).pin=await empHash(v.trim());save();render()});
  $$("[data-epinx]").forEach(b=>b.onclick=()=>{delete ce(b.dataset.epinx).pin;save();render()});
  $("#eAdd").onclick=()=>empForm(null);$$("[data-eed]").forEach(b=>b.onclick=()=>empForm(b.dataset.eed));
  $("#hAdd").onclick=()=>{const d=$("#hD").value,n=$("#hN").value.trim()||"วันหยุด";if(!d)return toast("เลือกวันที่");c.hol=c.hol.filter(h=>h.d!==d);c.hol.push({d,n});save();render()};
  $("#hFix").onclick=()=>{const y=ui.ym.slice(0,4);let n=0;FIXED_HOL.forEach(([md,nm])=>{const d=y+"-"+md;if(!c.hol.some(h=>h.d===d)){c.hol.push({d,n:nm});n++}});save();render();toast("เพิ่ม "+n+" วัน")};
  $$("[data-hdel]").forEach(b=>b.onclick=()=>{c.hol=c.hol.filter(h=>h.d!==b.dataset.hdel);save();render()});
  $("#dExp").onclick=()=>{const o={app:"edm-time",v:1};Object.values(T.K).filter(k=>k.startsWith("edm_time")).forEach(k=>o[k]=T.get(k,null));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="time-backup-"+T.today()+".json";a.click()};
  $("#dImp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const o=JSON.parse(t);if(o.app!=="edm-time")throw 0;if(!confirm("นำเข้าจะแทนที่ข้อมูลลงเวลาในเครื่องนี้ ยืนยัน?"))return;Object.keys(o).filter(k=>k.startsWith("edm_time")).forEach(k=>T.set(k,o[k]));c=T.cfg();toast("นำเข้าแล้ว");render()}).catch(()=>toast("ไฟล์ไม่ถูกต้อง"))};
  if($("#dDemo"))$("#dDemo").onclick=demo}
function empForm(id){const all=T.get(T.K.emps,[])||[],e=id?all.find(x=>x.id===id):null,x=e||{type:"m"};
  openDlg(`<h3>${e?"แก้ไขพนักงาน":"เพิ่มพนักงาน"} <button class="btn sm ghost" data-x type="button">ปิด</button></h3>
   <div class="row"><div class="f"><label for="pfName">ชื่อ-นามสกุล</label><input class="in-" id="pfName" value="${esc(x.name||"")}"></div><div class="f" style="flex:0 1 140px"><label for="pfCode">รหัส</label><input class="in-" id="pfCode" value="${esc(x.code||"EMP"+String(all.length+1).padStart(3,"0"))}"></div></div>
   <div class="row"><div class="f"><label for="pfPos">ตำแหน่ง</label><input class="in-" id="pfPos" value="${esc(x.pos||"")}"></div><div class="f"><label for="pfDept">แผนก / ฝ่าย</label><input class="in-" id="pfDept" value="${esc(x.dept||"")}" list="pfDepts"><datalist id="pfDepts">${[...new Set(all.map(a=>a.dept).filter(Boolean))].map(d=>`<option value="${esc(d)}">`).join("")}</datalist></div></div>
   <div class="row"><div class="f"><label for="pfType">ประเภทค่าจ้าง</label><select class="in-" id="pfType">${["m","d","h"].map(k=>`<option value="${k}" ${(x.type||"m")===k?"selected":""}>${TYPES[k]}</option>`).join("")}</select></div><div class="f"><label for="pfSal">ค่าจ้าง (บาท) ไม่บังคับ</label><input class="in-" id="pfSal" type="number" min="0" step="0.01" inputmode="decimal" value="${esc(x.salary||"")}"></div></div>
   <p class="muted small" style="margin:0">ใส่ค่าจ้างเพื่อให้รายงานประมาณค่า OT ได้ ถ้าไม่ใส่ รายงานยังนับชั่วโมงได้ตามปกติ</p>
   <button class="btn main" id="pfSave" type="button">บันทึก</button>${e?`<button class="btn ghost danger" id="pfEnd" type="button">พนักงานลาออก (เก็บประวัติไว้)</button>`:""}`);
  setTimeout(()=>$("#pfName").focus(),50);
  $("#pfSave").onclick=()=>{const name=$("#pfName").value.trim();if(!name){toast("ใส่ชื่อพนักงาน");return}
    const v={name,code:$("#pfCode").value.trim(),pos:$("#pfPos").value.trim(),dept:$("#pfDept").value.trim(),type:$("#pfType").value,salary:num($("#pfSal").value)};
    const L2=T.get(T.K.emps,[])||[];
    if(e){const t=L2.find(a=>a.id===e.id);Object.assign(t,v)}else L2.push(Object.assign({id:"e"+uid(),idc:"",bank:"",sso:true,tax:true,spouse:false,kids:0,kids2:0,parents:0,allow:0,posA:0,fixA:0,comPct:0,pvd:0,pvdEr:0,slf:0},v));
    T.set(T.K.emps,L2);closeDlg();toast("บันทึกแล้ว");render()};
  if($("#pfEnd"))$("#pfEnd").onclick=()=>{if(!confirm(`บันทึกว่า ${e.name} ลาออกวันนี้? รายชื่อจะไม่แสดงตั้งแต่เดือนถัดไป แต่ประวัติเวลายังอยู่`))return;const L2=T.get(T.K.emps,[])||[];const t=L2.find(a=>a.id===e.id);t.end=T.today();T.set(T.K.emps,L2);closeDlg();render()}}
function demo(){const ym=T.today().slice(0,7),L={},E=T.emps().filter(e=>T.active(e,ym)),MK={};L[ym]=[];let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  E.forEach((e,i)=>{const sh=T.shiftOf(c,e.id),sp=T.shiftSpan(sh);if(!sp)return;T.daysOf(ym,T.today()).forEach(d=>{const dow=new Date(T.midnight(d)).getDay();if(!(sh.days||[]).includes(dow)||T.holidayOf(c,d))return;
    const r=rnd();if(r<0.04)return;if(r<0.08){(MK[e.id]=MK[e.id]||{})[d]={lv:"sick",note:"ไม่สบาย"};return}
    const base=T.midnight(d),late=r<0.2?Math.round(5+rnd()*25):Math.round(-15+rnd()*14),ot=r>0.75?Math.round(30+rnd()*120):Math.round(rnd()*10);
    const out=d===T.today()?null:base+(sp.E+ot)*60000;L[ym].push({id:uid(),e:e.id,d,in:base+(sp.S+late)*60000,out,src:"demo"})})});
  setLog(L);const all=getMarks();all[ym]=MK;T.set(T.K.day,all);toast("สร้างข้อมูลตัวอย่างแล้ว");ui.tab="rep";svUi();render()}

/* ---------- render ---------- */
const V={kiosk:[vKiosk,bindKiosk],today:[vToday,bindToday],sheet:[vSheet,bindSheet],rep:[vRep,bindRep],set:[vSet,bindSet]};
function render(){document.body.classList.toggle("kiosk",!!ui.kiosk);if(ui.kiosk)ui.tab="kiosk";if(!V[ui.tab])ui.tab="kiosk";
  $$("[data-tab]").forEach(b=>{b.classList.toggle("on",b.dataset.tab===ui.tab);b.setAttribute("aria-selected",b.dataset.tab===ui.tab)});
  $("#kioskBtn").textContent=ui.kiosk?"🔓 ออกจากโหมดตอกบัตร":"🔒 โหมดตอกบัตร";
  const [v,b]=V[ui.tab];$("#main").innerHTML=v();b()}
$$("[data-tab]").forEach(b=>b.onclick=async()=>{const t=b.dataset.tab;if(t!=="kiosk"&&!await adminOk())return;ui.tab=t;svUi();render()});
$("#kioskBtn").onclick=async()=>{if(ui.kiosk){if(!await adminOk())return;ui.kiosk=false}else{ui.kiosk=true;ui.tab="kiosk";toast("โหมดตอกบัตร: ซ่อนเมนูอื่น · ออกจากโหมดต้องใส่ PIN เจ้าของร้าน")}svUi();render()};
window.addEventListener("storage",e=>{if(e.key&&e.key.startsWith("edm_")){c=T.cfg();if(!$("#dlg").open)render()}});
if(ui.tab!=="kiosk"&&lockCfg()&&!adminFresh())ui.tab="kiosk";
// เปิดหน้าครั้งแรก: ถ้ายังไม่มีการตอกบัตรเลย ไปหน้าตั้งค่าก่อน
if(!T.get(T.K.cfg,null)&&!lockCfg())ui.tab="set";
render();
})();
</script>
