function vGantt(){const M=$("#main");if(!cfg.projects.length)return emptyHello(M);
  if(ui.pid&&!P(ui.pid))ui.pid="";
  const p=P(ui.pid),L=tasksOf(ui.pid),[s,e]=span(L,p),pr=prog(L),days=dDiff(s,e)+1,wk=ui.zoom==="w";
  const dwN=wk?10:(innerWidth<700?22:26),mob=innerWidth<=700;document.documentElement.style.setProperty("--dw",dwN+"px");
  const pj=`<div class="pjs noprint"><button type="button" data-pj="" class="${!ui.pid?"on":""}">ทุกโปรเจกต์</button>${cfg.projects.map(x=>`<button type="button" data-pj="${x.id}" class="${ui.pid===x.id?"on":""}" style="--pc:${x.c}"><i></i>${esc(x.name)}</button>`).join("")}<button type="button" data-pj="+">＋ โปรเจกต์</button></div>`;
  const dl=[];for(let i=0;i<days;i++)dl.push(addD(s,i));
  const td=today(),ti=dDiff(s,td);
  // แถวเดือน
  let mo="",cur="",cnt=0;dl.forEach((d,i)=>{const k=d.slice(0,7);if(k!==cur){if(cur)mo+=`<th colspan="${cnt}">${MS[+cur.slice(5)-1]} ${+cur.slice(0,4)+543}</th>`;cur=k;cnt=0}cnt++});mo+=`<th colspan="${cnt}">${MS[+cur.slice(5)-1]} ${+cur.slice(0,4)+543}</th>`;
  const dy=dl.map(d=>{const dt=new Date(d+"T00:00"),w=dt.getDay(),lb=wk?(w===1?+d.slice(8):""):(+d.slice(8)+" "+MS[+d.slice(5,7)-1]);return`<th class="day${w===0||w===6?" we":""}${d===td?" td":""}" title="${thD(d)}">${lb}</th>`}).join("");
  const bar=t=>{const a=dDiff(s,t.start),n=dur(t);return`<div class="bar ${t.st==="p"?"":t.st}${isLate(t)?" late":""}" data-id="${t.id}" style="left:calc(var(--dw)*${a});width:calc(var(--dw)*${n} - 2px)" title="${esc(t.name)} · ${thD(t.start)} – ${thD(t.end)} (${n} วัน) · ${ST[t.st][0]}">${wk||n<4?"":esc(t.name)}</div>`};
  const tl=t=>`<td class="tl" colspan="${days}">${ti>=0&&ti<days?`<span class="tdl" style="left:calc(var(--dw)*${ti} + var(--dw)/2)"></span>`:""}${t?bar(t):""}</td>`;
  const row=(t,i)=>`<tr><td class="c-n" data-ed="${t.id}" title="${esc(t.name)}"><small>${i+1}</small>${esc(t.name)}${isLate(t)?'<span class="late-dot" title="เลยกำหนด"></span>':""}</td><td class="c-w">${esc(t.who||"-")}</td><td class="c-s">${thD(t.start)}</td><td class="c-e">${thD(t.end)}</td><td class="c-d">${dur(t)}</td><td class="c-st"><select class="st ${t.st==="p"?"":t.st}" data-st="${t.id}">${Object.keys(ST).map(k=>`<option value="${k}"${t.st===k?" selected":""}>${ST[k][0]}</option>`).join("")}</select></td>${tl(t)}</tr>`;
  let body="";
  if(p){body=L.map(row).join("")}
  else cfg.projects.forEach(x=>{const Lx=L.filter(t=>t.pid===x.id);if(!Lx.length&&L.length)return;const q=prog(Lx);body+=`<tr class="grp"><td class="c-n" style="--pc:${x.c}" data-pj2="${x.id}"><i></i>${esc(x.name)}</td><td class="c-w"></td><td class="c-s"></td><td class="c-e"></td><td class="c-d"></td><td class="c-st" style="font-weight:500;color:var(--muted);font-size:.78rem">${q.d}/${q.n} · ${q.p}%</td><td class="tl" colspan="${days}"></td></tr>`+Lx.map(row).join("")});
  const qa=`<tr class="qa"><td class="c-n"><input id="qaN" placeholder="＋ พิมพ์ชื่องานแล้วกด Enter"></td><td class="c-w"><input id="qaW" placeholder="ผู้รับผิดชอบ" list="ppl"></td><td class="c-s"><input id="qaS" type="date" value="${L.length?addD(L[L.length-1].end,1):(p&&p.start||td)}"></td><td class="c-e"><input id="qaD" type="number" min="1" value="3" title="จำนวนวัน" style="text-align:center"></td><td class="c-d" style="font-size:.75rem;color:var(--muted)">วัน</td><td class="c-st"><button class="btn sm main" id="qaB" type="button" style="width:100%">เพิ่ม</button></td><td class="tl" colspan="${days}"></td></tr>`;
  const pc=p?p.c:"var(--accent)";
  M.innerHTML=`${pj}
  <div class="card"><div class="gtitle">${esc(p?p.name:(cfg.name?cfg.name+" · ":"")+"แผนงานทุกโปรเจกต์")}</div>
    <div class="ph"><div class="pinfo"><span class="lb">วันที่เริ่ม${p?"โปรเจกต์":""}</span><b>${thD(s)}</b><span class="lb">วันที่สิ้นสุด${p?"โปรเจกต์":""}</span><b>${thD(e)}</b><span class="note">${days} วัน${e>=td&&s<=td?" · เหลืออีก "+dDiff(td,e)+" วัน":e<td?" · ครบกำหนดแล้ว":""}</span></div>
      <div style="flex:1;min-width:220px"><div style="display:flex;justify-content:space-between;font-size:.85rem"><span>ความคืบหน้า <b>${pr.p}%</b></span><span class="note">เสร็จ ${pr.d} / ${pr.n} งาน${pr.late?` · <b style="color:var(--danger)">เลยกำหนด ${pr.late}</b>`:""}</span></div><div class="pbar"><i style="width:${pr.p}%"></i></div></div>
      <div class="noprint" style="display:flex;gap:6px;flex-wrap:wrap"><div class="seg"><button type="button" data-z="d" class="${wk?"":"on"}">รายวัน</button><button type="button" data-z="w" class="${wk?"on":""}">รายสัปดาห์</button></div>${p?`<button class="btn sm ghost" type="button" id="pEdit">✏️ โปรเจกต์</button>`:""}<button class="btn sm ghost" type="button" onclick="print()">🖨️ พิมพ์</button><button class="btn sm main" type="button" id="tAdd">＋ เพิ่มงาน</button></div></div>
    <div class="gw" id="gw"><table class="gt${wk?" wk":""}" style="width:${(mob?246:684)+days*dwN}px"><thead><tr class="mo"><th class="c-n" rowspan="2">งานที่ต้องทำ</th><th class="c-w" rowspan="2">ผู้รับผิดชอบ</th><th class="c-s" rowspan="2">วันที่เริ่ม</th><th class="c-e" rowspan="2">วันที่สิ้นสุด</th><th class="c-d" rowspan="2">ระยะเวลา<br>(วัน)</th><th class="c-st" rowspan="2">สถานะ</th>${mo}</tr><tr class="dy">${dy}</tr></thead><tbody>${body||`<tr><td class="c-n" style="color:var(--muted)">ยังไม่มีงาน</td><td class="c-w"></td><td class="c-s"></td><td class="c-e"></td><td class="c-d"></td><td class="c-st"></td>${tl(null)}</tr>`}${p?qa:""}</tbody></table></div>
    <div class="leg"><span><i style="background:var(--pS)"></i>Pending · รอเริ่ม</span><span><i style="background:var(--wS)"></i>WIP · กำลังทำ</span><span><i style="background:var(--dS)"></i>Completed · เสร็จแล้ว</span><span><i style="background:#fff;box-shadow:inset 0 0 0 2px var(--danger)"></i>เลยกำหนด</span><span><i style="background:rgba(224,93,93,.55);width:3px"></i>วันนี้</span>${p?"":`<span class="noprint">· เลือกโปรเจกต์ด้านบนเพื่อเพิ่มงานเร็ว ๆ ในตาราง</span>`}</div>
  </div><datalist id="ppl">${people().map(n=>`<option value="${esc(n)}">`).join("")}</datalist>`;
  M.querySelectorAll("[data-pj]").forEach(b=>b.onclick=()=>{if(b.dataset.pj==="+")return projDlg();ui.pid=b.dataset.pj;saveUi();render()});
  M.querySelectorAll("[data-pj2]").forEach(b=>b.onclick=()=>{ui.pid=b.dataset.pj2;saveUi();render()});
  M.querySelectorAll("[data-z]").forEach(b=>b.onclick=()=>{ui.zoom=b.dataset.z;saveUi();render()});
  M.querySelectorAll("[data-ed],.bar").forEach(b=>b.onclick=()=>taskDlg(b.dataset.ed||b.dataset.id));
  M.querySelectorAll("[data-st]").forEach(sel=>sel.onchange=()=>{const t=T.find(x=>x.id===sel.dataset.st);if(!t)return;t.st=sel.value;save();render();if(t.st==="d")toast("🎉 เสร็จแล้ว: "+t.name)});
  const pe=$("#pEdit");if(pe)pe.onclick=()=>projDlg(p.id);
  $("#tAdd").onclick=()=>taskDlg(null);
  const qb=$("#qaB");if(qb){const go=()=>{const n=$("#qaN").value.trim();if(!n){$("#qaN").focus();return}const st=$("#qaS").value||td,d=Math.max(1,+$("#qaD").value||1);T.push({id:uid("t"),pid:p.id,name:n,who:$("#qaW").value.trim(),start:st,end:addD(st,d-1),st:"p",note:""});addPerson($("#qaW").value);save();render();const q=$("#qaN");q&&q.focus()};qb.onclick=go;$("#qaN").onkeydown=e=>{if(e.key==="Enter")go()}}
  // เลื่อนให้เห็นวันนี้
  const gw=$("#gw");if(gw&&ti>3&&!vGantt.done){vGantt.done=1;const dw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--dw"))||26;gw.scrollLeft=Math.max(0,(ti-3)*dw)}
}
function people(){const s=new Set(cfg.people||[]);T.forEach(t=>t.who&&s.add(t.who));return[...s].filter(Boolean)}
function addPerson(n){n=String(n||"").trim();if(n&&!(cfg.people||[]).includes(n)){cfg.people=(cfg.people||[]).concat(n);saveC()}}

/* ---------- หน้าต่างงาน ---------- */
function openDlg(t,h){$("#dlgT").textContent=t;$("#dlgB").innerHTML=h;$("#dlg").showModal()}
$("#dlgX").onclick=()=>$("#dlg").close();
function taskDlg(id){const t=id?T.find(x=>x.id===id):null,pid=t?t.pid:(ui.pid||cfg.projects[0].id),L=tasksOf(pid),st0=t?t.start:(L.length?addD(L[L.length-1].end,1):((P(pid)||{}).start||today()));
  openDlg(t?"แก้ไขงาน":"เพิ่มงาน",`<div class="f"><label>งานที่ต้องทำ</label><input class="in-" id="tN" value="${esc(t?t.name:"")}" placeholder="เช่น ออกแบบโลโก้"></div>
  <div class="row"><div class="f"><label>โปรเจกต์</label><select class="in-" id="tP">${cfg.projects.map(p=>`<option value="${p.id}"${p.id===pid?" selected":""}>${esc(p.name)}</option>`).join("")}</select></div><div class="f"><label>ผู้รับผิดชอบ</label><input class="in-" id="tW" list="ppl2" value="${esc(t?t.who:"")}" placeholder="ชื่อ (ถ้ามี)"><datalist id="ppl2">${people().map(n=>`<option value="${esc(n)}">`).join("")}</datalist></div></div>
  <div class="row3"><div class="f"><label>วันที่เริ่ม</label><input class="in-" type="date" id="tS" value="${st0}"></div><div class="f"><label>วันที่สิ้นสุด</label><input class="in-" type="date" id="tE" value="${t?t.end:addD(st0,2)}"></div><div class="f"><label>จำนวนวัน</label><input class="in-" type="number" min="1" id="tD" value="${t?dur(t):3}"></div></div>
  <div class="f"><label>สถานะ</label><div class="seg" id="tSt">${Object.keys(ST).map(k=>`<button type="button" data-k="${k}" class="${(t?t.st:"p")===k?"on":""}">${ST[k][0]}</button>`).join("")}</div></div>
  <div class="f"><label>หมายเหตุ</label><textarea class="in-" id="tNo" placeholder="รายละเอียด ลิงก์ไฟล์ ฯลฯ">${esc(t?t.note:"")}</textarea></div>
  <div style="display:flex;gap:8px;justify-content:space-between">${t?`<button class="btn ghost danger" id="tDel" type="button">ลบงาน</button>`:"<span></span>"}<button class="btn main" id="tOk" type="button">บันทึก</button></div>`);
  let st=t?t.st:"p";$$("#tSt button").forEach(b=>b.onclick=()=>{st=b.dataset.k;$$("#tSt button").forEach(x=>x.classList.toggle("on",x===b))});
  const sync=from=>{const s=$("#tS").value;if(!s)return;if(from==="d"){$("#tE").value=addD(s,Math.max(1,+$("#tD").value||1)-1)}else{let e=$("#tE").value;if(!e||e<s){e=s;$("#tE").value=s}$("#tD").value=dDiff(s,e)+1}};
  $("#tS").oninput=()=>sync("d");$("#tE").oninput=()=>sync("e");$("#tD").oninput=()=>sync("d");
  $("#tOk").onclick=()=>{const n=$("#tN").value.trim();if(!n){$("#tN").focus();return toast("ใส่ชื่องานก่อน")}const s=$("#tS").value||today();let e=$("#tE").value||s;if(e<s)e=s;
    const o={name:n,pid:$("#tP").value,who:$("#tW").value.trim(),start:s,end:e,st,note:$("#tNo").value};addPerson(o.who);
    if(t)Object.assign(t,o);else T.push(Object.assign({id:uid("t")},o));save();$("#dlg").close();render();toast("บันทึกแล้ว ✓")};
  const d=$("#tDel");if(d)d.onclick=()=>{if(!confirm("ลบงาน \""+t.name+"\" ?"))return;T=T.filter(x=>x!==t);save();$("#dlg").close();render()};
  setTimeout(()=>$("#tN").focus(),50)}
function projDlg(id){const p=id?P(id):null,c=p?p.c:PC[cfg.projects.length%PC.length];
  openDlg(p?"แก้ไขโปรเจกต์":"สร้างโปรเจกต์",`<div class="f"><label>ชื่อโปรเจกต์</label><input class="in-" id="pN" value="${esc(p?p.name:"")}" placeholder="เช่น เปิดร้านสาขาใหม่"></div>
  <div class="row"><div class="f"><label>วันที่เริ่มโปรเจกต์</label><input class="in-" type="date" id="pS" value="${p?p.start||"":today()}"></div><div class="f"><label>วันที่สิ้นสุดโปรเจกต์</label><input class="in-" type="date" id="pE" value="${p?p.end||"":addD(today(),37)}"></div></div>
  <div class="f"><label>สี</label><div class="sw">${PC.map(x=>`<label><input type="radio" name="pc" value="${x}"${x===c?" checked":""}><i style="background:${x}"></i></label>`).join("")}</div></div>
  <p class="note" style="margin:0">ไม่ใส่วันก็ได้ ระบบใช้วันของงานแรก-งานสุดท้ายให้เอง</p>
  <div style="display:flex;gap:8px;justify-content:space-between">${p?`<button class="btn ghost danger" id="pDel" type="button">ลบโปรเจกต์</button>`:"<span></span>"}<button class="btn main" id="pOk" type="button">บันทึก</button></div>`);
  $("#pOk").onclick=()=>{const n=$("#pN").value.trim();if(!n){$("#pN").focus();return toast("ใส่ชื่อโปรเจกต์ก่อน")}const o={name:n,start:$("#pS").value,end:$("#pE").value,c:($("input[name=pc]:checked")||{}).value||c};
    if(p)Object.assign(p,o);else{const np=Object.assign({id:uid("p")},o);cfg.projects.push(np);ui.pid=np.id;saveUi()}if(cfg.demo&&!p)cfg.demo=false;saveC();$("#dlg").close();ui.v="gantt";saveUi();render();toast(p?"บันทึกแล้ว ✓":"สร้างโปรเจกต์แล้ว · เพิ่มงานในตารางได้เลย")};
  const d=$("#pDel");if(d)d.onclick=()=>{const n=T.filter(t=>t.pid===p.id).length;if(!confirm("ลบโปรเจกต์ \""+p.name+"\""+(n?" และงาน "+n+" รายการ":"")+" ?"))return;cfg.projects=cfg.projects.filter(x=>x!==p);T=T.filter(t=>t.pid!==p.id);if(ui.pid===p.id)ui.pid="";save();saveC();saveUi();$("#dlg").close();render()};
  setTimeout(()=>$("#pN").focus(),50)}

/* ---------- ภาพรวม ---------- */
function vDash(){const M=$("#main");if(!cfg.projects.length)return emptyHello(M);
  const pr=prog(T),td=today(),wk=addD(td,7);
  const a=pr.n?pr.d/pr.n*100:0,b=pr.n?pr.w/pr.n*100:0;
  const up=T.filter(t=>t.st!=="d"&&t.end<=wk).sort((x,y)=>x.end<y.end?-1:1).slice(0,10);
  const pp={};T.filter(t=>t.st!=="d").forEach(t=>{const k=t.who||"(ยังไม่ระบุ)";pp[k]=pp[k]||{n:0,w:0,late:0};pp[k].n++;if(t.st==="w")pp[k].w++;if(isLate(t))pp[k].late++});
  M.innerHTML=`<div class="kpis"><div class="kpi" style="--k:var(--accent)"><span>งานทั้งหมด</span><b>${pr.n}</b><small>${cfg.projects.length} โปรเจกต์</small></div><div class="kpi" style="--k:var(--dS)"><span>เสร็จแล้ว</span><b>${pr.d}</b><small>${pr.p}% ของงานทั้งหมด</small></div><div class="kpi" style="--k:var(--wS)"><span>กำลังทำ</span><b>${pr.w}</b><small>รอเริ่ม ${pr.n-pr.d-pr.w} งาน</small></div><div class="kpi" style="--k:var(--danger)"><span>เลยกำหนด</span><b style="color:${pr.late?"var(--danger)":"inherit"}">${pr.late}</b><small>${pr.late?"ควรรีบตามงาน":"ไม่มีงานค้าง 👍"}</small></div></div>
  <div class="g2"><div class="card"><h2>สถานะงานทั้งหมด</h2><div class="dl"><div class="donut" style="background:conic-gradient(var(--dS) 0 ${a}%,var(--wS) ${a}% ${a+b}%,var(--pS) ${a+b}% 100%)"><i><span><b>${pr.p}%</b><small class="note">เสร็จแล้ว</small></span></i></div><ul><li><i style="background:var(--dS)"></i>เสร็จแล้ว ${pr.d}</li><li><i style="background:var(--wS)"></i>กำลังทำ ${pr.w}</li><li><i style="background:var(--pS)"></i>รอเริ่ม ${pr.n-pr.d-pr.w}</li></ul></div></div>
    <div class="card"><h2>ความคืบหน้าแต่ละโปรเจกต์</h2><div class="pl">${cfg.projects.map(p=>{const L=tasksOf(p.id),q=prog(L),[s,e]=span(L,p),lf=dDiff(td,e);return`<div class="it" data-go="${p.id}"><div><b style="color:${p.c}">● ${esc(p.name)}</b><span>${q.p}%</span></div><div class="pbar"><i style="width:${q.p}%;background:${p.c}"></i></div><div><small>${thD(s)} – ${thD(e)} · ${q.d}/${q.n} งาน${q.late?` · <b style="color:var(--danger)">เลยกำหนด ${q.late}</b>`:""}</small><small>${q.p>=100&&q.n?"🎉 เสร็จทั้งโปรเจกต์":lf<0?"ครบกำหนดแล้ว":"เหลือ "+lf+" วัน"}</small></div></div>`}).join("")}</div></div></div>
  <div class="g2"><div class="card"><h2>ต้องเสร็จภายใน 7 วัน <small>รวมงานที่เลยกำหนด</small></h2>${up.length?`<ul class="ul">${up.map(t=>{const n=dDiff(td,t.end);return`<li data-ed="${t.id}"><span>${esc(t.name)} <small class="note">· ${esc((P(t.pid)||{}).name||"")}${t.who?" · "+esc(t.who):""}</small></span><em class="${n<0?"late":""}">${n<0?"เลย "+(-n)+" วัน":n===0?"วันนี้":"อีก "+n+" วัน"}</em></li>`}).join("")}</ul>`:`<p class="note">ไม่มีงานที่ใกล้ครบกำหนด 👍</p>`}</div>
    <div class="card"><h2>งานที่ค้างของแต่ละคน</h2>${Object.keys(pp).length?`<div class="ppl">${Object.entries(pp).sort((x,y)=>y[1].n-x[1].n).map(([k,v])=>`<div><b>${esc(k)}</b>ค้าง ${v.n} งาน · กำลังทำ ${v.w}${v.late?` · <span style="color:var(--danger)">เลยกำหนด ${v.late}</span>`:""}</div>`).join("")}</div>`:`<p class="note">ทุกงานเสร็จแล้ว 🎉</p>`}</div></div>`;
  M.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{ui.pid=x.dataset.go;ui.v="gantt";saveUi();render()});
  M.querySelectorAll("[data-ed]").forEach(x=>x.onclick=()=>taskDlg(x.dataset.ed))}

/* ---------- ตั้งค่า ---------- */
function vSet(){const M=$("#main");
  M.innerHTML=`<div class="card"><h2>ชื่อทีม / บริษัท</h2><input class="in-" id="sName" value="${esc(cfg.name)}" placeholder="เช่น ทีมการตลาด"></div>
  <div class="card"><h2>โปรเจกต์ <button class="btn sm main" id="sNewP" type="button">＋ สร้างโปรเจกต์</button></h2>${cfg.projects.length?`<div class="plist">${cfg.projects.map(p=>{const q=prog(tasksOf(p.id));return`<div><i style="background:${p.c}"></i><span><b>${esc(p.name)}</b><br><small>${p.start?thD(p.start):"-"} – ${p.end?thD(p.end):"-"} · ${q.n} งาน · ${q.p}%</small></span><button class="btn sm ghost" data-pe="${p.id}" type="button">แก้ไข</button></div>`}).join("")}</div>`:`<p class="note">ยังไม่มีโปรเจกต์</p>`}</div>
  <div class="card"><h2>รายชื่อผู้รับผิดชอบ</h2><textarea class="in-" id="sPpl" placeholder="ใส่ทีละบรรทัด">${esc((cfg.people||[]).join("\n"))}</textarea><p class="note" style="margin:0">ใช้เลือกตอนเพิ่มงาน (พิมพ์ชื่อใหม่ในงานได้เลย ระบบจำให้เอง)</p></div>
  <div class="card"><h2>ข้อมูล</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="sCsv" type="button">⬇️ ส่งออก Excel (CSV)</button><button class="btn ghost" id="sDemo" type="button">✨ ใส่ข้อมูลตัวอย่าง</button><button class="btn ghost danger" id="sClr" type="button">ล้างข้อมูลทั้งหมด</button></div><p class="note" style="margin:0">ข้อมูลเก็บในเครื่องนี้ และสำรองขึ้นระบบอัตโนมัติเมื่อเข้าสู่ระบบสมาชิก</p></div>`;
  $("#sName").oninput=e=>{cfg.name=e.target.value;saveC()};
  $("#sPpl").onchange=e=>{cfg.people=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);saveC();toast("บันทึกแล้ว ✓")};
  $("#sNewP").onclick=()=>projDlg();M.querySelectorAll("[data-pe]").forEach(b=>b.onclick=()=>projDlg(b.dataset.pe));
  $("#sCsv").onclick=csv;$("#sDemo").onclick=()=>{if(T.length&&!confirm("ข้อมูลตัวอย่างจะแทนข้อมูลที่มีอยู่ ต้องการต่อ?"))return;demo()};
  $("#sClr").onclick=()=>{if(!confirm("ล้างโปรเจกต์และงานทั้งหมด? ย้อนกลับไม่ได้"))return;T=[];cfg.projects=[];cfg.demo=false;ui.pid="";save();saveC();saveUi();render();toast("ล้างแล้ว")}}
function csv(){const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';const rows=[["โปรเจกต์","งานที่ต้องทำ","ผู้รับผิดชอบ","วันที่เริ่ม","วันที่สิ้นสุด","ระยะเวลา (วัน)","สถานะ","หมายเหตุ"]];
  cfg.projects.forEach(p=>tasksOf(p.id).forEach(t=>rows.push([p.name,t.name,t.who,t.start,t.end,dur(t),ST[t.st][1],t.note])));
  const b=new Blob(["﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="project-planner-"+today()+".csv";a.click()}

/* ---------- ตัวอย่าง ---------- */
function demo(){const t=today(),s=addD(t,-12),p1={id:uid("p"),name:"เปิดร้านกาแฟสาขาใหม่",start:s,end:addD(s,37),c:PC[0]},p2={id:uid("p"),name:"ทำเว็บไซต์ร้าน",start:addD(t,-5),end:addD(t,20),c:PC[1]};
  const D=[["สำรวจทำเลและคู่แข่ง","มิว",0,5],["ทำแผนธุรกิจ + งบประมาณ","มิว",1,5],["เซ็นสัญญาเช่าพื้นที่","ต้น",7,3],["ออกแบบร้าน","ฝน",9,4],["ขออนุญาตร้านอาหาร","ต้น",11,5],["ตกแต่งร้าน / งานระบบ","ช่างเอก",14,8],["สั่งเครื่องชงกาแฟ","ต้น",15,2],["ออกแบบเมนูและราคา","ฝน",16,3],["รับสมัครพนักงาน","มิว",19,6],["อบรมพนักงาน","ฝน",24,4],["ทำป้ายและสื่อโปรโมต","ฝน",26,5],["เปิดเพจ + ยิงโฆษณา","มิว",27,7],["ทดลองเปิด (Soft opening)","ทุกคน",33,3],["งานเปิดร้านจริง","ทุกคน",36,1],["สรุปผล 1 สัปดาห์แรก","มิว",37,1]];
  const W=[["รวบรวมรูปร้าน + เมนู","ฝน",0,3],["ออกแบบหน้าเว็บ","บีม",3,5],["เขียนเนื้อหา","มิว",5,4],["ทำระบบสั่งออนไลน์","บีม",9,7],["ทดสอบบนมือถือ","บีม",16,3],["เปิดใช้งานเว็บ","บีม",20,1]];
  const st=(a,e)=>e<t?(Math.random()<.85?"d":"w"):a<=t?"w":"p";
  T=D.map(d=>{const a=addD(s,d[2]),e=addD(a,d[3]-1);return{id:uid("t"),pid:p1.id,name:d[0],who:d[1],start:a,end:e,st:st(a,e),note:""}}).concat(W.map(d=>{const a=addD(p2.start,d[2]),e=addD(a,d[3]-1);return{id:uid("t"),pid:p2.id,name:d[0],who:d[1],start:a,end:e,st:st(a,e),note:""}}));
  const lt=T.find(x=>x.end<t&&x.pid===p1.id&&x.name.includes("ขออนุญาต"));if(lt)lt.st="w";
  cfg.projects=[p1,p2];cfg.people=["มิว","ต้น","ฝน","บีม","ช่างเอก"];if(!cfg.name)cfg.name="ร้านกาแฟตัวอย่าง";cfg.demo=true;ui.pid=p1.id;ui.v="gantt";vGantt.done=0;save();saveC();saveUi();render();toast("ใส่ตัวอย่างแล้ว ✓")}
window.addEventListener("storage",e=>{if(e.key===K.items||e.key===K.cfg){T=LS.get(K.items,[])||[];cfg=Object.assign(cfg,LS.get(K.cfg,{})||{});if(!$("#dlg").open)render()}});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(ui.v==="gantt"&&!$("#dlg").open)render()},200)});
if(/[?&]demo=1/.test(location.search)&&!T.length)demo();else render();
})();
</script>
