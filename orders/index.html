<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่ในเบราว์เซอร์เต็ม)");return false}}};
const K={o:"edm_ord_items",cfg:"edm_ord_cfg",ui:"edm_ord_ui",si:"edm_stock_items",stx:"edm_stock_tx"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>(+n||0).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2});
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thD=s=>{if(!s)return"";const[y,m,d]=s.slice(0,10).split("-");return +d+" "+MS[+m-1]+" "+String(+y+543).slice(2)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const CH={fb:"Facebook",line:"LINE",tiktok:"TikTok",shopee:"Shopee",lazada:"Lazada",ig:"Instagram",web:"เว็บไซต์",walk:"หน้าร้าน",other:"อื่น ๆ"};
const ST={new:["รอโอน / ยืนยัน","s-new"],paid:["ชำระแล้ว รอแพ็ก","s-paid"],packed:["แพ็กแล้ว รอส่ง","s-packed"],shipped:["ส่งแล้ว","s-shipped"],done:["ลูกค้าได้รับแล้ว","s-done"],cancel:["ยกเลิก","s-cancel"]};
const NEXT={new:["paid","✅ ได้รับเงิน"],paid:["packed","📦 แพ็กแล้ว"],packed:["shipped","🚚 ส่งแล้ว"],shipped:["done","🏁 ลูกค้าได้รับ"]};
const CFG0={shop:{name:"",phone:"",addr:""},carriers:["Flash Express","Kerry Express","J&T Express","ไปรษณีย์ไทย (EMS)","ไปรษณีย์ไทย (ลงทะเบียน)","Shopee Xpress","Lalamove / Grab"],ship:40,prefix:"OD"};
let O=LS.get(K.o,[])||[],cfg=Object.assign({},CFG0,LS.get(K.cfg,{})||{}),ui=Object.assign({v:"home",f:"open",q:""},LS.get(K.ui,{})||{});
cfg.shop=Object.assign({},CFG0.shop,cfg.shop||{});
const save=()=>LS.set(K.o,O),saveCfg=()=>LS.set(K.cfg,cfg),saveUi=()=>LS.set(K.ui,ui);
const tot=o=>{const sub=r2((o.lines||[]).reduce((a,l)=>a+num(l.q)*num(l.p),0));const t=r2(Math.max(0,sub+num(o.ship)-num(o.disc)));return{sub,total:t}};
const items=()=>LS.get(K.si,[])||[];
function nextNo(d){const ym=(d||today()).slice(2,7).replace("-",""),p=(cfg.prefix||"OD").replace(/[^A-Za-z]/g,"")||"OD",k=p+ym+"-";let m=0;O.forEach(o=>{if(o.no&&o.no.startsWith(k))m=Math.max(m,+o.no.slice(k.length)||0)});return k+String(m+1).padStart(3,"0")}

/* ---------- ตัดสต๊อก: ตอนแพ็ก (ครั้งแรก) · ยกเลิกหลังตัดแล้ว = คืนสต๊อก ---------- */
function stockCut(o,back){const L=(o.lines||[]).filter(l=>l.pid&&num(l.q)>0);if(!L.length)return;const tx=LS.get(K.stx,[])||[];
  L.forEach(l=>tx.push({id:uid("t"),type:back?"in":"out",date:today(),pid:l.pid,qty:num(l.q),cost:0,note:(back?"คืนสต๊อก ยกเลิกออเดอร์ ":"ขายออนไลน์ ออเดอร์ ")+o.no,ts:Date.now(),src:"orders",ref:o.id}));
  LS.set(K.stx,tx);o.cut=!back}
function setSt(o,st){if(st==="cancel"){if(o.cut)stockCut(o,true)}else if(["packed","shipped","done"].includes(st)&&!o.cut)stockCut(o,false);
  if(st==="paid"&&!o.paidAt)o.paidAt=today();if(st==="shipped"&&!o.shipAt)o.shipAt=today();o.st=st;o.upd=Date.now();save()}

/* ---------- วางข้อความจากแชต → ชื่อ เบอร์ ที่อยู่ ---------- */
function parseChat(t){const out={name:"",phone:"",addr:""};t=String(t||"").replace(/\r/g,"").trim();if(!t)return out;
  const ph=/(?:\+?66|0)[\s-]?\d(?:[\s-]?\d){7,8}/.exec(t);if(ph){out.phone=ph[0].replace(/[\s-]/g,"").replace(/^\+?66/,"0");t=t.replace(ph[0]," ")}
  let lines=t.split(/\n+/).map(s=>s.replace(/^(ชื่อ|ผู้รับ|name|ที่อยู่|address|เบอร์|โทร|tel)\s*[:：]?\s*/i,"").trim()).filter(Boolean);
  const nameIdx=lines.findIndex(s=>!/\d/.test(s)&&s.length<=40);if(nameIdx>=0){out.name=lines[nameIdx].replace(/^(คุณ|K\.|k\.)\s*/,"คุณ");lines.splice(nameIdx,1)}
  out.addr=lines.join(" ").replace(/\s+/g," ").trim();if(!out.name&&out.addr){const m=/^(\D{2,30}?)\s+(\d.*)$/.exec(out.addr);if(m){out.name=m[1];out.addr=m[2]}}
  return out}

/* ---------- หน้าจอ ---------- */
const VIEWS=["home","list","pack","set"];
function render(){if(!VIEWS.includes(ui.v))ui.v="home";const nPack=O.filter(o=>o.st==="paid"||o.st==="packed"||(o.st==="new"&&o.pay==="cod")).length;
  $$("#tabs button").forEach(b=>{b.classList.toggle("on",b.dataset.v===ui.v);if(b.dataset.v==="pack")b.innerHTML="📦 รอแพ็ก/ส่ง"+(nPack?`<span class="n">${nPack}</span>`:"")});
  ({home:vHome,list:vList,pack:vPack,set:vSet})[ui.v]()}
function show(v){ui.v=v;saveUi();render();scrollTo(0,0)}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b)show(b.dataset.v)};
$("#fab").onclick=()=>orderDlg(null);
const live=()=>O.filter(o=>o.st!=="cancel");
function vHome(){const M=$("#main"),t=today(),m=t.slice(0,7),L=live();
  if(!O.length){M.innerHTML=`<div class="hello"><h1>📦 จัดการออเดอร์ร้านออนไลน์</h1><p>รับออเดอร์จาก Facebook LINE TikTok Shopee ในที่เดียว · วางข้อความจากแชต ระบบดึงชื่อ เบอร์ ที่อยู่ให้ · ติดตามสถานะ พิมพ์ใบปะหน้า แยก COD ตัดสต๊อกอัตโนมัติ</p></div>
    <div class="card"><h2>เริ่มใน 3 ขั้นตอน</h2><div class="note" style="font-size:.92rem;line-height:1.8">1) กด <b>＋</b> มุมขวาล่าง วางข้อความลูกค้าจากแชต แล้วใส่สินค้า<br>2) ลูกค้าโอนแล้วกด "ได้รับเงิน" → แพ็ก → ใส่เลขพัสดุ "ส่งแล้ว"<br>3) พิมพ์ใบปะหน้าทีละหลายออเดอร์ ส่งเลขพัสดุให้ลูกค้าทาง LINE ในคลิกเดียว</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn main" id="b1" type="button">＋ เพิ่มออเดอร์แรก</button><button class="btn ghost" id="bd" type="button">✨ ลองข้อมูลตัวอย่าง</button></div></div>`;
    $("#b1").onclick=()=>orderDlg(null);$("#bd").onclick=demo;return}
  const td=L.filter(o=>o.date===t),mo=L.filter(o=>o.date.slice(0,7)===m),sum=a=>a.reduce((s,o)=>s+tot(o).total,0);
  const toPack=O.filter(o=>o.st==="paid"||(o.st==="new"&&o.pay==="cod")).length,toShip=O.filter(o=>o.st==="packed").length,waitPay=O.filter(o=>o.st==="new"&&o.pay!=="cod").length;
  const codOut=L.filter(o=>o.pay==="cod"&&(o.st==="shipped"||o.st==="packed")&&!o.codGot).reduce((s,o)=>s+tot(o).total,0);
  const days=[];for(let i=13;i>=0;i--){const d=addDays(t,-i);days.push({d,v:sum(L.filter(o=>o.date===d))})}const mx=Math.max(1,...days.map(x=>x.v));
  const chs={};mo.forEach(o=>{chs[o.ch]=(chs[o.ch]||0)+tot(o).total});const chL=Object.entries(chs).sort((a,b)=>b[1]-a[1]),cmx=Math.max(1,...chL.map(x=>x[1]));

    if(old){$("#oLab").onclick=()=>{grab();labels([o])};$("#oMsg").onclick=()=>{grab();copyMsg(o)};$("#oDel").onclick=()=>{if(!confirm("ลบออเดอร์ "+o.no+"?"))return;if(o.cut)stockCut(o,true);O=O.filter(x=>x.id!==o.id);save();$("#dlg").close();render()}}};
  draw()}
