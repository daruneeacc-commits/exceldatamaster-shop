<style>
:root{--bg:#F4F6F5;--card:#fff;--ink:#0F1513;--muted:#66706B;--line:#E2E6E4;--soft:#F4F6F5;--accent:#127A4B;--accent-ink:#fff;--warn:#8A5A00;--warnbg:#FFF4DC;--danger:#B3261E;--dangerbg:#FDE8E7;--okbg:#E3F4EA;--blue:#1F4FA3;--bluebg:#E6EEFB;--coffee:#6B4226;--coffeebg:#F5EDE6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1110;--card:#161C1A;--ink:#EEF2F0;--muted:#97A29D;--line:#26302C;--soft:#1C2421;--accent:#4CC48A;--accent-ink:#06120C;--warn:#F0C27A;--warnbg:#2A2416;--danger:#F2867E;--dangerbg:#2C1A19;--okbg:#14261C;--blue:#8AB4F8;--bluebg:#18233A;--coffee:#E0B48F;--coffeebg:#2A211B}}
:root[data-theme="dark"]{--bg:#0D1110;--card:#161C1A;--ink:#EEF2F0;--muted:#97A29D;--line:#26302C;--soft:#1C2421;--accent:#4CC48A;--accent-ink:#06120C;--warn:#F0C27A;--warnbg:#2A2416;--danger:#F2867E;--dangerbg:#2C1A19;--okbg:#14261C;--blue:#8AB4F8;--bluebg:#18233A;--coffee:#E0B48F;--coffeebg:#2A211B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--soft);color:var(--ink);font-size:.9rem;justify-content:center}
.btn:hover{filter:brightness(.97)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn.lg{padding:14px 20px;font-size:1.02rem}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
main{max-width:1400px;margin:0 auto;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line);overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
.edm-embed #tabs{display:none!important}
#kExit{display:none}
body.kiosk header.top{display:none}
body.kiosk #tabs{display:flex!important;position:sticky;top:0;z-index:40}
body.kiosk #tabs [data-v="home"],body.kiosk #tabs [data-v="menu"],body.kiosk #tabs [data-v="inv"],body.kiosk #tabs [data-v="rpt"],body.kiosk #tabs [data-v="set"]{display:none}
body.kiosk #kExit{display:block;flex:0 0 auto;color:var(--danger)}
body.kiosk main{max-width:none;padding-top:8px}
#view{display:flex;flex-direction:column;gap:14px}
.hello h1{font-size:1.35rem;margin:0}.hello p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.05rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:.82rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px var(--line);border:0;text-align:left;display:block;width:100%;cursor:default}
button.kpi{cursor:pointer}
.kpi span{font-size:.8rem;color:var(--muted);display:block}
.kpi b{font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.3;display:block}
.kpi small{color:var(--muted);font-size:.76rem}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:620px){.row3{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.f>span{font-size:.8rem;font-weight:600;color:var(--muted)}
.in-{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;outline:none}
.in-:focus{border-color:var(--accent)}
.in-.r{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:7px 10px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .grow{flex:1}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
table.t th{text-align:left;font-size:.76rem;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t .r{text-align:right;white-space:nowrap}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--soft)}
table.t tfoot td{font-weight:700;border-top:1.5px solid var(--ink)}
.sub{display:block;font-size:.78rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-new{background:var(--warnbg);color:var(--warn)}.p-make{background:var(--bluebg);color:var(--blue)}.p-done{background:var(--okbg);color:var(--accent)}.p-served{background:var(--soft);color:var(--muted)}.p-void{background:var(--dangerbg);color:var(--danger)}
.empty{text-align:center;padding:26px 10px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{font-size:.8rem;color:var(--muted)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.86rem}
.bad{background:var(--dangerbg);color:var(--danger);border-radius:10px;padding:8px 12px;font-size:.86rem}
.hint{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.55}
.li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li>div:first-child{min-width:0}
.li small{display:block;color:var(--muted);font-size:.8rem}
.li .r{text-align:right;white-space:nowrap;display:flex;gap:6px;align-items:center;justify-content:flex-end}
.ck{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--soft);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:.88rem}
.chip.on{background:var(--ink);color:var(--bg)}
.chip small{font-weight:400;opacity:.75}
/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
@media(max-width:900px){.pos{grid-template-columns:1fr}}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.cats button{border:0;background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer;white-space:nowrap}
.cats button.on{background:var(--coffee);color:#fff;box-shadow:none}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.mi{border:0;background:var(--card);box-shadow:0 0 0 1px var(--line);border-radius:16px;padding:12px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center;position:relative;min-height:118px;justify-content:center}
.mi:active{transform:scale(.97)}
.mi.pulse{box-shadow:0 0 0 3px var(--accent)}
.mi{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.mi i{font-style:normal;font-size:2rem;line-height:1.1}
.mi b{font-size:.92rem;line-height:1.25}
.mi span{color:var(--coffee);font-weight:700;font-size:.92rem}
.mi.off{opacity:.45}
.mi .tag{position:absolute;top:6px;right:6px;font-size:.66rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--dangerbg);color:var(--danger)}
.mi .tag.low{background:var(--warnbg);color:var(--warn)}
.mi.has-img{padding:0 0 10px;justify-content:flex-start;overflow:hidden;gap:4px}
.mi .ph{display:block;width:100%;aspect-ratio:4/3;overflow:hidden;background:var(--soft);margin-bottom:4px}
.mi .ph img{width:100%;height:100%;object-fit:cover;display:block}
.mi.has-img b,.mi.has-img span{padding:0 8px}
.mi.has-img .tag{z-index:1}
.mthumb{width:30px;height:30px;border-radius:8px;object-fit:cover;vertical-align:middle}
.mphoto{display:flex;gap:14px;align-items:center;padding:12px;border-radius:14px;background:var(--soft);margin:10px 0}
.mph-pv{width:84px;height:84px;flex:none;border-radius:14px;overflow:hidden;background:var(--card);display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.mph-pv img{width:100%;height:100%;object-fit:cover}.mph-pv span{font-size:2.4rem}
.mph-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.cart{position:sticky;top:12px;background:var(--card);border-radius:18px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;max-height:calc(100vh - 24px)}
.edm-embed .cart{top:8px;max-height:calc(100vh - 16px)}
.cart .ch{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.cart .cl{padding:6px 14px;overflow-y:auto;flex:1;min-height:80px}
.cart .cf{padding:12px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.cline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;padding:9px 0;border-bottom:1px dashed var(--line)}
.cline:last-child{border-bottom:0}
.cline .nm{cursor:pointer;font-weight:600;line-height:1.3}
.cline .op{font-size:.78rem;color:var(--muted);grid-column:1/-1;line-height:1.35}
.cline .am{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.qty{display:inline-flex;align-items:center;gap:4px}
.qty button{width:30px;height:30px;border-radius:50%;border:0;background:var(--soft);font-weight:700;cursor:pointer;font-size:1rem;line-height:1}
.qty b{min-width:22px;text-align:center}
.tot{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-variant-numeric:tabular-nums}
.tot .r{text-align:right}
.tot .big{font-size:1.35rem;font-weight:700}
.cartbar{display:none}
@media(max-width:900px){
  .cart{display:none}
  body.cart-open .cart{display:flex;position:fixed;inset:auto 0 0 0;top:auto;max-height:88vh;border-radius:20px 20px 0 0;z-index:60;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  body.cart-open .scrim{display:block}
  .cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:50;background:var(--coffee);color:#fff;border-radius:999px;padding:12px 18px;align-items:center;gap:10px;font-weight:700;border:0;cursor:pointer;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
  .edm-embed .cartbar{bottom:12px}
  .cartbar .sp{flex:1}
  .pos{padding-bottom:70px}
}
.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55}
/* จอบาร์ */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
@media(max-width:900px){.kds{grid-template-columns:1fr}}
.kcol{background:var(--soft);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:120px}
.kcol>h3{margin:2px 4px;font-size:.95rem;display:flex;justify-content:space-between}
.tk{background:var(--card);border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:12px;display:flex;flex-direction:column;gap:8px}
.tk.late{box-shadow:0 0 0 2px var(--danger)}
.tk.mid{box-shadow:0 0 0 2px var(--warn)}
.tk .h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk .q{font-size:1.5rem;font-weight:700;line-height:1}
.tk .t{font-size:.8rem;color:var(--muted);text-align:right}
.tk ul{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tk li{font-weight:600;line-height:1.3}
.tk li small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.tk li em{font-style:normal;color:var(--danger);font-size:.8rem;display:block}
.callq{display:flex;gap:8px;flex-wrap:wrap}
.callq span{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:6px 14px;font-size:1.4rem;font-weight:700}
/* ฟอร์ม/หน้าต่าง */
dialog{border:0;border-radius:18px;padding:0;max-width:min(640px,calc(100% - 24px));width:100%;background:var(--card);color:var(--ink);max-height:calc(100% - 24px)}
dialog.lg{max-width:min(860px,calc(100% - 24px))}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:2}
dialog .db{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
dialog .foot{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:2}
dialog .foot .sp{flex:1}
.og{display:flex;flex-direction:column;gap:6px}
.og>b{font-size:.88rem}
.og>b small{font-weight:400;color:var(--muted)}
.paybig{text-align:center;font-size:2.4rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.change{text-align:center;font-size:1.3rem;font-weight:700;color:var(--accent)}
.change.neg{color:var(--danger)}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.qrbox .qr{background:#fff;padding:10px;border-radius:12px;width:240px;height:240px}
.qrbox .qr svg{width:100%;height:100%;display:block}
.qrbox .h{background:#113566;color:#fff;font-weight:700;font-size:.85rem;border-radius:8px;padding:3px 14px}
.qbig{font-size:4rem;font-weight:700;text-align:center;line-height:1;color:var(--coffee)}
.rec{display:grid;grid-template-columns:minmax(0,1fr) 90px 52px 32px;gap:6px;align-items:center}
.rec .u{font-size:.8rem;color:var(--muted)}
.rec .x,.x{border:0;background:none;color:var(--muted);font-size:1.05rem;cursor:pointer;padding:6px}
.choice{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.choice .top{display:grid;grid-template-columns:minmax(0,1fr) 90px 80px 32px;gap:6px;align-items:end}
@media(max-width:560px){.choice .top{grid-template-columns:1fr 1fr}.rec{grid-template-columns:minmax(0,1fr) 80px 40px 28px}}
.bars{display:flex;align-items:flex-end;gap:3px;height:140px;padding-top:10px}
.bars div{flex:1;background:var(--coffee);border-radius:5px 5px 0 0;min-height:2px;position:relative}
.bars div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:.62rem;color:var(--muted);white-space:nowrap}
.barx{display:flex;gap:3px;font-size:.66rem;color:var(--muted)}
.barx span{flex:1;text-align:center}
.pinv{font-size:2rem;letter-spacing:.4em;min-height:2.6rem;font-weight:700}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:10px;justify-content:center}
.pinpad button{height:60px;border:0;border-radius:16px;background:var(--soft);font-size:1.4rem;font-weight:700;cursor:pointer}
.pinpad button:active{background:var(--line)}
dialog.pin{max-width:min(340px,calc(100% - 24px))}
dialog.ask{max-width:min(460px,calc(100% - 24px))}
details.guide{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.86rem}
details.guide summary{cursor:pointer;font-weight:700}
details.guide ol{margin:6px 0 0;padding-left:20px;line-height:1.6}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("บันทึกไม่ได้: พื้นที่ในเครื่องเต็ม ลองปิดกะเพื่อย่อข้อมูลเก่า");return false}}};
const K={menu:"edm_cafe_menu",orders:"edm_cafe_orders",shifts:"edm_cafe_shifts",cfg:"edm_cafe_cfg",ui:"edm_cafe_ui",cart:"edm_cafe_cart"};
const SK={items:"edm_cafe_items",tx:"edm_cafe_stx"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100,r4=n=>Math.round((n+Number.EPSILON)*1e4)/1e4;
const fmt0=n=>Math.round(n).toLocaleString("th-TH");
const fmt=n=>(+n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fm=n=>Math.abs(n-Math.round(n))<.005?fmt0(n):fmt(n);
const fq=n=>(+n||0).toLocaleString("th-TH",{maximumFractionDigits:3});
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=()=>ymd(new Date());
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
const dn=s=>{const[y,m,d]=String(s).slice(0,10).split("-").map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)};
const fromDn=n=>new Date(n*864e5).toISOString().slice(0,10);
const addDays=(s,n)=>fromDn(dn(s)+n);
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const thD=s=>{if(!/^\d{4}-\d{2}-\d{2}/.test(s||""))return"";const[y,m,d]=s.slice(0,10).split("-");return +d+" "+MS[+m-1]+" "+String(+y+543).slice(2)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const EMB=(()=>{try{return window.top!==window.self&&window.top.location.origin===location.origin}catch(e){return false}})();
if(EMB)document.documentElement.classList.add("edm-embed");
const PMN={cash:"เงินสด",qr:"QR พร้อมเพย์",transfer:"โอนเงิน",card:"บัตร"},PMI={cash:"💵",qr:"📱",transfer:"🏦",card:"💳"};
const CH0=[{id:"grab",name:"Grab",gp:30,markup:0,on:false},{id:"lineman",name:"LINE MAN",gp:30,markup:0,on:false},{id:"shopee",name:"ShopeeFood",gp:30,markup:0,on:false},{id:"robinhood",name:"Robinhood",gp:0,markup:0,on:false}];
const chOf=id=>(C.channels||[]).find(c=>c.id===id);
const chOn=()=>(C.channels||[]).filter(c=>c.on&&c.name);
const payKey=o=>o.pay.m==="app"?"app_"+o.pay.ch:o.pay.m;
const pmName=k=>String(k).startsWith("app_")?((chOf(String(k).slice(4))||{}).name||String(k).slice(4)):(PMN[k]||k);
const pmIcon=k=>String(k).startsWith("app_")?"🛵":(PMI[k]||"");
// ข้อมูลของระบบคาเฟ่ (แยกจากระบบอื่น)
const KS_ALL=["edm_cafe_menu","edm_cafe_orders","edm_cafe_shifts","edm_cafe_cfg","edm_cafe_items","edm_cafe_stx"];
const OST={new:["รอทำ","p-new"],make:["กำลังทำ","p-make"],done:["เสร็จ รอรับ","p-done"],served:["รับแล้ว","p-served"],void:["ยกเลิก","p-void"]};

/* ---------- ข้อมูล ---------- */
const CFG0={pp:"",rcHead:"",rcFoot:"ขอบคุณที่อุดหนุนค่ะ ☕",width:80,autoPrint:false,beep:true,staff:[],tables:"",qStart:1,methods:{cash:true,qr:true,transfer:true,card:false},keepDays:14,warnMin:7,unitDefault:"แก้ว",rcCnt:{},print:"",abbr:false,staffs:[],ownerPin:"",salt:"",perm:{staffRpt:false,maxDisc:10,unlockMin:15},channels:[],round:1};
let M={cats:[],items:[],groups:[]},O=[],SH=[],C={},ui={},cart=null;
function load(){M=Object.assign({cats:[],items:[],groups:[]},LS.get(K.menu,{})||{});O=LS.get(K.orders,[])||[];SH=LS.get(K.shifts,[])||[];
  C=Object.assign({},CFG0,LS.get(K.cfg,{})||{});C.methods=Object.assign({},CFG0.methods,C.methods||{});C.perm=Object.assign({},CFG0.perm,C.perm||{});
  if((!Array.isArray(C.staffs)||!C.staffs.length)&&Array.isArray(C.staff)&&C.staff.length)C.staffs=C.staff.map(n=>({id:uid("u"),name:n,pin:""}));C.staffs=Array.isArray(C.staffs)?C.staffs:[];
  if(!C.print)C.print=C.autoPrint?"auto":"ask";
  const cs=Array.isArray(C.channels)?C.channels:[];C.channels=CH0.map(d=>Object.assign({},d,cs.find(x=>x.id===d.id)||{})).concat(cs.filter(x=>!CH0.some(d=>d.id===x.id)));
  if(!C.shop){const b=LS.get("edm_bill_seller",{})||{};C.shop={name:b.name||"",addr:b.addr||"",tax:b.tax||"",branch:b.branch||"",phone:b.phone||"",vat:!!b.vat};LS.set(K.cfg,C)}
  if(localStorage.getItem(SK.items)==null)migrateInv();
  ui=Object.assign({v:"home",cat:"",q:"",of:"all",mt:"menu",rr:"today",rf:"",rt:""},LS.get(K.ui,{})||{});cart=Object.assign(newCart(),LS.get(K.cart,null)||{})}
// ย้ายวัตถุดิบที่สูตรใช้อยู่จากระบบสต๊อกเดิมมาเป็นของคาเฟ่เอง (ทำครั้งเดียว · ข้อมูลเดิมไม่ถูกลบ)
function migrateInv(){const P=new Set();const add=L=>(L||[]).forEach(r=>{if(r&&r.pid)P.add(r.pid)});M.items.forEach(m=>add(m.rec));M.groups.forEach(g=>(g.choices||[]).forEach(c=>add(c.rec)));
  const old=LS.get("edm_stock_items",[])||[],items=old.filter(i=>P.has(i.id)||String(i.id).startsWith("cafe_")).map(i=>Object.assign({},i,{name:String(i.name||"").replace(/^คาเฟ่ · /,"")})),ids=new Set(items.map(i=>i.id));
  const tx=ids.size?(LS.get("edm_stock_tx",[])||[]).filter(t=>ids.has(t.pid)):[];LS.set(SK.items,items);LS.set(SK.tx,tx)}
function newCart(){return{type:"take",table:"",ch:"",ref:"",lines:[],disc:{t:"amt",v:0},note:"",hold:[]}}
const saveM=()=>LS.set(K.menu,M),saveO=()=>LS.set(K.orders,O),saveSH=()=>LS.set(K.shifts,SH),saveC=()=>LS.set(K.cfg,C),saveUi=()=>LS.set(K.ui,{v:ui.v,cat:ui.cat,of:ui.of,mt:ui.mt,rr:ui.rr,kiosk:!!ui.kiosk}),saveCart=()=>LS.set(K.cart,cart);
const seller=()=>C.shop||{};
const curShift=()=>SH.find(s=>!s.closed)||null;
const mOf=id=>M.items.find(x=>x.id===id),gOf=id=>M.groups.find(x=>x.id===id),catOf=id=>M.cats.find(x=>x.id===id);

/* ---------- วัตถุดิบของคาเฟ่ (ยอดคงเหลือและต้นทุนถัวเฉลี่ย) ---------- */
let ST=null;
let STB=null,STri=null,STrt=null;
function stock(){if(ST)return ST;const ri=localStorage.getItem(SK.items)||"[]",rt=localStorage.getItem(SK.tx)||"[]";
  if(!STB||ri!==STri||rt!==STrt){let items=[],tx=[];try{items=JSON.parse(ri)||[]}catch(e){}try{tx=JSON.parse(rt)||[]}catch(e){}const B={};
    items.forEach(i=>B[i.id]={i,bal:0,avg:num(i.cost)});
    tx.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date))||(x.ts||0)-(y.ts||0)).forEach(t=>{const s=B[t.pid];if(!s)return;const q=num(t.qty);
      if(t.type==="in"){const c=num(t.cost)||s.avg,nb=s.bal+q;s.avg=nb>0?r4((Math.max(s.bal,0)*s.avg+q*c)/(Math.max(s.bal,0)+q)):c;s.bal=r4(nb)}else if(t.type==="out")s.bal=r4(s.bal-q);else s.bal=r4(s.bal+q)});
    STB=B;STri=ri;STrt=rt}
  const S={};Object.keys(STB).forEach(k=>S[k]=Object.assign({},STB[k]));const pend=pendingUse();Object.keys(pend).forEach(pid=>{if(S[pid])S[pid].pend=pend[pid]});
  ST=S;return S}
const dirtyStock=()=>{ST=null};
const stItems=()=>Object.values(stock()).map(s=>s.i);
const sOf=pid=>stock()[pid];
// วัตถุดิบที่ใช้ไปในกะที่ยังไม่ปิด (ยังไม่ได้ตัดจริง)
function pendingUse(){const s=curShift(),U={};if(!s)return U;O.forEach(o=>{if(o.shift!==s.id||o.st==="void")return;eff(o).lines.forEach(l=>(l.use||[]).forEach(u=>{U[u.pid]=r4((U[u.pid]||0)+u.qty*l.qty)}))});return U}
// ยอดจริงของบิลหลังคืนเงินบางรายการ (ส่วนลดคิดตามสัดส่วน)
function eff(o){const R=o.ref||{},lines=o.lines.map((l,i)=>Object.assign({},l,{qty:l.qty-(R[i]||0)})).filter(l=>l.qty>0),sub=r2(lines.reduce((a,l)=>a+l.price*l.qty,0)),disc=o.sub?r2(sub*o.disc/o.sub):0,total=r2(sub-disc);return{lines,sub,disc,total,refund:r2(o.total-total)}}
const estBal=pid=>{const s=sOf(pid);return s?r4(s.bal-(s.pend||0)):0};

/* ---------- ราคา สูตร ต้นทุน ---------- */
function recipeOf(m,picks){let mult=1;const extra=[];(picks||[]).forEach(p=>{const g=gOf(p.g),c=g&&g.choices.find(x=>x.id===p.c);if(!c)return;if(num(c.mult))mult*=num(c.mult);(c.rec||[]).forEach(r=>extra.push(r))});
  const U={};(m.rec||[]).forEach(r=>{if(r.pid)U[r.pid]=(U[r.pid]||0)+num(r.qty)*mult});extra.forEach(r=>{if(r.pid)U[r.pid]=(U[r.pid]||0)+num(r.qty)});
  return Object.keys(U).map(pid=>({pid,qty:r4(Math.max(0,U[pid]))})).filter(u=>u.qty>0)}
function costOf(use){return r2((use||[]).reduce((a,u)=>{const s=sOf(u.pid);return a+(s?s.avg*u.qty:0)},0))}
function unitPrice(m,picks,ch){let add=0;(picks||[]).forEach(x=>{const g=gOf(x.g),c=g&&g.choices.find(y=>y.id===x.c);if(c)add+=num(c.add)});
  const c=ch&&chOf(ch);if(!c)return r2(num(m.price)+add);if(m.cp&&num(m.cp[ch])>0)return r2(num(m.cp[ch])+add);
  const p=(num(m.price)+add)*(1+num(c.markup)/100),rd=num(C.round)||1;return r2(Math.ceil(p/rd-1e-9)*rd)}
function pickTxt(picks){return(picks||[]).map(x=>{const g=gOf(x.g),c=g&&g.choices.find(y=>y.id===x.c);return c?c.name:""}).filter(Boolean).join(" · ")}
function defaultPicks(m){const P=[];(m.groups||[]).forEach(gid=>{const g=gOf(gid);if(!g||!g.req||g.multi||!g.choices.length)return;const c=g.choices.find(x=>x.id===g.def)||g.choices[0];P.push({g:gid,c:c.id})});return P}
function menuCost(m){return costOf(recipeOf(m,defaultPicks(m)))}
function shortOf(m){const use=recipeOf(m,defaultPicks(m));if(!use.length)return"";let low=false;for(const u of use){const s=sOf(u.pid);if(!s)continue;const b=estBal(u.pid);if(b<u.qty)return"out";if(num(s.i.min)>0&&b<=num(s.i.min))low=true}return low?"low":""}
function cartCalc(c){const sub=r2(c.lines.reduce((a,l)=>a+l.price*l.qty,0));let disc=c.disc.t==="pct"?r2(sub*Math.min(100,num(c.disc.v))/100):Math.min(sub,num(c.disc.v));disc=r2(disc);return{sub,disc,total:r2(sub-disc),n:c.lines.reduce((a,l)=>a+l.qty,0)}}

/* ---------- PIN พนักงาน และรหัสเจ้าของร้าน ---------- */
let unlockUntil=0;
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return"d"+(h>>>0)}}
const hasOwner=()=>!!C.ownerPin,unlocked=()=>!hasOwner()||Date.now()<unlockUntil;
function salt(){if(!C.salt){C.salt=uid("s");saveC()}return C.salt}
function pinDlg(title,sub,check){return new Promise(res=>{let v="",done=false;const fin=ok=>{if(done)return;done=true;dlg.removeEventListener("close",onClose);document.removeEventListener("keydown",onKey);res(ok)};const onClose=()=>fin(false);
  const paint=()=>{const el=$("#pinV");if(el)el.textContent=v?"●".repeat(v.length):"·"};
  const go=async()=>{if(v.length<4){$("#pinErr").textContent="PIN อย่างน้อย 4 หลัก";return}if(await check(v)){fin(true);if(dlg.open&&dlg.className==="pin")closeDlg()}else{v="";paint();$("#pinErr").textContent="รหัสไม่ถูกต้อง"}};
  const onKey=e=>{if(!dlg.open||dlg.className!=="pin")return;if(/^\d$/.test(e.key)){if(v.length<8){v+=e.key;paint()}}else if(e.key==="Backspace"){v=v.slice(0,-1);paint()}else if(e.key==="Enter")go()};
  openDlg(title,`<div class="db" style="align-items:center;text-align:center"><div class="note">${esc(sub||"")}</div><div class="pinv" id="pinV">·</div>
    <div class="pinpad">${[1,2,3,4,5,6,7,8,9,"C",0,"⌫"].map(k=>`<button type="button" data-k="${k}">${k}</button>`).join("")}</div><div id="pinErr" class="note" style="color:var(--danger);min-height:1.2em"></div>
    <button class="btn main lg" id="pinOk" type="button" style="width:100%">ยืนยัน</button></div>`,"pin");
  $("#dlgBody").onclick=e=>{const b=e.target.closest("[data-k]");if(!b)return;const k=b.dataset.k;if(k==="⌫")v=v.slice(0,-1);else if(k==="C")v="";else if(v.length<8)v+=k;paint();$("#pinErr").textContent=""};
  $("#pinOk").onclick=go;setTimeout(()=>{if(!done)dlg.addEventListener("close",onClose)},0);document.addEventListener("keydown",onKey)})}
function ownerCheck(p){return sha(salt()+p).then(h=>h===C.ownerPin)}
// ทำงานที่ต้องใช้สิทธิ์เจ้าของร้าน (ปลดล็อก 5 นาที)
const unlockFor=()=>{const m=num(C.perm.unlockMin);unlockUntil=m>0?Date.now()+m*60e3:Infinity};
function guard(fn,why){if(unlocked())return fn();pinDlg("🔒 รหัสเจ้าของร้าน",why||"งานนี้ต้องใช้รหัสเจ้าของร้าน",ownerCheck).then(ok=>{if(ok){unlockFor();fn()}})}
function lockCard(why){return`<div class="card" style="align-items:center;text-align:center;padding:40px 16px"><div style="font-size:2.4rem">🔒</div><h2 style="justify-content:center">${esc(why)}</h2><p class="note">เจ้าของร้านตั้งรหัสไว้ เพื่อไม่ให้แก้ราคา ดูต้นทุน หรือยกเลิกบิลโดยไม่ได้รับอนุญาต</p><button class="btn main" type="button" data-unlock="1">🔓 ใส่รหัสเจ้าของร้าน</button></div>`}

/* ---------- กันข้อมูลหาย: สำรองขึ้นระบบ / ไฟล์สำรอง ---------- */
function backupInfo(){const m=window.EDM_MEMBER,me=m&&m.me,c=m&&m.cloud?m.cloud():null;if(me&&me.token&&c&&c.ok&&c.email===me.email&&Date.now()-c.ok<864e5)return{ok:true,cloud:true,txt:"☁️ สำรองขึ้นระบบล่าสุด "+hm(c.ok)+" น."};
  const last=LS.get("edm_cafe_lastbk","");return{ok:!!last&&last>=today(),last}}
function backupAll(){const o={app:"edm-cafe",v:2};KS_ALL.forEach(k=>o[k]=LS.get(k,null));const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="สำรองคาเฟ่-"+today()+".json";a.click();LS.set("edm_cafe_lastbk",today());toast("ดาวน์โหลดไฟล์สำรองคาเฟ่แล้ว ✓ เก็บไว้ในไดรฟ์หรือส่งเข้าอีเมลตัวเอง")}
function backupBanner(force){const b=backupInfo();if(b.ok&&!force)return"";if(b.cloud)return`<div class="hint">${b.txt}</div>`;
  return`<div class="warn" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span style="flex:1;min-width:220px">⚠️ ข้อมูลร้านอยู่ในเครื่องนี้เครื่องเดียว ${b.last?"· ดาวน์โหลดไฟล์สำรองล่าสุด "+thD(b.last):"· ยังไม่เคยสำรอง"} — เข้าสู่ระบบสมาชิกเพื่อสำรองขึ้นระบบอัตโนมัติ หรือดาวน์โหลดไฟล์สำรองทุกวัน</span><button class="btn sm main" type="button" data-bk="1">⬇️ ดาวน์โหลดไฟล์สำรอง</button></div>`}

  const top=Object.entries(it).sort((a,b)=>b[1]-a[1])[0];return{n:L.length,net:r2(net),cost:r2(cost),top,avg:L.length?net/L.length:0}}

    b.addEventListener("pointerdown",()=>{held=false;clearTimeout(t);if((m.groups||[]).length)t=setTimeout(quick,450)});["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,()=>clearTimeout(t)));b.addEventListener("contextmenu",e=>e.preventDefault());

function kioskApply(){document.body.classList.toggle("kiosk",!!ui.kiosk);if(EMB){try{window.parent.postMessage({edm:"kiosk",on:!!ui.kiosk},location.origin)}catch(e){}}}

  else guard(()=>{ui.kiosk=false;saveUi();kioskApply();try{if(document.fullscreenElement)document.exitFullscreen();else if(document.webkitFullscreenElement)document.webkitExitFullscreen()}catch(e){}render()},"ออกจากโหมดหน้าร้าน ต้องใช้รหัสเจ้าของร้าน")}
const cartCh=()=>cart.type==="deli"?cart.ch:"";
function repriceCart(){cart.lines.forEach(l=>{const m=mOf(l.mid);if(m)l.price=unitPrice(m,l.picks,cartCh())})}
function lineKey(mid,picks,note){return mid+"|"+(picks||[]).map(p=>p.g+":"+p.c).sort().join(",")+"|"+(note||"")}
function addLine(m,picks,qty,note,idx){const use=recipeOf(m,picks),l={mid:m.id,name:m.name,picks,opt:pickTxt(picks),note:note||"",qty,price:unitPrice(m,picks,cartCh()),use,cost:costOf(use),unit:m.unit||C.unitDefault||"แก้ว"};
  if(idx!=null)cart.lines[idx]=l;else{const k=lineKey(m.id,picks,note),ex=cart.lines.find(x=>lineKey(x.mid,x.picks,x.note)===k);if(ex)ex.qty+=qty;else cart.lines.push(l)}
  saveCart();drawCart();if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}

function optDlg(m,idx){const ed=idx!=null?cart.lines[idx]:null;let picks=ed?JSON.parse(JSON.stringify(ed.picks)):defaultPicks(m),qty=ed?ed.qty:1;

function ppPayload(target,amount){const f=(id,v)=>id+("0"+v.length).slice(-2)+v,t=String(target||"").replace(/\D/g,"");let acc;
  if(t.length===10&&t[0]==="0")acc=f("01","0066"+t.slice(1));else if(t.length===13)acc=f("02",t);else if(t.length===15)acc=f("03",t);else return"";
  const body=f("00","01")+f("01",amount?"12":"11")+f("29",f("00","A000000677010111")+acc)+f("58","TH")+f("53","764")+(amount?f("54",Number(amount).toFixed(2)):"")+"6304";
  let c=0xFFFF;for(let i=0;i<body.length;i++){c^=body.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}
  return body+("0000"+c.toString(16).toUpperCase()).slice(-4)}
function qrSvg(text){try{const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return""}}

      :`<div class="hint">${m==="transfer"?"ตรวจยอดเงินเข้าในแอปธนาคารก่อนกดยืนยัน":"รูดบัตรที่เครื่อง EDC แล้วกดยืนยัน"}</div>`}</div>

    $("#pm").onclick=e=>{const b=e.target.closest("[data-m]");if(b){m=b.dataset.m;draw()}};

function shiftSum(s){const L=O.filter(o=>o.shift===s.id),ok=L.filter(o=>o.st!=="void"),vd=L.filter(o=>o.st==="void");

  vd.forEach(o=>(o.refunds||[]).forEach(f=>S.refund+=num(f.amt)));
  ok.forEach(o=>{const E=eff(o),k=payKey(o);S.gross+=E.sub;S.disc+=E.disc;S.net+=E.total;S.refund+=E.refund;S.byM[k]=(S.byM[k]||0)+E.total;S.cnt[k]=(S.cnt[k]||0)+1;

    const f=E.sub?E.total/E.sub:1;E.lines.forEach(l=>{const c=num(l.cost)*l.qty;S.cost+=c;const x=S.items[l.name]||(S.items[l.name]={q:0,amt:0,cost:0});x.q+=l.qty;x.amt+=l.price*l.qty*f;x.cost+=c})});
  ["gross","disc","net","cost","refund","gp"].forEach(k=>S[k]=r2(S[k]));Object.keys(S.byM).forEach(k=>S.byM[k]=r2(S.byM[k]));Object.values(S.items).forEach(x=>{x.amt=r2(x.amt);x.cost=r2(x.cost)});

  const used=new Set();items.forEach(m=>m.groups.forEach(g=>used.add(g)));
  const groups=T.groups.filter(g=>used.has(g.id)).map(g=>Object.assign({},g,{choices:g.choices.map(c=>Object.assign({},c,{rec:recipes?c.rec:[]}))}));

/* ---------- หน้าต่างถาม-ตอบในระบบ (แทน prompt / confirm ของเบราว์เซอร์) ---------- */
function askBox(o){return new Promise(res=>{let done=false;const fin=v=>{if(done)return;done=true;dlg.removeEventListener("close",onC);res(v)};const onC=()=>fin(null);
  openDlg(o.title||"ยืนยัน",`<div class="db">${o.html?`<div style="line-height:1.6">${o.html}</div>`:""}${o.input?(o.input.area?`<textarea class="in-" id="askIn" rows="3" maxlength="${o.input.max||200}" placeholder="${esc(o.input.ph||"")}"></textarea>`:`<input class="in-" id="askIn" maxlength="${o.input.max||120}" placeholder="${esc(o.input.ph||"")}">`):""}<div id="askErr" class="note" style="color:var(--danger);min-height:1em"></div></div>
    <div class="foot"><button class="btn ghost" id="askNo" type="button">${esc(o.cancel||"ยกเลิก")}</button><span class="sp"></span><button class="btn ${o.danger?"blue":"main"}" id="askOk" type="button">${esc(o.ok||"ตกลง")}</button></div>`,"ask");
  const inp=$("#askIn");if(inp){inp.value=o.input.value||"";setTimeout(()=>{inp.focus();if(inp.select)inp.select()},60);inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&!o.input.area){e.preventDefault();$("#askOk").click()}})}
  $("#askNo").onclick=()=>{fin(null);closeDlg()};
  $("#askOk").onclick=()=>{if(inp){const v=inp.value.trim();if(o.input.req&&!v){$("#askErr").textContent=o.input.req;return}fin(v)}else fin(true);closeDlg()};
  setTimeout(()=>{if(!done)dlg.addEventListener("close",onC)},0)})}
// ask("ข้อความ") → true / null · askIn("คำถาม", "ค่าเดิม") → ข้อความ / null
function ask(t,o){o=o||{};const lines=String(t).split("\n");return askBox({title:o.title||(t.indexOf("<")>=0?"ยืนยัน":lines[0].slice(0,60)),html:t.indexOf("<")>=0?t:esc(lines.length>1?lines.slice(1).join(" "):"").replace(/^$/,"")||"",ok:o.ok||"ตกลง",danger:o.danger})}
function askIn(q,v,o){o=o||{};const lines=String(q).split("\n");return askBox({title:lines[0],html:lines.length>1?esc(lines.slice(1).join(" ")):"",input:{value:v||"",ph:o.ph||"",req:o.req||"",area:o.area},ok:o.ok||"บันทึก"})}
