<script>
(function(){

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่เต็ม)");return false}}};
const K={items:"edm_due_items",cfg:"edm_due_cfg",ui:"edm_due_ui",del:"edm_due_del"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],MF=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0},f0=n=>(+n||0).toLocaleString("th-TH",{maximumFractionDigits:2});

/* ประเภท: k, ชื่อ, ไอคอน, สีพื้น, สีตัวอักษร, ป้ายช่อง party/bank */
const TDEF=[["con","สัญญา","📄","#E8EEF9","#2F5DA8"],["perf","ค้ำประกันผลงาน","🛡️","#E6F4EA","#1F7A47"],["bid","ค้ำประกันซอง","✉️","#F1EAFB","#6D3FB0"],["gua","ค้ำประกันสัญญา","🏦","#E3F2F6","#1D6E85"],["ins","ประกันภัย / พ.ร.บ.","🚗","#FDECEF","#B23A57"],["lic","ใบอนุญาต / ภาษี / ทะเบียน","🪪","#FFF3DA","#946200"],["oth","อื่น ๆ","📌","#F1F1F1","#555"]];
let C=LS.get(K.items,[])||[],cfg=Object.assign({name:"",w1:30,w2:60,w3:90,demo:false},LS.get(K.cfg,{})||{}),ui=Object.assign({v:"home",ft:"",fs:"",q:"",y:+today().slice(0,4)},LS.get(K.ui,{})||{});
/* กรอกพร้อมกันหลายเครื่อง: ประทับเวลาแก้ล่าสุด (u) ทุกรายการที่เปลี่ยน + จดรายการที่ลบไว้ (edm_due_del) ให้เครื่องอื่นลบตาม */
let SEEN=new Map((LS.get(K.items,[])||[]).map(x=>[x.id,JSON.stringify(Object.assign({},x,{u:0}))]));
const save=()=>{const now=Date.now(),ids=new Set(),D=LS.get(K.del,{})||{};let dd=false;
  C.forEach(x=>{if(!x.id)x.id=uid("d");ids.add(x.id);const j=JSON.stringify(Object.assign({},x,{u:0}));if(SEEN.get(x.id)!==j||!x.u){x.u=now;SEEN.set(x.id,j)}if(D[x.id]){delete D[x.id];dd=true}});
  [...SEEN.keys()].forEach(id=>{if(!ids.has(id)){D[id]=now;SEEN.delete(id);dd=true}});
  if(dd)LS.set(K.del,D);return LS.set(K.items,C)},saveC=()=>LS.set(K.cfg,cfg),saveUi=()=>LS.set(K.ui,ui);

function st(c){if(c.done)return["done",c.rep?"ต่ออายุแล้ว":"ปิดแล้ว"];if(!c.end)return["ok","ไม่มีวันสิ้นสุด"];const n=left(c);if(n<0)return["late","หมดอายุแล้ว "+(-n)+" วัน"];if(n===0)return["late","หมดอายุวันนี้"];if(n<=cfg.w1)return["w1","อีก "+n+" วัน"];if(n<=cfg.w2)return["w2","อีก "+n+" วัน"];if(n<=cfg.w3)return["w3","อีก "+n+" วัน"];return["ok","อีก "+n+" วัน"]}
const BC={late:"#C0392B",w1:"#EA580C",w2:"#E0A93B",w3:"#4A86C8",ok:"#9CC9A8",done:"#CCC"};

function aiHtml(c){const s=st(c),n=c.end?left(c):null;return`<div class="ai" style="--bc:${BC[s[0]]}"><div class="d" style="color:${BC[s[0]]}">${n==null?"-":n<0?`<b>${-n}</b><small>วันที่เลย</small>`:`<b>${n}</b><small>วัน</small>`}</div><div class="t" data-e="${c.id}"><b>${esc(c.name)}</b><small>${tyHtml(c.t)} ${c.ref?esc(c.ref)+" · ":""}หมดอายุ ${thD(c.end)}${c.party?" · "+esc(c.party):""}${c.amt?" · "+f0(c.amt)+" บาท":""}</small></div><div class="x"><span class="tag ${s[0]}">${s[1]}</span><button class="btn sm ghost" data-r="${c.id}" type="button">${c.rep?"🔄 ต่ออายุแล้ว":"✅ ปิดรายการ"}</button></div></div>`}
function bindAi(M){M.querySelectorAll("[data-e]").forEach(x=>x.onclick=()=>iDlg(C.find(c=>c.id===x.dataset.e)));M.querySelectorAll("[data-r]").forEach(x=>x.onclick=()=>doneDlg(C.find(c=>c.id===x.dataset.r)))}
function vHome(){const M=$("#main");if(!C.length)return emptyHello(M);const A=sorted(active()).filter(c=>c.end);
  const late=A.filter(c=>left(c)<=0),w1=A.filter(c=>left(c)>0&&left(c)<=cfg.w1),w23=A.filter(c=>left(c)>cfg.w1&&left(c)<=cfg.w3);
  const bondT=["perf","bid","gua"],bond=active().filter(c=>bondT.includes(c.t)).reduce((a,c)=>a+num(c.amt),0);
  const todo=A.filter(c=>left(c)<=cfg.w3);const y=+today().slice(0,4),ym0=today().slice(0,7);
  const cnt=Array.from({length:12},(_,i)=>{const ym=addM(ym0+"-01",i).slice(0,7);return[ym,A.filter(c=>c.end.slice(0,7)===ym).length]}),mx=Math.max(1,...cnt.map(x=>x[1]));
  M.innerHTML=`<div class="hello"><div><h1>${esc(cfg.name||"ติดตามวันครบกำหนด")}</h1><p>วันนี้ ${thD(today())} · ทั้งหมด ${active().length} รายการที่ยังไม่ปิด</p></div>${todo.length?`<button class="btn ghost" id="cpAll" type="button">💬 คัดลอกข้อความแจ้งเตือน (${todo.length})</button>`:""}</div>
  <div class="kpis"><button class="kpi" style="--k:#C0392B" data-go="late" type="button"><span>หมดอายุ / ถึงกำหนดแล้ว</span><b style="color:#C0392B">${late.length}</b><small>ต้องจัดการด่วน</small></button><button class="kpi" style="--k:#EA580C" data-go="w1" type="button"><span>ภายใน ${cfg.w1} วัน</span><b style="color:#C2410C">${w1.length}</b><small>เตรียมต่ออายุ / ทวงคืน</small></button><button class="kpi" style="--k:#E0A93B" data-go="w3" type="button"><span>${cfg.w1+1}–${cfg.w3} วัน</span><b>${w23.length}</b><small>วางแผนล่วงหน้า</small></button><button class="kpi" style="--k:#1F7A47" data-go="bond" type="button"><span>หลักประกัน / ค้ำประกันคงค้าง</span><b>${f0(bond)}</b><small>บาท · ค้ำผลงาน ซอง สัญญา</small></button></div>
  <div class="card"><h2>⚠️ ต้องจัดการภายใน ${cfg.w3} วัน <small>เรียงจากใกล้ที่สุด · แตะรายการเพื่อแก้ไข</small></h2>${todo.length?`<div class="al">${todo.map(aiHtml).join("")}</div>`:`<div class="empty">🎉 ไม่มีรายการใกล้ครบกำหนดใน ${cfg.w3} วัน</div>`}</div>
  <div class="card"><h2>📈 ครบกำหนด 12 เดือนข้างหน้า <small>แตะแท่งเพื่อดูปฏิทิน</small></h2><div class="bars">${cnt.map(([ym,n])=>`<div data-ym="${ym}"><b>${n||""}</b><i style="height:${n/mx*70}%"></i><em>${MS[+ym.slice(5)-1]}</em></div>`).join("")}</div></div>`;
  bindAi(M);const cp=$("#cpAll");if(cp)cp.onclick=()=>copy(lineMsg(todo));
  M.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ui.v="list";ui.fs=b.dataset.go;saveUi();render()});
  M.querySelectorAll("[data-ym]").forEach(b=>b.onclick=()=>{ui.v="cal";ui.y=+b.dataset.ym.slice(0,4);saveUi();render()})}

/* ---------- รายการทั้งหมด ---------- */
function vList(){const M=$("#main");if(!C.length)return emptyHello(M);
  const FS=[["","ทั้งหมด"],["late","หมดอายุแล้ว"],["w1","≤ "+cfg.w1+" วัน"],["w3","≤ "+cfg.w3+" วัน"],["bond","หลักประกันคงค้าง"],["open","ยังไม่ปิด"],["done","ปิดแล้ว"]];
  M.innerHTML=`<div class="card"><div class="chips" id="fT"><button class="chip${ui.ft?"":" on"}" data-t="" type="button">ทุกประเภท</button>${TDEF.filter(t=>C.some(c=>c.t===t[0])).map(t=>`<button class="chip${ui.ft===t[0]?" on":""}" data-t="${t[0]}" type="button">${t[2]} ${t[1]}</button>`).join("")}</div><div class="chips" id="fS">${FS.map(f=>`<button class="chip${ui.fs===f[0]?" on":""}" data-s="${f[0]}" type="button">${f[1]}</button>`).join("")}</div><input class="in-" id="fQ" placeholder="🔍 ค้นหา ชื่อ / คู่สัญญา / เลขที่ / ธนาคาร / ผู้รับผิดชอบ" value="${esc(ui.q)}"></div><div id="lst"></div>`;
  const draw=()=>{const q=ui.q.trim().toLowerCase();let L=C.filter(c=>(!ui.ft||c.t===ui.ft)&&(!q||[c.name,c.party,c.ref,c.bank,c.who,c.note].join(" ").toLowerCase().includes(q)));
    const s=ui.fs;if(s==="late")L=L.filter(c=>!c.done&&c.end&&left(c)<=0);else if(s==="w1")L=L.filter(c=>!c.done&&c.end&&left(c)<=cfg.w1);else if(s==="w3")L=L.filter(c=>!c.done&&c.end&&left(c)<=cfg.w3);else if(s==="bond")L=L.filter(c=>!c.done&&["perf","bid","gua"].includes(c.t));else if(s==="open")L=L.filter(c=>!c.done);else if(s==="done")L=L.filter(c=>c.done);
    L=sorted(L);const tot=L.reduce((a,c)=>a+num(c.amt),0);
    $("#lst").innerHTML=L.length?`<div class="card"><h2>${L.length} รายการ <small>มูลค่ารวม ${f0(tot)} บาท</small></h2><div class="tw big"><table class="xl"><thead><tr><th>#</th><th>ประเภท</th><th>รายการ / โครงการ</th><th>เลขที่</th><th>คู่สัญญา / หน่วยงาน</th><th>ธนาคาร / บริษัท</th><th>มูลค่า (บาท)</th><th>เริ่ม</th><th>หมดอายุ</th><th>สถานะ</th><th>ผู้รับผิดชอบ</th></tr></thead><tbody>${L.map((c,i)=>{const z=st(c);return`<tr data-e="${c.id}" class="${z[0]==="late"?"late":z[0]==="done"?"done":""}"><td class="c">${i+1}</td><td>${tyHtml(c.t)}</td><td class="nm"><b>${esc(c.name)}</b>${c.note?`<small>${esc(c.note)}</small>`:""}</td><td class="c">${esc(c.ref)}</td><td>${esc(c.party)}</td><td>${esc(c.bank)}</td><td class="r">${c.amt?f0(c.amt):""}</td><td class="c">${thD(c.start)}</td><td class="c"><b>${thD(c.end)}</b>${c.rep?`<br><small class="note">🔄 ทุก ${c.rep/12>=1&&c.rep%12===0?c.rep/12+" ปี":c.rep+" เดือน"}</small>`:""}</td><td class="c"><span class="tag ${z[0]}">${z[1]}</span></td><td>${esc(c.who)}</td></tr>`}).join("")}</tbody></table></div><div class="ml al">${L.map(aiHtml).join("")}</div></div>`:`<div class="card"><div class="empty">ไม่พบรายการ</div></div>`;
    $("#lst").querySelectorAll("tr[data-e]").forEach(r=>r.onclick=()=>iDlg(C.find(c=>c.id===r.dataset.e)));bindAi($("#lst"))};
  $("#fT").onclick=e=>{const b=e.target.closest("[data-t]");if(!b)return;ui.ft=b.dataset.t;saveUi();vList()};
  $("#fS").onclick=e=>{const b=e.target.closest("[data-s]");if(!b)return;ui.fs=b.dataset.s;saveUi();vList()};
  $("#fQ").oninput=e=>{ui.q=e.target.value;saveUi();draw()};draw()}

/* ---------- ปฏิทินทั้งปี ---------- */
function vCal(){const M=$("#main");if(!C.length)return emptyHello(M);const y=ui.y,ym0=today().slice(0,7);
  M.innerHTML=`<div class="card"><h2><span>📅 ปฏิทินวันครบกำหนด ปี ${y+543}</span><span style="display:flex;gap:6px"><button class="btn sm ghost" id="yP" type="button">‹ ${y+542}</button><button class="btn sm ghost" id="yT" type="button">ปีนี้</button><button class="btn sm ghost" id="yN" type="button">${y+544} ›</button><button class="btn sm ghost noprint" id="yPr" type="button">🖨️ พิมพ์</button></span></h2><div class="cal">${MF.map((mn,i)=>{const ym=y+"-"+pad(i+1),L=sorted(C.filter(c=>c.end&&c.end.slice(0,7)===ym));return`<div class="mo${ym===ym0?" now":""}"><h3>${mn}<small>${L.length?L.length+" รายการ":""}</small></h3>${L.map(c=>{const t=TY(c.t),z=st(c);return`<div class="ev" data-e="${c.id}" style="--tb:${t[3]};${z[0]==="done"?"opacity:.5;text-decoration:line-through":""}"><b>${+c.end.slice(8)}</b><span>${t[2]} ${esc(c.name)}</span></div>`}).join("")||`<span class="note">—</span>`}</div>`}).join("")}</div><p class="note" style="margin:0">ขีดฆ่า = ปิดแล้ว / ต่ออายุแล้ว · กรอบสีส้ม = เดือนนี้</p></div>`;
  $("#yP").onclick=()=>{ui.y--;saveUi();vCal()};$("#yN").onclick=()=>{ui.y++;saveUi();vCal()};$("#yT").onclick=()=>{ui.y=+today().slice(0,4);saveUi();vCal()};$("#yPr").onclick=()=>print();
  M.querySelectorAll("[data-e]").forEach(x=>x.onclick=()=>iDlg(C.find(c=>c.id===x.dataset.e)))}

/* ---------- เพิ่ม / แก้ไข ---------- */
function iDlg(c){const o=c||{t:"perf",start:today(),rep:0};
  openDlg(c?"แก้ไขรายการ":"เพิ่มรายการ",`<div class="f"><label>ประเภท</label><select class="in-" id="iT">${TDEF.map(t=>`<option value="${t[0]}"${o.t===t[0]?" selected":""}>${t[2]} ${t[1]}</option>`).join("")}</select></div>
  <div class="f"><label>ชื่อรายการ / โครงการ *</label><input class="in-" id="iN" value="${esc(o.name)}" placeholder="เช่น ค้ำประกันผลงาน งานก่อสร้างอาคาร A / ประกันรถ กข 1234"></div>
  <div class="row"><div class="f"><label id="lP">คู่สัญญา / หน่วยงาน</label><input class="in-" id="iP" value="${esc(o.party)}"></div><div class="f"><label>เลขที่สัญญา / เลขที่หนังสือ / กรมธรรม์</label><input class="in-" id="iR" value="${esc(o.ref)}"></div></div>
  <div class="row"><div class="f"><label>ธนาคาร / บริษัทประกัน / ผู้ออก</label><input class="in-" id="iB" value="${esc(o.bank)}"></div><div class="f"><label>มูลค่า / วงเงิน (บาท)</label><input class="in-" id="iA" inputmode="decimal" value="${o.amt||""}"></div></div>
  <div class="row3"><div class="f"><label>วันเริ่ม</label><input class="in-" type="date" id="iS" value="${o.start||""}"></div><div class="f"><label>วันหมดอายุ / ครบกำหนด *</label><input class="in-" type="date" id="iE" value="${o.end||""}"></div><div class="f"><label>ต่ออายุซ้ำ</label><select class="in-" id="iRp">${[[0,"ครั้งเดียว (ไม่ต่ออายุ)"],[12,"ทุกปี"],[24,"ทุก 2 ปี"],[36,"ทุก 3 ปี"],[60,"ทุก 5 ปี"],[6,"ทุก 6 เดือน"],[1,"ทุกเดือน"]].map(r=>`<option value="${r[0]}"${(o.rep||0)==r[0]?" selected":""}>${r[1]}</option>`).join("")}</select></div></div>
  <div class="row"><div class="f"><label>ช่วงอายุ (กดเพื่อเติมวันหมดอายุ)</label><div class="chips" id="qk">${[["+1 ปี",12],["+2 ปี",24],["+3 ปี",36],["+6 เดือน",6]].map(q=>`<button class="chip" type="button" data-m="${q[1]}">${q[0]}</button>`).join("")}</div></div><div class="f"><label>ผู้รับผิดชอบ</label><input class="in-" id="iW" value="${esc(o.who)}"></div></div>
  <div class="f"><label>หมายเหตุ</label><textarea class="in-" id="iNt" rows="2">${esc(o.note)}</textarea></div>
  ${c&&c.log&&c.log.length?`<div class="note">ประวัติ: ${c.log.map(l=>esc(l)).join(" · ")}</div>`:""}
  <div id="iHint" class="note"></div>
  <div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap">${c?`<span style="display:flex;gap:6px"><button class="btn ghost danger" id="iDel" type="button">ลบ</button>${c.done?`<button class="btn ghost" id="iOpen" type="button">↩️ เปิดรายการอีกครั้ง</button>`:""}</span>`:"<span></span>"}<button class="btn main" id="iOk" type="button">บันทึก</button></div>`);
  const hint=()=>{const e=$("#iE").value;$("#iHint").innerHTML=e?(()=>{const n=dDiff(today(),e);return n<0?`⚠️ หมดอายุไปแล้ว ${-n} วัน`:`เหลืออีก <b>${n}</b> วัน · ระบบเตือนเมื่อเหลือ ${cfg.w3} / ${cfg.w2} / ${cfg.w1} วัน`})():""};
  $("#iE").addEventListener("input",hint);hint();
  $("#qk").onclick=e=>{const b=e.target.closest("[data-m]");if(!b)return;const s=$("#iS").value||today();$("#iE").value=addM(s,+b.dataset.m);hint()};
  $("#iOk").onclick=()=>{const v={t:$("#iT").value,name:$("#iN").value.trim(),party:$("#iP").value.trim(),ref:$("#iR").value.trim(),bank:$("#iB").value.trim(),amt:num($("#iA").value),start:$("#iS").value,end:$("#iE").value,rep:+$("#iRp").value,who:$("#iW").value.trim(),note:$("#iNt").value.trim()};
    if(!v.name)return toast("ใส่ชื่อรายการก่อน");if(!v.end)return toast("ใส่วันหมดอายุ / ครบกำหนด");if(v.start&&v.start>v.end)return toast("วันเริ่มต้องไม่เกินวันหมดอายุ");
    if(c)Object.assign(c,v);else C.push(Object.assign({id:uid("d"),log:[]},v));save();$("#dlg").close();render();toast("บันทึกแล้ว ✓")};

  setTimeout(()=>$("#iN").focus(),60)}
/* ต่ออายุ / ปิดรายการ */

    openDlg("ต่ออายุแล้ว · "+c.name,`<p style="margin:0">ระบบจะเลื่อนรอบถัดไปให้ · เดิมหมดอายุ <b>${thD(c.end)}</b></p><div class="row"><div class="f"><label>วันเริ่มรอบใหม่</label><input class="in-" type="date" id="rS" value="${ns}"></div><div class="f"><label>หมดอายุรอบใหม่</label><input class="in-" type="date" id="rE" value="${ne}"></div></div><div class="row"><div class="f"><label>มูลค่า / เบี้ย (บาท)</label><input class="in-" id="rA" inputmode="decimal" value="${c.amt||""}"></div><div class="f"><label>เลขที่ใหม่ (ถ้าเปลี่ยน)</label><input class="in-" id="rR" value="${esc(c.ref)}"></div></div><button class="btn main" id="rOk" type="button">🔄 บันทึกการต่ออายุ</button>`);
    $("#rOk").onclick=()=>{const e=$("#rE").value;if(!e)return toast("ใส่วันหมดอายุรอบใหม่");(c.log=c.log||[]).push("ต่ออายุ "+thD(today())+" (เดิม "+thD(c.end)+")");c.start=$("#rS").value;c.end=e;c.amt=num($("#rA").value);c.ref=$("#rR").value.trim();delete c.done;save();$("#dlg").close();render();toast("ต่ออายุแล้ว ✓ รอบถัดไป "+thD(e))}}
  else{openDlg("ปิดรายการ · "+c.name,`<p style="margin:0">ใช้เมื่อสัญญาจบ / ได้หลักประกันคืนแล้ว / ไม่ต้องติดตามต่อ</p><div class="f"><label>วันที่ปิด</label><input class="in-" type="date" id="xD" value="${today()}"></div><div class="f"><label>หมายเหตุการปิด</label><input class="in-" id="xN" placeholder="เช่น ได้รับหนังสือค้ำคืนแล้ว"></div><button class="btn main" id="xOk" type="button">✅ ปิดรายการ</button>`);
    $("#xOk").onclick=()=>{c.done=$("#xD").value||today();(c.log=c.log||[]).push("ปิด "+thD(c.done)+($("#xN").value.trim()?" · "+$("#xN").value.trim():""));save();$("#dlg").close();render();toast("ปิดรายการแล้ว ✓")}}}

/* ---------- ตั้งค่า ---------- */

  M.innerHTML=`<div class="card"><h2>ชื่อบริษัท / ชื่อตาราง</h2><input class="in-" id="sN" value="${esc(cfg.name)}" placeholder="แสดงบนหัวหน้าแรกและข้อความแจ้งเตือน"></div>
  <div class="card"><h2>เตือนล่วงหน้า (วัน)</h2><div class="row3"><div class="f"><label>ด่วน (สีส้ม)</label><input class="in-" id="s1" inputmode="numeric" value="${cfg.w1}"></div><div class="f"><label>เตรียมตัว (สีเหลือง)</label><input class="in-" id="s2" inputmode="numeric" value="${cfg.w2}"></div><div class="f"><label>วางแผน (สีฟ้า)</label><input class="in-" id="s3" inputmode="numeric" value="${cfg.w3}"></div></div><p class="note" style="margin:0">หน้า "ต้องจัดการ" แสดงรายการที่เหลือไม่เกิน ${cfg.w3} วัน</p></div>
