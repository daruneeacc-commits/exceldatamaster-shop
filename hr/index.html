function donut(items,center){const tot=items.reduce((a,x)=>a+x.v,0)||1,R=70,r=44,c=90;let a=-Math.PI/2,g="";
  items.forEach(x=>{const s=x.v/tot*Math.PI*2;if(x.v<=0)return;if(s>=Math.PI*2-1e-6){g+=`<circle cx="${c}" cy="${c}" r="${(R+r)/2}" fill="none" stroke="${x.c}" stroke-width="${R-r}"/>`;a+=s;return}
   const p=(ang,rad)=>[c+rad*Math.cos(ang),c+rad*Math.sin(ang)],[x1,y1]=p(a,R),[x2,y2]=p(a+s,R),[x3,y3]=p(a+s,r),[x4,y4]=p(a,r),lg=s>Math.PI?1:0;
   g+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${lg} 0 ${x4} ${y4}Z" fill="${x.c}" stroke="#fff" stroke-width="2"/>`;
   const[mx,my]=p(a+s/2,(R+r)/2);if(x.v/tot>.06)g+=`<text x="${mx}" y="${my+4}" text-anchor="middle" style="fill:#fff;font-weight:700;font-size:11px">${Math.round(x.v/tot*100)}%</text>`;a+=s});
  return`<svg class="cv" viewBox="0 0 180 180" style="max-width:190px">${g}<text x="90" y="84" text-anchor="middle" style="font-size:12px">${center[0]}</text><text class="v" x="90" y="106" text-anchor="middle" style="font-size:22px">${center[1]}</text></svg>`}
function scatter(pts){const W=520,H=250,l=52,r=14,t=16,b=36,iw=W-l-r,ih=H-t-b;if(!pts.length)return`<div class="empty">ยังไม่มีคะแนนประเมิน</div>`;
  const ys=pts.map(p=>p[1]),my=niceMax(Math.max(...ys)),x0=1,x1=5,X=x=>l+iw*(x-x0)/(x1-x0),Y=y=>t+ih-ih*y/my;let g="";
  for(let i=0;i<=5;i++){const y=t+ih-ih*i/5;g+=`<line x1="${l}" x2="${W-r}" y1="${y}" y2="${y}" stroke="#EEF1F5"/><text x="${l-6}" y="${y+4}" text-anchor="end">${fk(my*i/5)}</text>`}
  for(let x=1;x<=5;x++)g+=`<text x="${X(x)}" y="${H-18}" text-anchor="middle">${x}</text>`;g+=`<text x="${l+iw/2}" y="${H-3}" text-anchor="middle" style="font-weight:600">คะแนนประเมิน (1–5)</text>`;
  pts.forEach(p=>g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="#2F6FDE" fill-opacity=".75"/>`);
  const n=pts.length,mx_=pts.reduce((a,p)=>a+p[0],0)/n,my_=ys.reduce((a,v)=>a+v,0)/n,sxx=pts.reduce((a,p)=>a+(p[0]-mx_)**2,0),sxy=pts.reduce((a,p)=>a+(p[0]-mx_)*(p[1]-my_),0),syy=ys.reduce((a,v)=>a+(v-my_)**2,0);
  if(sxx>0&&syy>0){const k=sxy/sxx,c=my_-k*mx_,r2=sxy*sxy/(sxx*syy);g+=`<line x1="${X(1)}" y1="${Y(Math.max(0,c+k))}" x2="${X(5)}" y2="${Y(Math.max(0,c+5*k))}" stroke="#1D2939" stroke-dasharray="5 4" stroke-width="1.5"/><text class="v" x="${W-r-4}" y="${t+14}" text-anchor="end">R² = ${r2.toFixed(2)}</text>`}
  return`<svg class="cv" viewBox="0 0 ${W} ${H}">${g}</svg>`}

  setTimeout(()=>$("#xN").focus(),60)}
function pasteDlg(){openDlg("วางรายชื่อจาก Excel",`<p class="note" style="margin:0">คัดลอกจาก Excel แล้ววางได้เลย เรียงคอลัมน์: <b>รหัส · ชื่อ · แผนก · ตำแหน่ง · เงินเดือน · วันเริ่มงาน · สถานะ</b> (ระดับ · คะแนนประเมิน ถ้ามี) · วันที่ใช้ 15/02/2023 หรือ 2023-02-15 · สถานะ: ทำงานอยู่ / ลาพัก / ลาออก</p>
  <textarea class="in-" id="pT" placeholder="E001	สมชาย ใจดี	ไอที	โปรแกรมเมอร์	35000	01/01/2023	ทำงานอยู่"></textarea><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pR"> แทนข้อมูลเดิมทั้งหมด</label><div class="note" id="pH"></div><button class="btn main" id="pOk" type="button">นำเข้า</button>`);
  const parse=()=>$("#pT").value.split(/\r?\n/).map(l=>l.split(/\t|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.trim().replace(/^"|"$/g,""))).filter(r=>r.length>=2&&r[1]&&!/^ชื่อ|name/i.test(r[1]));
  const dt=s=>{s=String(s||"").trim();let m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(s);if(m)return m[1]+"-"+pad(m[2])+"-"+pad(m[3]);m=/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/.exec(s);if(m){let y=+m[3];if(y<100)y+=2000;if(y>2400)y-=543;return y+"-"+pad(m[2])+"-"+pad(m[1])}return""};
  const st=s=>/ออก|term/i.test(s)?"t":/พัก|leave/i.test(s)?"l":"a";
  $("#pT").oninput=()=>{$("#pH").textContent="พบ "+parse().length+" แถว"};
  $("#pOk").onclick=()=>{const rs=parse();if(!rs.length)return toast("ยังไม่มีข้อมูล");if($("#pR").checked){if(!confirm("แทนข้อมูลเดิมทั้งหมด?"))return;E=[];cfg.demo=false}
    rs.forEach(r=>{const v={id:uid("e"),code:r[0]||nextCode(),name:r[1],dept:r[2]||"",pos:r[3]||"",sal:num(r[4]),start:dt(r[5])||today(),st:st(r[6]||""),lv:LV.includes(r[7])?r[7]:LV[0],rate:Math.min(5,num(r[8]))||"",end:""};if(v.st==="t")v.end=today();E.push(v);if(v.dept&&!cfg.depts.includes(v.dept))cfg.depts.push(v.dept)});
    save();saveC();$("#dlg").close();ui.v="dash";saveUi();render();toast("นำเข้า "+rs.length+" คนแล้ว ✓")}}

/* ---------- การจ่ายเงินเดือน ---------- */
function vPay(){const M=$("#main"),cur=today().slice(0,7),ms=Array.from({length:12},(_,i)=>ymAdd(cur,-i));
  M.innerHTML=`<div class="card"><h2>บันทึกการจ่ายเงินเดือน <small>ใช้คำนวณ KPI "จ่ายตรงเวลา"</small></h2><p class="note" style="margin:0">กำหนดจ่ายทุกวันที่ <input id="pd" value="${cfg.payDay}" inputmode="numeric" style="width:50px;border:1px solid var(--line);border-radius:8px;padding:3px 6px"> ของเดือน · ใส่วันที่จ่ายจริง จำนวนคนที่จ่าย และจำนวนคนที่จ่ายช้า (ถ้ามี)</p>
  <div style="overflow-x:auto"><table class="plog"><tr><th>เดือน</th><th>ค่าจ้างรวม (ระบบคิด)</th><th>วันที่จ่ายจริง</th><th>จ่ายกี่คน</th><th>จ่ายช้ากี่คน</th><th>จ่ายตรงเวลา</th></tr>${ms.map(ym=>{const p=PY[ym]||{},S=stats(E,ym),ot=num(p.n)>0?(num(p.n)-num(p.late))/num(p.n)*100:null;return`<tr><td><b>${ymS(ym)}</b></td><td>${f0(S.cost)}</td><td><input type="date" data-pp="${ym}|d" value="${p.d||""}"></td><td><input data-pp="${ym}|n" inputmode="numeric" value="${p.n||""}" placeholder="${S.hc}"></td><td><input data-pp="${ym}|late" inputmode="numeric" value="${p.late||""}" placeholder="0"></td><td>${ot==null?"-":pc(ot)}</td></tr>`}).join("")}</table></div>
  <button class="btn ghost sm" id="fillN" type="button" style="align-self:flex-start">เติมจำนวนคนอัตโนมัติ (ตามจำนวนพนักงาน)</button></div>`;
  $("#pd").oninput=e=>{cfg.payDay=Math.max(1,Math.min(31,num(e.target.value)||25));saveC()};
  M.querySelectorAll("[data-pp]").forEach(i=>i.onchange=()=>{const[ym,k]=i.dataset.pp.split("|");PY[ym]=PY[ym]||{};PY[ym][k]=i.value;if(k==="d"&&!PY[ym].n)PY[ym].n=stats(E,ym).hc;saveP();vPay()});
  $("#fillN").onclick=()=>{ms.forEach(ym=>{PY[ym]=PY[ym]||{};if(!PY[ym].n){const h=stats(E,ym).hc;if(h)PY[ym].n=h}});saveP();vPay()}}

/* ---------- ตั้งค่า ---------- */
function vSet(){const M=$("#main");
  M.innerHTML=`<div class="card"><h2>ชื่อบริษัท</h2><input class="in-" id="sN" value="${esc(cfg.name)}"></div>
  <div class="card"><h2>แผนก <small>ลำดับนี้ใช้กับสีในกราฟ</small></h2><textarea class="in-" id="sD" style="font-family:inherit;min-height:110px">${esc(cfg.depts.join("\n"))}</textarea></div>
  <div class="card"><h2>ข้อมูล</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost" id="xCsv" type="button">⬇️ ส่งออก Excel (CSV)</button><button class="btn ghost" id="xP" type="button">📋 วางจาก Excel</button><button class="btn ghost" id="xD" type="button">✨ ใส่ข้อมูลตัวอย่าง</button><button class="btn ghost danger" id="xC" type="button">ล้างข้อมูลทั้งหมด</button></div><p class="note" style="margin:0">ข้อมูลเก็บในเครื่องนี้ และสำรองขึ้นระบบอัตโนมัติเมื่อเข้าสู่ระบบสมาชิก · เงินเดือนเป็นข้อมูลลับ ควรตั้งรหัสผ่านเครื่อง</p></div>`;
  $("#sN").oninput=e=>{cfg.name=e.target.value;saveC()};$("#sD").onchange=e=>{cfg.depts=e.target.value.split("\n").map(x=>x.trim()).filter(Boolean);saveC();toast("บันทึกแล้ว ✓")};
  $("#xCsv").onclick=()=>{const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',rows=[["รหัส","ชื่อ","แผนก","ตำแหน่ง","เงินเดือน","วันเริ่มงาน","สถานะ","ระดับ","คะแนนประเมิน","วันที่ลาออก"]].concat(E.map(e=>[e.code,e.name,e.dept,e.pos,e.sal,e.start,STS[e.st],e.lv,e.rate,e.end]));const b=new Blob(["﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="employees-"+today()+".csv";a.click()};
  $("#xP").onclick=pasteDlg;$("#xD").onclick=()=>{if(E.length&&!confirm("ข้อมูลตัวอย่างจะแทนข้อมูลที่มีอยู่ ต้องการต่อ?"))return;demo()};
  $("#xC").onclick=()=>{if(!confirm("ล้างพนักงานและบันทึกการจ่ายทั้งหมด?"))return;E=[];PY={};cfg.demo=false;save();saveP();saveC();render();toast("ล้างแล้ว")}}

/* ---------- ตัวอย่าง (ข้อมูลสมมติ) ---------- */
function demo(){const FN=["สมชาย","สุภาพร","วิทยา","กมลชนก","ณัฐพล","ปิยะนุช","ธนากร","อรอุมา","ศุภชัย","จิราพร","อนุชา","พิมพ์ชนก","ชยพล","วรรณา","ภาณุ","นภัสสร","กิตติ","ศิริพร","ธีรวัฒน์","รัชนี","เอกชัย","ปวีณา","สุรเชษฐ์","มณีรัตน์","ณัฐวุฒิ","ชุติมา","พงศกร","อัญชลี","ทวีศักดิ์","ดวงใจ"],LN=["ใจดี","สุขสันต์","รุ่งเรือง","มีสุข","ทองดี","ศรีสวัสดิ์","บุญมา","แสงทอง","พรหมมา","วงศ์ใหญ่","เจริญผล","สายบุญ"];
  const DP={"ไอที":[["โปรแกรมเมอร์",32000],["ผู้ดูแลระบบ",28000],["หัวหน้าทีมไอที",48000]],"บุคคล":[["เจ้าหน้าที่บุคคล",22000],["หัวหน้าฝ่ายบุคคล",38000]],"บัญชี/การเงิน":[["นักบัญชี",25000],["เจ้าหน้าที่การเงิน",21000],["ผู้จัดการบัญชี",45000]],"ฝ่ายขาย":[["พนักงานขาย",18000],["หัวหน้าฝ่ายขาย",35000],["ผู้จัดการฝ่ายขาย",52000]],"ปฏิบัติการ":[["พนักงานปฏิบัติการ",15000],["หัวหน้างาน",24000],["ผู้จัดการโรงงาน",55000]]};
  const W={"ไอที":.2,"บุคคล":.12,"บัญชี/การเงิน":.15,"ฝ่ายขาย":.25,"ปฏิบัติการ":.28};cfg.depts=Object.keys(DP);
  let seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};const t=today(),cur=t.slice(0,7);E=[];let k=0;
  const pickD=()=>{let r=rnd(),a=0;for(const d in W){a+=W[d];if(r<=a)return d}return"ปฏิบัติการ"};
  for(let i=0;i<72;i++){const d=pickD(),ps=DP[d],j=rnd()<.7?0:rnd()<.75?1:Math.min(2,ps.length-1),p=ps[Math.min(j,ps.length-1)],rate=Math.round((1.5+rnd()*3.5)*10)/10,base=p[1]*(.9+rnd()*.2)*(.62+rate*.13);
    const mAgo=i<58?Math.floor(8+rnd()*40):Math.floor(rnd()*8),st=ymAdd(cur,-mAgo)+"-"+pad(1+Math.floor(rnd()*27));
    const lv=/ผู้จัดการ/.test(p[0])?"ผู้จัดการ":/หัวหน้า/.test(p[0])?"หัวหน้างาน":"พนักงาน";
    E.push({id:uid("e"),code:"E"+String(++k).padStart(3,"0"),name:FN[i%FN.length]+" "+LN[(i*7)%LN.length],dept:d,pos:p[0],lv,sal:Math.round(base/100)*100,rate:Math.min(5,rate),start:st>t?t:st,st:"a",end:""})}
  [3,17,29,44,51].forEach((i,n)=>{const e=E[i];e.st="t";e.end=ymAdd(cur,-n)+"-"+pad(10+n*3)});E[22].st="l";E[38].st="l";
  E.push({id:uid("e"),code:"E"+String(++k).padStart(3,"0"),name:"ประเสริฐ มั่นคง",dept:"บัญชี/การเงิน",pos:"ผู้อำนวยการ",lv:"ผู้บริหาร",sal:85000,rate:4.6,start:ymAdd(cur,-60)+"-01",st:"a",end:""});
  PY={};for(let i=1;i<=8;i++){const ym=ymAdd(cur,-i),h=stats(E,ym).hc;if(h)PY[ym]={d:ym+"-"+pad(cfg.payDay),n:h,late:i%3===0?2:i%4===0?1:0}}
  if(!cfg.name)cfg.name="บริษัทตัวอย่าง";cfg.demo=true;ui.ym=ymAdd(cur,-1);ui.v="dash";ui.f={d:[],s:[],lv:[],y:[]};save();saveP();saveC();saveUi();render();toast("ใส่ตัวอย่างแล้ว ✓")}
window.addEventListener("storage",e=>{if([K.emp,K.pay,K.cfg].includes(e.key)){E=LS.get(K.emp,[])||[];PY=LS.get(K.pay,{})||{};cfg=Object.assign(cfg,LS.get(K.cfg,{})||{});if(!$("#dlg").open)render()}});
if(/[?&]demo=1/.test(location.search)&&!E.length)demo();else render();
})();
</script>
