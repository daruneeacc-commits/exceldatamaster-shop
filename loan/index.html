<script>

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่เต็ม)");return false}}};

const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],MF=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];

const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0},fm=n=>(+n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}),f0=n=>(+n||0).toLocaleString("th-TH",{maximumFractionDigits:0});

let C=LS.get(K.items,[])||[],cfg=Object.assign({name:"",warn:3,demo:false},LS.get(K.cfg,{})||{}),ui=Object.assign({v:"month",ym:today().slice(0,7),c:""},LS.get(K.ui,{})||{});
const save=()=>LS.set(K.items,C),saveC=()=>LS.set(K.cfg,cfg),saveUi=()=>LS.set(K.ui,ui);
/* วันครบกำหนดของงวดที่ i (1..n): เดือนเริ่ม = c.fm (YYYY-MM) + (i-1) · วันที่ = c.day (ถ้าเดือนนั้นไม่มีวันนี้ใช้วันสุดท้าย) */
function ymAdd(ym,k){const[y,m]=ym.split("-").map(Number),d=new Date(y,m-1+k,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)}
function dueOf(c,i){const ym=ymAdd(c.fm,i-1),[y,m]=ym.split("-").map(Number),last=new Date(y,m,0).getDate();return ym+"-"+pad(Math.min(c.day,last))}
const amtOf=(c,i)=>i===1?num(c.a1):num(c.a),total=c=>num(c.a1)+num(c.a)*(c.n-1);
const idxIn=(c,ym)=>{const[y1,m1]=c.fm.split("-").map(Number),[y,m]=ym.split("-").map(Number),i=(y-y1)*12+(m-m1)+1;return i>=1&&i<=c.n?i:0};
const isPaid=(c,i)=>!!(c.paid&&c.paid[i]);
function stat(c,i){if(isPaid(c,i))return["ชำระแล้ว","ok"];const n=dDiff(today(),dueOf(c,i));if(n<0)return["เลยกำหนด "+(-n)+" วัน","late"];if(n===0)return["ครบกำหนดวันนี้","wait"];if(n<=num(cfg.warn||3))return["อีก "+n+" วัน","wait"];return["ค้างชำระ",""]}
const paidCnt=c=>Object.keys(c.paid||{}).filter(i=>+i>=1&&+i<=c.n).length,paidAmt=c=>Object.keys(c.paid||{}).filter(i=>+i>=1&&+i<=c.n).reduce((a,i)=>a+amtOf(c,+i),0);
const endDate=c=>dueOf(c,c.n);
const sorted=()=>C.slice().sort((a,b)=>(a.no||0)-(b.no||0));

function togglePaid(c,i,on){c.paid=c.paid||{};if(on)c.paid[i]={d:today()};else delete c.paid[i];save()}
function emptyHello(M){M.innerHTML=`<div class="card empty" style="align-items:center"><div style="font-size:3rem">📅</div><h2 style="justify-content:center">เริ่มบันทึกสัญญาแรก</h2><p class="note" style="max-width:520px;margin:0 auto">ใส่เลขที่สัญญา บริษัทลิสซิ่ง วันที่ชำระของทุกเดือน ยอดงวดแรกและงวดถัดไป ระบบสร้างตารางทุกงวดให้ แล้วติ๊กเมื่อชำระแล้ว</p><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn main" id="eNew" type="button">＋ เพิ่มสัญญา</button><button class="btn ghost" id="eDemo" type="button">✨ ลองดูตัวอย่าง</button></div></div>`;
  $("#eNew").onclick=()=>cDlg();$("#eDemo").onclick=demo}

function vMonth(){const M=$("#main");if(!C.length)return emptyHello(M);const ym=ui.ym||today().slice(0,7),[y,m]=ym.split("-").map(Number);
  const L=sorted().map(c=>({c,i:idxIn(c,ym)})).filter(x=>x.i).sort((a,b)=>dueOf(a.c,a.i)<dueOf(b.c,b.i)?-1:1);
  const pd=L.filter(x=>isPaid(x.c,x.i)),sumP=pd.reduce((a,x)=>a+amtOf(x.c,x.i),0),sumA=L.reduce((a,x)=>a+amtOf(x.c,x.i),0),late=L.filter(x=>!isPaid(x.c,x.i)&&dueOf(x.c,x.i)<today());
  M.innerHTML=`<div class="hello"><div><h1>ค่างวดเดือน${MF[m-1]} ${y+543}</h1><p>${esc(cfg.name||"")}${cfg.name?" · ":""}${L.length} สัญญาที่ต้องชำระเดือนนี้</p></div><div class="mnav noprint"><button class="btn sm ghost" id="mP" type="button">‹</button><b>${MS[m-1]} ${y+543}</b><button class="btn sm ghost" id="mN" type="button">›</button><button class="btn sm ghost" id="mT" type="button">เดือนนี้</button><button class="btn sm ghost" onclick="print()" type="button">🖨️</button><button class="btn sm main" id="cNew" type="button">＋ สัญญา</button></div></div>

  $("#xCsv").onclick=()=>{const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"',rows=[["คันที่","ผู้เช่าซื้อ","เลขที่สัญญา","รายการ","บริษัทลิสซิ่ง","งวดที่","วันครบกำหนด","ยอดเงิน","ชำระแล้ว","วันที่จ่าย"]];sorted().forEach(c=>{for(let i=1;i<=c.n;i++)rows.push([c.no,c.name,c.cno,c.asset,c.fin,i,dueOf(c,i),amtOf(c,i),isPaid(c,i)?"ชำระแล้ว":"ค้างชำระ",isPaid(c,i)?c.paid[i].d:""])});const b=new Blob(["﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="installments-"+today()+".csv";a.click()};
  $("#xJ").onclick=()=>{const b=new Blob([JSON.stringify({app:"edm-loan",v:1,items:C,cfg},null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="loan-backup-"+today()+".json";a.click()};
  $("#xI").onclick=()=>$("#impF").click();
  $("#xD").onclick=()=>{if(C.length&&!confirm("ข้อมูลตัวอย่างจะแทนข้อมูลที่มีอยู่ ต้องการต่อ?"))return;demo()};
  $("#xC").onclick=()=>{if(!confirm("ล้างสัญญาทั้งหมด? ย้อนกลับไม่ได้"))return;C=[];cfg.demo=false;save();saveC();render();toast("ล้างแล้ว")}}
$("#impF").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(d.app!=="edm-loan"||!Array.isArray(d.items))throw 0;if(C.length&&!confirm("นำเข้า "+d.items.length+" สัญญา แทนข้อมูลเดิม?"))return;C=d.items;cfg=Object.assign(cfg,d.cfg||{},{demo:false});save();saveC();ui.v="month";saveUi();render();toast("นำเข้า "+C.length+" สัญญาแล้ว ✓")}).catch(()=>alert("ไฟล์ไม่ถูกต้อง"));e.target.value=""};

function demo(){const t=today(),ym=t.slice(0,7);const D=[["1","บจก. ตัวอย่างก่อสร้าง","TOL25-A001","SK200-10 · YN0000001","ไทยลิสซิ่ง",10,-19,60,74575,64500],["2","บจก. ตัวอย่างก่อสร้าง","TAT25-A002","SK200-10 · YN0000002","เอสลิสซิ่ง",23,-19,60,72300,64100],["3","หจก. สมมติการโยธา","TOL25-A003","SAKAI SV521DF · 2SV0000","ไทยลิสซิ่ง",28,-14,60,56675,52800],["4","บจก. ตัวอย่างก่อสร้าง","TAT25-A004","SK140 LC · LP0000004","เอสลิสซิ่ง",18,-12,60,66400,56000],["5","บจก. ตัวอย่างก่อสร้าง","TOL25-A005","SK200-10 SM X · YN0000005","ไทยลิสซิ่ง",17,-9,48,83640,77500],["6","หจก. สมมติการโยธา","TAT26-A006","SK210 LC บูมยาว · YQ0000006","เอสลิสซิ่ง",10,-8,48,101540,96100],["7","บจก. ตัวอย่างก่อสร้าง","TAT26-A007","SK140LC สีเหลือง · LP0000007","เอสลิสซิ่ง",5,-6,48,73600,67200]];
  C=D.map(d=>{const fmv=ymAdd(ym,d[6]),c={id:uid("c"),no:d[0],name:d[1],cno:d[2],asset:d[3],fin:d[4],day:d[5],fm:fmv,start:ymAdd(fmv,-1)+"-"+pad(Math.max(1,d[5]-1)),n:d[7],a1:d[8],a:d[9],note:"",paid:{}};for(let i=1;i<=c.n;i++){const du=dueOf(c,i);if(du<t&&!(i===idxIn(c,ym)&&+c.no%3===0))c.paid[i]={d:du}}return c});
  if(!cfg.name)cfg.name="บริษัทตัวอย่าง";cfg.demo=true;save();saveC();ui.v="month";ui.ym=ym;saveUi();render();toast("ใส่ตัวอย่างแล้ว ✓")}
window.addEventListener("storage",e=>{if(e.key===K.items||e.key===K.cfg){C=LS.get(K.items,[])||[];cfg=Object.assign(cfg,LS.get(K.cfg,{})||{});if(!$("#dlg").open)render()}});
if(/[?&]demo=1/.test(location.search)&&!C.length)demo();else render();
})();
</script>
