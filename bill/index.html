<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เปิดบิลออนไลน์ · Excel Data Master</title>
<meta name="description" content="เปิดบิล ใบเสนอราคา ใบแจ้งหนี้ ใบเสร็จ ใบกำกับภาษี สำหรับธุรกิจซื้อมาขายไปและงานบริการ คำนวณ VAT และหัก ณ ที่จ่ายให้อัตโนมัติ พิมพ์เป็น PDF ได้ทันที">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F6F5;--card:#fff;--ink:#0F1513;--muted:#66706B;--line:#E2E6E4;--soft:#F4F6F5;--accent:#127A4B;--accent-ink:#fff;--warn:#8A5A00;--warnbg:#FFF4DC;--danger:#B3261E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1110;--card:#161C1A;--ink:#EEF2F0;--muted:#97A29D;--line:#26302C;--soft:#1C2421;--accent:#4CC48A;--accent-ink:#06120C;--warn:#F0C27A;--warnbg:#2A2416}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1400px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--soft);color:var(--ink);font-size:.9rem}
.btn:hover{filter:brightness(.97)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn.danger{color:var(--danger)}
main{max-width:1400px;margin:0 auto;padding:16px;display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:980px){main{grid-template-columns:minmax(0,1fr)}.preview-wrap{display:none}.preview-wrap.show{display:block}.editor.hide{display:none}}
.mtabs{display:none;gap:6px;max-width:1400px;margin:12px auto 0;padding:0 16px}
@media(max-width:980px){.mtabs{display:flex}}
.mtabs button{flex:1;border:0;border-radius:999px;padding:10px;background:var(--card);box-shadow:0 0 0 1px var(--line);font-weight:600;cursor:pointer}
.mtabs button.on{background:var(--ink);color:var(--bg);box-shadow:none}
.editor{display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px}
.card h2{font-size:1rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:.8rem}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:520px){.row3{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.8rem;font-weight:600;color:var(--muted)}
.in-{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;outline:none}
.in-:focus{border-color:var(--accent)}
textarea.in-{resize:vertical;min-height:60px}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;cursor:pointer;font-weight:600;font-size:.86rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.doctypes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.doctypes button{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px;cursor:pointer;font-weight:600;font-size:.86rem;text-align:left}
.doctypes button small{display:block;font-weight:400;color:var(--muted);font-size:.74rem}
.doctypes button.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.item .top{display:flex;gap:8px;align-items:center}
.item .no{font-weight:700;color:var(--muted);width:22px;flex:none}
.item .x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:1.1rem}
.item .sum{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.note{font-size:.8rem;color:var(--muted)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.84rem}
.logo-pick{display:flex;align-items:center;gap:10px}
.logo-pick .pv{width:56px;height:56px;border-radius:10px;background:var(--soft) center/contain no-repeat;box-shadow:0 0 0 1px var(--line);flex:none}
.totals{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;font-size:.92rem}
.totals .big{font-weight:700;font-size:1.1rem}
details.more summary{cursor:pointer;font-weight:600;font-size:.9rem}
.list{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto}
.list .li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.list .li b{display:block;font-size:.9rem}
.list .li small{color:var(--muted)}
.list .li .acts{margin-left:auto;display:flex;gap:4px}
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,calc(100% - 24px));width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
dialog .db{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:50;font-size:.9rem}
.cta{background:linear-gradient(135deg,#FDF1EC,#F4F6F5);color:#0F1513;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 0 0 1px var(--line)}
.cta b{display:block}
/* ---------- paper ---------- */
.preview-wrap{position:sticky;top:70px}
.paper-scroll{overflow:auto;background:#d9dedb;border-radius:16px;padding:16px;max-height:calc(100vh - 100px)}
.paper{width:210mm;min-height:297mm;margin:0 auto;background:#fff;color:#111;padding:14mm 14mm 12mm;box-shadow:0 10px 30px -12px rgba(0,0,0,.35);font-size:10.5pt;line-height:1.55;transform-origin:top center;display:flex;flex-direction:column}
.p-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.p-seller{display:flex;gap:12px;align-items:flex-start;max-width:60%}
.p-seller img{max-width:70px;max-height:70px;object-fit:contain}
.p-seller b{font-size:12.5pt}
.p-title{text-align:right}
.p-title h1{margin:0;font-size:17pt;color:var(--paper-accent,#127A4B);line-height:1.25}
.p-title .sub{font-size:9pt;color:#555}
.p-meta{display:grid;grid-template-columns:1.4fr 1fr;gap:12px;margin-top:12px}
.p-box{border:1px solid #d6dbd8;border-radius:8px;padding:8px 10px}
.p-box .lb{font-size:8.5pt;color:#666}
.p-kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
.p-kv span:nth-child(odd){color:#666}
table.p-items{width:100%;border-collapse:collapse;margin-top:12px;font-variant-numeric:tabular-nums}
table.p-items th{background:var(--paper-accent,#127A4B);color:#fff;font-weight:600;padding:6px 8px;font-size:9.5pt;text-align:left}
table.p-items td{padding:6px 8px;border-bottom:1px solid #e6e9e7;vertical-align:top}
table.p-items .r{text-align:right;white-space:nowrap}
table.p-items .c{text-align:center}
.p-sum{display:grid;grid-template-columns:1fr 260px;gap:16px;margin-top:10px}
.p-words{border:1px solid #d6dbd8;border-radius:8px;padding:8px 10px;align-self:start;font-weight:600}
.p-tot{display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-variant-numeric:tabular-nums}
.p-tot .grand{font-weight:700;font-size:12pt;border-top:1.5px solid #111;padding-top:4px;margin-top:2px}
.p-notes{margin-top:12px;font-size:9.5pt;white-space:pre-wrap}
.p-sign{margin-top:auto;padding-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:30px;text-align:center;font-size:9.5pt}
.p-sign .ln{border-top:1px dotted #555;margin:44px 20px 4px}
.p-foot{margin-top:10px;font-size:7.5pt;color:#999;text-align:center}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  header.top,.editor,.mtabs,.no-print,.toast{display:none!important}
  main{display:block;padding:0;max-width:none}
  .preview-wrap{display:block!important;position:static}
  .paper-scroll{background:none;padding:0;max-height:none;overflow:visible;border-radius:0}
  .paper{box-shadow:none;margin:0;transform:none!important;zoom:1!important;width:210mm;min-height:297mm}
}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/">📊 Excel Data Master <small>· เปิดบิลออนไลน์</small></a>
  <nav class="nav">
    <button class="btn sm ghost" id="openList">📁 เอกสารของฉัน</button>
    <a class="btn sm ghost" href="/payroll/">💰 คำนวณเงินเดือน</a>
    <a class="btn sm ghost" href="/">🛒 ร้านเทมเพลต</a>
  </nav>
</div></header>

<div class="mtabs"><button data-mt="edit" class="on">✏️ แก้ไข</button><button data-mt="view">📄 ดูเอกสาร</button></div>

<main>
  <section class="editor" id="editor">
    <div class="card">
      <h2>ประเภทธุรกิจ</h2>
      <div class="seg" id="modeSeg"><button data-mode="goods">🛍️ ซื้อมาขายไป</button><button data-mode="service">🧰 บริการ</button></div>
      <h2 style="margin-top:4px">เอกสาร</h2>
      <div class="doctypes" id="docTypes"></div>
      <div id="typeWarn"></div>
      <div class="row">
        <div class="f"><label>เลขที่</label><input class="in-" id="docNo"></div>
        <div class="f"><label>วันที่</label><input class="in-" type="date" id="docDate"></div>
      </div>
      <div class="row">
        <div class="f"><label id="dueLabel">ครบกำหนด / ยืนราคาถึง</label><input class="in-" type="date" id="docDue"></div>
        <div class="f"><label>อ้างอิง (ถ้ามี)</label><input class="in-" id="docRef" placeholder="เช่น เลขที่ใบเสนอราคา"></div>
      </div>
    </div>

    <details class="card more" id="sellerCard">
      <summary>🏪 ข้อมูลกิจการของฉัน <small class="note" id="sellerSum"></small></summary>
      <div class="logo-pick"><div class="pv" id="logoPv"></div><div style="display:flex;flex-direction:column;gap:4px"><label class="btn sm ghost">📷 เลือกโลโก้<input type="file" id="logoIn" accept="image/*" hidden></label><button class="btn sm ghost" id="logoClr" type="button">ลบโลโก้</button></div></div>
      <div class="f"><label>ชื่อกิจการ / ชื่อผู้ขาย</label><input class="in-" id="sName"></div>
      <div class="f"><label>ที่อยู่</label><textarea class="in-" id="sAddr"></textarea></div>
      <div class="row">
        <div class="f"><label>เลขประจำตัวผู้เสียภาษี</label><input class="in-" id="sTax" inputmode="numeric" maxlength="13"></div>
        <div class="f"><label>สาขา</label><input class="in-" id="sBranch" placeholder="สำนักงานใหญ่"></div>
      </div>
      <div class="row">
        <div class="f"><label>โทร</label><input class="in-" id="sPhone"></div>
        <div class="f"><label>อีเมล / LINE</label><input class="in-" id="sContact"></div>
      </div>
      <label style="display:flex;gap:8px;align-items:center;font-weight:600;font-size:.9rem"><input type="checkbox" id="sVat"> จดทะเบียนภาษีมูลค่าเพิ่ม (VAT)</label>
      <div class="f"><label>ข้อมูลการชำระเงิน (แสดงท้ายเอกสาร)</label><textarea class="in-" id="sPay" placeholder="เช่น ธ.กสิกรไทย 123-4-56789-0 ชื่อบัญชี ..."></textarea></div>
      <div class="f"><label>สีเอกสาร</label><input type="color" id="sColor" value="#127A4B" style="width:60px;height:34px;border:0;background:none"></div>
      <p class="note">บันทึกไว้ในเครื่องนี้ครั้งเดียว ใช้กับทุกเอกสาร</p>
    </details>

    <div class="card">
      <h2>ลูกค้า <button class="btn sm ghost" id="pickCust" type="button">เลือกลูกค้าเดิม</button></h2>
      <div class="f"><label>ชื่อลูกค้า / บริษัท</label><input class="in-" id="cName"></div>
      <div class="f"><label>ที่อยู่</label><textarea class="in-" id="cAddr"></textarea></div>
      <div class="row">
        <div class="f"><label>เลขผู้เสียภาษี</label><input class="in-" id="cTax" inputmode="numeric" maxlength="13"></div>
        <div class="f"><label>สาขา</label><input class="in-" id="cBranch"></div>
      </div>
      <div class="f"><label>ผู้ติดต่อ / โทร</label><input class="in-" id="cContact"></div>
    </div>

    <div class="card">
      <h2 id="itemsTitle">รายการสินค้า</h2>
      <div id="items" style="display:flex;flex-direction:column;gap:8px"></div>
      <button class="btn ghost" id="addItem" type="button">＋ เพิ่มรายการ</button>
    </div>

    <div class="card">
      <h2>ภาษีและส่วนลด</h2>
      <div class="f"><label>ภาษีมูลค่าเพิ่ม</label>
        <div class="seg" id="vatSeg"><button data-vat="none">ไม่มี VAT</button><button data-vat="ex">แยก VAT 7%</button><button data-vat="in">รวม VAT แล้ว</button></div></div>
      <div class="row">
        <div class="f"><label>ส่วนลดท้ายบิล (บาท)</label><input class="in-" id="billDisc" type="number" min="0" step="0.01" inputmode="decimal"></div>
        <div class="f"><label>หัก ณ ที่จ่าย</label><select class="in-" id="wht"><option value="0">ไม่หัก</option><option value="1">1% (ขนส่ง)</option><option value="2">2% (โฆษณา)</option><option value="3">3% (บริการ/จ้างทำของ)</option><option value="5">5% (ค่าเช่า)</option></select></div>
      </div>
      <div class="totals" id="totals"></div>
      <div class="f"><label>หมายเหตุ</label><textarea class="in-" id="notes" placeholder="เงื่อนไขการชำระเงิน การรับประกัน ฯลฯ"></textarea></div>
    </div>

    <div class="card no-print" style="position:sticky;bottom:10px;z-index:5;flex-direction:row;flex-wrap:wrap;gap:8px">
      <button class="btn main" id="saveBtn">💾 บันทึก</button>
      <button class="btn main" id="printBtn">🖨️ พิมพ์ / PDF</button>
      <button class="btn ghost" id="convertBtn">🔁 แปลงเป็นเอกสารอื่น</button>
      <button class="btn ghost" id="newBtn">＋ เอกสารใหม่</button>
    </div>

    <div class="cta no-print"><div style="flex:1;min-width:200px"><b>อยากได้ระบบบัญชีครบใน Excel?</b><span class="note" style="color:#555">เทมเพลตรายรับ-รายจ่าย สต๊อก ติดตามหนี้ พร้อมใช้</span></div><a class="btn main" href="/">ดูเทมเพลต →</a></div>
  </section>

  <section class="preview-wrap" id="previewWrap">
    <div class="paper-scroll"><div class="paper" id="paper"></div></div>
  </section>
</main>

<dialog id="dlg"><div class="dh"><b id="dlgTitle"></b><button class="btn sm ghost" onclick="dlg.close()">✕</button></div><div class="db" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("บันทึกไม่ได้: พื้นที่ในเครื่องเต็มหรือเบราว์เซอร์ไม่อนุญาต");return false}}};
const K={seller:"edm_bill_seller",docs:"edm_bill_docs",cnt:"edm_bill_counter",cust:"edm_bill_customers",draft:"edm_bill_draft"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v).replace(/,/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const fmt=n=>r2(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const thDate=d=>{if(!d)return"";const x=new Date(d+"T00:00:00");return x.toLocaleDateString("th-TH",{day:"numeric",month:"long",year:"numeric"})};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2600)}

/* ---------- Thai baht text ---------- */
function bahtText(n){
  n=r2(Math.abs(n));const D=["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"],P=["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  const grp=s=>{let out="";const L=s.length;for(let i=0;i<L;i++){const d=+s[i],pos=L-i-1;if(!d)continue;
    if(pos===1&&d===1)out+="สิบ";else if(pos===1&&d===2)out+="ยี่สิบ";else if(pos===0&&d===1&&L>1&&+s[L-2]!==0)out+="เอ็ด";else if(pos===0&&d===1&&L>1)out+="เอ็ด";else out+=D[d]+P[pos];}return out};
  const words=s=>{s=s.replace(/^0+/,"");if(!s)return"";let out="";const parts=[];while(s.length>6){parts.unshift(s.slice(-6));s=s.slice(0,-6)}parts.unshift(s);
    parts.forEach((p,i)=>{const w=grp(p);out+=w;if(i<parts.length-1)out+=(w?"ล้าน":"ล้าน")});return out.replace(/^เอ็ด/,"หนึ่ง")};
  const [b,s]=n.toFixed(2).split(".");let t=words(b);t=t?t+"บาท":"";
  if(+s===0)return(t||"ศูนย์บาท")+"ถ้วน";return t+words(s)+"สตางค์";
}

/* ---------- document types ---------- */
const TYPES={
  QT:{name:"ใบเสนอราคา",en:"QUOTATION",due:"ยืนราคาถึง",sign:["ผู้เสนอราคา","ผู้อนุมัติสั่งซื้อ"]},
  IV:{name:"ใบแจ้งหนี้ / ใบวางบิล",en:"INVOICE",due:"ครบกำหนดชำระ",sign:["ผู้วางบิล","ผู้รับวางบิล"]},
  RC:{name:"ใบเสร็จรับเงิน",en:"RECEIPT",due:"",sign:["ผู้รับเงิน","ผู้จ่ายเงิน"]},
  TX:{name:"ใบกำกับภาษี / ใบเสร็จรับเงิน",en:"TAX INVOICE / RECEIPT",due:"",sign:["ผู้รับเงิน","ผู้จ่ายเงิน"],tax:1},
  IT:{name:"ใบแจ้งหนี้ / ใบกำกับภาษี",en:"INVOICE / TAX INVOICE",due:"ครบกำหนดชำระ",sign:["ผู้ส่งสินค้า","ผู้รับสินค้า"],tax:1}
};
/* ซื้อมาขายไป: ภาษีเกิดตอนส่งมอบสินค้า จึงออกใบแจ้งหนี้คู่กับใบกำกับภาษี ไม่มีใบเสร็จแยก · บริการ: ภาษีเกิดตอนรับเงิน */
const MODE_TYPES={goods:["QT","IT"],service:["QT","IV","RC","TX"]};
const fitType=(mode,t)=>MODE_TYPES[mode].includes(t)?t:mode==="goods"?"IT":"IV";
const tName=k=>k==="IT"&&!seller.vat?"ใบส่งของ / ใบแจ้งหนี้":TYPES[k].name;
const tEn=k=>k==="IT"&&!seller.vat?"DELIVERY NOTE / INVOICE":TYPES[k].en;

/* ---------- state ---------- */
let seller=Object.assign({name:"",addr:"",tax:"",branch:"สำนักงานใหญ่",phone:"",contact:"",vat:false,pay:"",color:"#127A4B",logo:""},LS.get(K.seller,{}));
let doc=LS.get(K.draft,null)||blank("goods","QT");
function blank(mode,type){return{id:"d"+Date.now().toString(36),mode,type,no:"",date:today(),due:type==="QT"?addDays(today(),30):type==="IV"?addDays(today(),30):"",ref:"",
  cust:{name:"",addr:"",tax:"",branch:"",contact:""},items:[{d:"",q:1,u:mode==="goods"?"ชิ้น":"งาน",p:0,disc:0}],vat:seller.vat?"ex":"none",billDisc:0,wht:mode==="service"?3:0,notes:"",saved:false}}
function nextNo(type,date){const ym=(date||today()).slice(2,7).replace("-","");const c=LS.get(K.cnt,{});const k=type+ym;return type+ym+"-"+String((c[k]||0)+1).padStart(3,"0")}
function bumpNo(no){const m=/^([A-Z]{2})(\d{4})-(\d+)$/.exec(no||"");if(!m)return;const c=LS.get(K.cnt,{});const k=m[1]+m[2];c[k]=Math.max(c[k]||0,+m[3]);LS.set(K.cnt,c)}
if(doc.mode&&fitType(doc.mode,doc.type)!==doc.type){doc.type=fitType(doc.mode,doc.type);doc.no=""}
if(!doc.no)doc.no=nextNo(doc.type,doc.date);

/* ---------- calc ---------- */
function calc(d){
  const lines=d.items.map(it=>{const amt=r2(num(it.q)*num(it.p)-num(it.disc));return Object.assign({},it,{amt})});
  const sub=r2(lines.reduce((a,l)=>a+l.amt,0));const after=r2(Math.max(0,sub-num(d.billDisc)));
  let vat=0,total=after,base=after;
  if(d.vat==="ex"){vat=r2(after*0.07);total=r2(after+vat)}
  else if(d.vat==="in"){base=r2(after/1.07);vat=r2(after-base);total=after}
  const wht=r2(base*num(d.wht)/100),net=r2(total-wht);
  return{lines,sub,disc:num(d.billDisc),after,base,vat,total,wht,net};
}

/* ---------- render editor ---------- */

  $$("#docTypes button").forEach(b=>b.onclick=()=>{const old=doc.type;doc.type=b.dataset.type;if(!doc.saved||old!==doc.type){doc.no=nextNo(doc.type,doc.date)}
    if(TYPES[doc.type].tax&&seller.vat&&doc.vat==="none")doc.vat="ex";doc.due=TYPES[doc.type].due?(doc.due||addDays(doc.date,30)):"";renderAll()});
  const w=[];if(doc.type==="IT"&&!seller.vat)w.push("ยังไม่ได้จดทะเบียน VAT จึงออกเป็น \"ใบส่งของ / ใบแจ้งหนี้\" ถ้าจด VAT แล้วให้ติ๊ก \"จดทะเบียนภาษีมูลค่าเพิ่ม\" ในข้อมูลกิจการ เอกสารจะเปลี่ยนเป็นใบแจ้งหนี้ / ใบกำกับภาษีให้อัตโนมัติ");
  else if(TYPES[doc.type].tax){if(!seller.vat)w.push("ใบกำกับภาษีออกได้เฉพาะผู้ที่จดทะเบียน VAT ให้ติ๊ก \"จดทะเบียนภาษีมูลค่าเพิ่ม\" ในข้อมูลกิจการ");
    if(!/^\d{13}$/.test(seller.tax))w.push("ใบกำกับภาษีต้องมีเลขผู้เสียภาษี 13 หลักของผู้ขาย");if(!doc.cust.name)w.push("ใบกำกับภาษีต้องระบุชื่อและที่อยู่ผู้ซื้อ")}

  $("#dueLabel").textContent=TYPES[doc.type].due||"ครบกำหนด (ไม่ใช้กับเอกสารนี้)";$("#docDue").disabled=!TYPES[doc.type].due;
}

  $("#totals").innerHTML=`<span>รวมเป็นเงิน</span><span>${fmt(c.sub)}</span>`+(c.disc?`<span>ส่วนลด</span><span>-${fmt(c.disc)}</span><span>ยอดหลังหักส่วนลด</span><span>${fmt(c.after)}</span>`:"")+

function fitPaper(){const P=$("#paper");P.style.zoom="";const w=$(".paper-scroll").clientWidth-32,pw=P.offsetWidth;if(!w||w<=0)return;const s=Math.min(1,w/pw);P.style.zoom=s<1?String(s):""}

function save(silent){
  if(!doc.no){toast("ใส่เลขที่เอกสารก่อน");return false}
  const docs=LS.get(K.docs,[]);doc.saved=true;doc.updated=Date.now();const c=calc(doc);doc._total=c.net;
  const i=docs.findIndex(d=>d.id===doc.id);if(i>=0)docs[i]=JSON.parse(JSON.stringify(doc));else docs.unshift(JSON.parse(JSON.stringify(doc)));
  if(LS.set(K.docs,docs)){bumpNo(doc.no);
    if(doc.cust.name){const cs=LS.get(K.cust,[]);const j=cs.findIndex(x=>x.name===doc.cust.name);if(j>=0)cs[j]=doc.cust;else cs.unshift(doc.cust);LS.set(K.cust,cs.slice(0,200))}
    if(!silent)toast("บันทึกแล้ว ✓");return true}return false;
}

  const docs=LS.get(K.docs,[]);
  openDlg("เอกสารของฉัน",`<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm ghost" id="exp">⬇️ สำรองข้อมูล</button><label class="btn sm ghost">⬆️ นำเข้าข้อมูล<input type="file" id="imp" accept=".json" hidden></label></div><input class="in-" id="dq" placeholder="ค้นหาเลขที่หรือชื่อลูกค้า"><div class="list" id="dl"></div><p class="note">ข้อมูลเก็บในเบราว์เซอร์ของเครื่องนี้เท่านั้น ควรกด "สำรองข้อมูล" เก็บไว้เป็นระยะ</p>`);
  const draw=q=>{const L=docs.filter(d=>!q||(d.no+d.cust.name).toLowerCase().includes(q));$("#dl").innerHTML=L.length?L.map(d=>`<div class="li"><div><b>${esc(d.no)} · ${esc((TYPES[d.type]||TYPES.QT).name)}</b><small>${esc(d.cust.name||"-")} · ${thDate(d.date)} · ฿${fmt(d._total||0)}</small></div><div class="acts"><button class="btn sm main" data-op="${d.id}">เปิด</button><button class="btn sm ghost danger" data-dl="${d.id}">ลบ</button></div></div>`).join(""):`<p class="note">ยังไม่มีเอกสารที่บันทึกไว้</p>`;
    $$("[data-op]").forEach(b=>b.onclick=()=>{doc=JSON.parse(JSON.stringify(docs.find(d=>d.id===b.dataset.op)));dlg.close();renderAll()});
    $$("[data-dl]").forEach(b=>b.onclick=()=>{if(!confirm("ลบเอกสารนี้?"))return;const i=docs.findIndex(d=>d.id===b.dataset.dl);docs.splice(i,1);LS.set(K.docs,docs);draw($("#dq").value.toLowerCase())})};
  draw("");$("#dq").oninput=e=>draw(e.target.value.toLowerCase());
  $("#exp").onclick=()=>{const data={v:1,app:"edm-bill",seller,docs:LS.get(K.docs,[]),customers:LS.get(K.cust,[]),counter:LS.get(K.cnt,{})};const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:"application/json"}));a.download="สำรองข้อมูลบิล-"+today()+".json";a.click()};
  $("#imp").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{const d=JSON.parse(t);if(d.app!=="edm-bill")throw 0;if(!confirm("นำเข้าข้อมูลจากไฟล์? ข้อมูลเดิมในเครื่องนี้จะถูกแทนที่"))return;seller=d.seller||seller;LS.set(K.seller,seller);LS.set(K.docs,d.docs||[]);LS.set(K.cust,d.customers||[]);LS.set(K.cnt,d.counter||{});dlg.close();renderAll();toast("นำเข้าข้อมูลแล้ว ✓")}).catch(()=>toast("ไฟล์ไม่ถูกต้อง"))};
};
const dlg=$("#dlg");window.dlg=dlg;
function openDlg(t,h){$("#dlgTitle").textContent=t;$("#dlgBody").innerHTML=h;dlg.showModal()}
$$(".mtabs button").forEach(b=>b.onclick=()=>{$$(".mtabs button").forEach(x=>x.classList.toggle("on",x===b));const v=b.dataset.mt==="view";$("#previewWrap").classList.toggle("show",v);$("#editor").classList.toggle("hide",v);if(v)fitPaper()});
window.addEventListener("resize",fitPaper);
window.addEventListener("afterprint",()=>{if(!$(".mtabs button.on")||$(".mtabs button.on").dataset.mt==="edit")$("#previewWrap").classList.remove("show")});
window.__bill={calc,bahtText,get doc(){return doc}};
renderAll();
})();
</script>
