<style>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3000)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("บันทึกไม่ได้: พื้นที่ในเครื่องเต็ม");return false}}};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100, r4=n=>Math.round((n+Number.EPSILON)*10000)/10000;
const fmt=n=>r2(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>Math.round(n).toLocaleString("th-TH");
const fq=n=>(+n||0).toLocaleString("th-TH",{maximumFractionDigits:3});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const dayDiff=(a,b)=>Math.round((new Date(a+"T00:00:00Z")-new Date(b+"T00:00:00Z"))/864e5);
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const thD=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return +dd+" "+MS[+m-1]+" "+String(+y+543).slice(2)};
const ymLabel=ym=>{const[y,m]=ym.split("-").map(Number);return MONTHS[m-1]+" "+(y+543)};
const ymShift=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+String(m).padStart(2,"0")};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- ข้อมูลจากทุกระบบ (เก็บในเบราว์เซอร์เครื่องเดียวกัน) ---------- */
const KEY={acc:"edm_acc",bdocs:"edm_bill_docs",bseller:"edm_bill_seller",bcnt:"edm_bill_counter",bcust:"edm_bill_customers",sitems:"edm_stock_items",stx:"edm_stock_tx",scfg:"edm_stock_cfg",pay:"edm_pay_summary",ui:"edm_acc_ui"};
const ACC_DEF=()=>({accounts:[{id:"cash",name:"เงินสด",type:"cash",open:0},{id:"bank1",name:"บัญชีธนาคาร",type:"bank",open:0}],pay:[],pur:[],cash:[],cnt:{}});
let A,D;
function load(){A=Object.assign(ACC_DEF(),LS.get(KEY.acc,{}));
  D={docs:LS.get(KEY.bdocs,[]),seller:LS.get(KEY.bseller,{}),items:LS.get(KEY.sitems,[]),tx:LS.get(KEY.stx,[]),payroll:LS.get(KEY.pay,{})}}
const saveA=()=>LS.set(KEY.acc,A);
let ui=Object.assign({v:"home",ym:today().slice(0,7),arf:"open",bf:"all",bk:"",ck:"",apf:"open",apg:"doc"},LS.get(KEY.ui,{}));const svU=()=>LS.set(KEY.ui,ui);
load();
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){load();render()}});
window.addEventListener("storage",()=>{load();render()});

/* ---------- คำนวณเอกสาร (สูตรเดียวกับหน้าเปิดบิล) ---------- */
function calcDoc(d){const sub=r2((d.items||[]).reduce((a,it)=>a+r2(num(it.q)*num(it.p)-num(it.disc)),0));const after=r2(Math.max(0,sub-num(d.billDisc)));
  let vat=0,total=after,base=after;if(d.vat==="ex"){vat=r2(after*.07);total=r2(after+vat)}else if(d.vat==="in"){base=r2(after/1.07);vat=r2(after-base);total=after}
  const wht=r2(base*num(d.wht)/100);return{sub,base,vat,total,wht,net:r2(total-wht)}}
const calcPur=p=>calcDoc({items:(p.lines||[]).map(l=>({q:l.q,p:l.p})),vat:p.vat,wht:p.wht,billDisc:0});
const BT={QT:"ใบเสนอราคา",IV:"ใบแจ้งหนี้",IT:"ใบแจ้งหนี้/ใบกำกับภาษี",RC:"ใบเสร็จรับเงิน",TX:"ใบกำกับภาษี/ใบเสร็จ"};
const isInvoice=d=>d.type==="IV"||d.type==="IT";
const isCashSale=d=>(d.type==="IT"&&d.term==="cash")||d.type==="RC"||d.type==="TX";
// เอกสารรับเงินที่อ้างถึงใบแจ้งหนี้ (เช่น แปลง IV → TX ในหน้าเปิดบิล)
function receiptsFor(d){return D.docs.filter(x=>(x.type==="RC"||x.type==="TX")&&x.ref&&x.ref===d.no)}
function arInfo(d){const c=calcDoc(d);const pays=A.pay.filter(p=>p.dir==="in"&&p.docId===d.id);let got=r2(pays.reduce((a,p)=>a+num(p.amount)+num(p.wht),0));
  const rcs=receiptsFor(d).filter(r=>!pays.some(p=>p.rcDocId===r.id));let byDoc=0;rcs.forEach(r=>byDoc+=calcDoc(r).total);got=r2(Math.min(c.total,got+byDoc));
  const due=d.due||d.date,left=r2(c.total-got);const st=left<=0.009?"paid":got>0?"part":"open";const late=st!=="paid"?dayDiff(today(),due):0;
  return{c,got,left:Math.max(0,left),st,late,due,pays,rcs}}
// รายได้ที่รับรู้ = ใบแจ้งหนี้ + ใบเสร็จที่ไม่ได้อ้างถึงใบแจ้งหนี้ (ขายเงินสด)
function salesDocs(){const inv=new Set(D.docs.filter(isInvoice).map(d=>d.no));return D.docs.filter(d=>isInvoice(d)||((d.type==="RC"||d.type==="TX")&&!(d.ref&&inv.has(d.ref))))}
// ภาษีขาย: ใบกำกับภาษีที่ออกจริง (IT ของผู้จด VAT, TX)
function outputVatDocs(){return D.docs.filter(d=>(d.type==="TX"||(d.type==="IT"&&D.seller.vat))&&d.vat!=="none")}

/* ---------- สต๊อก: ต้นทุนขายตามต้นทุนถัวเฉลี่ย ---------- */
function stockCalc(){const S={};D.items.forEach(i=>S[i.id]={bal:0,avg:num(i.cost)});const cogs={};const sorted=D.tx.slice().sort((a,b)=>String(a.date).localeCompare(String(b.date))||(a.ts||0)-(b.ts||0));
  sorted.forEach(t=>{const s=S[t.pid];if(!s)return;const q=num(t.qty);const ym=String(t.date).slice(0,7);
    if(t.type==="in"){const c=num(t.cost)||s.avg;const nb=s.bal+q;s.avg=nb>0?r4((Math.max(s.bal,0)*s.avg+q*c)/(Math.max(s.bal,0)+q)):c;s.bal=r4(nb)}
    else if(t.type==="out"){cogs[ym]=(cogs[ym]||0)+q*s.avg;s.bal=r4(s.bal-q)}else s.bal=r4(s.bal+q)});
  let value=0;Object.values(S).forEach(s=>value+=Math.max(s.bal,0)*s.avg);return{S,cogs,value:r2(value)}}

/* ---------- ซื้อ: เข้าสต๊อก / ตั้งเจ้าหนี้ ---------- */
function purNo(date){const ym=(date||today()).slice(2,7).replace("-","");const k="PU"+ym;A.cnt[k]=(A.cnt[k]||0)+1;return k+"-"+String(A.cnt[k]).padStart(3,"0")}
function syncPurStock(p,remove){let T=LS.get(KEY.stx,[]);T=T.filter(t=>t.docId!==p.id);
  if(!remove&&p.kind==="stock"&&p.status==="received"){const now=Date.now();(p.lines||[]).forEach((l,k)=>{if(!l.pid||num(l.q)<=0)return;const cost=p.vat==="in"?r4(num(l.p)/1.07):num(l.p);
    T.push({id:"ta"+now.toString(36)+k,type:"in",date:p.recvDate||p.date,pid:l.pid,qty:num(l.q),cost,ref:p.no,party:p.sup.name,note:"",src:"acc",docId:p.id,ts:now+k})})}
  LS.set(KEY.stx,T);D.tx=T}
function apInfo(p){const c=calcPur(p);const paid=r2(A.pay.filter(x=>x.dir==="out"&&x.purId===p.id).reduce((a,x)=>a+num(x.amount)+num(x.wht),0));
  const left=Math.max(0,r2(c.total-paid));const st=p.status==="ordered"?"ordered":left<=0.009?"paid":paid>0?"part":"open";return{c,paid,left,st,late:st==="open"||st==="part"?dayDiff(today(),p.due||p.date):0}}
const NOT_EXP=["จ่ายเงินเดือน","ถอนใช้ส่วนตัว","ชำระภาษี","คืนเงินกู้","โอนระหว่างบัญชี"],NOT_INC=["เงินลงทุนเพิ่ม","เงินกู้ยืม","โอนระหว่างบัญชี"];
const EXP_CATS=["เงินเดือน / ค่าจ้าง","ประกันสังคม (ส่วนนายจ้าง)","ค่าเช่า","ค่าน้ำ-ไฟ","ค่าโทรศัพท์ / อินเทอร์เน็ต","ค่าขนส่ง","ค่าโฆษณา / การตลาด","วัสดุสิ้นเปลือง","ค่าซ่อมแซม","ค่าธรรมเนียม / บริการ","ค่าเดินทาง","ค่ารับรอง","ค่าใช้จ่ายอื่น"];
// หมวดที่นับเป็นต้นทุนขาย (ธุรกิจบริการ) ไม่ใช่ค่าใช้จ่ายดำเนินงาน
const COST_CATS=["ต้นทุนบริการ / ค่าจ้างเหมาช่วง","วัตถุดิบ / วัสดุใช้ในงาน"];const isCostP=p=>p.kind==="stock"||(p.kind==="expense"&&COST_CATS.includes(p.cat));

/* ---------- เงินสด-ธนาคาร ---------- */
function cashMoves(){const L=[];
  A.pay.forEach(p=>{let label="",party="";if(p.dir==="in"){const d=D.docs.find(x=>x.id===p.docId);label=(p.src==="bill"?"ขายเงินสด ":"รับชำระ ")+(d?d.no:"");party=d?d.cust.name:""}else{const pu=A.pur.find(x=>x.id===p.purId);label="จ่าย "+(pu?pu.no:"");party=pu?pu.sup.name:""}
    L.push({id:p.id,src:"pay",bill:p.src==="bill",date:p.date,acc:p.accId,amt:p.dir==="in"?num(p.amount):-num(p.amount),label,party,note:p.src==="bill"?(p.method||""):p.note||""})});
  A.cash.forEach(c=>L.push({id:c.id,src:"cash",date:c.date,acc:c.accId,amt:c.dir==="in"?num(c.amount):-num(c.amount),label:c.cat||(c.dir==="in"?"รายรับอื่น":"รายจ่ายอื่น"),party:"",note:c.note||""}));
  // ขายเงินสด (ใบเสร็จที่ไม่ได้อ้างใบแจ้งหนี้) ถือว่ารับเงินเข้าบัญชีเงินสดแล้ว ถ้ายังไม่ได้บันทึก
  return L.sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function balances(upto){const B={};A.accounts.forEach(a=>B[a.id]=num(a.open));cashMoves().forEach(m=>{if(upto&&m.date>upto)return;if(B[m.acc]!=null)B[m.acc]=r2(B[m.acc]+m.amt)});return B}

/* ---------- กำไรขาดทุนรายเดือน ---------- */
function pnl(ym,SC){SC=SC||stockCalc();
  let sales=0,salesN=0;salesDocs().forEach(d=>{if(String(d.date).startsWith(ym)){sales+=calcDoc(d).base;salesN++}});
  let svc=0;const exp={};
  A.pur.forEach(p=>{if(p.kind!=="expense"||p.status==="ordered"||!String(p.date).startsWith(ym))return;if(COST_CATS.includes(p.cat)){svc+=calcPur(p).base;return}exp[p.cat||"ค่าใช้จ่ายอื่น"]=r2((exp[p.cat||"ค่าใช้จ่ายอื่น"]||0)+calcPur(p).base)});
  let other=0;A.cash.forEach(c=>{if(!String(c.date).startsWith(ym))return;if(c.dir==="out"&&c.cat==="จ่ายเงินเดือน"&&!D.payroll[ym])exp["เงินเดือน / ค่าจ้าง"]=r2((exp["เงินเดือน / ค่าจ้าง"]||0)+num(c.amount));if(c.dir==="out"&&COST_CATS.includes(c.cat))svc+=num(c.amount);else if(c.dir==="out"&&!NOT_EXP.includes(c.cat))exp[c.cat||"ค่าใช้จ่ายอื่น"]=r2((exp[c.cat||"ค่าใช้จ่ายอื่น"]||0)+num(c.amount));if(c.dir==="in"&&!NOT_INC.includes(c.cat))other+=num(c.amount)});
  const pr=D.payroll[ym];const payroll=pr?r2(num(pr.earn)+num(pr.sso)):0; // เงินเดือนรวม + ประกันสังคมส่วนนายจ้าง
  let expT=0;Object.values(exp).forEach(v=>expT+=v);
  const cogs=r2((SC.cogs[ym]||0)+svc);sales=r2(sales);const gross=r2(sales-cogs);const net=r2(gross+other-expT-payroll);
  return{sales,salesN,cogs,gross,exp,expT:r2(expT),payroll,prN:pr?pr.n:0,other:r2(other),net}}

/* ---------- เจ้าหนี้ / จ่ายชำระ: ดูยอดหนี้ที่ต้องจ่าย และยอดที่จ่ายไปแล้ว ---------- */

const plabel=id=>{const i=D.items.find(x=>x.id===id);return i?(i.sku?i.sku+" · ":"")+i.name:""};

function taxData(ym){

  const whtIn=A.pay.filter(p=>p.dir==="in"&&num(p.wht)>0&&String(p.date).startsWith(ym)).map(p=>({p,d:D.docs.find(x=>x.id===p.docId)}));
  const whtOut=A.pay.filter(p=>p.dir==="out"&&num(p.wht)>0&&String(p.date).startsWith(ym)).map(p=>({p,u:A.pur.find(x=>x.id===p.purId)}));
  let ov=0,ob=0,iv=0,ib=0;out.forEach(x=>{ov+=x.c.vat;ob+=x.c.base});inp.forEach(x=>{iv+=x.c.vat;ib+=x.c.base});
