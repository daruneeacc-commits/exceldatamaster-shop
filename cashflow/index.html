function openBal(y){var s=0;for(var k in cfg.open)s+=+cfg.open[k]||0;
 tx.forEach(function(x){if(x.d&&+x.d.slice(0,4)<y&&+x.d.slice(0,4)>=(cfg.year||y))s+=sgn(x)});return s}
function calc(y,per){
 var C=cols(per,y),res={cols:C,cat:{},grp:{op:[],inv:[],fin:[]},tIn:[],tOut:[],net:[],open:[],close:[]};
 C.forEach(function(c,i){res.tIn[i]=0;res.tOut[i]=0;res.net[i]=0;["op","inv","fin"].forEach(function(g){res.grp[g][i]=0})});
 var Y=tx.filter(function(x){return inYear(x,y)&&x.t!=="tr"});
 Y.forEach(function(x){var m=mo(x),ci=per==="q"?Math.floor(m/3):m,c=cat(x.c),g=c?c.g:"op",v=sgn(x);
  if(!res.cat[x.c])res.cat[x.c]=C.map(function(){return 0});res.cat[x.c][ci]+=v;res.grp[g][ci]+=v;res.net[ci]+=v;if(v>=0)res.tIn[ci]+=v;else res.tOut[ci]+=-v});
 var ob=openBal(y);C.forEach(function(c,i){res.open[i]=ob;ob+=res.net[i];res.close[i]=ob});
 res.Y=Y;return res}
