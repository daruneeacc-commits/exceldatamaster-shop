<style>
:root{--ink:#1d2b36;--sub:#5d6c78;--line:#dfe6ec;--bg:#f4f7fa;--card:#fff;--brand:#2563a6;--brand2:#e8f0fa;--in:#1f8a4c;--inb:#e5f5ec;--out:#c2413b;--outb:#fdeceb;--op:#2563a6;--inv:#8a5cc2;--fin:#c27a1d;--f:"IBM Plex Sans Thai","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.hd{max-width:1280px;margin:0 auto;padding:0 16px;height:58px;display:flex;align-items:center;gap:12px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;text-decoration:none;color:inherit;min-width:0}
.logo i{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:grid;place-items:center;font-style:normal;font-size:19px;flex:none}
.logo span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo small{display:block;font-weight:500;color:var(--sub);font-size:12px}
.sp{flex:1}
.nav{display:flex;gap:4px}
.nav button{border:0;background:none;padding:8px 12px;border-radius:10px;font-weight:600;color:var(--sub);cursor:pointer;white-space:nowrap}
.nav button.on{background:var(--brand2);color:var(--brand)}
select.sm,.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;cursor:pointer;font-weight:600}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.g{background:var(--in);border-color:var(--in);color:#fff}
.btn.d{color:var(--out)}
.btn:disabled{opacity:.5;cursor:default}
main{max-width:1280px;margin:0 auto;padding:18px 16px 90px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar h1{font-size:22px;margin-right:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{font-size:16px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:5px solid var(--c,var(--brand));cursor:pointer}
.kpi small{color:var(--sub);font-size:13px;display:block}
.kpi b{font-size:22px;display:block;line-height:1.3}
.kpi em{font-style:normal;font-size:12px;color:var(--sub)}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table.cf{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.cf th,.cf td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:right}
.cf th:first-child,.cf td:first-child{text-align:left;position:sticky;left:0;background:inherit;z-index:1;min-width:210px}
.cf thead th{background:#eef3f8;font-weight:700;position:sticky;top:0;z-index:2}
.cf thead th:first-child{z-index:3}
.cf tr{background:#fff}
.cf tr.grp td{background:#f3f6fa;font-weight:700}
.cf tr.grp td:first-child{border-left:4px solid var(--gc)}
.cf tr.sub td{font-weight:700;background:#fafcfe}
.cf tr.tot td{font-weight:700;background:#eef3f8}
.cf tr.big td{font-weight:800;background:var(--brand2);color:var(--brand)}
.cf td.n{cursor:pointer}
.cf td.n:hover{background:#fff7d6;text-decoration:underline}
.cf td.z{color:#b6c0c8}
.cf .neg{color:var(--out)}
.cf td.lb{padding-left:26px}
.cf td.lb .tg{cursor:pointer;color:var(--sub);margin-left:-18px;width:16px;display:inline-block}
.cf tr.pty td{font-size:13px;color:var(--sub);background:#fcfdfe}
.cf tr.pty td:first-child{padding-left:44px}
.cf td.ck{font-weight:700}
.ok{color:var(--in)}.bad{color:var(--out)}
.hint{color:var(--sub);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;cursor:pointer;font-size:13.5px;font-weight:600}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.list .row{display:grid;grid-template-columns:96px 1fr auto auto;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.list .row:hover{background:#f8fafc}
.list .row b{font-weight:600}
.list .row small{display:block;color:var(--sub);font-size:12.5px}
.amt{font-weight:700;text-align:right}
.amt.in{color:var(--in)}.amt.out{color:var(--out)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:#eef3f8;color:var(--sub);margin-left:4px;font-weight:600}
.li input{border:1px solid var(--line);border-radius:8px;padding:6px 7px;background:#fff}.li td{padding:4px 3px!important;vertical-align:top}
.dtw{position:relative;display:flex}.dtw .dtx{flex:1;width:100%;padding-right:44px!important}.dtb{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;cursor:pointer;padding:4px 8px}.dtp{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none;border:0;padding:0}
dialog{margin:auto;border:0;border-radius:18px;padding:0;width:min(640px,94vw);max-height:90vh;box-shadow:0 30px 80px rgba(20,30,40,.35)}
dialog::backdrop{background:rgba(20,30,40,.45)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;position:sticky;top:0;background:#fff;z-index:2}
.dh h3{font-size:17px;flex:1}
.db{padding:16px 18px;overflow:auto;max-height:calc(90vh - 130px)}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;background:#fff;position:sticky;bottom:0}
.df .btn{min-width:110px;padding:10px 18px}.df .btn.p{min-width:160px;font-size:16px}.df #fDel{margin-right:0!important}
@media (max-width:600px){.df{flex-wrap:nowrap}.df .btn{min-width:0;flex:1;padding:10px 8px}.df .btn.p{flex:2;min-width:0}}
.x{border:0;background:#eef3f8;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:3px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfcfe}
.fg .full{grid-column:1/-1}
.tt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.tt button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;cursor:pointer}
.tt button.on.in{border-color:var(--in);background:var(--inb);color:var(--in)}
.tt button.on.out{border-color:var(--out);background:var(--outb);color:var(--out)}
.dt{width:100%;border-collapse:collapse;font-size:14px}
.dt th,.dt td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.dt td.r,.dt th.r{text-align:right;white-space:nowrap}
.dt tfoot td{font-weight:800;border-top:2px solid var(--ink)}
.dt tr.e{cursor:pointer}.dt tr.e:hover{background:#f8fafc}
.fab{position:fixed;right:20px;bottom:20px;width:60px;height:60px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:32px;box-shadow:0 12px 26px rgba(37,99,166,.4);cursor:pointer;z-index:15}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1d2b36;color:#fff;padding:10px 18px;border-radius:12px;opacity:0;transition:.2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
.ind input{width:110px;border:1px solid var(--line);border-radius:8px;padding:5px 7px;text-align:right;background:#fffef6}
.svgc{width:100%;height:auto;display:block}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin-top:6px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.empty{text-align:center;padding:40px 10px;color:var(--sub)}
.empty b{display:block;font-size:18px;color:var(--ink);margin-bottom:6px}
#rep{display:none}
.mtab{display:none}
@media (max-width:900px){
 .kpis{grid-template-columns:repeat(2,1fr)}.kpis .kpi:last-child{grid-column:1/-1}
 .g2{grid-template-columns:1fr}
 .nav{display:none}
 .mtab{display:flex;position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);z-index:14}
 .mtab button{flex:1;border:0;background:none;padding:8px 1px 10px;font-size:10px;min-width:0;white-space:nowrap;overflow:hidden;font-weight:600;color:var(--sub)}
 .mtab button b{display:block;font-size:20px}
 .mtab button.on{color:var(--brand)}
 .fab{bottom:78px}
 main{padding-bottom:150px}
 .fg{grid-template-columns:1fr}
 .cf th:first-child,.cf td:first-child{min-width:160px;max-width:180px;white-space:normal}
 .hd .lg2{display:none}
}
/* ===== report (print) ===== */
@media print{
 @page{size:A4 landscape;margin:10mm}
 body{background:#fff;font-size:11px}
 header.top,main,.fab,.mtab,dialog,.toast{display:none!important}
 #rep{display:block}
 .rp h1{font-size:18px}.rp .meta{color:#555;margin:2px 0 10px}
 .rp table{border-collapse:collapse;width:100%;font-size:10px;margin-bottom:12px}
 .rp th,.rp td{border:1px solid #ccd;padding:3px 5px;text-align:right;white-space:nowrap}
 .rp th:first-child,.rp td:first-child{text-align:left}
 .rp thead th{background:#e8eef5}
 .rp tr.grp td{background:#f1f4f8;font-weight:700}
 .rp tr.tot td,.rp tr.sub td{font-weight:700}
 .rp tr.big td{font-weight:800;background:#e8eef5}
 .rp h2{font-size:13px;margin:10px 0 4px}
 .rp .pb{break-before:page}
 .rp .kp{display:flex;gap:8px;margin-bottom:10px}
 .rp .kp div{border:1px solid #ccd;border-radius:6px;padding:4px 8px;flex:1}
 .rp .kp b{display:block;font-size:13px}
 .rp .sig{display:flex;justify-content:space-around;margin-top:24px;text-align:center}
 .rp .neg{color:#b00}
}
