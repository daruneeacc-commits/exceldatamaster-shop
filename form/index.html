  const o={sub,wht:wh,net:sub-wh};if(t.clear){o.adv=num(d.f.advRecv);o.diff=o.adv-sub}return o}
function blank(t){const last=D.filter(x=>x.tpl===t.id).sort((a,b)=>(b.ts||0)-(a.ts||0))[0],f={};
  (t.keep||[]).forEach(k=>{if(last&&last.f[k])f[k]=last.f[k]});if(t.id==="ce"||t.id==="mm"){}
  return{id:"",tpl:t.id,no:"",date:today(),lang:cfg.lang||"th",cur:cfg.cur||"THB",f,items:t.it?[{},{}]:[],pm:t.pay?"transfer":"",ts:0}}

function bodyText(d,l){const t=TP(d.tpl),v=k=>esc(fv(d,k))||"…………",co=esc(coName(l)),L=l==="bi"?"th":l,c=calc(d);
  const sal=fv(d,"salary")?money(num(d.f.salary),d.cur)+" "+CU(d.cur)[l==="en"?4:L==="th"?2:L==="ko"?6:7]:"";
  const S={
  sr:{th:`ข้าพเจ้า ${v("requester")} ตำแหน่ง ${v("pos")} ขอรับรองว่าได้จ่ายเงินในนาม ${co} ตามรายการข้างต้น ซึ่งไม่อาจเรียกใบเสร็จรับเงินจากผู้รับเงินได้ และเป็นการจ่ายเพื่อกิจการของบริษัทโดยแท้`,
      en:`I, ${v("requester")}, ${v("pos")}, certify that the above expenses were paid on behalf of ${co}, that receipts could not be obtained from the payees, and that the expenses were incurred solely for company business.`,
      ko:`본인 ${v("requester")}(${v("pos")})은(는) 위 금액을 ${co}을(를) 대신하여 지급하였으며, 수령인으로부터 영수증을 받을 수 없었고, 전적으로 회사 업무를 위한 지출임을 확인합니다.`,
      ja:`私 ${v("requester")}（${v("pos")}）は、上記の費用を${co}に代わって支払ったこと、受取人から領収書を入手できなかったこと、及び専ら会社業務のための支出であることを証明します。`},
  rc:{th:`ข้าพเจ้า ${v("receiver")} ได้รับเงินจาก ${co} ตามรายการข้างต้นไว้ถูกต้องครบถ้วนแล้ว`,en:`I, ${v("receiver")}, hereby acknowledge receipt of the above amount in full from ${co}.`,ko:`본인 ${v("receiver")}은(는) ${co}(으)로부터 위 금액을 정히 영수하였습니다.`,ja:`私 ${v("receiver")}は、${co}より上記金額を正に領収いたしました。`},
  ce:{th:`หนังสือฉบับนี้ให้ไว้เพื่อรับรองว่า ${v("empName")} เลขบัตรประชาชน ${v("idcard")} เป็นพนักงานของ ${co} ตำแหน่ง ${v("pos")} แผนก ${v("dept")} เริ่มปฏิบัติงานตั้งแต่วันที่ ${esc(dt(fv(d,"start"),"th"))||"…………"} จนถึงปัจจุบัน${sal?` ได้รับเงินเดือนเดือนละ ${sal} (${esc(words(num(d.f.salary),d.cur,"th"))})`:""}\n\nให้ไว้ ณ วันที่ ${esc(dt(d.date,"th"))} เพื่อใช้ประกอบ${v("purpose")}`,
      en:`This is to certify that ${v("empName")} (ID No. ${v("idcard")}) has been employed by ${co} as ${v("pos")}, ${v("dept")} Department, since ${esc(dt(fv(d,"start"),"en"))||"…………"} to the present.${sal?` The current monthly salary is ${sal} (${esc(words(num(d.f.salary),d.cur,"en"))}).`:""}\n\nThis certificate is issued on ${esc(dt(d.date,"en"))} for the purpose of ${v("purpose")}.`,
      ko:`위 사람 ${v("empName")}(신분증 번호 ${v("idcard")})은(는) ${esc(dt(fv(d,"start"),"ko"))||"…………"}부터 현재까지 ${co} ${v("dept")} 부서에서 ${v("pos")}(으)로 재직 중임을 증명합니다.${sal?` 현재 월급은 ${sal}(${esc(words(num(d.f.salary),d.cur,"ko"))})입니다.`:""}\n\n본 증명서는 ${v("purpose")} 용도로 ${esc(dt(d.date,"ko"))}에 발급합니다.`,
      ja:`${v("empName")}（身分証番号 ${v("idcard")}）は、${esc(dt(fv(d,"start"),"ja"))||"…………"}から現在まで、${co} ${v("dept")}部に${v("pos")}として在職していることを証明します。${sal?`現在の月給は${sal}（${esc(words(num(d.f.salary),d.cur,"ja"))}）です。`:""}\n\n本証明書は${v("purpose")}のため、${esc(dt(d.date,"ja"))}に発行します。`},
  pa:{th:`ข้าพเจ้า ${v("grantor")} ที่อยู่ ${v("gAddr")} ขอมอบอำนาจให้ ${v("grantee")} เลขบัตรประชาชน ${v("gid")} ที่อยู่ ${v("geAddr")} เป็นผู้มีอำนาจกระทำการแทนข้าพเจ้าในเรื่องดังต่อไปนี้\n${v("matters")}\n\nการใดที่ผู้รับมอบอำนาจได้กระทำไปภายในขอบเขตที่มอบอำนาจนี้ ให้ถือเสมือนว่าข้าพเจ้าได้กระทำด้วยตนเองทุกประการ${fv(d,"valid")?` หนังสือมอบอำนาจนี้มีผลถึงวันที่ ${esc(dt(d.f.valid,"th"))}`:""}`,
      en:`I/We, ${v("grantor")}, of ${v("gAddr")}, hereby authorize ${v("grantee")} (ID No. ${v("gid")}), of ${v("geAddr")}, to act on my/our behalf in the following matters:\n${v("matters")}\n\nAny act performed by the attorney within the scope of this authorization shall be deemed to have been performed by me/us in all respects.${fv(d,"valid")?` This power of attorney is valid until ${esc(dt(d.f.valid,"en"))}.`:""}`,
      ko:`본인 ${v("grantor")}(주소: ${v("gAddr")})은(는) ${v("grantee")}(신분증 번호 ${v("gid")}, 주소: ${v("geAddr")})에게 다음 사항에 관한 권한을 위임합니다.\n${v("matters")}\n\n수임인이 위임 범위 내에서 행한 모든 행위는 본인이 직접 행한 것으로 간주합니다.${fv(d,"valid")?` 본 위임장의 유효기간은 ${esc(dt(d.f.valid,"ko"))}까지입니다.`:""}`,
      ja:`私 ${v("grantor")}（住所：${v("gAddr")}）は、${v("grantee")}（身分証番号 ${v("gid")}、住所：${v("geAddr")}）を代理人と定め、下記の事項に関する権限を委任します。\n${v("matters")}\n\n代理人が本委任の範囲内で行った行為は、すべて私自身が行ったものとみなします。${fv(d,"valid")?`本委任状の有効期限は${esc(dt(d.f.valid,"ja"))}までとします。`:""}`}};
  const s=S[t.body];if(!s)return"";if(l==="bi")return s.th+'<span class="s2">'+s.en+"</span>";return s[l]}
function docHtml(d){const t=TP(d.tpl),l=d.lang||"th",c=calc(d),C=CU(d.cur),cc=d.cur;
  const lg=cfg.co.logo?`<img class="lg" src="${esc(cfg.co.logo)}" alt="">`:`<div class="lgt">${esc((coName("en")||"A").replace(/^(บริษัท|ห้างหุ้นส่วน(จำกัด)?|หจก\.?|บจก\.?)\s*/,"").trim().slice(0,1)||"A")}</div>`;
  const ttl=l==="bi"?`${esc(t.t[0])}`:esc(t.t[LI[l]]),sub=l==="th"||l==="en"?"":t.t[1];
  const meta=`<table class="mt"><tr><td>${w("no",l)}</td><td><b>${esc(d.no||"—")}</b></td></tr><tr><td>${w("date",l)}</td><td>${esc(dt(d.date,l))}</td></tr></table>`;
  let h=`<div class="doc ${l}" style="--dc:${esc(cfg.color||"#2E6F9E")}"><div class="hd"><div class="co">${lg}<div><b>${esc(coName(l))}</b><small>${esc(coAddr(l)||"")}</small><small>${cfg.co.tax?esc(wt("taxid",l==="bi"?"th":l))+" "+esc(cfg.co.tax):""}${cfg.co.phone?" · "+esc(wt("phone",l==="bi"?"th":l))+" "+esc(cfg.co.phone):""}</small></div></div><div><h1>${ttl}</h1>${l==="bi"||sub?`<div class="sub">${esc(t.t[1])}</div>`:""}${meta}</div></div>`;
  // ช่องข้อมูล
  const hideKV=new Set(["note","body","matters","whtPct","signer","sPos"].concat(t.memo?["pos"]:[]).concat(t.body==="pa"?["grantor","gAddr","grantee","gid","geAddr","valid"]:[]).concat(t.body==="ce"?["empName","idcard","pos","dept","start","salary","purpose"]:[]));
  const kv=t.f.filter(x=>!hideKV.has(x[0])&&!(t.memo&&x[0]==="body")).map(x=>{let v=fv(d,x[0]);if(!v)return null;if(x[1]==="d")v=dt(v,l);else if(x[1]==="m")v=money(num(v),cc)+" "+cc;else if(x[1]==="sel")v=x[4].map(o=>(o===v?"☑ ":"☐ ")+wt(o,l==="bi"?"th":l)).join("   ");return`<div class="${x[2]||x[1]==="sel"?"w2":""}"><span class="k">${w(x[0],l)}</span><span class="v">${esc(v)}</span></div>`}).filter(Boolean);
  if(kv.length)h+=`<div class="kv">${kv.join("")}</div>`;
  if(t.memo)h+=`<div class="body t">${esc(fv(d,"body"))}</div>`;
  // ตาราง
  if(t.it){const I=(d.items||[]).filter(r=>t.it.some(col=>String(r[col[0]]||"").trim()));const rows=I.length?I:[{}];
    const head=`<tr><th style="width:30px">#</th>${t.it.map(col=>`<th${col[2]?` style="width:${col[2]}px"`:""}>${w(col[0]==="amt"?"amount":col[0],l)}${col[1]==="m"||col[1]==="amt"?` (${cc})`:""}</th>`).join("")}</tr>`;
    const body=rows.map((r,i)=>`<tr><td class="c">${I.length?i+1:""}</td>${t.it.map(col=>{let v=r[col[0]];if(col[1]==="m"||col[1]==="amt")return`<td class="r">${v===""||v==null?"":money(num(v),cc)}</td>`;if(col[1]==="d")return`<td class="c">${esc(dt(v,l))}</td>`;if(col[1]==="n"||col[1]==="tm")return`<td class="c">${esc(v==null?"":v)}</td>`;return`<td>${esc(v==null?"":v).replace(/\n/g,"<br>")}</td>`}).join("")}</tr>`).join("");
    const pad=Array.from({length:Math.max(0,4-rows.length)},()=>`<tr><td style="height:24px"></td>${t.it.map(()=>"<td></td>").join("")}</tr>`).join("");
    const span=t.it.length,si=t.it.findIndex(col=>col[0]===t.sum);let tot="";
    if(t.sum==="hours")tot=`<tr class="tt"><td class="k" colspan="${si+1}">${w("totalHrs",l)}</td><td class="c">${c.sub}</td>${"<td></td>".repeat(span-si-1)}</tr>`;
    else{const row=(k,v)=>`<tr class="tt"><td class="k" colspan="${span}">${w(k,l)}</td><td class="r">${money(v,cc)}</td></tr>`;
      if(t.wht&&c.wht)tot=row("subtotal",c.sub)+`<tr class="tt"><td class="k" colspan="${span}">${w("wht",l)} ${num(d.f.whtPct)}%</td><td class="r">-${money(c.wht,cc)}</td></tr>`+row("net",c.net);else tot=row("total",c.sub);}
    h+=`<table class="it">${head}${body}${pad}${tot}</table>`;
    if(t.sum==="amount")h+=`<div class="wd"><b>${w("words",l)}:</b> ${esc(words(t.wht?c.net:c.sub,cc,l)).replace(/\n/g,"<br>")}</div>`;
    if(t.clear){const r=(k,v)=>`<div><span class="k">${w(k,l)}</span><span class="v">${money(v,cc)} ${cc}</span></div>`;h+=`<div class="kv">${r("advRecv",c.adv)}${r("spent",c.sub)}${c.diff>=0?r("refund",c.diff):r("extra",-c.diff)}</div>`}}
  if(t.body)h+=`<div class="body t">${bodyText(d,l)}</div>`;
  if(t.pay){const pm=d.pm||"";h+=`<div class="line"><span class="k">${w(t.pay==="pay"?"paidby":"recvby",l)}</span>${["cash","transfer","cheque"].map(k=>(pm===k?"☑ ":"☐ ")+w(k,l)).join(" &nbsp; ")}${fv(d,"bank")?` &nbsp;·&nbsp; ${w("bank",l)} ${esc(fv(d,"bank"))}`:""}${fv(d,"ref")?` &nbsp;·&nbsp; ${w("ref",l)} ${esc(fv(d,"ref"))}`:""}</div>`}
  if(fv(d,"note")&&t.f.some(x=>x[0]==="note"))h+=`<div class="line"><span class="k">${w("note",l)}</span>${esc(fv(d,"note")).replace(/\n/g,"<br>")}</div>`;
  const sg=t.sg||[];h+=`<div class="sg" style="grid-template-columns:repeat(${Math.min(sg.length,4)},1fr)">${sg.map(([lab,k])=>{const nm=fv(d,k);const ps=k==="signer"&&fv(d,t.id==="ce"?"sPos":"pos");return`<div><div class="ln"></div><div class="nm">(${nm?esc(nm):"......................................"})</div>${ps?`<div>${esc(ps)}</div>`:""}<b>${w(lab,l)}</b><div class="s2">${w("signDate",l)}</div></div>`}).join("")}</div>`;
  h+=`<div class="ft edm-brand">${esc(W.page[LI[l==="bi"?"th":l]])}</div></div>`;return h}

  <div class="ed"><div class="side" style="display:flex;flex-direction:column;gap:12px">
