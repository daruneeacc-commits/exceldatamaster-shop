      ko:`위 사람 ${v("empName")}(신분증 번호 ${v("idcard")})은(는) ${esc(dt(fv(d,"start"),"ko"))||"…………"}부터 현재까지 ${co} ${v("dept")} 부서에서 ${v("pos")}(으)로 재직 중임을 증명합니다.${sal?` 현재 월급은 ${sal}(${esc(words(num(d.f.salary),d.cur,"ko"))})입니다.`:""}\n\n본 증명서는 ${v("purpose")} 용도로 ${esc(dt(d.date,"ko"))}에 발급합니다.`,
      ja:`${v("empName")}（身分証番号 ${v("idcard")}）は、${esc(dt(fv(d,"start"),"ja"))||"…………"}から現在まで、${co} ${v("dept")}部に${v("pos")}として在職していることを証明します。${sal?`現在の月給は${sal}（${esc(words(num(d.f.salary),d.cur,"ja"))}）です。`:""}\n\n本証明書は${v("purpose")}のため、${esc(dt(d.date,"ja"))}に発行します。`},
  pa:{th:`ข้าพเจ้า ${v("grantor")} ที่อยู่ ${v("gAddr")} ขอมอบอำนาจให้ ${v("grantee")} เลขบัตรประชาชน ${v("gid")} ที่อยู่ ${v("geAddr")} เป็นผู้มีอำนาจกระทำการแทนข้าพเจ้าในเรื่องดังต่อไปนี้\n${v("matters")}\n\nการใดที่ผู้รับมอบอำนาจได้กระทำไปภายในขอบเขตที่มอบอำนาจนี้ ให้ถือเสมือนว่าข้าพเจ้าได้กระทำด้วยตนเองทุกประการ${fv(d,"valid")?` หนังสือมอบอำนาจนี้มีผลถึงวันที่ ${esc(dt(d.f.valid,"th"))}`:""}`,
      en:`I/We, ${v("grantor")}, of ${v("gAddr")}, hereby authorize ${v("grantee")} (ID No. ${v("gid")}), of ${v("geAddr")}, to act on my/our behalf in the following matters:\n${v("matters")}\n\nAny act performed by the attorney within the scope of this authorization shall be deemed to have been performed by me/us in all respects.${fv(d,"valid")?` This power of attorney is valid until ${esc(dt(d.f.valid,"en"))}.`:""}`,
      ko:`본인 ${v("grantor")}(주소: ${v("gAddr")})은(는) ${v("grantee")}(신분증 번호 ${v("gid")}, 주소: ${v("geAddr")})에게 다음 사항에 관한 권한을 위임합니다.\n${v("matters")}\n\n수임인이 위임 범위 내에서 행한 모든 행위는 본인이 직접 행한 것으로 간주합니다.${fv(d,"valid")?` 본 위임장의 유효기간은 ${esc(dt(d.f.valid,"ko"))}까지입니다.`:""}`,
      ja:`私 ${v("grantor")}（住所：${v("gAddr")}）は、${v("grantee")}（身分証番号 ${v("gid")}、住所：${v("geAddr")}）を代理人と定め、下記の事項に関する権限を委任します。\n${v("matters")}\n\n代理人が本委任の範囲内で行った行為は、すべて私自身が行ったものとみなします。${fv(d,"valid")?`本委任状の有効期限は${esc(dt(d.f.valid,"ja"))}までとします。`:""}`}};
  const sal2=fv(d,"salary")?money(num(d.f.salary),d.cur)+" "+d.cur:"";
  S.rs={th:`ข้าพเจ้า ${v("employee")} ตำแหน่ง ${v("pos")} แผนก ${v("dept")} ขอลาออกจากการเป็นพนักงานของ ${co} โดยมีผลตั้งแต่วันที่ ${esc(dt(fv(d,"last"),"th"))||"…………"} เป็นต้นไป เนื่องจาก${v("reason")}\n\nข้าพเจ้าจะส่งมอบงานและคืนทรัพย์สินของบริษัทให้เรียบร้อยก่อนวันมีผล และขอขอบคุณบริษัทที่ให้โอกาสร่วมงานตลอดมา`,
    en:`I, ${v("employee")}, ${v("pos")} of the ${v("dept")} Department, hereby resign from my employment with ${co}, effective ${esc(dt(fv(d,"last"),"en"))||"…………"}, due to ${v("reason")}.\n\nI will complete the handover of my work and return all company property before the effective date. Thank you for the opportunity to work with the company.`,
    ko:`본인 ${v("employee")}(${v("dept")} ${v("pos")})은(는) ${v("reason")}(으)로 인하여 ${esc(dt(fv(d,"last"),"ko"))||"…………"}부로 ${co}을(를) 사직하고자 합니다.\n\n사직일 전까지 업무 인수인계와 회사 자산 반납을 완료하겠습니다. 그동안 함께 일할 기회를 주셔서 감사합니다.`,
    ja:`私 ${v("employee")}（${v("dept")} ${v("pos")}）は、${v("reason")}のため、${esc(dt(fv(d,"last"),"ja"))||"…………"}付で${co}を退職いたしたく、ここにお届けいたします。\n\n退職日までに業務の引継ぎと会社資産の返却を完了いたします。これまでのご指導に心より感謝申し上げます。`};
  S.ol={th:`เรียน ${v("fullName")}\n\n${co} มีความยินดีเสนอจ้างท่านในตำแหน่ง ${v("pos")} แผนก ${v("dept")} เริ่มงานวันที่ ${esc(dt(fv(d,"start"),"th"))||"…………"} อัตราเงินเดือน ${sal2||"…………"} ต่อเดือน ระยะทดลองงาน ${v("prob")} วัน${fv(d,"benefit")?` สวัสดิการ: ${v("benefit")}`:""}\n\nหากท่านตกลงรับข้อเสนอนี้ กรุณาลงนามตอบรับและส่งกลับภายในวันที่ ${esc(dt(fv(d,"replyBy"),"th"))||"…………"}`,
    en:`Dear ${v("fullName")},\n\n${co} is pleased to offer you the position of ${v("pos")} in the ${v("dept")} Department, starting on ${esc(dt(fv(d,"start"),"en"))||"…………"}, with a monthly salary of ${sal2||"…………"} and a probation period of ${v("prob")} days.${fv(d,"benefit")?` Benefits: ${v("benefit")}.`:""}\n\nIf you accept this offer, please sign below and return this letter by ${esc(dt(fv(d,"replyBy"),"en"))||"…………"}.`,
    ko:`${v("fullName")} 님께\n\n${co}은(는) 귀하를 ${v("dept")} 부서 ${v("pos")}(으)로 채용하고자 합니다. 입사일은 ${esc(dt(fv(d,"start"),"ko"))||"…………"}, 월급은 ${sal2||"…………"}, 수습 기간은 ${v("prob")}일입니다.${fv(d,"benefit")?` 복리후생: ${v("benefit")}.`:""}\n\n본 제안을 수락하시면 ${esc(dt(fv(d,"replyBy"),"ko"))||"…………"}까지 서명하여 회신해 주시기 바랍니다.`,
    ja:`${v("fullName")} 様\n\n${co}は、貴殿を${v("dept")}部 ${v("pos")}として採用することを決定いたしましたので通知いたします。入社日は${esc(dt(fv(d,"start"),"ja"))||"…………"}、月給は${sal2||"…………"}、試用期間は${v("prob")}日です。${fv(d,"benefit")?`福利厚生：${v("benefit")}。`:""}\n\n本内容をご承諾いただける場合は、${esc(dt(fv(d,"replyBy"),"ja"))||"…………"}までに署名のうえご返送ください。`};
  const s=S[t.body];if(!s)return"";if(l==="bi")return s.th+'<span class="s2">'+s.en+"</span>";return s[l]}
function docHtml(d){const t=TP(d.tpl),l=d.lang||"th",c=calc(d),C=CU(d.cur),cc=d.cur;
  const lg=cfg.co.logo?`<img class="lg" src="${esc(cfg.co.logo)}" alt="">`:`<div class="lgt">${esc((coName("en")||"A").replace(/^(บริษัท|ห้างหุ้นส่วน(จำกัด)?|หจก\.?|บจก\.?)\s*/,"").trim().slice(0,1)||"A")}</div>`;
  const ttl=l==="bi"?`${esc(t.t[0])}`:esc(t.t[LI[l]]),sub=l==="th"||l==="en"?"":t.t[1];
  const meta=`<table class="mt">${t.noNo?"":`<tr><td>${w("no",l)}</td><td><b>${esc(d.no||"—")}</b></td></tr>`}<tr><td>${w("date",l)}</td><td>${esc(dt(d.date,l))}</td></tr></table>`;
  let h=t.noHead?`<div class="doc ${l}" style="--dc:${esc(cfg.color||"#2E6F9E")}"><div class="hd nh"><div><h1>${ttl}</h1>${l==="bi"||sub?`<div class="sub">${esc(t.t[1])}</div>`:""}${meta}</div></div>`:`<div class="doc ${l}" style="--dc:${esc(cfg.color||"#2E6F9E")}"><div class="hd"><div class="co">${lg}<div><b>${esc(coName(l))}</b><small>${esc(coAddr(l)||"")}</small><small>${cfg.co.tax?esc(wt("taxid",l==="bi"?"th":l))+" "+esc(cfg.co.tax):""}${cfg.co.phone?" · "+esc(wt("phone",l==="bi"?"th":l))+" "+esc(cfg.co.phone):""}</small></div></div><div><h1>${ttl}</h1>${l==="bi"||sub?`<div class="sub">${esc(t.t[1])}</div>`:""}${meta}</div></div>`;
  // ช่องข้อมูล
  const hideKV=new Set(["note","body","matters","whtPct","vatPct","signer","sPos"].concat(t.hide||[]).concat(t.memo?["pos"]:[]).concat(t.body==="pa"?["grantor","gAddr","grantee","gid","geAddr","valid"]:[]).concat(t.body==="ce"?["empName","idcard","pos","dept","start","salary","purpose"]:[]));
  const kv=t.f.filter(x=>!hideKV.has(x[0])&&!(t.memo&&x[0]==="body")).map(x=>{let v=fv(d,x[0]);if(!v)return null;if(x[1]==="d")v=dt(v,l);else if(x[1]==="m")v=money(num(v),cc)+" "+cc;else if(x[1]==="sel")v=x[4].map(o=>(o===v?"☑ ":"☐ ")+wt(o,l==="bi"?"th":l)).join("   ");return`<div class="${x[2]||x[1]==="sel"?"w2":""}"><span class="k">${w(x[0],l)}</span><span class="v">${esc(v)}</span></div>`}).filter(Boolean);
  if(kv.length)h+=`<div class="kv">${kv.join("")}</div>`;
  if(t.memo)h+=`<div class="body t">${esc(fv(d,"body"))}</div>`;
  // ตาราง
  if(t.it){const I=(d.items||[]).filter(r=>t.it.some(col=>String(r[col[0]]||"").trim()));const rows=I.length?I:[{}];
    const head=`<tr><th style="width:30px">#</th>${t.it.map(col=>`<th${col[2]?` style="width:${col[2]}px"`:""}>${w(col[0]==="amt"?"amount":col[0],l)}${col[1]==="m"||col[1]==="amt"?` (${cc})`:""}</th>`).join("")}</tr>`;
    const body=rows.map((r,i)=>`<tr><td class="c">${I.length?i+1:""}</td>${t.it.map(col=>{let v=r[col[0]];if(col[1]==="m"||col[1]==="amt")return`<td class="r">${v===""||v==null?"":money(num(v),cc)}</td>`;if(col[1]==="d")return`<td class="c">${esc(dt(v,l))}</td>`;if(col[1]==="n"||col[1]==="tm")return`<td class="c">${esc(v==null?"":v)}</td>`;return`<td>${esc(v==null?"":v).replace(/\n/g,"<br>")}</td>`}).join("")}</tr>`).join("");
    const pad=Array.from({length:Math.max(0,4-rows.length)},()=>`<tr><td style="height:24px"></td>${t.it.map(()=>"<td></td>").join("")}</tr>`).join("");
    const span=t.it.length,si=t.it.findIndex(col=>col[0]===t.sum);let tot="";
    if(t.sum&&t.sum!=="amount")tot=`<tr class="tt"><td class="k" colspan="${si+1}">${w(t.sumL||"totalHrs",l)}</td><td class="c">${c.sub}</td>${"<td></td>".repeat(span-si-1)}</tr>`;
    else if(t.sum){const row=(k,v)=>`<tr class="tt"><td class="k" colspan="${span}">${w(k,l)}</td><td class="r">${money(v,cc)}</td></tr>`;
      if(t.vat)tot=row("subtotal",c.sub)+`<tr class="tt"><td class="k" colspan="${span}">${w("vat",l)} ${num(d.f.vatPct==null||d.f.vatPct===""?7:d.f.vatPct)}%</td><td class="r">${money(c.vat,cc)}</td></tr>`+row("grand",c.net);
      else if(t.wht&&c.wht)tot=row("subtotal",c.sub)+`<tr class="tt"><td class="k" colspan="${span}">${w("wht",l)} ${num(d.f.whtPct)}%</td><td class="r">-${money(c.wht,cc)}</td></tr>`+row("net",c.net);else tot=row("total",c.sub);}
    h+=`<table class="it">${head}${body}${pad}${tot}</table>`;
    if(t.sum==="amount")h+=`<div class="wd"><b>${w("words",l)}:</b> ${esc(words(t.wht||t.vat?c.net:c.sub,cc,l)).replace(/\n/g,"<br>")}</div>`;
    if(t.clear){const r=(k,v)=>`<div><span class="k">${w(k,l)}</span><span class="v">${money(v,cc)} ${cc}</span></div>`;h+=`<div class="kv">${r("advRecv",c.adv)}${r("spent",c.sub)}${c.diff>=0?r("refund",c.diff):r("extra",-c.diff)}</div>`}}
  if(t.body)h+=`<div class="body t">${bodyText(d,l)}</div>`;
  if(t.pay){const pm=d.pm||"";h+=`<div class="line"><span class="k">${w(t.pay==="pay"?"paidby":"recvby",l)}</span>${["cash","transfer","cheque"].map(k=>(pm===k?"☑ ":"☐ ")+w(k,l)).join(" &nbsp; ")}${fv(d,"bank")?` &nbsp;·&nbsp; ${w("bank",l)} ${esc(fv(d,"bank"))}`:""}${fv(d,"ref")?` &nbsp;·&nbsp; ${w("ref",l)} ${esc(fv(d,"ref"))}`:""}</div>`}
  if(fv(d,"note")&&t.f.some(x=>x[0]==="note"))h+=`<div class="line"><span class="k">${w("note",l)}</span>${esc(fv(d,"note")).replace(/\n/g,"<br>")}</div>`;
  const sg=t.sg||[];h+=`<div class="sg" style="grid-template-columns:repeat(${Math.min(sg.length,4)},1fr)">${sg.map(([lab,k])=>{const nm=fv(d,k);const ps=k==="signer"&&fv(d,t.id==="ce"?"sPos":"pos");return`<div><div class="ln"></div><div class="nm">(${nm?esc(nm):"......................................"})</div>${ps?`<div>${esc(ps)}</div>`:""}<b>${w(lab,l)}</b><div class="s2">${w("signDate",l)}</div></div>`}).join("")}</div>`;
  h+=`<div class="ft edm-brand">${esc(W.page[LI[l==="bi"?"th":l]])}</div></div>`;return h}

  <label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="cpDt"${c.dt?" checked":""}> ใส่วันที่วันนี้</label>
  <div class="f"><label>สีปากกา</label><div class="chips" id="cpC">${Object.keys(CP_C).map(k=>`<button class="chip${c.col===k?" on":""}" data-c="${k}"><span style="color:${CP_C[k]}">●</span> ${{blue:"น้ำเงิน",black:"ดำ",red:"แดง"}[k]}</button>`).join("")}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn main" id="cpPdf">📄 PDF / ส่ง / พิมพ์</button><button class="btn ghost" id="cpPng">🖼️ บันทึกเป็นรูป</button></div>
  <p class="note" style="margin:0">พิมพ์แล้วเซ็นชื่อจริงบนเส้น "ลงชื่อ" ก่อนส่งทุกครั้ง</p>

function cpList(){const L=$("#cpL");if(L)L.innerHTML=CPI.map((x,i)=>`<span class="chip" style="display:inline-flex;gap:6px;align-items:center">รูป ${i+1}<button class="btn sm ghost" data-r="${i}" title="หมุน">⟳</button><button class="btn sm ghost danger" data-x="${i}" title="เอาออก">✕</button></span>`).join("")}
async function cpDraw(){const cv=$("#cpCv");if(!cv)return;const c=cpCfg(),g=cv.getContext("2d"),W=1240,H=1754,col=CP_C[c.col]||CP_C.blue,F='"IBM Plex Sans Thai","Noto Sans Thai",Tahoma,sans-serif';
  try{await document.fonts.load('700 40px "IBM Plex Sans Thai"')}catch(e){}
  g.setTransform(1,0,0,1,0,0);g.fillStyle="#fff";g.fillRect(0,0,W,H);
  if(!CPI.length){g.fillStyle="#9aa6a1";g.font=`600 34px ${F}`;g.textAlign="center";g.fillText("เลือกรูปเอกสารทางซ้าย 📷",W/2,H/2-60);g.font=`28px ${F}`;g.fillText("รูปอยู่ในเครื่องนี้เท่านั้น ไม่ส่งขึ้นระบบ",W/2,H/2);}
  const top=90,bot=1330,slot=(bot-top)/Math.max(1,CPI.length),line1="ใช้สำหรับ"+(c.x||"……………………………")+" เท่านั้น",line2=c.two?"ห้ามนำไปใช้เพื่อการอื่น":"";
  CPI.forEach((p,i)=>{const r=p.rot%180!==0,iw=r?p.cv.height:p.cv.width,ih=r?p.cv.width:p.cv.height,k=Math.min(1000/iw,(slot-40)/ih),w=iw*k,h=ih*k,x=(W-w)/2,y=top+i*slot+(slot-h)/2;
    g.save();g.translate(x+w/2,y+h/2);g.rotate(p.rot*Math.PI/180);const dw=r?h:w,dh=r?w:h;g.drawImage(p.cv,-dw/2,-dh/2,dw,dh);g.restore();
    g.strokeStyle="rgba(0,0,0,.15)";g.lineWidth=1;g.strokeRect(x,y,w,h);
    // ขีดคร่อม 2 เส้นขนานตามแนวทแยง พร้อมข้อความระหว่างเส้น
    const ang=-Math.atan2(h,w),len=Math.hypot(w,h),gap=Math.max(70,Math.min(130,Math.min(w,h)*.22))*(line2?1.25:1);
    g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.translate(x+w/2,y+h/2);g.rotate(ang);g.strokeStyle=col;g.lineWidth=5;g.lineCap="round";
    [-gap/2,gap/2].forEach(o=>{g.beginPath();g.moveTo(-len*.6,o);g.lineTo(len*.6,o);g.stroke()});
    g.fillStyle=col;g.textAlign="center";g.textBaseline="middle";const lines=line2?[line1,line2]:[line1];let fs=Math.min(gap*(line2?.3:.5),46);
    g.font=`700 ${fs}px ${F}`;const mw=Math.max(...lines.map(t=>g.measureText(t).width));if(mw>len*.85){fs*=len*.85/mw;g.font=`700 ${fs}px ${F}`}
