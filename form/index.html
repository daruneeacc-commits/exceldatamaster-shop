function cpList(){const L=$("#cpL");if(L)L.innerHTML=CPI.map((x,i)=>`<span class="chip" style="display:inline-flex;gap:6px;align-items:center">รูป ${i+1}<button class="btn sm ghost" data-r="${i}" title="หมุน">⟳</button><button class="btn sm ghost danger" data-x="${i}" title="เอาออก">✕</button></span>`).join("")}
