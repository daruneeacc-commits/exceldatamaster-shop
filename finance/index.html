<style>
:root{color-scheme:light;--bg:#F6F8FC;--card:#fff;--ink:#26303D;--muted:#6B7584;--line:#E2E7F0;--grid:#E8ECF4;--a:#5B7DB8;--a-ink:#fff;--a2:#EAF0FA;--a3:#C9D8F0;
  --in:#6FA8DC;--inbg:#DDEBF8;--out:#A88BD0;--outbg:#ECE4F7;--pf:#4FAF83;--pfbg:#DCF2E6;--neg:#D64C5B;--negbg:#FDE6E9;--yel:#FCEBB0;--yel2:#FFF7DA;--pink:#F9D2DE;--ok:#2E8B57}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}[hidden]{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1220px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:6px;color:var(--a)}.brand small{font-weight:500;color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--a2);color:var(--ink);font-size:.88rem;min-height:38px}
.btn.main{background:var(--a);color:var(--a-ink)}.btn.buy{background:#FFE08A;color:#4A3B12}.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.btn.sm{padding:4px 10px;font-size:.82rem;min-height:32px}.btn.danger{color:var(--neg)}
.ic{width:1.35em;height:1.35em;flex:none;vertical-align:-.3em;display:inline-block}.ic.s{width:1.15em;height:1.15em;vertical-align:-.22em}.brand .ic{width:1.6em;height:1.6em}.stabs .ic{width:1.6em;height:1.6em}
main{max-width:1220px;margin:0 auto;padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
/* หัวแผ่นงาน: ป้ายแบบในเทมเพลต */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:4px 16px;font-size:1.25rem;font-weight:700;box-shadow:3px 3px 0 var(--yel);margin:0}
.tag small{font-size:.8rem;font-weight:500;color:var(--muted);margin-left:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.card h2{font-size:.95rem;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.card h2.cap{background:var(--inbg);margin:-14px -14px 12px;padding:8px 14px;border-radius:10px 10px 0 0;justify-content:center;font-weight:600}
.card h2.cap.o{background:var(--outbg)}.card h2.cap.p{background:var(--pfbg)}.card h2.cap.y{background:var(--yel)}.card h2.cap.k{background:var(--pink)}
.muted{color:var(--muted)}.small{font-size:.82rem}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;color:var(--muted);min-height:34px}
.seg button.on{background:var(--a);color:#fff}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pick select,.pick input,.fld{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
/* stabs แบบแท็บ Excel */
.stabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#F3F2F1;border-top:1px solid #D6D4D2;display:flex;gap:2px;padding:0 8px env(safe-area-inset-bottom,0px);overflow-x:auto;scrollbar-width:none}
.stabs button{flex:none;border:0;background:transparent;padding:10px 16px;font-weight:600;cursor:pointer;color:#555;border-bottom:3px solid transparent;min-height:46px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.stabs button.on{background:#fff;color:var(--a);border-bottom-color:var(--a)}
/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-left:5px solid var(--a3)}
.kpi span{font-size:.82rem;color:var(--muted)}.kpi b{display:block;font-size:1.35rem;line-height:1.25;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.kpi small{font-size:.76rem;color:var(--muted)}
.kpi.in{border-left-color:var(--in)}.kpi.out{border-left-color:var(--out)}.kpi.pf{border-left-color:var(--pf)}.kpi.pf b{color:var(--pf)}.kpi.neg b{color:var(--neg)}.kpi.neg{border-left-color:var(--neg)}.kpi.mg{border-left-color:#E8C468}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px}
.donut{width:168px;height:168px;border-radius:50%;margin:6px auto 4px;display:grid;place-items:center;background:conic-gradient(var(--dc,var(--pf)) calc(var(--p)*1%),var(--a2) 0)}
.donut div{width:120px;height:120px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;line-height:1.15}.donut b{font-size:1.6rem}.donut small{color:var(--muted);font-size:.78rem}
.split{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:.86rem}.split div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:2px 0}
.split b{font-variant-numeric:tabular-nums}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 46px 108px;gap:8px;align-items:center;font-size:.86rem}
.bar .tr{height:14px;background:var(--a2);border-radius:4px;overflow:hidden}.bar .tr i{display:block;height:100%;border-radius:4px}
.bar .v{text-align:right;font-weight:600}.bar .amt{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px;vertical-align:0}
.goal{display:flex;flex-direction:column;gap:8px}.goal .tr{height:16px;background:var(--a2);border-radius:999px;overflow:hidden}.goal .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--in),var(--pf));border-radius:999px}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-bottom:4px}.lg span{display:inline-flex;align-items:center;gap:5px}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg.chart{width:100%;height:auto;display:block;font-size:11px;fill:var(--muted)}
/* ตารางสรุป */
.tw{overflow-x:auto;border:1px solid var(--grid);border-radius:8px;background:var(--card)}
table.st{border-collapse:collapse;width:100%;font-size:.88rem;font-variant-numeric:tabular-nums}
.st th{background:var(--inbg);font-weight:600;padding:7px 8px;text-align:right;white-space:nowrap}.st th:first-child,.st td:first-child{text-align:left}
.st td{border-top:1px solid var(--grid);padding:6px 8px;text-align:right;white-space:nowrap}
.st tfoot td{background:var(--a2);font-weight:700}.st .neg{color:var(--neg)}.st .pos{color:var(--pf)}
.st.o th{background:var(--outbg)}.st.y th{background:var(--yel)}.st.p th{background:var(--pfbg)}.st.k th{background:var(--pink)}
.st tr.sub td{background:#FAFBFD;font-weight:600}
/* ตารางกรอกแบบ Excel */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
.filters input[type=search]{flex:1;min-width:150px}
.sums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--yel2);border:1px solid #F1DE9C;border-radius:10px;padding:8px 12px}
.sums div{font-size:.8rem;color:var(--muted)}.sums b{display:block;font-size:1.05rem;color:var(--ink);font-variant-numeric:tabular-nums}
table.sh{border-collapse:collapse;width:100%;min-width:1480px;font-size:.9rem}
.sh th{background:var(--inbg);font-weight:600;padding:8px 6px;text-align:left;white-space:nowrap;position:sticky;top:0;z-index:1}
.sh.o th{background:var(--outbg)}
.sh td{border-top:1px solid var(--grid);border-left:1px solid var(--grid);padding:0;height:40px;vertical-align:middle}
.sh td:first-child{border-left:0}.sh tr:nth-child(even) td{background:#FBFCFE}
.sh .ix{width:38px;text-align:center;color:var(--muted);font-size:.78rem;background:#FAFAFA!important}
.sh input.cell,.sh select.cell{width:100%;border:0;background:transparent;padding:8px;min-height:40px;outline:none;border-radius:0}
.sh input.cell:focus,.sh select.cell:focus{box-shadow:inset 0 0 0 2px var(--a);background:#fff}
.sh select.cell{cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.sh input.num{text-align:right;font-variant-numeric:tabular-nums}
.sh .net{text-align:right;padding:0 8px;font-weight:700;white-space:nowrap;background:#F7FBF9!important;font-variant-numeric:tabular-nums}
.sh .dt{position:relative;min-width:104px}.sh .dt span{display:block;padding:8px;white-space:nowrap}
.sh .dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.sh .del{width:40px;text-align:center}.sh .del button{border:0;background:none;cursor:pointer;color:#bbb;font-size:1rem;min-width:36px;min-height:36px}.sh .del button:hover{color:var(--neg)}
.sh tr.new td{background:#FFFDF2!important}.sh tr.new input::placeholder{color:#B59A55}
.empty{padding:22px;text-align:center;color:var(--muted)}
/* ตั้งค่า */
.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .r{display:flex;gap:6px;align-items:center}.lst .r input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.lst .r input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.goals{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.goals label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:2px}.goals input{border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px;text-align:right;width:100%}
.banner{background:var(--yel2);color:#7A5B00;border:1px solid #F1DE9C;border-radius:10px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner .btn{background:var(--card)}
.info{background:var(--a2);border-radius:10px;padding:10px 12px;font-size:.86rem;line-height:1.6}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:16px;display:flex;flex-direction:column;gap:10px}.dlg h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--a)}
.dlg .fg{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dlg label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted)}.dlg label.w{grid-column:1/-1}
.dlg .fld{width:100%;color:var(--ink);font-size:.95rem}
.dlg .pv{background:var(--pfbg);border-radius:10px;padding:8px 12px;display:flex;justify-content:space-between;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;z-index:70;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast button{border:0;background:none;color:var(--a3);font-weight:700;cursor:pointer;padding:0}
@media (max-width:900px){.g3{grid-template-columns:1fr}.lists{grid-template-columns:1fr 1fr}.goals{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:640px){.kpis,.sums{grid-template-columns:1fr 1fr}.g2{grid-template-columns:1fr}.lists{grid-template-columns:1fr}.goals{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) 40px;}.bar .amt{display:none}
  .top .brand small{display:none}.kpi b{font-size:1.1rem}.tag{font-size:1.05rem}
  .stabs{padding-left:0;padding-right:0;gap:0}.stabs button{flex:1 1 0;padding:8px 2px;font-size:.8rem;min-width:0;flex-direction:column;gap:0}.stabs .ic{width:1.4em;height:1.4em}
  .dlg .fg{grid-template-columns:1fr}}
/* ทุกธุรกิจ: กระเป๋าเงิน · บันทึกเร็ว · พาย */
.fab{position:fixed;right:18px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:35;width:58px;height:58px;border-radius:50%;border:0;background:var(--a);color:#fff;font-size:2rem;line-height:1;box-shadow:0 8px 24px rgba(91,125,184,.45);cursor:pointer;display:grid;place-items:center}
.fab:active{transform:scale(.95)}
.wals{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.wal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:5px solid var(--wc,var(--a3))}
.wal .wn{font-weight:600;font-size:.9rem}.wal b{font-size:1.35rem;font-variant-numeric:tabular-nums}.wal b.neg{color:var(--neg)}.wal small{font-size:.76rem;color:var(--muted)}
.wal label{display:flex;align-items:center;gap:6px;margin-top:4px}.wal input{width:110px;border:1px solid var(--line);border-radius:6px;padding:3px 6px;text-align:right}
.wstrip{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.84rem}.wstrip button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;font-variant-numeric:tabular-nums}
.wstrip button b{font-weight:700}.wstrip .neg{color:var(--neg)}
.cb{display:flex;gap:14px;align-items:flex-start}.cb .bars{flex:1;min-width:0}
.pie{width:118px;height:118px;border-radius:50%;flex:none;display:grid;place-items:center}.pie i{width:64px;height:64px;border-radius:50%;background:var(--card)}
.recent{display:flex;flex-direction:column}.recent button{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;border:0;border-bottom:1px dashed var(--line);background:none;padding:7px 2px;text-align:left;cursor:pointer;font-size:.88rem}
.recent button:hover{background:var(--a2)}.recent .rd{color:var(--muted);font-size:.78rem}.recent .rt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.recent .rt small{display:block;color:var(--muted);font-size:.74rem}.recent .ra{font-weight:700;font-variant-numeric:tabular-nums}.ra.in{color:var(--pf)}.ra.out{color:var(--neg)}
.qt{display:grid!important;grid-template-columns:1fr 1fr}.qt button.on[data-qt="in"]{background:var(--pf)}.qt button.on[data-qt="out"]{background:var(--neg)}
.fld.big{font-size:2rem;font-weight:700;text-align:right;padding:8px 12px;font-variant-numeric:tabular-nums}
.cchips{display:flex;flex-wrap:wrap;gap:6px}.cchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:.84rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.cchip::before{content:"";width:9px;height:9px;border-radius:3px;background:var(--cc)}.cchip.on{border-color:var(--cc);background:color-mix(in srgb,var(--cc) 20%,#fff);font-weight:700}
.dlg details.more summary{cursor:pointer;font-size:.84rem;color:var(--muted)}.dlg details.more[open] summary{margin-bottom:8px}
.biz{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.biz button{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.biz button b{font-size:.92rem}.biz button small{font-size:.74rem;color:var(--muted);line-height:1.35}.biz button.on,.biz button:hover{border-color:var(--a);background:var(--a2)}
.recl{display:flex;flex-direction:column;gap:6px}.recl div{display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px dashed var(--line);padding:4px 0;font-size:.88rem}
.ix .rr{display:block;color:var(--a);font-size:.8rem}
.dlg label.chk{flex-direction:row;align-items:center;gap:8px;font-size:.88rem;color:var(--ink);background:var(--a2);border-radius:10px;padding:8px 10px;cursor:pointer}.dlg label.chk input{width:18px;height:18px;flex:none;accent-color:var(--a)}
@media (max-width:640px){.cb{flex-direction:column;align-items:center}.cb .bars{width:100%}.fab{right:14px;width:54px;height:54px}}
#printArea{display:none}
@media print{body{background:#fff}header.top,main,.stabs,.toast,dialog,.edm-bar,.edm-gate,.edm-chip{display:none!important}#printArea{display:block}}
.pr{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:#000;font-size:9.5pt;background:#fff}.pr h1{font-size:14pt;margin:0}.pr h2{font-size:11pt;margin:12px 0 4px}
.pr .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px}
.pr table{width:100%;border-collapse:collapse}.pr th,.pr td{border:1px solid #999;padding:3px 5px;text-align:right;vertical-align:top}.pr th{background:#eee}.pr td:first-child,.pr th:first-child,.pr .l{text-align:left}.pr tr{page-break-inside:avoid}
</style>

function agg(from,to){const r={in:0,out:0,vin:0,vout:0,win:0,wout:0,nin:0,nout:0,ci:{},co:{},cnt:0};

function nice(x){const p=Math.pow(10,Math.floor(Math.log10(x||1))),f=x/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function chart(labels,series,line,o){o=o||{};const sm=(window.innerWidth||1000)<640,W=sm?360:640,H=sm?Math.round((o.h||250)*.82):(o.h||250),L=sm?38:48,R=10,T=12,B=30,pw=W-L-R,ph=H-T-B,n=labels.length||1;
  const vals=[].concat(...series.map(s=>s.v),line?line.v:[]).filter(v=>v!=null);let mx=Math.max(0,...vals),mn=Math.min(0,...vals);if(mx===mn)mx=mn+100;
  const step=nice((mx-mn)/4);mx=Math.ceil(mx/step)*step;mn=Math.floor(mn/step)*step;const y=v=>T+ph-(v-mn)/(mx-mn)*ph;
  const gw=pw/n,bw=Math.min(26,gw*.78/series.length);let g="",b="",ln="";
  for(let k=0;k<=Math.round((mx-mn)/step);k++){const v=mn+k*step;g+=`<line x1="${L}" x2="${W-R}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="${Math.abs(v)<1e-9?"#9AA4B4":"#E6EAF2"}"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end">${fk(v)}</text>`}
  series.forEach((s,si)=>s.v.forEach((v,k)=>{const x=L+gw*k+gw/2-bw*series.length/2+bw*si,y0=y(0),y1=y(v);if(!v)return;
    b+=`<rect x="${(x+1).toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${Math.max(bw-2,1).toFixed(1)}" height="${Math.max(Math.abs(y1-y0),1).toFixed(1)}" rx="3" fill="${s.c}"><title>${esc(labels[k])} · ${esc(s.n)} ${fb(v)}</title></rect>`}));
  if(line){const P=line.v.map((v,k)=>v==null?null:[L+gw*k+gw/2,y(v),k]).filter(Boolean);ln=`<polyline points="${P.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ")}" fill="none" stroke="${line.c}" stroke-width="2.5" stroke-linejoin="round"/>`+P.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.5" fill="#fff" stroke="${line.c}" stroke-width="2"><title>${esc(labels[p[2]])} · ${esc(line.n)} ${fb(line.v[p[2]])}</title></circle>`).join("")}
  const ev=Math.ceil(n/((o.maxL||12)*(sm?.5:1))),xl=labels.map((t,k)=>k%ev?"":`<text x="${(L+gw*k+gw/2).toFixed(1)}" y="${H-10}" text-anchor="middle">${esc(t)}</text>`).join("");
  const lg=series.concat(line?[line]:[]).map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join("");
  return`<div class="lg">${lg}</div><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||"กราฟ")}">${g}${b}${ln}${xl}</svg>`}
function donut(r){const p=Math.max(0,Math.min(100,r.mg));return`<div class="donut" style="--p:${p};--dc:${r.pf<0?"var(--neg)":"var(--pf)"}"><div><b style="color:${r.pf<0?"var(--neg)":"var(--pf)"}">${r.mg}%</b><small>อัตรากำไร</small></div></div>
  <div class="split"><div><span><i class="dot" style="background:${C.in}"></i>รายได้</span><b>${fb(r.in)}</b></div><div><span><i class="dot" style="background:${C.out}"></i>ค่าใช้จ่าย</span><b>${fb(r.out)}</b></div><div><span><i class="dot" style="background:${r.pf<0?"var(--neg)":C.pf}"></i>${r.pf<0?"ขาดทุน":"กำไร"}</span><b style="color:${r.pf<0?"var(--neg)":"var(--pf)"}">${fb(r.pf)}</b></div></div>`}
function kpis(r,goal){return`<div class="kpis"><div class="kpi in"><span>รายได้</span><b>${fb(r.in)}</b>${goal?`<small>เป้า ${fb(goal)} · ทำได้ ${pct(r.in,goal)}%</small>`:`<small>${r.cnt} รายการ</small>`}</div><div class="kpi out"><span>ค่าใช้จ่าย</span><b>${fb(r.out)}</b><small>${pct(r.out,r.in)}% ของรายได้</small></div><div class="kpi pf ${r.pf<0?"neg":""}"><span>${r.pf<0?"ขาดทุน":"กำไร"}</span><b>${fb(r.pf)}</b><small>รายได้ − ค่าใช้จ่าย</small></div><div class="kpi mg"><span>อัตรากำไร</span><b>${r.mg}%</b><small>กำไร ÷ รายได้</small></div></div>`}
const colOf=(cats,n)=>(cats.find(c=>c.n===n)||{}).c||"#B8B8C8";
function pie(L,map,cats,total){let a=0;const seg=L.map(n=>{const s=a;a+=map[n]/total*100;return`${colOf(cats,n)} ${s.toFixed(2)}% ${a.toFixed(2)}%`});return`<div class="pie" style="background:conic-gradient(${seg.join(",")||"var(--a2) 0 100%"})" role="img" aria-label="สัดส่วน"><i></i></div>`}
function catCard(title,map,cats,total,cls){const L=Object.keys(map).sort((a,b)=>map[b]-map[a]);
  return`<div class="card"><h2 class="cap ${cls||""}">${title}</h2>${L.length?`<div class="cb">${total>0?pie(L,map,cats,total):""}<div class="bars">${L.map(n=>`<div class="bar"><span class="nm" title="${esc(n)}"><i class="dot" style="background:${colOf(cats,n)}"></i>${esc(n)}</span><span class="tr"><i style="width:${pct(map[n],total)}%;background:${colOf(cats,n)}"></i></span><span class="v">${pct(map[n],total)}%</span><span class="amt">${fb(map[n])}</span></div>`).join("")}</div></div><div class="split"><div><span>รวม</span><b>${fb(total)}</b></div></div>`:`<div class="empty small">ยังไม่มีรายการในช่วงนี้</div>`}</div>`}
function walStrip(to,label){if(!cfg.chans.length)return"";return`<div class="wstrip"><span class="muted">${label}</span>${cfg.chans.map(ch=>{const b=balOf(ch,to);return`<button type="button" data-go="wal"><i class="dot" style="background:${colW(ch)}"></i>${esc(ch)} <b class="${b<0?"neg":""}">${fb(b)}</b></button>`}).join("")}<span>รวม <b>${fb(balAll(to))}</b></span></div>`}
function tagCard(from,to){if(!cfg.tags.length)return"";const T={};live().forEach(i=>{if(i.d<from||i.d>to)return;const k=i.tag||"ไม่ระบุ",o=T[k]||(T[k]={in:0,out:0});o[i.t==="in"?"in":"out"]+=calc(i).a});const L=Object.keys(T).sort((a,b)=>(T[b].in-T[b].out)-(T[a].in-T[a].out));if(!L.length)return"";
  return`<div class="card"><h2 class="cap p">กำไรแยกตาม${esc(cfg.tagName)}</h2><div class="tw"><table class="st p"><thead><tr><th>${esc(cfg.tagName)}</th><th>รายได้</th><th>ค่าใช้จ่าย</th><th>กำไร / ขาดทุน</th><th>อัตรากำไร</th></tr></thead><tbody>${L.map(k=>{const x=T[k],p=r2(x.in-x.out);return`<tr><td>${esc(k)}</td>${td(r2(x.in))}${td(r2(x.out))}${td(p,p>0?"pos":"")}<td>${x.in?pct(p,x.in)+"%":"-"}</td></tr>`}).join("")}</tbody></table></div></div>`}
function recentCard(from,to){const L=live().filter(i=>i.d>=from&&i.d<=to).sort((a,b)=>b.d.localeCompare(a.d)||(b.c||0)-(a.c||0)).slice(0,7);
  return`<div class="card"><h2 class="cap k">รายการล่าสุด<button class="btn sm" data-go="out" type="button">ดูทั้งหมด</button></h2>${L.length?`<div class="recent">${L.map(i=>{const c=calc(i);return`<button type="button" data-edit="${i.id}"><span class="rd">${thD(i.d)}</span><span class="rt">${esc(i.item||i.cat||"-")}<small>${esc(i.cat||"")}${i.tag?" · "+esc(i.tag):""}${i.ch?" · "+esc(i.ch):""}</small></span><span class="ra ${i.t}">${i.t==="in"?"+":"−"}${fm(c.n)}</span></button>`}).join("")}</div>`:`<div class="empty small">ยังไม่มีรายการเดือนนี้ · กดปุ่ม + มุมขวาล่างเพื่อบันทึก</div>`}</div>`}
function goalCard(inc,g,label){if(!g)return`<div class="card"><h2>${ic("target","s")} เป้ารายได้${label}</h2><p class="small muted" style="margin:0">ยังไม่ได้ตั้งเป้า · ตั้งได้ที่แท็บ <button class="btn sm" data-go="set" type="button">ตั้งค่า</button></p></div>`;
  const p=pct(inc,g);return`<div class="card goal"><h2>${ic("target","s")} เป้ารายได้${label}<span class="small muted">${fb(inc)} / ${fb(g)}</span></h2><div class="tr"><i style="width:${Math.min(100,p)}%"></i></div><div class="small">${p>=100?`<b style="color:var(--pf)">ถึงเป้าแล้ว ${p}%</b> เกินเป้า ${fb(inc-g)} 🎉`:`ทำได้ <b>${p}%</b> · ขาดอีก <b>${fb(g-inc)}</b>`}</div></div>`}
const td=(v,cls)=>`<td class="${cls||""}${v<0?" neg":""}">${fb(v)}</td>`;
function sumTable(rows,tot,G,head){return`<div class="tw"><table class="st"><thead><tr><th>${head||"เดือน"}</th><th>รายได้</th><th>ค่าใช้จ่าย</th><th>กำไร / ขาดทุน</th><th>อัตรากำไร</th><th>เป้ารายได้</th><th>% ของเป้า</th></tr></thead><tbody>${rows.map(([l,x,g])=>`<tr><td>${esc(l)}</td>${td(x.in)}${td(x.out)}${td(x.pf,x.pf>0?"pos":"")}<td>${x.in?x.mg+"%":"-"}</td><td>${g?fb(g):"-"}</td><td>${g?pct(x.in,g)+"%":"-"}</td></tr>`).join("")}</tbody><tfoot><tr><td>รวม</td>${td(tot.in)}${td(tot.out)}${td(tot.pf)}<td>${tot.in?tot.mg+"%":"-"}</td><td>${G?fb(G):"-"}</td><td>${G?pct(tot.in,G)+"%":"-"}</td></tr></tfoot></table></div>`}
function catYearTable(title,key,cats,cols,cls){const names=new Set(cats.map(c=>c.n));cols.forEach(c=>Object.keys(c.x[key]).forEach(n=>names.add(n)));const L=[...names].filter(n=>cols.some(c=>c.x[key][n]));
  if(!L.length)return`<div class="card"><h2 class="cap ${cls}">${title}</h2><div class="empty small">ยังไม่มีรายการ</div></div>`;
  return`<div class="card"><h2 class="cap ${cls}">${title}</h2><div class="tw"><table class="st ${cls}"><thead><tr><th>หมวดหมู่</th>${cols.map(c=>`<th>${esc(c.l)}</th>`).join("")}<th>รวม</th><th>เฉลี่ย</th></tr></thead><tbody>${L.map(n=>{const v=cols.map(c=>c.x[key][n]||0),s=v.reduce((a,b)=>a+b,0);return`<tr><td><i class="dot" style="background:${colOf(cats,n)}"></i>${esc(n)}</td>${v.map(x=>`<td>${x?fb(x):"-"}</td>`).join("")}<td><b>${fb(s)}</b></td><td>${fb(s/cols.length)}</td></tr>`}).join("")}</tbody></table></div></div>`}

  return head+({m:vDashM,y:vDashY,"5":vDash5,c:vDashC}[ui.mode]||vDashM)()}
function vDashM(){const ym=ui.ym,[f,t]=mRange(ym),r=agg(f,t),g=goalM(ym),y=+ym.slice(0,4),m=+ym.slice(5,7),nd=new Date(y,m,0).getDate();
  const di=Array(nd).fill(0),dout=Array(nd).fill(0);live().forEach(i=>{if(i.d<f||i.d>t)return;(i.t==="in"?di:dout)[+i.d.slice(8)-1]+=calc(i).a});

  ${kpis(r,g)}${walStrip(t,"ยอดเงินคงเหลือ ณ สิ้นเดือน:")}<div class="g3"><div class="card"><h2 class="cap p">สัดส่วนกำไร</h2>${donut(r)}</div><div class="card"><h2 class="cap y">รายได้ & ค่าใช้จ่ายรายวัน · ${esc(ymL(ym))}</h2>${chart(di.map((_,k)=>String(k+1)),[{n:"รายได้",c:C.in,v:di},{n:"ค่าใช้จ่าย",c:C.out,v:dout}],null,{maxL:16,title:"รายวัน"})}</div></div>
  <div class="g2">${catCard("รายได้ตามหมวดหมู่",r.ci,cfg.inCats,r.in)}${catCard("ค่าใช้จ่ายตามหมวดหมู่",r.co,cfg.outCats,r.out,"o")}</div>${tagCard(f,t)}<div class="g2">${recentCard(f,t)}${goalCard(r.in,g,"เดือนนี้")}</div>`}
function vDashY(){const y=ui.fyY??curFY(),M=fyMonths(y),[f,t]=fyRange(y),r=agg(f,t),rows=M.map(ym=>{const[a,b]=mRange(ym);return{ym,x:agg(a,b),g:goalM(ym)}}),G=rows.reduce((s,q)=>s+q.g,0);

  ${kpis(r,G)}${walStrip(t,"ยอดเงินคงเหลือ ณ สิ้นปีบัญชี:")}<div class="g3"><div class="card"><h2 class="cap p">สัดส่วนกำไรทั้งปี</h2>${donut(r)}</div><div class="card"><h2 class="cap y">รายได้ ค่าใช้จ่าย และกำไรรายเดือน</h2>${chart(M.map(ymS),[{n:"รายได้",c:C.in,v:rows.map(q=>q.x.in)},{n:"ค่าใช้จ่าย",c:C.out,v:rows.map(q=>q.x.out)}],{n:"กำไร",c:C.pf,v:rows.map(q=>q.ym>today().slice(0,7)?null:q.x.pf)},{title:"รายเดือน"})}</div></div>

  <div class="g2">${catCard("รายได้ตามหมวดหมู่ทั้งปี",r.ci,cfg.inCats,r.in)}${catCard("ค่าใช้จ่ายตามหมวดหมู่ทั้งปี",r.co,cfg.outCats,r.out,"o")}</div>${tagCard(f,t)}
  <div class="card"><h2 class="cap y">กระแสเงินสด · เงินเข้า−ออกจริง และยอดคงเหลือรวม</h2>${chart(M.map(ymS),[{n:"เงินเข้า−ออกสุทธิ",c:C.in,v:rows.map(q=>r2(q.x.nin-q.x.nout))}],{n:"ยอดคงเหลือรวม",c:C.pf,v:M.map(ym=>ym>today().slice(0,7)?null:balAll(mRange(ym)[1]))},{title:"กระแสเงินสด"})}<p class="small muted" style="margin:6px 0 0">เงินเข้า−ออกสุทธิ = รับสุทธิ − จ่ายสุทธิ (รวม VAT หักภาษี ณ ที่จ่ายแล้ว) · ยอดคงเหลือรวมทุกกระเป๋าเงิน</p></div>${goalCard(r.in,G,"ทั้งปี")}`}
function vDash5(){const y0=ui.y5??curFY()-4,Ys=[0,1,2,3,4].map(k=>y0+k),cols=Ys.map(y=>{const[a,b]=fyRange(y);return{y,l:String(y+543),x:agg(a,b),g:fyMonths(y).reduce((s,ym)=>s+goalM(ym),0)}});

  <div class="card"><h2 class="cap">ภาพรวมทุกปี</h2>${sumTable(cols.map(c=>[cfg.fy===1?"ปี "+c.l:fyLabel(c.y),c.x,c.g]),tot,G,"ปี")}</div>
  ${catYearTable("รายได้ตามหมวดหมู่ 5 ปี","ci",cfg.inCats,cols,"")}${catYearTable("ค่าใช้จ่ายตามหมวดหมู่ 5 ปี","co",cfg.outCats,cols,"o")}`}
function cmpDef(){const t=today(),ym=t.slice(0,7),pm=(()=>{const x=new Date(+ym.slice(0,4),+ym.slice(5,7)-2,1);return x.getFullYear()+"-"+pad(x.getMonth()+1)})(),ly=(+ym.slice(0,4)-1)+ym.slice(4);return[mRange(ym),mRange(pm),mRange(ly)].map(([f,t])=>({f,t}))}
function vDashC(){if(!Array.isArray(ui.cmp)||ui.cmp.length!==3)ui.cmp=cmpDef();const P=ui.cmp.map((p,k)=>({k,f:p.f,t:p.t,l:p.f&&p.t?thD(p.f)+" – "+thD(p.t):"ช่วงที่ "+(k+1),x:p.f&&p.t&&p.f<=p.t?agg(p.f,p.t):null}));const V=P.filter(p=>p.x);

  const tot=r2(W.reduce((s,w)=>s+w.b,0)),M=Array.from({length:12},(_,k)=>{const x=new Date(+ym.slice(0,4),+ym.slice(5,7)-12+k,1);return x.getFullYear()+"-"+pad(x.getMonth()+1)});
  const TR=items.filter(x=>x.t==="tr").sort((a,b)=>(b.d||"").localeCompare(a.d||"")||(b.c||0)-(a.c||0));
  return`${demoBanner()}<div class="head"><h1 class="tag">กระเป๋าเงิน<small>ยอดคงเหลือทุกบัญชี</small></h1><button class="btn main" id="trBtn" type="button">⇄ โอนระหว่างบัญชี</button></div>
  <div class="kpis"><div class="kpi pf ${tot<0?"neg":""}"><span>เงินคงเหลือรวม</span><b>${fb(tot)}</b><small>${cfg.chans.length} บัญชี</small></div><div class="kpi in"><span>เงินเข้าเดือนนี้</span><b>${fb(r2(W.reduce((s,w)=>s+w.i,0)))}</b><small>รับสุทธิทุกบัญชี</small></div><div class="kpi out"><span>เงินออกเดือนนี้</span><b>${fb(r2(W.reduce((s,w)=>s+w.o,0)))}</b><small>จ่ายสุทธิทุกบัญชี</small></div><div class="kpi mg"><span>โอนระหว่างบัญชี</span><b>${TR.length}</b><small>รายการทั้งหมด</small></div></div>
  <div class="wals">${W.map(w=>`<div class="wal" style="--wc:${colW(w.ch)}"><div class="wn">${esc(w.ch)}</div><b class="${w.b<0?"neg":""}">${fb(w.b)}</b><small>เดือนนี้ เข้า ${fb(w.i)} · ออก ${fb(w.o)}</small><label class="small muted">ยอดยกมา <input data-open="${esc(w.ch)}" inputmode="decimal" value="${num(cfg.open[w.ch])?fm(num(cfg.open[w.ch])):""}" placeholder="0.00" aria-label="ยอดยกมา ${esc(w.ch)}"></label></div>`).join("")}</div>
  <div class="card"><h2 class="cap y">ยอดคงเหลือรวม 12 เดือนล่าสุด</h2>${chart(M.map(ymS),[{n:"เงินเข้า−ออกสุทธิ",c:C.in,v:M.map(m=>{const x=agg(...mRange(m));return r2(x.nin-x.nout)})}],{n:"ยอดคงเหลือรวม",c:C.pf,v:M.map(m=>balAll(mRange(m)[1]))},{title:"ยอดคงเหลือ"})}</div>
  <div class="card"><h2 class="cap">ประวัติการโอนระหว่างบัญชี${TR.length>15?`<button class="btn sm" id="trAll" type="button">${ui.trAll?"แสดงล่าสุด 15":"ดูทั้งหมด "+TR.length}</button>`:""}</h2>${TR.length?`<div class="tw"><table class="st"><thead><tr><th>วันที่</th><th style="text-align:left">จาก</th><th style="text-align:left">ไป</th><th>จำนวน</th><th style="text-align:left">หมายเหตุ</th><th></th></tr></thead><tbody>${(ui.trAll?TR:TR.slice(0,15)).map(x=>`<tr><td>${thD(x.d)}</td><td style="text-align:left">${esc(x.ch)}</td><td style="text-align:left">${esc(x.ch2)}</td><td>${fb(num(x.amt))}</td><td style="text-align:left">${esc(x.note||"")}</td><td><button class="btn sm ghost danger" data-trdel="${x.id}" type="button" aria-label="ลบ">✕</button></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty small">ยังไม่มีการโอน · เช่น ฝากเงินสดเข้าธนาคาร หรือจ่ายบัตรเครดิต</div>`}</div>
  <p class="small muted" style="margin:0">ยอดคงเหลือ = ยอดยกมา + รับสุทธิ − จ่ายสุทธิ ± โอน · เพิ่ม/เปลี่ยนชื่อบัญชีได้ที่ <button class="btn sm" data-go="set" type="button">ตั้งค่า</button></p>`}
function bindWal(){$$("[data-open]").forEach(el=>el.onchange=()=>{if(!can())return render();const v=r2(num(el.value));if(v)cfg.open[el.dataset.open]=v;else delete cfg.open[el.dataset.open];svCfg();render();toast("บันทึกยอดยกมาแล้ว")});
  $$("[data-trdel]").forEach(b=>b.onclick=()=>{if(!can())return;const k=items.findIndex(x=>x.id===b.dataset.trdel);if(k<0)return;const it=items.splice(k,1)[0];sv();render();toast("ลบแล้ว",()=>{items.splice(k,0,it);sv();render()})});
  const ta=$("#trAll");if(ta)ta.onclick=()=>{ui.trAll=!ui.trAll;svUi();render()};
  $("#trBtn").onclick=trDlg;bindCommon()}
function trDlg(){if(!can())return;if(cfg.chans.length<2){toast("เพิ่มกระเป๋าเงินอย่างน้อย 2 บัญชีก่อน (ตั้งค่า)");return}
  openDlg(`<h3>โอนระหว่างบัญชี<button class="btn sm ghost" data-x type="button" aria-label="ปิด">✕</button></h3><input class="fld big" id="tAmt" inputmode="decimal" placeholder="0.00" aria-label="จำนวนเงิน">
   <div class="fg"><label>จาก<select class="fld" id="tFrom">${opts(cfg.chans,cfg.chans[0])}</select></label><label>ไป<select class="fld" id="tTo">${opts(cfg.chans,cfg.chans[1])}</select></label><label>วันที่<input class="fld" type="date" id="tD" value="${today()}"></label><label>หมายเหตุ<input class="fld" id="tNote" placeholder="เช่น ฝากเงินสดเข้าบัญชี"></label></div>
   <p class="small muted" style="margin:0">การโอนไม่นับเป็นรายได้หรือค่าใช้จ่าย แค่ย้ายเงินระหว่างบัญชี</p><div class="row" style="justify-content:flex-end"><button class="btn ghost" data-x type="button">ยกเลิก</button><button class="btn main" id="tSave" type="button">บันทึกการโอน</button></div>`);
  setTimeout(()=>$("#tAmt").focus(),60);
  $("#tSave").onclick=()=>{const a=r2(num($("#tAmt").value)),f=$("#tFrom").value,t=$("#tTo").value;if(!(a>0)){toast("ใส่จำนวนเงินก่อน");return}if(f===t){toast("เลือกบัญชีต้นทางและปลายทางให้ต่างกัน");return}
    items.push({id:uid(),t:"tr",d:$("#tD").value||today(),ch:f,ch2:t,amt:a,note:$("#tNote").value.trim(),c:Date.now()});sv();closeDlg();render();toast("โอน "+fb(a)+" จาก "+f+" ไป "+t+" แล้ว")}}
function bizDlg(after){openDlg(`<h3>ธุรกิจของคุณเป็นแบบไหน?<button class="btn sm ghost" data-x type="button" aria-label="ปิด">✕</button></h3><p class="small muted" style="margin:0">ระบบจะตั้งหมวดหมู่รายรับ-รายจ่ายที่เหมาะให้ แก้เพิ่มเองได้ทีหลัง</p>
   <div class="biz">${Object.entries(BT).map(([k,b])=>`<button type="button" data-bt="${k}" class="${cfg.biz===k?"on":""}"><b>${b.n}</b><small>${b.d}</small></button>`).join("")}</div>`);
  $$("[data-bt]").forEach(b=>b.onclick=()=>{const t=BT[b.dataset.bt];cfg.biz=b.dataset.bt;cfg.inCats=mkCats(t.i);cfg.outCats=mkCats(t.o);cfg.tagName=t.tag;svCfg();closeDlg();if(after)after();render();toast("ตั้งหมวดหมู่สำหรับ "+t.n+" แล้ว")})}

function vTax(){const y=ui.taxY??curFY(),M=fyMonths(y),rows=M.map(ym=>{const[a,b]=mRange(ym);return{ym,x:agg(a,b)}}),tot=agg(...fyRange(y));
  const cells=(f,cls)=>rows.map(q=>{const v=f(q.x);return`<td class="${v<0?"neg":cls||""}">${v?fm(v):"-"}</td>`}).join("")+`<td class="${f(tot)<0?"neg":""}"><b>${fm(f(tot))}</b></td>`;
  const net=tot.vin-tot.vout;
  return`${demoBanner()}<div class="head"><h1 class="tag">รายงานภาษี<small>${esc(fyLabel(y))}</small></h1><div class="pick"><select id="pTax" aria-label="ปี">${yOpts(y)}</select></div></div>
  <div class="kpis"><div class="kpi in"><span>ภาษีขาย (VAT) ทั้งปี</span><b>${fb(tot.vin)}</b></div><div class="kpi out"><span>ภาษีซื้อ (VAT) ทั้งปี</span><b>${fb(tot.vout)}</b></div><div class="kpi ${net>0?"neg":"pf"}"><span>${net>0?"VAT ต้องชำระ":"VAT ชำระเกิน / ขอคืน"}</span><b>${fb(Math.abs(net))}</b><small>ภาษีขาย − ภาษีซื้อ</small></div><div class="kpi mg"><span>ถูกหัก ณ ที่จ่าย (เครดิตภาษี)</span><b>${fb(tot.win)}</b><small>นำไปหักตอนยื่นภาษีเงินได้</small></div></div>
  <div class="card"><h2 class="cap y">ภาษีขาย − ภาษีซื้อ รายเดือน</h2>${chart(M.map(ymS),[{n:"ภาษีขาย",c:C.vin,v:rows.map(q=>q.x.vin)},{n:"ภาษีซื้อ",c:C.vout,v:rows.map(q=>q.x.vout)}],{n:"ส่วนต่าง",c:"#D64C5B",v:rows.map(q=>q.ym>today().slice(0,7)?null:r2(q.x.vin-q.x.vout))},{h:220,title:"ภาษีรายเดือน"})}</div>
  <div class="card"><h2 class="cap k">ภาษีมูลค่าเพิ่ม (ภ.พ.30)</h2><div class="tw"><table class="st k"><thead><tr><th></th>${M.map(ym=>`<th>${ymS(ym)}</th>`).join("")}<th>รวม</th></tr></thead><tbody>
   <tr><td>ภาษีขาย</td>${cells(x=>x.vin)}</tr><tr><td>ภาษีซื้อ</td>${cells(x=>x.vout)}</tr><tr class="sub"><td>ส่วนต่าง (+ ชำระ / − เครดิต)</td>${cells(x=>r2(x.vin-x.vout))}</tr></tbody></table></div></div>
  <div class="card"><h2 class="cap">ภาษีหัก ณ ที่จ่าย</h2><div class="tw"><table class="st"><thead><tr><th></th>${M.map(ym=>`<th>${ymS(ym)}</th>`).join("")}<th>รวม</th></tr></thead><tbody>
   <tr><td>ลูกค้าหักเรา (เครดิตภาษี)</td>${cells(x=>x.win)}</tr><tr><td>เราหักผู้ขาย (ต้องนำส่ง ภ.ง.ด.3 / 53)</td>${cells(x=>x.wout)}</tr></tbody></table></div></div>
  <div class="info">ตัวเลขคำนวณจากช่อง VAT และหัก ณ ที่จ่ายที่กรอกในแต่ละรายการ ใช้ประกอบการยื่นแบบและวางแผนภาษี · ยอดจริงที่ต้องยื่นให้ยึดตามใบกำกับภาษีและหนังสือรับรองการหักภาษี ณ ที่จ่าย</div>`}
function bindTax(){$("#pTax").onchange=e=>{ui.taxY=+e.target.value;svUi();render()};bindCommon()}

const OBJ=k=>k==="inCats"||k==="outCats";
function lst(k,label,hint){const L=cfg[k],obj=OBJ(k);return`<div class="card lst"><h2>${label}</h2>${L.map((v,j)=>`<div class="r">${obj?`<input type="color" value="${esc(v.c)}" data-lc="${k}" data-lj="${j}" aria-label="สี">`:""}<input type="text" value="${esc(obj?v.n:v)}" data-lk="${k}" data-lj="${j}" aria-label="${label}"><button class="btn sm ghost danger" data-ld="${k}" data-lj="${j}" type="button" aria-label="ลบ">✕</button></div>`).join("")}
  <button class="btn sm" data-la="${k}" type="button">+ เพิ่ม</button><span class="small muted">${hint}</span></div>`}

  <section class="card"><h2>แยกดูกำไรตาม <small class="muted">(สาขา โปรเจกต์ ลูกค้า ร้าน ห้อง ฯลฯ · ไม่ใช้ก็ได้)</small></h2><div class="row"><label class="small">ชื่อการแยก <input class="fld" id="sTagN" value="${esc(cfg.tagName)}" placeholder="เช่น สาขา" style="width:200px"></label></div>
   <div style="margin-top:8px">${lst("tags","รายชื่อ"+esc(cfg.tagName),"เพิ่มแล้วจะมีช่องให้เลือกตอนบันทึก และแดชบอร์ดแสดงกำไรแยกให้")}</div></section>
  <section class="card"><h2>${ic("target","s")} เป้ารายได้รายเดือน<span class="row"><select class="fld" id="sGy" aria-label="ปีของเป้า">${yOpts(gy,[...new Set(yearsAvail().concat([curFY(),curFY()+1]))].sort((a,b)=>b-a))}</select><button class="btn sm" id="sGall" type="button">ใส่เท่ากันทุกเดือน</button></span></h2>
   <div class="goals">${M.map(ym=>`<label>${ymS(ym)}<input data-goal="${ym}" inputmode="decimal" value="${goalM(ym)?fm(goalM(ym)):""}" placeholder="0"></label>`).join("")}</div></section>
  <div class="lists">${lst("inCats","หมวดหมู่รายได้","เปลี่ยนชื่อแล้วรายการเดิมเปลี่ยนตาม")}${lst("outCats","หมวดหมู่ค่าใช้จ่าย","สีใช้ในกราฟแดชบอร์ด")}${lst("chans","กระเป๋าเงิน / บัญชี","เช่น เงินสด กสิกร SCB บัตรเครดิต · ใส่ยอดยกมาที่แท็บกระเป๋าเงิน")}</div>
  <section class="card"><h2>↻ รายการประจำ (ลงให้อัตโนมัติทุกเดือน)</h2>${cfg.rec.length?`<div class="recl">${cfg.rec.map(r=>`<div><span><b>${r.t==="in"?"+":"−"} ${fb(num(r.amt))}</b> · ${esc(r.item||r.cat)} <span class="muted small">· ทุกวันที่ ${r.day} · ${esc(r.ch||"")}</span></span><button class="btn sm ghost danger" data-rdel="${r.id}" type="button">หยุด</button></div>`).join("")}</div>`:`<p class="small muted" style="margin:0">ยังไม่มี · ตอนบันทึกรายการ ติ๊ก "ลงรายการนี้ให้อัตโนมัติทุกเดือน" เช่น ค่าเช่า ค่าเน็ต เงินเดือน</p>`}</section>

   <p class="small muted" style="margin:8px 0 0">โอนแล้วแนบสลิปในหน้าถัดไป ใช้งานต่อได้ทันที 24 ชม. ระหว่างร้านตรวจยอด แล้วได้อีเมลแจ้งวันใช้งานเต็มแพ็ก</p></section>

   <p class="small muted" style="margin:8px 0 0">ข้อมูลเก็บในเครื่องนี้ สมาชิกที่เข้าสู่ระบบจะสำรองขึ้นคลาวด์และใช้ได้หลายเครื่อง · กด ${ic("dl","s")} Excel ด้านบนเพื่อดาวน์โหลดเก็บไว้ (ไฟล์เป็นข้อมูลอย่างเดียว ไม่มีสูตร)</p></section>`}
function bindSet(){
  $("#sName").onchange=e=>{if(!can())return render();cfg.name=e.target.value.trim();svCfg();toast("บันทึกแล้ว")};
  $("#sBiz").onclick=()=>{if(!can())return;bizDlg()};
  $("#sTagN").onchange=e=>{if(!can())return render();cfg.tagName=e.target.value.trim()||"สาขา / โปรเจกต์";svCfg();render()};
  $("#sFy").onchange=e=>{if(!can())return render();cfg.fy=+e.target.value;ui.fyY=ui.y5=ui.taxY=ui.goalY=ui.per_in=ui.per_out=null;svCfg();svUi();render();toast("เปลี่ยนเดือนเริ่มปีบัญชีแล้ว")};
  $("#sVat").onchange=e=>{if(!can())return render();cfg.vat=+e.target.value;svCfg();toast("บันทึกแล้ว")};
  $("#sGy").onchange=e=>{ui.goalY=+e.target.value;svUi();render()};
  $$("[data-goal]").forEach(el=>el.onchange=()=>{if(!can())return render();const v=r2(num(el.value));if(v)cfg.goal[el.dataset.goal]=v;else delete cfg.goal[el.dataset.goal];svCfg();el.value=v?fm(v):""});
  $("#sGall").onclick=()=>{if(!can())return;const v=prompt("เป้ารายได้ต่อเดือน (บาท)","");if(v==null)return;const n=r2(num(v));fyMonths(ui.goalY??curFY()).forEach(ym=>{if(n)cfg.goal[ym]=n;else delete cfg.goal[ym]});svCfg();render()};
  $$("[data-lk]").forEach(el=>el.onchange=()=>{if(!can())return render();const k=el.dataset.lk,j=+el.dataset.lj,v=el.value.trim(),obj=OBJ(k);if(!v){render();return}
    const old=obj?cfg[k][j].n:cfg[k][j];if(cfg[k].some((x,q)=>q!==j&&(obj?x.n:x)===v)){toast("มีชื่อนี้แล้ว");render();return}
    if(obj)cfg[k][j].n=v;else cfg[k][j]=v;
    if(obj){const t=k==="inCats"?"in":"out";items.forEach(i=>{if(i.t===t&&i.cat===old)i.cat=v});cfg.rec.forEach(r=>{if(r.t===t&&r.cat===old)r.cat=v})}
    else if(k==="chans"){items.forEach(i=>{if(i.ch===old)i.ch=v;if(i.ch2===old)i.ch2=v});cfg.rec.forEach(r=>{if(r.ch===old)r.ch=v});if(old in cfg.open){cfg.open[v]=cfg.open[old];delete cfg.open[old]}}
    else if(k==="tags"){items.forEach(i=>{if(i.tag===old)i.tag=v});cfg.rec.forEach(r=>{if(r.tag===old)r.tag=v})}
    sv();svCfg();toast("บันทึกแล้ว")});
