.bud{height:14px;border-radius:99px;background:var(--soft);overflow:hidden}.bud i{display:block;height:100%;border-radius:99px;background:var(--ok)}.bud.warn i{background:#E3A008}.bud.over i{background:var(--danger)}

.mbar{display:flex;align-items:center;gap:8px}.mbar b{flex:1;text-align:center;font-size:1.05rem}
.cl{display:flex;flex-direction:column;gap:6px}.cl div{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:6px;align-items:center}

<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่เต็ม)");return false}}};
const K={items:"edm_spend_items",cfg:"edm_spend_cfg",ui:"edm_spend_ui"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/[,฿\s]/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100,fmt=n=>(+n||0).toLocaleString("th-TH",{minimumFractionDigits:0,maximumFractionDigits:2}),fm=n=>"฿"+fmt(n);
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],MF=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const thD=s=>{const[y,m,d]=s.split("-");return +d+" "+MS[+m-1]+" "+String(+y+543).slice(2)},thM=ym=>{const[y,m]=ym.split("-");return MF[+m-1]+" "+(+y+543)},thMs=ym=>{const[y,m]=ym.split("-");return MS[+m-1]+String(+y+543).slice(2)};
const addM=(ym,n)=>{let[y,m]=ym.split("-").map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+"-"+pad(m)};
const uid=()=>"x"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const WD=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}
const PAL=["#D45D45","#E0A21C","#3FA98A","#5B86D6","#9A6FD6","#D6578A","#E8896A","#4FAF83","#7A8CA3","#B7791F","#0E8C94","#A0A0A0"];
const DC=[["🍜","อาหาร/เครื่องดื่ม"],["🛒","ของใช้/ซูเปอร์"],["🚗","เดินทาง/น้ำมัน"],["🏠","ค่าบ้าน/ค่าเช่า"],["💡","น้ำ ไฟ เน็ต โทรศัพท์"],["🛍","ช้อปปิ้ง"],["💊","สุขภาพ"],["🎓","การศึกษา"],["🎉","บันเทิง/ท่องเที่ยว"],["👨‍👩‍👧","ครอบครัว"],["💳","หนี้/ผ่อน"],["📦","อื่น ๆ"]];
const DI=[["💼","เงินเดือน"],["🛍","ขายของ"],["💻","รายได้เสริม/ฟรีแลนซ์"],["🎁","โบนัส/ของขวัญ"],["📈","ดอกเบี้ย/ปันผล"],["💰","อื่น ๆ"]];
const PAY={cash:"เงินสด",transfer:"โอน",card:"บัตร"};
let X=LS.get(K.items,[])||[],cfg=Object.assign({name:"",budget:0,cats:DC.map(c=>({e:c[0],n:c[1]})),demo:false},LS.get(K.cfg,{})||{}),ui=Object.assign({v:"dash",m:today().slice(0,7),q:"",f:""},LS.get(K.ui,{})||{});
if(!Array.isArray(cfg.icats)||!cfg.icats.length)cfg.icats=DI.map(c=>({e:c[0],n:c[1]}));
const save=()=>LS.set(K.items,X),saveC=()=>LS.set(K.cfg,cfg),saveUi=()=>LS.set(K.ui,ui);
const isIn=x=>x.t==="in",catsOf=t=>t==="in"?cfg.icats:cfg.cats;
const catE=(n,t)=>{const c=catsOf(t).find(c=>c.n===n)||cfg.cats.concat(cfg.icats).find(c=>c.n===n);return c?c.e:(t==="in"?"💰":"📦")};
const inM=ym=>X.filter(x=>x.d.slice(0,7)===ym),sum=a=>r2(a.reduce((s,x)=>s+num(x.a),0)),outs=a=>a.filter(x=>!isIn(x)),ins=a=>a.filter(isIn);
function render(){$$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===ui.v));({dash:vDash,list:vList,set:vSet}[ui.v]||vDash)()}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b){ui.v=b.dataset.v;saveUi();render()}};
$("#fab").onclick=()=>addDlg();
function mbar(){return`<div class="mbar"><button class="btn ghost sm" data-mm="-1" type="button">‹</button><b>${thM(ui.m)}</b><button class="btn ghost sm" data-mm="1" type="button" ${ui.m>=today().slice(0,7)?"disabled":""}>›</button></div>`}
function bindM(fn){$$("[data-mm]").forEach(b=>b.onclick=()=>{ui.m=addM(ui.m,+b.dataset.mm);saveUi();fn()})}
function vDash(){const M=$("#main");
  if(!X.length){M.innerHTML=`<div class="card" style="text-align:center;align-items:center;padding:30px 16px"><div style="font-size:3rem">💸</div><h2 style="justify-content:center">เริ่มจดรายรับ-รายจ่ายรายการแรก</h2><p style="color:var(--muted);margin:0;max-width:480px">กดปุ่ม ＋ เลือกรายจ่ายหรือรายรับ แตะหมวด ใส่จำนวนเงิน เสร็จใน 3 วินาที ระบบสรุปให้ว่าเดือนนี้ได้เท่าไหร่ ใช้ไปเท่าไหร่ เหลือเท่าไหร่</p><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn main" id="nw" type="button">＋ จดรายการ</button><button class="btn ghost" id="dm" type="button">✨ ดูตัวอย่าง</button></div></div>`;$("#nw").onclick=()=>addDlg();$("#dm").onclick=demo;return}
  const m=ui.m,L=inM(m),O=outs(L),I=ins(L),tot=sum(O),inc=sum(I),bal=r2(inc-tot),isCur=m===today().slice(0,7),pmL=outs(inM(addM(m,-1))),pm=sum(isCur?pmL.filter(x=>+x.d.slice(8)<=new Date().getDate()):pmL);
  const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),dn=isCur?new Date().getDate():dim,avg=dn?tot/dn:0;
  const ch=pm?Math.round((tot-pm)/pm*100):null,bud=num(cfg.budget),bp=bud?Math.round(tot/bud*100):0,left=bud-tot,sr=inc?Math.round(bal/inc*100):null;
  const byC={};O.forEach(x=>byC[x.c]=(byC[x.c]||0)+num(x.a));const cs=Object.entries(byC).sort((a,b)=>b[1]-a[1]);
  let acc=0;const grad=cs.length?cs.map(([c,v],i)=>{const a=acc/tot*100;acc+=v;return`${PAL[i%PAL.length]} ${a}% ${acc/tot*100}%`}).join(","):"var(--soft) 0 100%";
  const six=[...Array(6)].map((_,i)=>addM(m,i-5)),so=six.map(k=>sum(outs(inM(k)))),si=six.map(k=>sum(ins(inM(k)))),smax=Math.max(1,...so,...si);
  const dd=[...Array(dim)].map((_,i)=>sum(O.filter(x=>+x.d.slice(8)===i+1))),dmax=Math.max(1,...dd);
  const top=O.slice().sort((a,b)=>num(b.a)-num(a.a)).slice(0,5);
  M.innerHTML=`<div class="hello"><div><h1>💸 ${esc(cfg.name?"รายรับ-รายจ่ายของ "+cfg.name:"รายรับ-รายจ่ายของฉัน")}</h1><p>สรุปให้เองทุกครั้งที่จด</p></div>${mbar()}</div>
  <div class="kpis"><div class="kpi"><span>รายรับ${isCur?"เดือนนี้":" "+thMs(m)}</span><b class="down">${fm(inc)}</b><small>${I.length} รายการ</small></div>
  <div class="kpi"><span>รายจ่าย${isCur?"เดือนนี้":" "+thMs(m)}</span><b class="up">${fm(tot)}</b><small>${ch==null?O.length+" รายการ":(ch>0?"▲ ":"▼ ")+Math.abs(ch)+"% จาก"+(isCur?"ช่วงเดียวกัน":"")+"เดือนก่อน"}</small></div>
