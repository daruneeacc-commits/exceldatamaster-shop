<style>
:root{--pri:#1e4e8c;--pri2:#163b6b;--pri-l:#e8eff8;--bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--txt:#1d2733;--mut:#6b7686;--ok:#0f7b55;--ok-l:#e3f4ec;--warn:#a86a12;--warn-l:#fbf0dc;--err:#b42d2d;--err-l:#fbe7e7;--r:10px}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#163b6b,#1e4e8c 55%,#2b6cb0)}
.auth-card{background:#fff;border-radius:14px;width:100%;max-width:380px;padding:30px 28px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.auth-card h1{margin:10px 0 2px;font-size:21px}.auth-card .sub{color:var(--mut);margin:0 0 22px;font-size:13px}
.lock-ic{width:44px;height:44px;border-radius:12px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;color:var(--pri)}

.top{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:30}
.logo{font-weight:600;font-size:16px;white-space:nowrap;color:var(--pri2)}.logo b{color:var(--pri)}
.tag{font-size:10px;background:var(--warn-l);color:var(--warn);padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600;vertical-align:middle}
.sp{flex:1}.ham{display:none;border:0;background:none;padding:6px;cursor:pointer}
#coSel{max-width:260px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}
#side{position:fixed;top:56px;bottom:0;left:0;width:238px;background:#fff;border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px 30px;z-index:25}
.mi{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:#344154;font-size:13.5px;margin-bottom:1px}
.mi:hover{background:#f2f5f9}.mi.on{background:var(--pri-l);color:var(--pri);font-weight:600}
.mi svg{width:18px;height:18px;flex:none}.mi .ph{margin-left:auto;font-size:10px;color:var(--mut);background:#f0f2f5;border-radius:4px;padding:1px 5px}
.mgrp{font-size:11px;color:var(--mut);padding:12px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
main{margin:56px 0 0 238px;padding:22px 26px 60px;max-width:1400px}
#scrim{display:none}
@media(max-width:1000px){.ham{display:block}#side{transform:translateX(-100%);transition:.2s}#side.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.2)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}.kpi .l{color:var(--mut);font-size:12.5px}.kpi .v{font-size:24px;font-weight:600;margin-top:2px}
.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border-color:var(--line)}.btn.ghost:hover{background:#f4f7fb}
.btn.danger{background:var(--err);border-color:var(--err)}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.w{width:100%;padding:11px}
.ib{border:1px solid var(--line);background:#fff;border-radius:6px;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#475467;padding:0}

.in,select.in,textarea.in{border:1px solid #cfd6e0;border-radius:8px;padding:8px 10px;background:#fff;width:100%}

.bar .in{width:auto}.bar .q{min-width:220px;flex:1}

.req:after{content:' *';color:var(--err)}
.hint{font-size:12px;color:var(--mut);margin-top:4px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}

.note{background:var(--pri-l);border-radius:8px;padding:10px 12px;font-size:12.8px;color:#24426b;margin-bottom:12px}
.note.warn{background:var(--warn-l);color:var(--warn)}
.warn{background:var(--warn-l);color:#7a4d0c}.errbox{background:var(--err-l);color:var(--err)}

function fmtCode(segs, s) {

/* ---------- Import ---------- */
function impOpen() {

    '<div class="tabs"><button class="on" id="tb1" onclick="impTab(1)">ไฟล์ Excel / CSV</button><button id="tb2" onclick="impTab(2)">คัดลอกวางจาก Excel</button></div>' +
    '<div id="ip1"><input type="file" id="impFile" accept=".xlsx,.xls,.csv" class="in"></div>' +
    '<div id="ip2" class="hidden"><textarea class="in" id="impPaste" rows="7" placeholder="เลือกตารางใน Excel (รวมแถวหัวตาราง) กด Ctrl+C แล้ววางที่นี่"></textarea><div style="margin-top:8px"><button class="btn ghost sm" onclick="impFromPaste()">ตรวจสอบข้อมูล</button></div></div>' +
    '<div id="impRes" style="margin-top:14px"></div>',
    '<button class="btn ghost" onclick="closeM()">' + t('cancel') + '</button><button class="btn" id="impGo" disabled onclick="impCommit()">นำเข้า</button>', true);
  $('impFile').onchange = impFromFile;
}
function impTab(n) { $('ip1').classList.toggle('hidden', n !== 1); $('ip2').classList.toggle('hidden', n !== 2); $('tb1').classList.toggle('on', n === 1); $('tb2').classList.toggle('on', n === 2); }
function loadXLSX() {
  if (window.XLSX) return Promise.resolve();
  return new Promise(function (res, rej) {
    var s = document.createElement('script'); s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
    s.onload = res; s.onerror = function () { rej(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้ ให้ใช้แท็บ "คัดลอกวางจาก Excel" แทน')); };
    document.head.appendChild(s);
  });
}
function impFromFile() {
  var f = $('impFile').files[0]; if (!f) return;
  $('impRes').innerHTML = '<div class="small">กำลังอ่านไฟล์...</div>';
  loadXLSX().then(function () {
    return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsArrayBuffer(f); });
  }).then(function (buf) {
    var wb = XLSX.read(buf, { type: 'array' }), ws = wb.Sheets[wb.SheetNames[0]];
    impCheck(XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' }).filter(function (r) { return r.some(function (c) { return String(c).trim(); }); }));
  }).catch(function (e) { $('impRes').innerHTML = ''; fail(e); });
}
function impFromPaste() {
  var rows = v('impPaste').split(/\r?\n/).filter(function (l) { return l.trim(); }).map(function (l) { return l.split('\t'); });
  impCheck(rows);
}
function impCheck(table) {
  S.imp = table; $('impGo').disabled = true;
  call('account.import', { company_id: S.cid, table: table, dryRun: true }).then(function (r) {
    var h = '<div class="grid g4" style="margin-bottom:12px"><div class="kpi"><div class="l">พร้อมนำเข้า</div><div class="v" style="color:var(--ok)">' + r.count + '</div></div><div class="kpi"><div class="l">ข้าม (มีอยู่แล้ว)</div><div class="v">' + r.skipped.length + '</div></div><div class="kpi"><div class="l">ข้อผิดพลาด</div><div class="v" style="color:' + (r.errors.length ? 'var(--err)' : 'inherit') + '">' + r.errors.length + '</div></div></div>';
    if (r.errors.length) h += '<div class="note errbox">แก้ไขไฟล์ตามรายการด้านล่าง แล้วเลือกไฟล์ใหม่ (ยังไม่มีข้อมูลถูกบันทึก)</div><div class="tw" style="max-height:260px;overflow:auto"><table class="t"><thead><tr><th>แถว</th><th>ปัญหา</th></tr></thead><tbody>' + r.errors.map(function (e) { return '<tr><td>' + e.row + '</td><td>' + esc(e.msg) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    else if (r.count) h += '<div class="tw" style="max-height:260px;overflow:auto"><table class="t"><thead><tr><th>รหัส</th><th>ชื่อบัญชี</th><th>ประเภท</th><th>ควบคุม</th><th>สถานะ</th></tr></thead><tbody>' + r.preview.map(function (a) { return '<tr><td class="code">' + esc(a.code) + '</td><td><div style="padding-left:' + ((a.level - 1) * 14) + 'px">' + esc(a.name_th) + '</div></td><td>' + badge('t', a.acc_type) + '</td><td>' + badge('c', a.control) + '</td><td>' + badge('s', a.status) + '</td></tr>'; }).join('') + '</tbody></table></div>';
    else h += '<div class="note warn">ไม่มีบัญชีใหม่ให้นำเข้า</div>';
    $('impRes').innerHTML = h;
    $('impGo').disabled = !!r.errors.length || !r.count;
    $('impGo').textContent = r.count ? 'นำเข้า ' + r.count + ' บัญชี' : 'นำเข้า';
  }).catch(function (e) { $('impRes').innerHTML = '<div class="note errbox">' + esc(e.message) + '</div>'; });
}
function impCommit() {
  $('impGo').disabled = true;
  call('account.import', { company_id: S.cid, table: S.imp, dryRun: false }).then(function (r) {
    if (!r.committed) { fail(new Error('ข้อมูลเปลี่ยนไประหว่างตรวจ กรุณาตรวจสอบใหม่')); return impCheck(S.imp); }
    closeM(); return reloadCoa('นำเข้า ' + r.count + ' บัญชีแล้ว');
  }).catch(fail);
}

/* ================= Account Structure ================= */
function pStruct() {
  $('main').innerHTML = head(t('structure'), '') + '<div class="empty">กำลังโหลด...</div>';
  call('structure.get', { company_id: S.cid }).then(function (d) { S.st = d; S.st.edit = JSON.parse(JSON.stringify(d.structure)); renderStruct(); }).catch(fail);
}
function renderStruct() {
  var d = S.st, s = d.edit, ro = co().status !== 'ACTIVE';
  var lockD = function (i) { return ro || (!d.onlySystem && i < d.maxUsedLevel); };
  var exSegs = function (k) { var a = []; for (var i = 0; i < k; i++) a.push(pad(1, s.levels[i].digits)); return a; };
  var rows = s.levels.map(function (l, i) {
    return '<tr><td><b>ระดับ ' + (i + 1) + '</b><span class="sub2">' + (i === 0 ? 'หมวดบัญชี (1–5)' : i === s.levels.length - 1 ? 'ระดับสุดท้าย (POSTING)' : '') + '</span></td>' +
      '<td><input class="in" type="number" min="1" max="' + (i ? 6 : 2) + '" value="' + l.digits + '" style="width:80px"' + (lockD(i) ? ' disabled' : '') + ' onchange="stSet(' + i + ',\'digits\',+this.value)"></td>' +
      '<td>' + (i ? '<input type="checkbox"' + (l.sep ? ' checked' : '') + (ro ? ' disabled' : '') + ' onchange="stSet(' + i + ',\'sep\',this.checked)">' : '<span class="small">–</span>') + '</td>' +
      '<td class="code">' + esc(fmtCode(exSegs(i + 1), s)) + '</td></tr>';
  }).join('');
  var canRemove = !ro && s.levels.length > 2 && s.levels.length > d.maxUsedLevel;
  $('main').innerHTML = head(t('structure'), esc(co().code + ' · ' + co().name_th) + ' · กำหนดจำนวนระดับ จำนวนหลัก และตัวคั่นของรหัสบัญชี') +
    (d.onlySystem ? '<div class="note">ยังมีเฉพาะหมวดหลัก ปรับโครงสร้างได้ทุกส่วน</div>' : '<div class="note warn">มีบัญชีถึงระดับ ' + d.maxUsedLevel + ' แล้ว: เปลี่ยนจำนวนหลักของระดับ 1–' + d.maxUsedLevel + ' และลดระดับไม่ได้ (ป้องกันรหัสเดิมเสีย) แต่เปลี่ยนตัวคั่น การเติมศูนย์ และเพิ่มระดับได้ ระบบจะปรับรหัสทุกบัญชีให้อัตโนมัติ</div>') +
    '<div class="grid g2"><div class="card"><h3>ระดับบัญชี</h3><div class="tw"><table class="t"><thead><tr><th>ระดับ</th><th>จำนวนหลัก</th><th>ใส่ตัวคั่นหน้าระดับนี้</th><th>ตัวอย่างรหัส</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="bar" style="margin-top:10px"><button class="btn ghost sm"' + (ro || s.levels.length >= 8 ? ' disabled' : '') + ' onclick="stAdd()">+ เพิ่มระดับ</button><button class="btn ghost sm"' + (canRemove ? '' : ' disabled') + ' onclick="stRemove()">ลบระดับสุดท้าย</button></div></div>' +
    '<div class="card"><h3>รูปแบบรหัส</h3><div class="fr"><label class="f">ตัวคั่นรหัส</label><select class="in" id="stSep"' + (ro ? ' disabled' : '') + '>' + [['-', 'ขีด  ( - )'], ['.', 'จุด  ( . )'], ['/', 'ทับ  ( / )'], ['_', 'ขีดล่าง  ( _ )'], ['', 'ไม่ใช้ตัวคั่น']].map(function (o) { return '<option value="' + o[0] + '"' + (s.separator === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div>' +
    '<div class="fr"><label class="f">การแสดงรหัสบัญชีระดับบน</label><select class="in" id="stPad"' + (ro ? ' disabled' : '') + '><option value="1"' + (s.pad ? ' selected' : '') + '>เติม 0 ให้ครบทุกหลัก (เช่น 1100-00)</option><option value="0"' + (!s.pad ? ' selected' : '') + '>แสดงเฉพาะหลักที่ใช้ (เช่น 11)</option></select></div>' +
    '<div class="fr"><label class="f">รหัสบัญชีระดับสุดท้าย</label><div class="codeprev">' + esc(fmtCode(exSegs(s.levels.length), s)) + '</div><div class="hint">รวม ' + s.levels.reduce(function (t, l) { return t + l.digits; }, 0) + ' หลัก (สูงสุด 20)</div></div>' +
    (ro ? '' : '<div class="bar"><button class="btn ghost" onclick="pStruct()">คืนค่า</button><button class="btn" onclick="stSave()">บันทึกโครงสร้าง</button></div>') + '</div></div>';
  if (!ro) { $('stSep').onchange = function () { s.separator = this.value; renderStruct(); }; $('stPad').onchange = function () { s.pad = this.value === '1'; renderStruct(); }; }
}
function stSet(i, k, val) { S.st.edit.levels[i][k] = val; renderStruct(); }
function stAdd() { S.st.edit.levels.push({ digits: 2, sep: true }); renderStruct(); }
function stRemove() { S.st.edit.levels.pop(); renderStruct(); }
function stSave() {
  confirmM('บันทึกโครงสร้างรหัสบัญชี', 'ระบบจะปรับรหัสบัญชีทุกบัญชีของบริษัทนี้ให้ตรงโครงสร้างใหม่ (ไฟล์สำรองรายวันยังกู้คืนได้)', 'บันทึก', function () {
    call('structure.save', { company_id: S.cid, structure: S.st.edit }).then(function (r) { toast('บันทึกแล้ว ปรับรหัส ' + r.regenerated + ' บัญชี', 'ok'); S.coa = null; return loadCos(); }).then(pStruct).catch(fail);
  });
}

function jSet(i, k, val) { S.jEdit.lines[i][k] = val; if (k === 'debit' || k === 'credit') jTotals(); }
function jFmt(el) { var n = sat(el.value); if (el.value && !isNaN(n)) { el.value = money(n / 100); el.dispatchEvent(new Event('input')); } }
function jChk(el) {

function jTotals() {

  S.jEdit.lines.forEach(function (l) { var d = sat(l.debit), c = sat(l.credit); if (isNaN(d) || isNaN(c)) bad = true; else { dr += d; cr += c; } });
  $('jDr').textContent = money(dr / 100); $('jCr').textContent = money(cr / 100);
  var df = $('jDiff');

  else if (dr !== cr) { df.className = 'diff'; df.textContent = '(ไม่สมดุล ต่างกัน ' + money(Math.abs(dr - cr) / 100) + ')'; }

/* ---------- พิมพ์ใบสำคัญ ---------- */
function bahtText(num) {
  var n = Math.round(Number(num) * 100); if (!n) return 'ศูนย์บาทถ้วน';
  var D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  function grp(x) { // < 1,000,000
    var s = '', str = String(x), len = str.length;
    for (var i = 0; i < len; i++) {
      var d = +str[i], pos = len - i - 1; if (!d) continue;
      if (pos === 1 && d === 1) s += 'สิบ';
      else if (pos === 1 && d === 2) s += 'ยี่สิบ';
      else if (pos === 0 && d === 1 && len > 1) s += 'เอ็ด';
      else s += D[d] + P[pos];
    }
    return s;
  }
  function words(x) { if (x >= 1000000) return words(Math.floor(x / 1000000)) + 'ล้าน' + grp(x % 1000000); return grp(x); }
  var baht = Math.floor(n / 100), st = n % 100;
  return (baht ? words(baht) + 'บาท' : '') + (st ? words(st) + 'สตางค์' : 'ถ้วน');
}

function bal(j) { return Number(j.total_dr) > 0 && j.total_dr === j.total_cr; }

function pSum() {
  if (!$('pSum')) return;
  var ids = Object.keys(S.pf.sel), tot = 0;
  S.pRows.forEach(function (j) { if (S.pf.sel[j.id]) tot += sat(j.total_dr); });
  var unb = S.pRows.filter(function (j) { return !bal(j); }).length;
  $('pSum').innerHTML = 'เลือก <b>' + ids.length + '</b> รายการ · ยอดรวม <b>' + money(tot / 100) + '</b>' + (unb ? ' <span class="diff small">· ไม่สมดุล ' + unb + ' รายการ (ต้องแก้ไขก่อน)</span>' : '');

}

      (r.rows.length ? '<div class="tw"><table class="t"><thead><tr><th><input type="checkbox" onchange="[].forEach.call(document.querySelectorAll(\'.brck\'),function(e){e.checked=this.checked}.bind(this));brCalc()"> ตรงกับ statement</th><th>วันที่</th><th>เลขที่</th><th>รายการ</th><th class="num">ฝาก / รับ</th><th class="num">ถอน / จ่าย</th></tr></thead><tbody>' +
        r.rows.map(function (l) { var a = Number(l.amount); return '<tr><td><input type="checkbox" class="brck" value="' + l.id + '"' + (l.cleared ? ' checked' : '') + ' onchange="brCalc()"></td><td>' + fdate(l.doc_date + 'T00:00').slice(0, 10) + '</td><td class="code"><span class="lk" onclick="jView(\'' + l.journal_id + '\')">' + esc(l.doc_no) + '</span></td><td>' + esc(l.description) + '</td><td class="num">' + (a > 0 ? money(a) : '') + '</td><td class="num">' + (a < 0 ? money(-a) : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">ไม่มีรายการเคลื่อนไหวที่ยังไม่กระทบ</div>') +
      (r.cheques.length ? '<p class="small" style="margin-top:10px">เช็คที่ยังไม่ผ่าน (ยังไม่เข้าบัญชีธนาคาร): ' + r.cheques.map(function (q) { return (q.kind === 'IN' ? 'รับ ' : 'จ่าย ') + esc(q.cheque_no) + ' ' + money(q.amount); }).join(' · ') + ' — ถ้าขึ้นใน statement แล้ว ให้กด "ผ่านเช็ค" ที่เมนูเช็คก่อน</p>' : '') +
      '<div class="bar" style="margin-top:12px">' + (ro ? '' : '<button class="btn" onclick="brSave()">บันทึกการกระทบยอด</button>') + '<button class="btn ghost" onclick="brPrint()">🖨 พิมพ์งบกระทบยอด</button></div></div>';
    brCalc();
  }).catch(fail);
}
function brNums() {
  var ck = {}; [].forEach.call(document.querySelectorAll('.brck:checked'), function (e) { ck[e.value] = 1; });
  var dep = 0, pay = 0; S.brR.rows.forEach(function (l) { if (ck[l.id]) return; var a = rndSat(l.amount); if (a > 0) dep += a; else pay -= a; });
  var sb = rndSat(v('br_sb')), book = rndSat(S.brR.book_balance), adj = (isNaN(sb) ? 0 : sb) + dep - pay;
  return { ck: Object.keys(ck), dep: dep, pay: pay, sb: sb, book: book, adj: adj, diff: adj - book };
}
function brCalc() {
  var n = brNums(), m = function (x) { return (x < 0 ? '-' : '') + money(Math.abs(x) / 100); };
  $('brSum').innerHTML = '<div class="grid g4" style="gap:8px;margin:6px 0 12px"><div><div class="small">ยอดตาม statement</div><b>' + (isNaN(n.sb) ? '–' : m(n.sb)) + '</b></div><div><div class="small">+ เงินฝากระหว่างทาง</div><b>' + m(n.dep) + '</b></div><div><div class="small">− เช็ค/รายการจ่ายที่ธนาคารยังไม่ตัด</div><b>' + m(n.pay) + '</b></div><div><div class="small">ยอดตามบัญชี</div><b>' + m(n.book) + '</b></div></div>' +
    '<div class="note ' + (n.diff ? 'warn' : '') + '">' + (isNaN(n.sb) || v('br_sb') === '' ? 'ใส่ยอดคงเหลือตาม statement' : n.diff ? 'ยังมีผลต่าง <b>' + m(n.diff) + '</b> บาท — ตรวจรายการที่ยังไม่ได้บันทึกบัญชี เช่น ค่าธรรมเนียม ดอกเบี้ยรับ แล้วบันทึกที่สมุดรายวัน' : '✓ กระทบยอดตรงกัน') + '</div>';
}
function brSave() {
  var n = brNums();
  call('rec.save', { company_id: S.cid, id: S.brR.id, bank_account_id: S.br.bank, statement_date: S.br.date, statement_balance: v('br_sb'), cleared: n.ck, note: v('br_n') })
    .then(function (r) { S.brR.id = r.id; toast(n.diff ? 'บันทึกแล้ว (ยังมีผลต่าง)' : 'บันทึกการกระทบยอดแล้ว', n.diff ? 'err' : 'ok'); return call('rec.list', { company_id: S.cid }); }).then(function (l) { S.brList = l; }).catch(fail);
}
function brDel(id) { confirmM('ลบการกระทบยอด', 'ลบการกระทบยอดงวดนี้ ? รายการที่ติ๊กไว้จะกลับมาเป็นยังไม่กระทบ', 'ลบ', function () { call('rec.delete', { company_id: S.cid, id: id }).then(function () { toast('ลบแล้ว', 'ok'); pBankRec(); }).catch(fail); }, true); }
function brPrint() {
  var n = brNums(), c = co(), m = function (x) { return (x < 0 ? '-' : '') + money(Math.abs(x) / 100); }, ck = {}; n.ck.forEach(function (i) { ck[i] = 1; });
  var bank = (S.coa.accounts.filter(function (a) { return a.id === S.br.bank; })[0] || {});
  var outs = function (pos) { var L = S.brR.rows.filter(function (l) { var a = Number(l.amount); return !ck[l.id] && (pos ? a > 0 : a < 0); }); return L.length ? L.map(function (l) { return '<tr><td style="padding-left:24px">' + fdate(l.doc_date + 'T00:00').slice(0, 10) + ' ' + esc(l.doc_no) + ' ' + esc(l.description) + '</td><td class="r">' + money(Math.abs(Number(l.amount))) + '</td><td></td></tr>'; }).join('') : '<tr><td style="padding-left:24px" class="small">ไม่มี</td><td></td><td></td></tr>'; };
  printer().show('งบกระทบยอดเงินฝากธนาคาร', '<div class="pv"><div style="text-align:center"><b style="font-size:15px">' + esc(c.name_th) + '</b><h1>งบกระทบยอดเงินฝากธนาคาร</h1>' + esc((bank.code || '') + ' ' + (bank.name_th || '')) + '<br>ณ วันที่ ' + thDate(S.br.date) + '</div>' +
    '<table style="margin-top:12px"><tbody><tr><th style="text-align:left">ยอดคงเหลือตาม Bank Statement</th><td></td><th class="r">' + m(n.sb) + '</th></tr>' +
    '<tr><td><b>บวก</b> เงินฝากระหว่างทาง / รายการรับที่ธนาคารยังไม่บันทึก</td><td></td><td></td></tr>' + outs(true) + '<tr><td class="r">รวม</td><td></td><td class="r">' + m(n.dep) + '</td></tr>' +
    '<tr><td><b>หัก</b> เช็คจ่ายที่ยังไม่ขึ้นเงิน / รายการจ่ายที่ธนาคารยังไม่ตัด</td><td></td><td></td></tr>' + outs(false) + '<tr><td class="r">รวม</td><td></td><td class="r">(' + m(n.pay) + ')</td></tr>' +
    '<tr><th style="text-align:left">ยอดคงเหลือที่ปรับปรุงแล้ว</th><td></td><th class="r">' + m(n.adj) + '</th></tr><tr><th style="text-align:left">ยอดคงเหลือตามบัญชี</th><td></td><th class="r">' + m(n.book) + '</th></tr>' +
    '<tr><th style="text-align:left">ผลต่าง</th><td></td><th class="r">' + m(n.diff) + '</th></tr></tbody></table>' +
    '<div class="sig"><div>ผู้จัดทำ</div><div>ผู้ตรวจสอบ</div><div>ผู้อนุมัติ</div></div></div>');
}

/* ================= Planned pages ================= */
function pPlan(p) {
  var ph = 0; MENU.forEach(function (g) { g.items.forEach(function (it) { if (it[0] === p) ph = it[1]; }); });
  $('main').innerHTML = head(t(p), '') + '<div class="card empty"><div style="font-size:15px;color:var(--txt);margin-bottom:6px"><b>อยู่ในแผน Phase ' + ph + '</b></div>เมนูนี้จะเปิดใช้หลังทดสอบ Phase 1–2 ผ่านแล้ว ตามลำดับการพัฒนา</div>';
}

showAuth();
</script>
