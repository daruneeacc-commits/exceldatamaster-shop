<style>

*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:14px;color:var(--txt);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
/* auth */
.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#163b6b,#1e4e8c 55%,#2b6cb0)}

.lock-ic{width:44px;height:44px;border-radius:12px;background:var(--pri-l);display:flex;align-items:center;justify-content:center;color:var(--pri)}
/* layout */
.top{position:fixed;top:0;left:0;right:0;height:56px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 14px;z-index:30}

.sp{flex:1}.ham{display:none;border:0;background:none;padding:6px;cursor:pointer}
#coSel{max-width:260px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:#fff}

.mi svg{width:18px;height:18px;flex:none}.mi .ph{margin-left:auto;font-size:10px;color:var(--mut);background:#f0f2f5;border-radius:4px;padding:1px 5px}
.mgrp{font-size:11px;color:var(--mut);padding:12px 10px 4px;text-transform:uppercase;letter-spacing:.04em}
main{margin:56px 0 0 238px;padding:22px 26px 60px;max-width:1400px}
#scrim{display:none}
@media(max-width:1000px){.ham{display:block}#side{transform:translateX(-100%);transition:.2s}#side.open{transform:none;box-shadow:0 0 30px rgba(0,0,0,.2)}

/* elements */
h2.pt{font-size:20px;margin:0 0 4px}.pd{color:var(--mut);margin:0 0 18px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.card h3{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}

.btn{border:1px solid var(--pri);background:var(--pri);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--pri2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border-color:var(--line)}.btn.ghost:hover{background:#f4f7fb}
.btn.danger{background:var(--err);border-color:var(--err)}.btn.sm{padding:5px 10px;font-size:12.5px}.btn.w{width:100%;padding:11px}

.ib:hover{background:#f2f5f9;color:var(--pri)}.ib.red:hover{color:var(--err)}.ib svg{width:15px;height:15px}

.bar .in{width:auto}.bar .q{min-width:220px;flex:1}
label.f{display:block;font-size:12.5px;color:#475467;margin:0 0 4px;font-weight:500}
.fr{margin-bottom:12px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.f2{grid-template-columns:1fr}}
.req:after{content:' *';color:var(--err)}
.hint{font-size:12px;color:var(--mut);margin-top:4px}

.b-h{background:#eef2f7;color:#41526b}.b-p{background:#e6effa;color:#1e4e8c}.b-c{background:#f3e8fb;color:#6b2c91}.b-s{background:#e9edf2;color:#334155}

.pg{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:12.5px;color:var(--mut);flex-wrap:wrap}
.empty{padding:30px;text-align:center;color:var(--mut)}
.note{background:var(--pri-l);border-radius:8px;padding:10px 12px;font-size:12.8px;color:#24426b;margin-bottom:12px}
.note.warn{background:var(--warn-l);color:var(--warn)}
.warn{background:var(--warn-l);color:#7a4d0c}.errbox{background:var(--err-l);color:var(--err)}
.catbar{height:8px;background:#eef1f5;border-radius:6px;overflow:hidden}.catbar i{display:block;height:100%;background:var(--pri)}
.phase{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px}.phase:last-child{border:0}
.dot{width:9px;height:9px;border-radius:50%;background:#cbd2dc;flex:none}.dot.on{background:var(--ok)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--mut);border-bottom:2px solid transparent}.tabs button.on{color:var(--pri);border-color:var(--pri);font-weight:600}

.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.mbox.wide{max-width:860px}
.mh{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.mh h3{margin:0;font-size:16px;flex:1}
.mb{padding:18px}.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut);line-height:1}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;width:min(92vw,460px)}
.ts{background:#1d2733;color:#fff;padding:11px 14px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);white-space:pre-line}.ts.err{background:var(--err)}.ts.ok{background:var(--ok)}
#busy{position:fixed;top:56px;left:0;right:0;height:3px;z-index:60;overflow:hidden}#busy i{display:block;width:40%;height:100%;background:#4f8ad6;animation:ld 1s infinite linear}

.seg{display:flex;align-items:center;gap:6px}.seg .pre{font-family:ui-monospace,Menlo,monospace;color:var(--mut)}
.small{font-size:12px;color:var(--mut)}
.jl input.in{padding:6px 8px;min-width:90px}.jl td{padding:5px 6px}.jl .acc{min-width:230px}.jl .amt{text-align:right;min-width:110px}
.tot td{font-weight:600;background:#f6f8fb}.diff{color:var(--err)}.okc{color:var(--ok)}
.ib:disabled{opacity:.3;cursor:not-allowed}.ib:disabled:hover{background:#fff;color:#475467}
.jact{display:flex;gap:6px;flex-wrap:wrap;width:100%;align-items:center}.jact .btn{display:inline-flex;align-items:center;gap:6px}.jact .btn svg{width:15px;height:15px}
.sticky{position:sticky;bottom:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -4px 14px rgba(0,0,0,.05)}
#printArea{display:none}
@media print{body{background:#fff}body>*:not(#printArea){display:none!important}#printArea{display:block!important;font-size:13px;color:#000;font-family:Sarabun,'IBM Plex Sans Thai',sans-serif}@page{size:A4;margin:14mm}}
.pv h1{font-size:18px;margin:0}.pv .co{font-size:12px;line-height:1.5}.pv table{width:100%;border-collapse:collapse;margin-top:10px}.pv th,.pv td{border:1px solid #444;padding:5px 7px}.pv th{background:#eee}
.pv .r{text-align:right}.pv .hd{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}.pv .meta td{border:0;padding:2px 6px}

.sec{font-size:12px;font-weight:600;color:var(--pri);margin:4px 0 8px;text-transform:uppercase;letter-spacing:.03em}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}@media(max-width:600px){.f3{grid-template-columns:1fr}}
.f4{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}@media(max-width:600px){.f4{grid-template-columns:1fr 1fr}.f4>.fr:first-child{grid-column:1/-1}}.slbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.pp30 td{padding:10px 12px}.pp30 .big{font-size:18px;font-weight:700}
.gls h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.lk{color:var(--pri);cursor:pointer;text-decoration:underline}
@media(max-width:600px){#coaTbl .sub2{display:none}#coaTbl td:nth-child(2){min-width:170px}#coaTbl td div{padding-left:0!important}.t td,.t th{padding:7px 8px}}

:root{--fld:#c9d2de;--fld-h:#9fb3cc;--sec-bg:#f5f8fc}

.req:after{content:' *';color:var(--err);font-weight:700}
.in,select.in,textarea.in{min-height:42px;padding:9px 12px;border:1.5px solid var(--fld);border-radius:9px;font-size:15.5px;background:#fff;transition:border-color .15s,box-shadow .15s}

.mb .tw{border-radius:10px;border-color:#dfe5ee}

/* กล่องคำอธิบาย */
.note{border-left:4px solid #8fb1db;border-radius:8px;padding:11px 14px;line-height:1.6}.note.warn{border-left-color:#e0a84b}

function fmtCode(segs, s) {
  var out = '';

    var seg;

function bahtText(num) {
  var n = Math.round(Number(num) * 100); if (!n) return 'ศูนย์บาทถ้วน';
  var D = ['', 'หนึ่ง', 'สอง', 'สาม', 'สี่', 'ห้า', 'หก', 'เจ็ด', 'แปด', 'เก้า'], P = ['', 'สิบ', 'ร้อย', 'พัน', 'หมื่น', 'แสน'];
  function grp(x) { // < 1,000,000
    var s = '', str = String(x), len = str.length;
    for (var i = 0; i < len; i++) {

      if (pos === 1 && d === 1) s += 'สิบ';
      else if (pos === 1 && d === 2) s += 'ยี่สิบ';
      else if (pos === 0 && d === 1 && len > 1) s += 'เอ็ด';
      else s += D[d] + P[pos];
    }
    return s;
  }
  function words(x) { if (x >= 1000000) return words(Math.floor(x / 1000000)) + 'ล้าน' + grp(x % 1000000); return grp(x); }
  var baht = Math.floor(n / 100), st = n % 100;
  return (baht ? words(baht) + 'บาท' : '') + (st ? words(st) + 'สตางค์' : 'ถ้วน');
}

function taxOk() {

    inv_date: v('t_date'), tax_month: v('t_month'), base_amount: (baseS / 100).toFixed(2), rate: v('t_rate'), tax_amount: (taxS / 100).toFixed(2)
  };

  if (x.g === 'WHT') { t.cert_no = v('t_cert'); t.form_row = x.rate.form_row; t.income_code = x.rate.income_code; t.income_desc = v('t_desc'); t.wht_condition = v('t_cond'); }

}

      $('piSrcBox').innerHTML = '<p class="small">ใช้ชื่อสินค้าจากรายการในบิลที่ยังไม่ได้ผูกสินค้า · ระบบรันรหัสให้ (P0001…) แก้รหัส/หน่วยได้ในตาราง</p>';

function piShow(list, src) {

    list.map(function (o, i) { return '<tr' + (o.dup ? ' style="opacity:.5"' : '') + '><td>' + (o.dup ? '<span class="small">มีแล้ว</span>' : '<input type="checkbox" id="pi_c' + i + '" checked onchange="S.pi.items[' + i + '].on=this.checked">') + '</td><td><input class="in code" style="width:110px;padding:4px 6px" value="' + esc(o.code) + '" placeholder="รันให้" onchange="S.pi.items[' + i + '].code=this.value"' + (o.dup ? ' disabled' : '') + '></td><td>' + esc(o.name) + '</td><td><input class="in" style="width:70px;padding:4px 6px" value="' + esc(o.unit) + '" onchange="S.pi.items[' + i + '].unit=this.value"' + (o.dup ? ' disabled' : '') + '></td><td class="num">' + (o.sale_price ? money(o.sale_price) : '–') + '</td><td class="num">' + o.n + '</td></tr>'; }).join('') + '</tbody></table></div><div id="piProg"></div>';

  };

/* ================= ปิดภาษีซื้อ-ภาษีขาย (ภ.พ.30) ================= */

    var th = function (mm) { return ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'][Number(mm.slice(5, 7)) - 1] + ' ' + (Number(mm.slice(0, 4)) + 543); };

    };

    return '<tr><td class="c">' + (i + 1) + '</td><td class="c">' + p[2] + '/' + p[1] + '/' + (Number(p[0]) + 543) + '</td><td class="el">' + esc(d.inv_no) + (d.status === 'DRAFT' ? ' <span class="dr">*</span>' : '') + '</td><td class="el">' + esc(d.party_name) + '</td><td class="c">' + esc(d.party_tax_id || '') + '</td>' +
      '<td class="c">' + (h ? '✓' : '') + '</td><td class="c">' + (d.party_tax_id && !h ? esc(brNo(d.party_branch)) : '') + '</td><td class="n">' + money(d.base_amount) + '</td><td class="n">' + money(d.tax_amount) + '</td></tr>';
  };
  var cb = 0, ct = 0, out = [];
  for (var pg = 0; pg < n; pg++) {
    var part = rows.slice(pg * PER, pg * PER + PER), pb = 0, pt = 0, last = pg === n - 1, bf = cb, tf = ct;
    part.forEach(function (d) { pb += sat(d.base_amount); pt += sat(d.tax_amount); });
    cb += pb; ct += pt;
    out.push('<div class="vpg">' + head + '<table>' + th + '<tbody>' +
      part.map(function (d, i) { return row(d, pg * PER + i); }).join('') +
      '</tbody>' + (last ? '<tfoot><tr><td colspan="7" style="text-align:right">รวมทั้งสิ้น ' + rows.length + ' รายการ</td><td class="n">' + money(r.base_total) + '</td><td class="n">' + money(r.tax_total) + '</td></tr></tfoot>' : '') + '</table>' +
      '<div class="ft"><span>' + (drafts && last ? '<span class="dr">* รายการที่ยังไม่ Post ' + drafts + ' รายการ</span>' : '') + '</span><span>' + (last ? 'ผู้จัดทำ ........................................ วันที่ ....../....../........... &nbsp; &nbsp; ' : '') + 'หน้า ' + (pg + 1) + '/' + n + '</span></div></div>');
  }
  return '<div class="vr">' + out.join('') + '</div>';
}

function pPlan(p) {
  var ph = 0; MENU.forEach(function (g) { g.items.forEach(function (it) { if (it[0] === p) ph = it[1]; }); });
  $('main').innerHTML = head(t(p), '') + '<div class="card empty"><div style="font-size:15px;color:var(--txt);margin-bottom:6px"><b>อยู่ในแผน Phase ' + ph + '</b></div>เมนูนี้จะเปิดใช้หลังทดสอบ Phase 1–2 ผ่านแล้ว ตามลำดับการพัฒนา</div>';
}
