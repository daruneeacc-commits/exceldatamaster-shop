<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่เต็ม)");return false}}};
const K={sales:"edm_pos_sales",cfg:"edm_pos_cfg",ui:"edm_pos_ui",items:"edm_stock_items",tx:"edm_stock_tx"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100,fmt=n=>(+n||0).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2}),fq=n=>(+n||0).toLocaleString("th-TH",{maximumFractionDigits:3});
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],thD=s=>{const[y,m,d]=s.split("-");return +d+" "+MS[+m-1]+" "+String(+y+543).slice(2)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2400)}
const PAY={cash:"เงินสด",transfer:"โอน / QR",card:"บัตร"};
let S=LS.get(K.sales,[])||[],cfg=Object.assign({shop:{name:"",phone:"",addr:"",tax:""},foot:"ขอบคุณที่อุดหนุนค่ะ",vat:false},LS.get(K.cfg,{})||{}),ui=Object.assign({v:"sell",q:"",cat:""},LS.get(K.ui,{})||{});
let cart=[],pay="cash",disc=0;
const items=()=>LS.get(K.items,[])||[];
function bal(){const B={};(LS.get(K.tx,[])||[]).forEach(t=>{const q=num(t.qty);B[t.pid]=(B[t.pid]||0)+(t.type==="out"?-q:q)});return B}
const saveS=()=>LS.set(K.sales,S),saveUi=()=>LS.set(K.ui,ui);
const cTot=()=>{const sub=r2(cart.reduce((a,l)=>a+num(l.q)*num(l.p),0));return{sub,total:r2(Math.max(0,sub-num(disc)))}};
function nextNo(){const k="RC"+today().slice(2,10).replace(/-/g,"")+"-";let m=0;S.forEach(s=>{if(s.no.startsWith(k))m=Math.max(m,+s.no.slice(k.length)||0)});return k+String(m+1).padStart(3,"0")}
function render(){$$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===ui.v));({sell:vSell,hist:vHist,sum:vSum,set:vSet}[ui.v]||vSell)()}
$("#tabs").onclick=e=>{const b=e.target.closest("[data-v]");if(b){ui.v=b.dataset.v;saveUi();render()}};
const code=i=>String(i.barcode||i.sku||"").trim();
function addByCode(c){c=String(c||"").trim();if(!c)return false;const I=items(),i=I.find(x=>code(x)&&code(x).toLowerCase()===c.toLowerCase())||I.find(x=>x.name===c);if(!i)return false;addItem(i);return true}
function addItem(i){const l=cart.find(x=>x.pid===i.id);if(l)l.q=num(l.q)+1;else cart.push({pid:i.id,d:i.name,q:1,p:num(i.price),u:i.unit||""});drawCart();beep()}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=1200;g.gain.value=.05;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},70)}catch(e){}}
function vSell(){const M=$("#main"),I=items();
  if(!I.length){M.innerHTML=`<div class="hello"><h1>🏪 POS ร้านค้าปลีก</h1><p>ยิงบาร์โค้ดหรือแตะสินค้า คิดเงิน ทอนเงิน พิมพ์ใบเสร็จ ตัดสต๊อกอัตโนมัติ</p></div><div class="card"><h2>ยังไม่มีสินค้า</h2><p class="note">เพิ่มสินค้าพร้อมบาร์โค้ดและราคาขาย (ใช้รายการเดียวกับระบบสต๊อกสินค้า)</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn main" id="ad" type="button">＋ เพิ่มสินค้า</button><button class="btn ghost" id="dm" type="button">✨ ลองข้อมูลตัวอย่าง</button></div></div>`;$("#ad").onclick=()=>itemDlg();$("#dm").onclick=demo;return}
  const B=bal(),cats=[...new Set(I.map(i=>i.cat).filter(Boolean))],q=(ui.q||"").trim().toLowerCase(),L=I.filter(i=>(!ui.cat||i.cat===ui.cat)&&(!q||(i.name+" "+code(i)).toLowerCase().includes(q))).slice(0,120);
  M.innerHTML=`<div class="pos"><div class="card"><div class="scan"><input class="in-" id="sc" placeholder="🔎 ยิงบาร์โค้ด / พิมพ์รหัสหรือชื่อ แล้วกด Enter" autocomplete="off" value="${esc(ui.q||"")}"><button class="btn ghost" id="camB" type="button" title="สแกนด้วยกล้อง">📷</button></div>
    ${cats.length?`<div class="seg cats"><button class="${!ui.cat?"on":""}" data-c="" type="button">ทั้งหมด</button>${cats.map(c=>`<button class="${ui.cat===c?"on":""}" data-c="${esc(c)}" type="button">${esc(c)}</button>`).join("")}</div>`:""}
    <div class="grid">${L.map(i=>`<button class="pi ${(B[i.id]||0)<=0?"out":""}" data-a="${esc(i.id)}" type="button"><b>${esc(i.name)}</b><span>฿${fmt(i.price)}</span><small>${esc(code(i))} · เหลือ ${fq(B[i.id]||0)}</small></button>`).join("")||`<div class="empty">ไม่พบสินค้า</div>`}</div></div>
    <div class="card cart" id="cartC"></div></div>`;
  const sc=$("#sc");sc.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();if(addByCode(sc.value)){sc.value="";ui.q="";filt()}else toast("ไม่พบรหัส "+sc.value)}};
  const filt=()=>{const q2=sc.value.trim().toLowerCase();$$(".pi").forEach(b=>{const i=I.find(x=>x.id===b.dataset.a);b.hidden=!!q2&&!(i.name+" "+code(i)).toLowerCase().includes(q2)})};
  sc.oninput=()=>{ui.q=sc.value;filt()};
  $$("[data-c]").forEach(b=>b.onclick=()=>{ui.cat=b.dataset.c;saveUi();vSell()});$$("[data-a]").forEach(b=>b.onclick=()=>{addItem(I.find(x=>x.id===b.dataset.a));sc.focus()});
  $("#camB").onclick=camScan;drawCart();setTimeout(()=>sc.focus(),30)}
function drawCart(){const C=$("#cartC");if(!C)return;const T=cTot();
  C.innerHTML=`<h2>ตะกร้า <small>${cart.reduce((a,l)=>a+num(l.q),0)} ชิ้น</small></h2><div class="cl">${cart.map((l,i)=>`<div class="ci"><div><b>${esc(l.d)}</b><small>฿${fmt(l.p)} ${esc(l.u)}</small></div><div class="qty"><button data-m="${i}" type="button">−</button><input class="in-" data-q="${i}" value="${fq(l.q)}" inputmode="decimal"><button data-p="${i}" type="button">+</button></div><b>${fmt(num(l.q)*num(l.p))}</b></div>`).join("")||`<div class="empty">ยิงบาร์โค้ดหรือแตะสินค้าเพื่อเริ่มขาย</div>`}</div>
   <div class="sum"><span>รวม</span><span>${fmt(T.sub)}</span><span>ส่วนลด</span><span><input class="in-" id="ds" value="${disc||""}" inputmode="decimal" placeholder="0" style="width:90px;text-align:right;padding:4px 8px"></span><span class="big">ยอดชำระ</span><span class="big">฿${fmt(T.total)}</span></div>
   <div class="seg">${Object.keys(PAY).map(k=>`<button class="${pay===k?"on":""}" data-pay="${k}" type="button">${PAY[k]}</button>`).join("")}</div>
   ${pay==="cash"?`<div class="f"><label>รับเงินมา</label><input class="in-" id="rv" inputmode="decimal" placeholder="${fmt(T.total)}" style="font-size:1.2rem"></div><div class="cash">${[20,50,100,500,1000].map(v=>`<button data-r="${v}" type="button">${v}</button>`).join("")}<button data-r="x" type="button">พอดี</button></div><div class="sum"><span>เงินทอน</span><span class="big" id="chg">฿0.00</span></div>`:""}
   <button class="btn main lg edm-lock" id="pay" type="button" ${cart.length?"":"disabled"}>✅ รับเงิน ฿${fmt(T.total)}</button>${cart.length?`<button class="btn ghost sm danger" id="clr" type="button">ล้างตะกร้า</button>`:""}`;
  const re=()=>{const r=num($("#rv")&&$("#rv").value),c=r-T.total;if($("#chg"))$("#chg").textContent=r?(c>=0?"฿"+fmt(c):"ขาด ฿"+fmt(-c)):"฿0.00"};
  $$("[data-m]").forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.m];l.q=num(l.q)-1;if(l.q<=0)cart.splice(+b.dataset.m,1);drawCart()});
  $$("[data-p]").forEach(b=>b.onclick=()=>{cart[+b.dataset.p].q=num(cart[+b.dataset.p].q)+1;drawCart()});
  $$("[data-q]").forEach(x=>x.onchange=()=>{const l=cart[+x.dataset.q];l.q=num(x.value);if(l.q<=0)cart.splice(+x.dataset.q,1);drawCart()});
  $("#ds").onchange=e=>{disc=num(e.target.value);drawCart()};$$("[data-pay]").forEach(b=>b.onclick=()=>{pay=b.dataset.pay;drawCart()});
  if($("#rv")){$("#rv").oninput=re;$$("[data-r]").forEach(b=>b.onclick=()=>{$("#rv").value=b.dataset.r==="x"?T.total:num($("#rv").value)+num(b.dataset.r);re()});$("#rv").onkeydown=e=>{if(e.key==="Enter")$("#pay").click()}}
  if($("#clr"))$("#clr").onclick=()=>{if(confirm("ล้างตะกร้า?")){cart=[];disc=0;drawCart()}};
  $("#pay").onclick=()=>{if(!cart.length)return;const T2=cTot();let recv=T2.total;if(pay==="cash"){recv=num($("#rv").value)||T2.total;if(recv<T2.total)return toast("รับเงินไม่พอ")}
    const s={id:uid("s"),no:nextNo(),ts:Date.now(),date:today(),lines:cart.map(l=>({pid:l.pid,d:l.d,q:num(l.q),p:num(l.p)})),sub:T2.sub,disc:num(disc),total:T2.total,pay,recv,change:r2(recv-T2.total),by:localStorage.getItem("edm_who")||""};
    const tx=LS.get(K.tx,[])||[];s.lines.forEach(l=>{if(l.pid)tx.push({id:uid("t"),type:"out",date:s.date,pid:l.pid,qty:l.q,cost:0,note:"ขายหน้าร้าน "+s.no,ts:Date.now(),src:"pos",ref:s.id})});LS.set(K.tx,tx);

async function camScan(){if(!("BarcodeDetector" in window)){toast("เครื่องนี้สแกนด้วยกล้องไม่ได้ ใช้เครื่องยิงบาร์โค้ด หรือพิมพ์รหัสแทน");return}

  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});const v=$("#cam");v.srcObject=stream;await v.play();const det=new BarcodeDetector();let last="",lastT=0;
    const tick=async()=>{if(!stream)return;try{const r=await det.detect(v);if(r[0]){const c=r[0].rawValue;if(c!==last||Date.now()-lastT>1500){last=c;lastT=Date.now();if(addByCode(c))toast("เพิ่ม "+c);else toast("ไม่พบรหัส "+c)}}}catch(e){}requestAnimationFrame(tick)};tick()}catch(e){toast("เปิดกล้องไม่ได้");closeCam()}}
