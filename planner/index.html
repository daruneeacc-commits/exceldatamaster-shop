<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EDM Planner">
<meta name="theme-color" content="#1e7a46">
<title>EDM SME Planner 2027</title>
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--p:#1e7a46;--bg:#f6f5f1;--card:#fff;--tx:#23262a;--mut:#6b7178;--bd:#e4e2dc;--red:#c0392b;--amb:#c58a00;--grn:#1e7a46}
body.rose{--p:#a8435f}body.ocean{--p:#1f6f8b}body.lav{--p:#6b4fa0}body.cocoa{--p:#7a5240}
body.dark{--bg:#17191b;--card:#222528;--tx:#e9e9e9;--mut:#9aa0a6;--bd:#34383c}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
:root{--pl:color-mix(in srgb,var(--p) 13%,var(--card))}
body{--pl:color-mix(in srgb,var(--p) 13%,var(--card))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd)}
.ic{vertical-align:-5px;flex:none;overflow:visible}h2 .ic{vertical-align:-6px}aside a{align-items:center}
.logo{width:34px;height:34px;border-radius:9px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
header h1{font-size:16px;margin:0;flex:1;line-height:1.2}header h1 small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;width:38px;height:38px;font-size:17px;cursor:pointer}
aside{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--card);border-right:1px solid var(--bd);padding:14px 10px 30px;overflow:auto;z-index:30;transform:translateX(-100%);transition:.2s}
aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
aside .sec{font-size:11px;color:var(--mut);letter-spacing:.08em;margin:14px 10px 4px}
aside a{display:flex;gap:10px;padding:9px 10px;border-radius:9px;color:var(--tx);text-decoration:none;cursor:pointer}
aside a.on{background:var(--pl);color:var(--p);font-weight:700}
main{padding:16px;max-width:1000px;margin:0 auto;padding-bottom:90px}
@media(min-width:900px){aside{transform:none;top:59px}#mb{display:none}main{margin-left:250px;padding:24px 32px}}
h2{font-size:22px;margin:4px 0 2px}.sub{color:var(--mut);margin:0 0 14px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:15.5px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:20px}.stat span{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--p)}
textarea{width:100%;min-height:180px}
.f{flex:1 1 140px}
.btn{font:inherit;border:0;background:var(--p);color:#fff;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn.o{background:transparent;color:var(--p);border:1px solid var(--p)}.btn.s{padding:4px 9px;font-size:13px}
.x{border:0;background:none;color:var(--mut);cursor:pointer;font-size:16px;padding:2px 6px}
.li{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--bd)}.li:last-child{border:0}
.li .t{flex:1;min-width:0}.done .t{text-decoration:line-through;color:var(--mut)}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:20px;background:var(--pl);color:var(--p);margin-left:4px;white-space:nowrap}
.tag.r{background:color-mix(in srgb,var(--red) 14%,var(--card));color:var(--red)}
.tag.a{background:color-mix(in srgb,var(--amb) 16%,var(--card));color:var(--amb)}
.mut{color:var(--mut);font-size:13px}.red{color:var(--red)}.grn{color:var(--grn)}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--p)}
.bar i.over{background:var(--red)}
.hero{background:var(--pl);border:0}.hero h2{font-size:26px}
.warn{background:color-mix(in srgb,var(--amb) 14%,var(--card));border-color:color-mix(in srgb,var(--amb) 40%,var(--card))}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--mut)}
.cal .d{min-height:64px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:3px 4px;font-size:11px;cursor:pointer;overflow:hidden}
.cal .d.o{opacity:.35}.cal .d.t{border:2px solid var(--p)}.cal .d.sel{background:var(--pl)}
.cal .d .n{font-weight:700;font-size:13px}.cal .d.hol .n{color:var(--red)}
.dot{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:0 3px;margin-top:2px;background:var(--pl);color:var(--p)}
.dot.h{background:color-mix(in srgb,var(--red) 12%,var(--card));color:var(--red)}.dot.x{background:color-mix(in srgb,var(--amb) 15%,var(--card));color:var(--amb)}
.kb{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.kc{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px}
.kc h4{margin:2px 4px 8px;font-size:14px}
.kcard{background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:8px;margin-bottom:6px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}td.c,th.c{text-align:center}td.r,th.r{text-align:right}
.scroll{overflow-x:auto}
.sw{display:inline-block;width:30px;height:30px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd);cursor:pointer}
.sw.on{box-shadow:0 0 0 2px var(--tx)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:50}
#toast.on{opacity:1}
.lic{font-size:12px;color:var(--mut);text-align:center;margin-top:24px}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:9px;overflow:hidden}.seg button{font:inherit;border:0;background:var(--card);color:var(--tx);padding:6px 12px;cursor:pointer}.seg button.on{background:var(--p);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ===== EDM SME Planner 2027 · © Excel Data Master ===== */
const LICENSED_TO = 'ตัวอย่าง (Demo)'; // ← เปลี่ยนเป็นชื่อผู้ซื้อก่อนส่งไฟล์
const K = 'edm_sme_planner_2027_v1';
const TH_M=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const TH_MF=['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_D=['อา','จ','อ','พ','พฤ','ศ','ส'];
const HOL={'01-01':'วันขึ้นปีใหม่','04-06':'วันจักรี','04-13':'วันสงกรานต์','04-14':'วันสงกรานต์','04-15':'วันสงกรานต์','05-01':'วันแรงงาน','05-04':'วันฉัตรมงคล','06-03':'วันเฉลิมฯ พระราชินี','07-28':'วันเฉลิมฯ ร.10','08-12':'วันแม่แห่งชาติ','10-13':'วันนวมินทรมหาราช','10-23':'วันปิยมหาราช','12-05':'วันพ่อแห่งชาติ','12-10':'วันรัฐธรรมนูญ','12-31':'วันสิ้นปี'};
const CAT_IN=['ขายสินค้า','ค่าบริการ','รายได้อื่น'];
const CAT_OUT=['ต้นทุนสินค้า','ค่าเช่า','เงินเดือน','ค่าน้ำ-ไฟ-เน็ต','ค่าขนส่ง','การตลาด','ภาษี/ค่าธรรมเนียม','ใช้จ่ายส่วนตัว','อื่นๆ'];
const THEMES=[['excel','#1e7a46','Excel Green'],['rose','#a8435f','Rosé'],['ocean','#1f6f8b','Ocean'],['lav','#6b4fa0','Lavender'],['cocoa','#7a5240','Cocoa']];
const NAV=[['home','🏠','หน้าแรก'],['cal','📅','ปฏิทิน'],['tasks','✅','งาน & To-do'],['goals','🎯','เป้าหมาย'],['money','💰','รายรับรายจ่าย'],['habits','🔁','นิสัยประจำวัน'],['journal','📝','บันทึกประจำวัน'],['-','','ธุรกิจ'],['sales','🧾','ยอดขายรายวัน'],['stock','','สต๊อกสินค้า'],['tax','🏛️','ปฏิทินภาษี'],['cust','👥','ลูกค้า / ลูกหนี้'],['staff','','พนักงาน & เงินเดือน'],['-','','ระบบ'],['set','⚙️','ตั้งค่า & สำรองข้อมูล']];

/* ---------- cute icons ---------- */
const SK='#4a3530';
function face(x,y,s=1){return`<circle cx="${x-2.2*s}" cy="${y}" r="${.85*s}" fill="${SK}" stroke="none"/><circle cx="${x+2.2*s}" cy="${y}" r="${.85*s}" fill="${SK}" stroke="none"/><path d="M${x-1*s} ${y+1.3*s}q${s} ${s} ${2*s} 0" fill="none" stroke-width="1.2"/><ellipse cx="${x-3.6*s}" cy="${y+1.4*s}" rx="${1.1*s}" ry="${.7*s}" fill="#ff9fb5" stroke="none" opacity=".85"/><ellipse cx="${x+3.6*s}" cy="${y+1.4*s}" rx="${1.1*s}" ry="${.7*s}" fill="#ff9fb5" stroke="none" opacity=".85"/>`}
const gear=()=>{let s='';for(let i=0;i<8;i++){const a=i*Math.PI/4;s+=`<circle cx="${(12+7.6*Math.cos(a)).toFixed(2)}" cy="${(12+7.6*Math.sin(a)).toFixed(2)}" r="2.1" fill="#d6dcf5"/>`}return s+`<circle cx="12" cy="12" r="7.6" fill="#d6dcf5"/>`+face(12,12,.75)};
const ICO={
stock:`<path d="M4 8.5 12 4.5l8 4V18l-8 4-8-4z" fill="#f3cf9b"/><path d="M4 8.5l8 4 8-4M12 12.5V22" fill="none"/><path d="M8 6.5l8 4" fill="none" stroke="#c99a5c"/>${face(8.2,15,.6)}`,
staff:`<circle cx="12" cy="8.5" r="4.8" fill="#ffe0c2"/><path d="M4.5 21c0-4 3.4-6.5 7.5-6.5s7.5 2.5 7.5 6.5z" fill="#bcd9ff"/><path d="M12 14.5l-1.3 2.2L12 21l1.3-4.3z" fill="#ff9fb5"/>${face(12,8.6,.62)}`,
home:`<path d="M4 11.5 12 4.5l8 7V20a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z" fill="#ffd6a5"/><path d="M2.8 12.2 12 4l9.2 8.2" fill="none" stroke="#e8846b" stroke-width="2.2"/>${face(12,15)}`,
cal:`<rect x="3.5" y="5" width="17" height="15.5" rx="3.5" fill="#d6ebff"/><path d="M3.5 10V8.5A3.5 3.5 0 0 1 7 5h10a3.5 3.5 0 0 1 3.5 3.5V10z" fill="#8ec5ff"/><path d="M8 3.3v3.4M16 3.3v3.4" fill="none"/>${face(12,15,.9)}`,
tasks:`<rect x="5" y="4.5" width="14" height="16.5" rx="3" fill="#c8f0cf"/><rect x="9" y="3" width="6" height="3.2" rx="1.2" fill="#fff"/>${face(12,11.5,.8)}<path d="M9.2 17.2l1.9 1.7 3.8-3.4" fill="none" stroke="#2e9e5b" stroke-width="1.8"/>`,
goals:`<path d="M12 3.2l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.5l-5.2 2.7 1-5.8L3.6 9.3l5.8-.8z" fill="#ffe27a"/>${face(12,11.6,.72)}`,
money:`<circle cx="12.5" cy="4.6" r="2.3" fill="#ffd85e"/><path d="M8.6 9 7.4 5.6l3.3 1.6" fill="#ffc6d6"/><ellipse cx="12" cy="13.5" rx="8" ry="6" fill="#ffc6d6"/><ellipse cx="19.6" cy="13.6" rx="1.6" ry="2" fill="#ff9fb8"/><path d="M8 19.2v1.8M15.5 19.2v1.8" fill="none"/>${face(11,12.6,.8)}`,
habits:`<path d="M12 14V9.5" fill="none"/><path d="M12 10.5C8.5 10.5 6.5 8.5 6.5 5.5c3.5 0 5.5 2 5.5 5z" fill="#9be3a6"/><path d="M12 9.5c0-3 2-5 5.5-5 0 3-2 5-5.5 5z" fill="#7fd492"/><path d="M6.5 14h11l-1.3 6.4a1 1 0 0 1-1 .8H8.8a1 1 0 0 1-1-.8z" fill="#f4b993"/>${face(12,17,.65)}`,
journal:`<rect x="5" y="3.5" width="14" height="17" rx="2.5" fill="#e2d3ff"/><path d="M8.5 3.5v17" fill="none"/><path d="M14.5 3.5v5l1.5-1.2 1.5 1.2v-5" fill="#ff9fb5"/>${face(13.6,13,.72)}`,
sales:`<path d="M9 8.5V7a3 3 0 0 1 6 0v1.5" fill="none"/><path d="M5 8.5h14l-1 11.6a1.5 1.5 0 0 1-1.5 1.4h-9A1.5 1.5 0 0 1 6 20.1z" fill="#ffd3b8"/>${face(12,14.4,.85)}`,
tax:`<path d="M6 3.5h12V21l-2-1.4-2 1.4-2-1.4-2 1.4-2-1.4L6 21z" fill="#c4efe6"/>${face(12,9.6,.75)}<path d="M9 14.5h6M9 17h4" fill="none"/>`,
cust:`<circle cx="16.3" cy="9.3" r="3.7" fill="#ffe0a3"/><path d="M12 20.5c0-3.4 2-5.3 4.3-5.3s4.3 1.9 4.3 5.3z" fill="#ffe0a3"/><circle cx="9.3" cy="10.4" r="4.6" fill="#ffc6d6"/><path d="M3.3 21c0-3.6 2.7-5.6 6-5.6s6 2 6 5.6z" fill="#ffc6d6"/>${face(9.3,10.4,.62)}`,
set:gear(),
cloud:`<path d="M7 18.5h10a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.6 1.2A3.4 3.4 0 0 0 7 18.5z" fill="#d9ecff"/>${face(12,14,.72)}`,
phone:`<rect x="6.5" y="2.8" width="11" height="18.6" rx="3" fill="#ffd6e7"/><path d="M10.5 5h3" fill="none"/>${face(12,12,.75)}`,
pin:`<path d="M12 21s-6-5.6-6-10.5a6 6 0 0 1 12 0C18 15.4 12 21 12 21z" fill="#ffb3c7"/>${face(12,10.4,.7)}`,
todo:`<circle cx="12" cy="12" r="8" fill="#ffe0a3"/>${face(12,11.5,.8)}`,
doing:`<circle cx="12" cy="12" r="8" fill="#cfe6ff"/>${face(12,11.5,.8)}`,
done:`<circle cx="12" cy="12" r="8" fill="#c8f0cf"/>${face(12,11.5,.8)}`
};
const ic=(n,s=22)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" stroke="${SK}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">${ICO[n]||''}</svg>`;
/* น้องเซลล์ mascot */
const cell=(s=34)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 40 40" stroke="${SK}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="4" y="6" width="32" height="28" rx="8" fill="#8edba6"/><path d="M4 15h32M15 6v9" fill="none" stroke="#5fbf80" stroke-width="1.4"/><rect x="31" y="29" width="6" height="6" rx="1.5" fill="#fff"/><circle cx="15" cy="22" r="1.5" fill="${SK}" stroke="none"/><circle cx="25" cy="22" r="1.5" fill="${SK}" stroke="none"/><path d="M18 25q2 2 4 0" fill="none"/><ellipse cx="11.5" cy="25" rx="2" ry="1.2" fill="#ff9fb5" stroke="none"/><ellipse cx="28.5" cy="25" rx="2" ry="1.2" fill="#ff9fb5" stroke="none"/></svg>`;

/* ---------- helpers ---------- */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const TODAY=()=>iso(new Date());
const pd=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c||1)};
const th=s=>{if(!s)return'';const d=pd(s);return d.getDate()+' '+TH_M[d.getMonth()]+' '+(d.getFullYear()+543)};
const thym=m=>{const[y,mm]=m.split('-').map(Number);return TH_MF[mm-1]+' '+(y+543)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const money=n=>(+n||0).toLocaleString('th-TH',{maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};
const sum=(a,f)=>a.reduce((t,x)=>t+(+f(x)||0),0);
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800)}

/* ---------- data ---------- */
function blank(){return{s:{name:'',biz:'',theme:'excel',dark:false,vat:true,emp:true,wht:true,lastBackup:0,ssoRate:5,ssoMax:17500},tasks:[],events:[],goals:[],tx:[],budget:{},habits:[],hlog:{},journal:{},sales:[],cust:[],taxDone:{},products:[],moves:[],staff:[],pay:{}}}
function load(){try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.s){const b=blank();for(const k in b)if(r[k]===undefined)r[k]=b[k];r.s=Object.assign(b.s,r.s);return r}}catch(e){}return blank()}
let D=load();
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('⚠️ บันทึกไม่สำเร็จ กรุณาสำรองข้อมูล')}}
let _st;function saveSoon(){clearTimeout(_st);_st=setTimeout(save,400)}
const T0=TODAY();
let cur=(location.hash||'#home').slice(1),ui={cy:+T0.slice(0,4),cm:+T0.slice(5,7),sel:T0,tv:'list',mon:T0.slice(0,7),jd:T0,ty:Math.max(2027,+T0.slice(0,4))};

/* ---------- tax ---------- */
function taxList(y){const L=[],s=D.s;
 for(let m=1;m<=12;m++){const per=m===1?TH_MF[11]+' '+(y-1+543):TH_MF[m-2]+' '+(y+543);
  const add=(day,code,name,on)=>L.push({id:y+'-'+pad(m)+'|'+code,date:y+'-'+pad(m)+'-'+pad(day),name,per:'งวด '+per,on});
  if(s.emp){add(7,'pnd1','ภ.ง.ด.1 หัก ณ ที่จ่ายเงินเดือน',1);add(15,'sso','ประกันสังคม สปส.1-10',0)}
  if(s.wht){add(7,'pnd3','ภ.ง.ด.3 หัก ณ ที่จ่าย (บุคคลธรรมดา)',1);add(7,'pnd53','ภ.ง.ด.53 หัก ณ ที่จ่าย (นิติบุคคล)',1)}
  if(s.vat)add(15,'pp30','ภ.พ.30 ภาษีมูลค่าเพิ่ม',1)}
 const A=(date,code,name,per)=>L.push({id:y+'|'+code,date,name,per,on:1,an:1});
 if(s.emp)A(y+'-02-'+new Date(y,2,0).getDate(),'pnd1k','ภ.ง.ด.1ก สรุปเงินเดือนทั้งปี','ปี '+(y-1+543));

staff(){const m=ui.mon,L=D.staff.map(e=>[e,payOf(e,m)]),tg=sum(L,x=>x[1].g),ts=sum(L,x=>x[1].sso),tn=sum(L,x=>x[1].net),inp=(id,k,v)=>`<input type="number" inputmode="decimal" value="${v||''}" placeholder="0" style="width:80px;padding:3px 6px" onchange="setPay('${id}','${m}','${k}',this.value)">`;
 return`<h2>พนักงาน & เงินเดือน</h2><p class="sub">คำนวณเงินเดือนแบบง่าย พร้อมหักประกันสังคมอัตโนมัติ</p>
 <div class="card"><h3>เพิ่มพนักงาน</h3><div class="row"><input id="fN" class="f" placeholder="ชื่อ-นามสกุล"><input id="fP" placeholder="ตำแหน่ง" style="width:120px"><input id="fS" type="number" inputmode="decimal" placeholder="เงินเดือน" style="width:110px"><input id="fD" type="date" title="วันเริ่มงาน"><input id="fT" type="tel" placeholder="เบอร์โทร" style="width:120px"><button class="btn" onclick="addStaff()">เพิ่ม</button></div></div>
 <div class="row" style="margin-bottom:12px"><input type="month" value="${m}" onchange="ui.mon=this.value||ui.mon;render()"><span class="f"></span><button class="btn o s" onclick="payToExp()">บันทึกเป็นรายจ่าย</button><button class="btn o s" onclick="exPay()">⬇ Excel</button></div>
 <div class="stats"><div class="stat"><span>พนักงาน</span><b>${D.staff.length} คน</b></div><div class="stat"><span>รวมรายได้</span><b>${money(tg)}</b></div><div class="stat"><span>ประกันสังคม (ลูกจ้าง)</span><b>${money(ts)}</b></div><div class="stat"><span>จ่ายสุทธิ</span><b class="grn">${money(tn)}</b></div></div>
 <div class="card scroll"><h3>เงินเดือน ${thym(m)}</h3><table><tr><th>พนักงาน</th><th class="r">เงินเดือน</th><th class="r">OT</th><th class="r">โบนัส/อื่นๆ</th><th class="r">ประกันสังคม</th><th class="r">หักอื่นๆ</th><th class="r">สุทธิ</th><th></th></tr>${L.map(([e,p])=>`<tr><td><b>${esc(e.name)}</b><div class="mut">${esc(e.pos||'')}${e.start?' · เริ่ม '+th(e.start):''}</div></td><td class="r">${inp(e.id,'sal',p.sal)}</td><td class="r">${inp(e.id,'ot',p.ot)}</td><td class="r">${inp(e.id,'bo',p.bo)}</td><td class="r">${money(p.sso)}</td><td class="r">${inp(e.id,'de',p.de)}</td><td class="r"><b>${money(p.net)}</b></td><td><button class="x" onclick="if(confirm('ลบพนักงานนี้?'))del('staff','${e.id}')">✕</button></td></tr>`).join('')||'<tr><td colspan="8" class="mut">ยังไม่มีพนักงาน</td></tr>'}</table></div>
 <div class="card"><h3>ตั้งค่าประกันสังคม</h3><div class="row"><span>อัตรา</span><input type="number" value="${D.s.ssoRate}" style="width:70px" onchange="setS('ssoRate',+this.value||0)"><span>% ฐานค่าจ้างสูงสุด</span><input type="number" value="${D.s.ssoMax}" style="width:100px" onchange="setS('ssoMax',+this.value||0)"><span>บาท</span></div><p class="mut">* ตรวจสอบอัตราและเพดานค่าจ้างล่าสุดกับสำนักงานประกันสังคม · หน้านี้ยังไม่คำนวณภาษีหัก ณ ที่จ่าย สลิปเงินเดือน และ OT อัตโนมัติ หากต้องการระบบเต็ม ใช้ <b>Excel HR Pro</b> ที่ exceldatamaster.com</p></div>`},
set(){const lb=D.s.lastBackup?new Date(D.s.lastBackup).toLocaleString('th-TH'):'ยังไม่เคย';
 return`<h2>ตั้งค่า & สำรองข้อมูล</h2><p class="sub">ปรับให้เป็นของคุณ</p>
 <div class="card"><h3>ข้อมูลของคุณ</h3><div class="row"><input class="f" placeholder="ชื่อของคุณ" value="${esc(D.s.name)}" onchange="setS('name',this.value.trim())"><input class="f" placeholder="ชื่อธุรกิจ / ร้าน" value="${esc(D.s.biz)}" onchange="setS('biz',this.value.trim())"></div></div>
 <div class="card"><h3>ธีม</h3><div class="row">${THEMES.map(([k,c,n])=>`<span class="sw ${D.s.theme===k?'on':''}" style="background:${c}" title="${n}" onclick="setS('theme','${k}')"></span>`).join('')}<span class="f"></span><label class="row"><input type="checkbox" ${D.s.dark?'checked':''} onchange="setS('dark',this.checked)">โหมดมืด</label></div></div>
 <div class="card"><h3>${ic('cloud')} สำรอง / กู้ข้อมูล</h3><p class="mut">ข้อมูลทั้งหมดเก็บในเครื่องนี้เท่านั้น ไม่ส่งขึ้นอินเทอร์เน็ต ไม่ sync ข้ามเครื่อง แนะนำให้สำรองทุกสัปดาห์ และใช้ไฟล์สำรองย้ายข้อมูลไปเครื่องอื่น<br>สำรองล่าสุด: <b>${lb}</b></p><div class="row"><button class="btn" onclick="backup()">⬇ ดาวน์โหลดไฟล์สำรอง</button><label class="btn o">⬆ กู้จากไฟล์<input type="file" accept=".json,application/json" hidden onchange="restore(this)"></label></div></div>
 <div class="card"><h3>${ic('phone')} ใช้บนมือถือ</h3><p class="mut">iPhone: เปิดไฟล์ด้วย Safari → ปุ่มแชร์ → "เพิ่มไปยังหน้าจอโฮม" เพื่อใช้เหมือนแอป<br>Android: Chrome → เมนู ⋮ → "เพิ่มลงในหน้าจอหลัก"<br>⚠️ iPhone อาจล้างข้อมูลของเว็บที่ไม่ได้เปิดนาน กรุณาสำรองข้อมูลสม่ำเสมอ</p></div>
 <div class="card"><h3>อื่นๆ</h3><div class="row"><button class="btn o" onclick="demo()">ใส่ข้อมูลตัวอย่าง</button><button class="btn o" style="color:var(--red);border-color:var(--red)" onclick="resetAll()">ล้างข้อมูลทั้งหมด</button></div></div>`}
};

/* ---------- render ---------- */
function render(){if(!P[cur])cur='home';
 document.body.className=D.s.theme+(D.s.dark?' dark':'');
 const nav=NAV.map(([k,i,n])=>k==='-'?`<div class="sec">${n}</div>`:`<a class="${cur===k?'on':''}" onclick="go('${k}')">${ic(k,26)}${n}</a>`).join('');
 document.getElementById('app').innerHTML=`<header><button class="ib" id="mb" onclick="document.querySelector('aside').classList.toggle('open')">☰</button>${cell(38)}<h1>EDM SME Planner 2027<small>${D.s.biz?esc(D.s.biz):'by Excel Data Master'}</small></h1><button class="ib" onclick="setS('dark',!D.s.dark)">${D.s.dark?'☀️':'🌙'}</button></header>
 <aside onclick="if(event.target===this)this.classList.remove('open')">${nav}</aside>
 <main>${cur==='home'?P[cur]():P[cur]().replace('<h2>','<h2>'+ic(cur,32)+' ')}<div class="lic">EDM SME Planner 2027 · © Excel Data Master · exceldatamaster.com<br>ลิขสิทธิ์ใช้งานโดย: <b>${esc(LICENSED_TO)}</b> · ห้ามแจกจ่ายหรือจำหน่ายต่อ</div></main>`}
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==cur&&P[h]){cur=h;render()}});
render();
</script>
