<script>
(function(){
"use strict";
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert("บันทึกไม่ได้ (พื้นที่เต็ม)");return false}}};
const K={cfg:"edm_sales_cfg",data:"edm_sales_data",ui:"edm_sales_ui"};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0"),ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date());
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."],MF=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const thD=s=>{if(!s)return"-";const[y,m,d]=s.split("-");return +d+" "+MS[+m-1]+" "+String(+y+543).slice(2)};
const thM=m=>{const[y,mm]=m.split("-");return MF[+mm-1]+" "+(+y+543)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const money=n=>Math.round(n||0).toLocaleString("en-US");
const addM=(m,n)=>{const[y,mm]=m.split("-").map(Number),d=new Date(y,mm-1+n,1);return d.getFullYear()+"-"+pad(d.getMonth()+1)};
const dim=m=>{const[y,mm]=m.split("-").map(Number);return new Date(y,mm,0).getDate()};
const addD=(s,n)=>{const d=new Date(s+"T00:00");d.setDate(d.getDate()+n);return ymd(d)};
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const S=window.EDM_SALES;
function qrSvg(t){try{const q=qrcode(0,"M");q.addData(t);q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(e){return""}}
const KIND={call:["โทร","📞"],meet:["นัดคุย / เข้าพบ","🤝"],quote:["เสนอราคา","📄"],follow:["ติดตาม","🔁"],sale:["ปิดการขาย","💰"]};
const DSKILLS=["หาลูกค้าใหม่","นัดคุย / เปิดบทสนทนา","นำเสนอสินค้า","ต่อรองและปิดการขาย","ติดตามลูกค้าเก่า"];
const DSTD={call:100,meet:10,quote:12,follow:15};
let cfg=Object.assign({team:"",key:"",demo:false},LS.get(K.cfg,{})||{});
let D=LS.get(K.data,null)||{team:{name:"",cfg:{std:Object.assign({},DSTD),skills:DSKILLS.slice(),plan:[]}},reps:[],logs:[]};
D.team=D.team||{name:"",cfg:{}};D.team.cfg=Object.assign({std:Object.assign({},DSTD),skills:DSKILLS.slice(),plan:[]},D.team.cfg||{});D.reps=D.reps||[];D.logs=D.logs||[];
let ui=Object.assign({v:"dash",m:today().slice(0,7),rep:"",fr:"",fk:""},LS.get(K.ui,{})||{});
const saveC=()=>LS.set(K.cfg,cfg),persist=()=>LS.set(K.data,D),saveUi=()=>LS.set(K.ui,ui);
const online=()=>!!(cfg.team&&cfg.key&&S&&S.api);
function paidMs(){const m=window.EDM_MEMBER&&EDM_MEMBER.me;if(!m)return 0;const X=m.sx||{};return Object.keys(X).length?(Number(X.sales)||0):(Number(m.exp)||0)}
const mreq=o=>S.call(Object.assign({team:cfg.team,key:cfg.key,paid:paidMs()},o));

/* ---------- ข้อมูล: ออนไลน์ (หลังบ้าน) หรือเครื่องเดียว ---------- */
let busy=false;
async function refresh(quiet){if(!online()){render();return}
  busy=true;if(!quiet)$("#main").classList.add("loading");
  try{const r=await mreq({a:"m_get",from:addD(ui.m+"-01",-7),to:ui.m+"-31"});D.team=r.team;D.team.cfg=Object.assign({std:Object.assign({},DSTD),skills:DSKILLS.slice(),plan:[]},r.team.cfg||{});if(!D.team.cfg.skills.length)D.team.cfg.skills=DSKILLS.slice();D.reps=r.reps;D.logs=r.logs;D.at=Date.now();persist()}
  catch(e){toast(S.msg(e));if(e.message==="no_access"){/* กุญแจผิด: เก็บไว้ให้เจ้าของตัดสินใจในหน้าตั้งค่า */}}
  busy=false;$("#main").classList.remove("loading");render()}
async function saveTeam(p){// p: {name?, cfg?, reps?:[{id,...}]}
  if(online()){const r=await mreq(Object.assign({a:"m_save"},p));D.team=r.team;D.team.cfg=Object.assign({std:Object.assign({},DSTD),skills:DSKILLS.slice(),plan:[]},r.team.cfg||{});D.reps=r.reps;persist();return}
  if(p.name!=null)D.team.name=p.name;if(p.cfg)D.team.cfg=p.cfg;
  (p.reps||[]).forEach(x=>{const i=D.reps.findIndex(r=>r.id===x.id);if(x.del){if(i>=0)D.reps.splice(i,1);return}
    const o=i>=0?D.reps[i]:{id:x.id||uid("r"),name:"",zone:"",target:0,active:true,skills:{},idp:[],notes:[]};const c=Object.assign({},x);delete c.pin;Object.assign(o,c);if(x.pin)o.hasPin=true;if(i<0)D.reps.push(o)});
  if(D.reps.filter(r=>r.active!==false).length>10)throw new Error("max_reps");persist()}
async function addLog(l){if(online()){const r=await mreq({a:"m_log",log:l});const i=D.logs.findIndex(x=>x.id===r.log.id);i>=0?D.logs[i]=r.log:D.logs.push(r.log);persist();return}
  l.id=l.id||uid("l");l.ts=Date.now();l.by="mgr";const i=D.logs.findIndex(x=>x.id===l.id);i>=0?D.logs[i]=l:D.logs.push(l);persist()}
async function delLog(id){if(online())await mreq({a:"m_del",id});D.logs=D.logs.filter(l=>l.id!==id);persist()}
const guard=fn=>async(...a)=>{try{await fn(...a)}catch(e){toast(S.msg(e))}};

/* ---------- คำนวณ ---------- */
const actReps=()=>D.reps.filter(r=>r.active!==false);
const repById=id=>D.reps.find(r=>r.id===id);
const mLogs=()=>D.logs.filter(l=>l.date&&l.date.slice(0,7)===ui.m);
function stat(rep,L){L=(L||mLogs()).filter(l=>l.rep===rep.id);const c={call:0,meet:0,quote:0,follow:0,sale:0},amt=L.reduce((a,l)=>{c[l.kind]=(c[l.kind]||0)+1;return a+(l.kind==="sale"?+l.amount||0:0)},0);
  const pct=rep.target?Math.round(amt/rep.target*100):0,fr=paceFrac(),exp=rep.target*fr,pace=exp?Math.round(amt/exp*100):0;
  const st=!rep.target?"none":pct>=100?"over":!fr?"wait":pace>=100?"ok":pace>=85?"near":"coach";
  return{amt,c,deals:c.sale,pct,pace,exp,st,conv:c.quote?Math.round(c.sale/c.quote*100):null,avg:c.sale?amt/c.sale:0}}

function paceFrac(){const t=today(),m=ui.m,cur=t.slice(0,7);if(m<cur)return 1;if(m>cur)return 0;let a=0,b=0;for(let d=1;d<=dim(m);d++){const ds=m+"-"+pad(d);if(!isWork(ds))continue;b++;if(ds<=t)a++}return b?a/b:1}
function daysLeft(){const t=today(),m=ui.m,cur=t.slice(0,7);if(m<cur)return 0;let n=0;const s=m===cur?+t.slice(8):1;for(let d=s;d<=dim(m);d++){if(new Date(m+"-"+pad(d)+"T00:00").getDay()!==0)n++}return n}

   addlog(){logDlg(id)},dellog:guard(async()=>{const l=D.logs.find(x=>x.id===id);if(!l||!confirm("ลบรายการนี้?"))return;await delLog(id);render()}),
   note:guard(async()=>{const t=$("#nt").value.trim();if(!t)return $("#nt").focus();const r=repById(id);const n=(r.notes||[]).concat([{d:today(),t}]).slice(-40);await saveTeam({reps:[{id,notes:n}]});toast("บันทึกแล้ว ✓");render()}),
   copy(){const i=$("#lk");i.select();(navigator.clipboard?navigator.clipboard.writeText(i.value):Promise.reject()).then(()=>toast("คัดลอกแล้ว ✓"),()=>{document.execCommand("copy");toast("คัดลอกแล้ว ✓")})},
   skadd(){const c=D.team.cfg;readSkills();if((c.skills||[]).length<8){c.skills.push("");vSet();const L=$$("[data-skn]");L[L.length-1].focus()}},
   saveset:guard(async()=>{readSkills();const c=Object.assign({},D.team.cfg,{std:{}});["call","meet","quote","follow"].forEach(k=>c.std[k]=Math.max(0,Math.min(999,Math.round(+$("#sd_"+k).value||0))));c.skills=(c.skills||[]).map(s=>s.trim()).filter(Boolean).slice(0,8);
     await saveTeam({name:$("#tn").value.trim(),cfg:c});toast("บันทึกแล้ว ✓");vSet()}),
   demo(){if(D.reps.length&&!cfg.demo&&!confirm("ใส่ข้อมูลตัวอย่างแทนข้อมูลเดิม?"))return;makeDemo()},
   cleardemo(){if(!confirm("ลบข้อมูลตัวอย่างทั้งหมด?"))return;D={team:{name:"",cfg:{std:Object.assign({},DSTD),skills:DSKILLS.slice(),plan:[]}},reps:[],logs:[]};cfg.demo=false;saveC();persist();ui.v="dash";saveUi();render()},
   goonline:guard(goOnline)}[b.dataset.act]||(()=>{}))()});
function readSkills(){const L=$$("[data-skn]");if(L.length)D.team.cfg.skills=L.map(i=>i.value)}

async function goOnline(){const me=window.EDM_MEMBER&&EDM_MEMBER.me;if(!me||!me.email)return toast("เข้าสู่ระบบสมาชิกก่อน");
  if(cfg.demo&&!confirm("ข้อมูลตัวอย่างจะถูกลบ แล้วเริ่มทีมออนไลน์ใหม่ ตกลง?"))return;
  const btn=$('[data-act="goonline"]');if(btn)btn.disabled=true;toast("กำลังเปิดทีมออนไลน์…");
  try{const keepReps=cfg.demo?[]:D.reps.slice(),keepLogs=cfg.demo?[]:D.logs.slice();
    const r=await S.call({a:"create",email:me.email,name:D.team.name||"ทีมขาย",paid:paidMs(),cfg:cfg.demo?{std:DSTD,skills:DSKILLS,plan:[]}:D.team.cfg});
    cfg.team=r.team;cfg.key=r.key;cfg.demo=false;saveC();
    if(keepReps.length)await mreq({a:"m_save",reps:keepReps.map(x=>({id:x.id,name:x.name,zone:x.zone,target:x.target,active:x.active!==false,skills:x.skills||{},idp:x.idp||[],notes:x.notes||[]}))});
    for(let i=0;i<keepLogs.length;i++){const l=keepLogs[i];if(i%20===0)toast("ย้ายกิจกรรม "+(i+1)+"/"+keepLogs.length);await mreq({a:"m_log",log:{id:l.id,rep:l.rep,kind:l.kind,date:l.date,amount:l.amount,customer:l.customer,note:l.note}})}
    toast("เปิดทีมออนไลน์แล้ว ✓ ตั้ง PIN ให้เซลล์แต่ละคนต่อได้เลย");await refresh();ui.v="set";saveUi();render()}
  catch(e){toast(S.msg(e));if(btn)btn.disabled=false}}

function makeDemo(){const t=today(),m=t.slice(0,7),last=+t.slice(8);let seed=7;const rnd=()=>(seed=(seed*9301+49297)%233280)/233280;
  const P=[["อรุณี ก.","กรุงเทพฯ เหนือ",500000,1.12,{},[4,4,4.5,4.5,4]],["ธนพล ส.","นนทบุรี",500000,.97,{},[4,3.5,4,3,3.5]],["กมลชนก ว.","ปทุมธานี",400000,.9,{},[3.5,3.5,4,3,3]],["วีรยุทธ พ.","กรุงเทพฯ ใต้",400000,.72,{},[3.5,3,4,2,2.5]],["ปวีณา ร.","สมุทรปราการ",350000,.6,{},[3,2.5,3.5,2.5,3]]];
  D={team:{name:"ทีมขาย (ตัวอย่าง)",cfg:{std:Object.assign({},DSTD),skills:DSKILLS.slice(),plan:[{id:"p1",t:"ประชุมเช้า 15 นาที ทุกวัน",m:"ทั้งทีม · 08:30 น.",done:true},{id:"p2",t:"โค้ช 1:1 วีรยุทธ เรื่องปิดการขาย",m:"สัปดาห์นี้ · 30 นาที",done:false},{id:"p3",t:"ซ้อมบทต่อรองราคา (role-play)",m:"ศุกร์ · อรุณีเป็นพี่เลี้ยง",done:false}]}},reps:[],logs:[]};
  P.forEach((p,i)=>{const id="r"+(i+1),sk={};DSKILLS.forEach((s,j)=>sk[s]=p[5][j]);
    D.reps.push({id,name:p[0],zone:p[1],target:p[2],active:true,skills:sk,idp:i===3?[{id:"i1",t:"ตามอรุณีไปพบลูกค้า 2 ครั้ง",m:"ดูวิธีปิดการขาย",due:"สัปดาห์ 1",done:true},{id:"i2",t:"ฝึกบทต่อรองราคากับหัวหน้า",m:"3 สถานการณ์: แพงไป / ขอคิดก่อน / เจ้าอื่นถูกกว่า",due:"สัปดาห์ 1",done:false},{id:"i3",t:"ติดตามดีลค้างภายใน 48 ชม.",m:"",due:"สัปดาห์ 2",done:false}]:[],notes:i===3?[{d:addD(t,-4),t:"ลูกค้าหลุดตอนต่อรองราคา 4 ราย ลดราคาเร็วเกินไป ตกลงฝึกถามความต้องการก่อนลดราคา"}]:[]});
    let wdAll=0;for(let d=1;d<=dim(m);d++)if(isWork(m+"-"+pad(d)))wdAll++;let sold=0,wd=0;
    for(let d=1;d<=last;d++){const ds=m+"-"+pad(d);if(new Date(ds+"T00:00").getDay()===0)continue;const sc=.6+p[3]*.5;
      const add=(k,n,amt)=>{for(let z=0;z<n;z++)D.logs.push({id:uid("l"),rep:id,date:ds,kind:k,amount:amt||0,customer:k==="sale"||k==="quote"?["ร้านสมใจ","บจก. ไทยเจริญ","ร้านเจ๊หมวย","หจก. รุ่งเรือง","ร้านบ้านสวน"][Math.floor(rnd()*5)]:"",note:"",ts:Date.now()-z,by:"rep"})};
      wd++;const due=p[2]*p[3]*wd/wdAll;add("call",Math.round((12+rnd()*8)*sc));add("meet",3+(rnd()<.5?1:0)+(rnd()<.3*sc?1:0));add("follow",Math.round(rnd()*3*sc));let q=2+(rnd()<.6?1:0)+(rnd()<.3?1:0);
      while(sold<due-6000){const a=Math.round((12000+rnd()*16000)/100)*100;add("sale",1,a);sold+=a;}add("quote",q)}});
  cfg.demo=true;saveC();persist();ui.v="dash";ui.m=m;saveUi();render();toast("ใส่ตัวอย่างแล้ว ✓")}

window.addEventListener("storage",e=>{if(e.key===K.data||e.key===K.cfg){cfg=Object.assign(cfg,LS.get(K.cfg,{})||{});D=LS.get(K.data,D)||D;if(!$("#dlg").open)render()}});
render();if(online())refresh(true);
window.addEventListener("edm-member",()=>{if(ui.v==="set")vSet()});
})();
</script>
