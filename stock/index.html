<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบสต๊อกสินค้า · Excel Data Master</title>
<meta name="description" content="ระบบสต๊อกสินค้าออนไลน์ รับเข้า เบิกออก ตรวจนับ ต้นทุนเฉลี่ย แจ้งเตือนสินค้าใกล้หมด บัญชีคุมสต๊อก รายงานประจำเดือน ส่งออก Excel เชื่อมกับระบบเปิดบิล">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#F4F6F5;--card:#fff;--ink:#0F1513;--muted:#66706B;--line:#E2E6E4;--soft:#F4F6F5;--accent:#127A4B;--accent-ink:#fff;--warn:#8A5A00;--warnbg:#FFF4DC;--danger:#B3261E;--dangerbg:#FDE8E7;--okbg:#E3F4EA;--in:#127A4B;--out:#B3261E;--adj:#1F4FA3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1110;--card:#161C1A;--ink:#EEF2F0;--muted:#97A29D;--line:#26302C;--soft:#1C2421;--accent:#4CC48A;--accent-ink:#06120C;--warn:#F0C27A;--warnbg:#2A2416;--danger:#F2867E;--dangerbg:#2C1A19;--okbg:#14261C;--in:#4CC48A;--out:#F2867E;--adj:#8AB4F8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "IBM Plex Sans Thai","Noto Sans Thai",system-ui,sans-serif}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand small{font-weight:500;color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-decoration:none;background:var(--soft);color:var(--ink);font-size:.9rem;justify-content:center}
.btn:hover{filter:brightness(.97)}
.btn.main{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:6px 12px;font-size:.84rem}
.btn.danger{color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
main{max-width:1200px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.tabs{display:flex;gap:6px;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line);position:sticky;top:62px;z-index:15;overflow-x:auto}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font-size:1.05rem;margin:0;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:.82rem}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px var(--line)}
.kpi span{font-size:.8rem;color:var(--muted);display:block}
.kpi b{font-size:1.45rem;font-variant-numeric:tabular-nums;line-height:1.3}
.kpi.warn b{color:var(--warn)}.kpi.bad b{color:var(--danger)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:620px){.row3,.row4{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:.8rem;font-weight:600;color:var(--muted)}
.in-{width:100%;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;outline:none}
.in-:focus{border-color:var(--accent)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:999px;padding:8px 6px;cursor:pointer;font-weight:600;font-size:.88rem;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools .in-{flex:1;min-width:160px}
.tbl-wrap{overflow-x:auto;margin:0 -4px}
table.t{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
table.t th{text-align:left;font-size:.76rem;color:var(--muted);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t .r{text-align:right;white-space:nowrap}
table.t tr.click{cursor:pointer}table.t tr.click:hover td{background:var(--soft)}
.sku{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--muted)}
.pill{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-ok{background:var(--okbg);color:var(--accent)}.p-low{background:var(--warnbg);color:var(--warn)}.p-out{background:var(--dangerbg);color:var(--danger)}
.p-in{background:var(--okbg);color:var(--in)}.p-outm{background:var(--dangerbg);color:var(--out)}.p-adj{background:#E6EEFB;color:var(--adj)}
.qin{color:var(--in);font-weight:700}.qout{color:var(--out);font-weight:700}.qadj{color:var(--adj);font-weight:700}
.empty{text-align:center;padding:26px 10px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.note{font-size:.8rem;color:var(--muted)}
.warn{background:var(--warnbg);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:.86rem}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,1fr) minmax(0,1.2fr) auto;gap:8px;align-items:end;border:1px solid var(--line);border-radius:12px;padding:10px}
.line.nocost{grid-template-columns:minmax(0,3fr) minmax(0,1fr) auto}
@media(max-width:620px){.line,.line.nocost{grid-template-columns:1fr 1fr}.line .f:first-child{grid-column:1/-1}}
.line .x{border:0;background:none;color:var(--muted);font-size:1.1rem;cursor:pointer;padding:8px}
.line .bal{font-size:.78rem;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:.88rem}
.bar .tr{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:4px}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
dialog{border:0;border-radius:18px;padding:0;max-width:min(720px,calc(100% - 24px));width:100%;background:var(--card);color:var(--ink);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .dh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);z-index:1}
dialog .db{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:150;font-size:.9rem;max-width:calc(100% - 32px);text-align:center}
.cta{background:linear-gradient(135deg,#FDF1EC,#F4F6F5);color:#0F1513;border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 0 0 1px var(--line)}
.cta b{display:block}
body.edm-ro .edm-lock{pointer-events:none;opacity:.45;filter:grayscale(.4)}
/* print */
#printArea{display:none}
.page{background:#fff;color:#111;font-size:8.6pt;line-height:1.45}
.page h1{font-size:14pt;margin:0;color:#127A4B}
.page .ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px;gap:12px}
.page table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.page th{color:#127A4B;border-bottom:1.5px solid #127A4B;padding:4px 6px;text-align:right;font-weight:700}
.page th:nth-child(-n+3){text-align:left}
.page td{padding:3px 6px;border-bottom:1px solid #e6e9e7;text-align:right}
.page td:nth-child(-n+3){text-align:left}
.page tfoot td{font-weight:700;border-top:1.2px solid #111}
.page .pf{margin-top:10px;font-size:7.5pt;color:#888;text-align:center}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  header.top,main,.toast,dialog,.edm-bar,.edm-gate{display:none!important}
  #printArea{display:block}
}
.hint{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:.86rem;line-height:1.55}.hint a{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="/">📊 Excel Data Master <small>· ระบบสต๊อกสินค้า</small></a>
  <nav class="nav">
    <button class="btn sm ghost" id="dataBtn">💾 สำรอง / นำเข้า</button>
    <a class="btn sm main" href="/app/">🏪 ระบบร้านค้า</a>
    <a class="btn sm ghost" href="/bill/">🧾 เปิดบิล</a>
    <a class="btn sm ghost" href="/account/">📒 บัญชี</a>
    <a class="btn sm ghost" href="/">🛒 ร้านเทมเพลต</a>
  </nav>
</div></header>

<main>
  <div class="tabs" id="tabs">
    <button data-v="home">📊 ภาพรวม</button>
    <button data-v="items">📦 สินค้า</button>
    <button data-v="move">⇄ รับเข้า / เบิกออก</button>
    <button data-v="report">📄 รายงาน</button>
  </div>
  <div id="view"></div>
  <div class="cta"><div style="flex:1;min-width:200px"><b>อยากได้ระบบสต๊อกใน Excel หรือ Google Sheets?</b><span class="note" style="color:#555">เทมเพลตสต๊อก รับ-จ่าย และรายงานพร้อมใช้</span></div><a class="btn main" href="/">ดูเทมเพลต →</a></div>
</main>

<div id="printArea"></div>
<dialog id="dlg"><div class="dh"><b id="dlgTitle"></b><button class="btn sm ghost" onclick="dlg.close()" aria-label="ปิด">✕</button></div><div class="db" id="dlgBody"></div></dialog>
<div class="toast" id="toast" hidden></div>
<datalist id="plist"></datalist>

<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2800)}
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){toast("บันทึกไม่ได้: พื้นที่ในเครื่องเต็มหรือเบราว์เซอร์ไม่อนุญาต");return false}}};
const K={items:"edm_stock_items",tx:"edm_stock_tx",cfg:"edm_stock_cfg",ui:"edm_stock_ui"};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=v=>{const n=parseFloat(String(v==null?"":v).replace(/,/g,""));return isFinite(n)?n:0};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100, r4=n=>Math.round((n+Number.EPSILON)*10000)/10000;
const fmt=n=>r2(n).toLocaleString("th-TH",{minimumFractionDigits:2,maximumFractionDigits:2});
const fq=n=>(+n||0).toLocaleString("th-TH",{maximumFractionDigits:3});
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
const addDays=(d,n)=>{const x=new Date(d+"T00:00:00Z");x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const MS=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const thD=d=>{if(!d)return"";const[y,m,dd]=d.split("-");return +dd+" "+MS[+m-1]+" "+String(+y+543).slice(2)};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const TY={in:["รับเข้า","p-in","qin","+"],out:["เบิก/ขายออก","p-outm","qout","−"],adj:["ปรับยอด","p-adj","qadj",""]};

let items=LS.get(K.items,[]), tx=LS.get(K.tx,[]), cfg=Object.assign({name:""},LS.get(K.cfg,{}));
let ui=Object.assign({v:"home",q:"",cat:"",mtype:"in",hf:"all",hm:today().slice(0,7),rm:today().slice(0,7)},LS.get(K.ui,{}));
const svI=()=>LS.set(K.items,items), svT=()=>LS.set(K.tx,tx), svU=()=>LS.set(K.ui,ui);
const byId=id=>items.find(i=>i.id===id);
// อ่านใหม่ทุกครั้งที่กลับมาหน้านี้ (หน้าเปิดบิลอาจตัดสต๊อกไปแล้ว)
window.addEventListener("storage",e=>{if(e.key===K.tx||e.key===K.items){items=LS.get(K.items,[]);tx=LS.get(K.tx,[]);render()}});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"){items=LS.get(K.items,[]);tx=LS.get(K.tx,[]);render()}});

/* ---------- คำนวณ: ยอดคงเหลือ + ต้นทุนเฉลี่ยถ่วงน้ำหนัก ---------- */
const sortTx=a=>a.slice().sort((x,y)=>String(x.date).localeCompare(String(y.date))||(x.ts||0)-(y.ts||0));
function compute(upto){ // upto: วันที่ (รวมวันนั้น) ถ้าไม่ใส่ = ทั้งหมด
  const S={};items.forEach(i=>S[i.id]={bal:0,avg:num(i.cost),inQ:0,outQ:0,adjQ:0,last:""});
  sortTx(tx).forEach(t=>{if(upto&&t.date>upto)return;const s=S[t.pid];if(!s)return;const q=num(t.qty);
    if(t.type==="in"){const c=num(t.cost)||s.avg;const nb=s.bal+q;s.avg=nb>0?r4((Math.max(s.bal,0)*s.avg+q*c)/(Math.max(s.bal,0)+q)):c;s.bal=r4(nb);s.inQ+=q}
    else if(t.type==="out"){s.bal=r4(s.bal-q);s.outQ+=q}
    else{s.bal=r4(s.bal+q);s.adjQ+=q}
    s.last=t.date});
  Object.values(S).forEach(s=>s.value=r2(Math.max(s.bal,0)*s.avg));return S;
}
function status(i,s){if(s.bal<=0)return["หมด","p-out"];if(num(i.min)>0&&s.bal<=num(i.min))return["ใกล้หมด","p-low"];return["ปกติ","p-ok"]}
function period(from,to){ // ยกมา / รับ / จ่าย / ปรับ / คงเหลือ ในช่วง
  const open=compute(addDays(from,-1)),close=compute(to),R={};
  items.forEach(i=>R[i.id]={open:open[i.id].bal,inQ:0,outQ:0,adjQ:0,close:close[i.id].bal,avg:close[i.id].avg,value:close[i.id].value,inV:0});
  tx.forEach(t=>{if(t.date<from||t.date>to||!R[t.pid])return;const q=num(t.qty);if(t.type==="in"){R[t.pid].inQ+=q;R[t.pid].inV+=q*num(t.cost)}else if(t.type==="out")R[t.pid].outQ+=q;else R[t.pid].adjQ+=q});
  return R;
}
const monthRange=ym=>{const[y,m]=ym.split("-").map(Number);const last=new Date(y,m,0).getDate();return[ym+"-01",ym+"-"+String(last).padStart(2,"0")]};
const ymLabel=ym=>{const[y,m]=ym.split("-").map(Number);return MONTHS[m-1]+" "+(y+543)};

/* ---------- views ---------- */
function render(){
  $$("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===ui.v));
  ({home:vHome,items:vItems,move:vMove,report:vReport}[ui.v]||vHome)();
  refreshList();
}
function refreshList(){$("#plist").innerHTML=items.slice().sort((a,b)=>a.name.localeCompare(b.name,"th")).map(i=>`<option value="${esc(label(i))}"></option>`).join("")}
const label=i=>(i.sku?i.sku+" · ":"")+i.name;
const findByLabel=v=>{v=String(v||"").trim();return items.find(i=>label(i)===v)||items.find(i=>i.sku&&i.sku.toLowerCase()===v.toLowerCase())||items.find(i=>i.name===v)};

function emptyState(){return`<div class="card"><div class="empty"><div style="font-size:2rem">📦</div><b>ยังไม่มีสินค้าในสต๊อก</b><div>เริ่มเพิ่มสินค้าชิ้นแรก หรือลองดูระบบด้วยข้อมูลตัวอย่าง</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button class="btn main edm-lock" data-act="add">＋ เพิ่มสินค้า</button><button class="btn ghost edm-lock" data-act="demo">✨ ลองใส่ข้อมูลตัวอย่าง</button></div></div></div>`}

function vHome(){
  if(!items.length){$("#view").innerHTML=emptyState();return}
  const S=compute(),[f,t]=monthRange(today().slice(0,7)),P=period(f,t);
  let val=0,low=[],out=[];items.forEach(i=>{const s=S[i.id];val+=s.value;const st=status(i,s);if(st[0]==="หมด")out.push(i);else if(st[0]==="ใกล้หมด")low.push(i)});
  let mIn=0,mOut=0;Object.values(P).forEach(p=>{mIn+=p.inV});items.forEach(i=>mOut+=P[i.id].outQ*S[i.id].avg);
  const alert=out.concat(low);
  const recent=sortTx(tx).reverse().slice(0,8);
  const top=items.map(i=>({i,q:P[i.id].outQ})).filter(x=>x.q>0).sort((a,b)=>b.q-a.q).slice(0,6),mx=top.length?top[0].q:1;
  $("#view").innerHTML=`<div class="kpis">
    <div class="kpi"><span>สินค้าทั้งหมด</span><b>${items.length}</b> <span>รายการ</span></div>
    <div class="kpi"><span>มูลค่าสต๊อก (ทุน)</span><b>฿${fmt(val)}</b></div>
    <div class="kpi warn"><span>ใกล้หมด</span><b>${low.length}</b> <span>รายการ</span></div>
    <div class="kpi bad"><span>หมดสต๊อก</span><b>${out.length}</b> <span>รายการ</span></div></div>
  <div class="grid2">
    <div class="card"><h2>⚠️ ต้องสั่งเพิ่ม <small>${alert.length?alert.length+" รายการ":""}</small></h2>
      ${alert.length?`<div class="tbl-wrap"><table class="t"><thead><tr><th>สินค้า</th><th class="r">คงเหลือ</th><th class="r">ขั้นต่ำ</th><th></th></tr></thead><tbody>${alert.map(i=>{const s=S[i.id],st=status(i,s);return`<tr><td><b>${esc(i.name)}</b><br><span class="sku">${esc(i.sku||"")}</span></td><td class="r">${fq(s.bal)} ${esc(i.unit)}</td><td class="r">${fq(i.min)}</td><td class="r"><span class="pill ${st[1]}">${st[0]}</span> <button class="btn sm ghost edm-lock" data-in="${i.id}">รับเข้า</button></td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty" style="padding:14px">ไม่มีสินค้าใกล้หมด 🎉</div>`}
    </div>
    <div class="card"><h2>🔥 จ่ายออกมากสุด <small>${ymLabel(today().slice(0,7))}</small></h2>

    <div class="row3"><div class="f"><label>วันที่</label><input class="in-" type="date" id="mDate" value="${esc(d.date)}"></div>
      <div class="f"><label>${isIn?"ผู้ขาย / ซัพพลายเออร์":isAdj?"ผู้ตรวจนับ":"ลูกค้า / ผู้เบิก"}</label><input class="in-" id="mParty" value="${esc(d.party)}"></div>

    <div class="lines" id="lines">${d.lines.map((l,k)=>{const it=byId(l.pid),s=it?S[it.id]:null;return`<div class="line ${isIn?"":"nocost"}" data-k="${k}">
      <div class="f"><label>สินค้า ${k+1}</label><input class="in-" list="plist" data-l="pid" value="${esc(it?label(it):"")}" placeholder="พิมพ์ชื่อหรือรหัสสินค้า"><span class="bal">${it?`คงเหลือ ${fq(s.bal)} ${esc(it.unit)} · ทุนเฉลี่ย ${fmt(s.avg)}`:""}</span></div>

      <button class="x" data-rm="${k}" title="ลบบรรทัด" type="button">✕</button></div>`}).join("")}</div>

  $$("[data-rm]").forEach(b=>b.onclick=()=>{sync();d.lines.splice(+b.dataset.rm,1);if(!d.lines.length)d.lines.push({pid:"",qty:"",cost:"",count:""});vMove()});

}
function saveMove(){
  const d=draft,S=compute(),w=[];
  const lines=d.lines.filter(l=>l.pid||(l._txt||"").trim());
  if(!lines.length)return toast("เลือกสินค้าอย่างน้อย 1 รายการ");
  for(const l of lines){if(!l.pid)return toast("ไม่พบสินค้า \""+l._txt+"\" ในรายการ · เพิ่มสินค้าที่แท็บ 📦 สินค้า ก่อน");
    if(d.type==="adj"){if(l.count===""||num(l.count)<0)return toast("ใส่จำนวนที่นับได้ของ "+byId(l.pid).name)}
    else if(num(l.qty)<=0)return toast("ใส่จำนวนของ "+byId(l.pid).name)}
  if(d.type==="out"){const need={};lines.forEach(l=>need[l.pid]=(need[l.pid]||0)+num(l.qty));
    Object.keys(need).forEach(pid=>{const bal=compute(d.date)[pid].bal;if(need[pid]>bal)w.push(byId(pid).name+" คงเหลือ "+fq(bal)+" แต่เบิก "+fq(need[pid]))})}
  if(w.length&&!confirm("สต๊อกไม่พอ:\n• "+w.join("\n• ")+"\n\nยังต้องการบันทึก (ยอดจะติดลบ)?"))return;
  const batch=uid("b"),now=Date.now();let n=0;
  lines.forEach((l,k)=>{const base={id:uid("t"),batch,date:d.date||today(),pid:l.pid,party:d.party.trim(),ref:d.ref.trim(),note:d.note.trim(),ts:now+k};
    if(d.type==="adj"){const bal=compute(d.date)[l.pid].bal;const delta=r4(num(l.count)-bal);if(delta===0)return;tx.push(Object.assign(base,{type:"adj",qty:delta,note:(base.note?base.note+" · ":"")+"นับได้ "+fq(l.count)+" (ในระบบ "+fq(bal)+")"}))}
    else tx.push(Object.assign(base,{type:d.type,qty:num(l.qty),cost:d.type==="in"?num(l.cost):0}));n++});
  svT();draft=null;toast(n?"บันทึกแล้ว "+n+" รายการ ✓":"ยอดตรงกับระบบอยู่แล้ว ไม่ต้องปรับ");vMove();
}

    const o={sku,name,cat:$("#iCat").value.trim(),unit:$("#iUnit").value.trim()||"ชิ้น",cost:num($("#iCost").value),price:num($("#iPrice").value),min:num($("#iMin").value),note:$("#iNote").value.trim()};
    if(id)Object.assign(byId(id),o);else{const it=Object.assign({id:uid("p"),created:Date.now()},o);items.push(it);const op=num(($("#iOpen")||{}).value);if(op>0){tx.push({id:uid("t"),type:"in",date:today(),pid:it.id,qty:op,cost:o.cost,note:"ยอดยกมา",ts:Date.now()});svT()}}
    svI();dlg.close();toast("บันทึกสินค้าแล้ว ✓");render()};
  if(id)$("#iDel").onclick=()=>{const n=tx.filter(t=>t.pid===id).length;if(!confirm("ลบ \""+i.name+"\""+(n?" และประวัติรับ-จ่าย "+n+" รายการ":"")+"?"))return;items=items.filter(x=>x.id!==id);tx=tx.filter(t=>t.pid!==id);svI();svT();dlg.close();render()};
}
function stockCard(id){
  const i=byId(id);if(!i)return;let bal=0,avg=num(i.cost);
  const rows=sortTx(tx.filter(t=>t.pid===id)).map(t=>{const q=num(t.qty);if(t.type==="in"){const c=num(t.cost)||avg;avg=bal+q>0?r4((Math.max(bal,0)*avg+q*c)/(Math.max(bal,0)+q)):c;bal=r4(bal+q)}else if(t.type==="out")bal=r4(bal-q);else bal=r4(bal+q);return{t,bal,avg}});
  const st=status(i,{bal});
  openDlg("บัญชีคุมสต๊อก · "+i.name,`<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><span class="pill ${st[1]}">${st[0]}</span><b>คงเหลือ ${fq(bal)} ${esc(i.unit)}</b><span class="note">ทุนเฉลี่ย ${fmt(avg)} · มูลค่า ${fmt(Math.max(bal,0)*avg)} · ราคาขาย ${fmt(i.price)}</span></div>
   <div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm main edm-lock" data-in="${id}">⬇️ รับเข้า</button><button class="btn sm ghost edm-lock" data-outq="${id}">⬆️ เบิกออก</button><button class="btn sm ghost edm-lock" data-adjq="${id}">🔍 ตรวจนับ</button><button class="btn sm ghost edm-lock" data-edit="${id}">✏️ แก้ไขสินค้า</button></div>
   <div class="tbl-wrap"><table class="t"><thead><tr><th>วันที่</th><th>รายการ</th><th class="r">รับ</th><th class="r">จ่าย</th><th class="r">คงเหลือ</th><th class="r">ทุนเฉลี่ย</th></tr></thead><tbody>
   ${rows.reverse().map(({t,bal,avg})=>{const q=num(t.qty);return`<tr><td style="white-space:nowrap">${thD(t.date)}</td><td>${TY[t.type][0]}${t.party?" · "+esc(t.party):""}${t.ref?` <span class="sku">${esc(t.ref)}</span>`:""}${t.note?`<br><span class="note">${esc(t.note)}</span>`:""}</td><td class="r qin">${t.type==="in"||t.type==="adj"&&q>0?fq(Math.abs(q)):""}</td><td class="r qout">${t.type==="out"||t.type==="adj"&&q<0?fq(Math.abs(q)):""}</td><td class="r"><b>${fq(bal)}</b></td><td class="r">${fmt(avg)}</td></tr>`}).join("")||`<tr><td colspan="6" class="note" style="text-align:center">ยังไม่มีความเคลื่อนไหว</td></tr>`}
   </tbody></table></div>`);
}

/* ---------- Excel ---------- */
function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)})}
function exportExcel(){
  if(!items.length)return toast("ยังไม่มีสินค้า");toast("กำลังสร้างไฟล์ Excel...");
  return loadXLSX().then(X=>{
    const wb=X.utils.book_new(),S=compute(),[f,t]=monthRange(ui.rm),P=period(f,t);
    const mk=(rows,w,money,qty)=>{const ws=X.utils.aoa_to_sheet(rows);ws["!cols"]=w.map(x=>({wch:x}));const R=X.utils.decode_range(ws["!ref"]);
      for(let r=1;r<=R.e.r;r++){(money||[]).forEach(c=>{const a=X.utils.encode_cell({r,c});if(ws[a]&&ws[a].t==="n")ws[a].z="#,##0.00"});(qty||[]).forEach(c=>{const a=X.utils.encode_cell({r,c});if(ws[a]&&ws[a].t==="n")ws[a].z="#,##0.###"})}
      ws["!autofilter"]={ref:ws["!ref"]};return ws};
    const list=items.slice().sort((a,b)=>(a.cat||"").localeCompare(b.cat||"","th")||a.name.localeCompare(b.name,"th"));
    const A=[["รหัส","สินค้า","หมวด","หน่วย","คงเหลือ","จุดสั่งซื้อ","สถานะ","ทุนเฉลี่ย","ราคาขาย","มูลค่าคงเหลือ","เคลื่อนไหวล่าสุด"]];
    list.forEach(i=>{const s=S[i.id];A.push([i.sku||"",i.name,i.cat||"",i.unit,s.bal,num(i.min),status(i,s)[0],s.avg,num(i.price),s.value,s.last?new Date(s.last+"T00:00:00"):""])});
    X.utils.book_append_sheet(wb,mk(A,[12,30,14,8,10,10,9,12,12,14,14],[7,8,9],[4,5]),"คงเหลือ "+thD(today()).replace(/ /g,"-"));
    const B=[["รหัส","สินค้า","หน่วย","ยกมา","รับเข้า","จ่ายออก","ปรับยอด","คงเหลือ","ทุนเฉลี่ย","มูลค่า","มูลค่ารับเข้า"]];
    list.forEach(i=>{const p=P[i.id];B.push([i.sku||"",i.name,i.unit,p.open,p.inQ,p.outQ,p.adjQ,p.close,p.avg,p.value,r2(p.inV)])});
    X.utils.book_append_sheet(wb,mk(B,[12,30,8,10,10,10,10,10,12,14,14],[8,9,10],[3,4,5,6,7]),"รายงาน "+MS[+ui.rm.slice(5)-1]+" "+String(+ui.rm.slice(0,4)+543).slice(2));
    const C=[["วันที่","ประเภท","รหัส","สินค้า","จำนวน","หน่วย","ทุน/หน่วย","มูลค่า","คู่ค้า","เอกสารอ้างอิง","ที่มา","หมายเหตุ"]];
    sortTx(tx).forEach(tt=>{const i=byId(tt.pid)||{};const q=num(tt.qty)*(tt.type==="out"?-1:1);C.push([new Date(tt.date+"T00:00:00"),TY[tt.type][0],i.sku||"",i.name||"",q,i.unit||"",tt.type==="in"?num(tt.cost):"",tt.type==="in"?r2(q*num(tt.cost)):"",tt.party||"",tt.ref||"",tt.src==="bill"?"หน้าเปิดบิล":tt.src==="acc"?"ใบซื้อ (บัญชี)":"บันทึกเอง",tt.note||""])});
    const wc=mk(C,[11,12,12,30,10,8,12,12,22,14,12,28],[6,7],[4]);const RC=X.utils.decode_range(wc["!ref"]);for(let r=1;r<=RC.e.r;r++){const a=X.utils.encode_cell({r,c:0});if(wc[a])wc[a].z="d/m/yyyy"}
    X.utils.book_append_sheet(wb,wc,"ความเคลื่อนไหว");
    X.writeFile(wb,"สต๊อกสินค้า-"+(cfg.name?cfg.name.replace(/[\\/:*?"<>|]/g,"")+"-":"")+today()+".xlsx");toast("ดาวน์โหลดไฟล์ Excel แล้ว ✓");
  }).catch(()=>toast("สร้างไฟล์ไม่สำเร็จ ตรวจอินเทอร์เน็ตแล้วลองอีกครั้ง"));
}

/* ---------- events ---------- */
// เปิดบัญชีคุมสต๊อกของสินค้าจากการค้นหาในระบบร้านค้า (#card=<id>)
window.edmStockView=v=>{if(!["home","items","move","report"].includes(v))return;ui.v=v;svU();render();scrollTo(0,0)};
const cardFromHash=()=>{const m=/card=([\w-]+)/.exec(location.hash);if(!m)return;history.replaceState(null,"",location.pathname+location.search);if(items.some(i=>i.id===m[1]))stockCard(m[1])};
window.addEventListener("hashchange",cardFromHash);setTimeout(cardFromHash,0);
$("#tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;ui.v=b.dataset.v;svU();render();scrollTo(0,0)};
document.addEventListener("click",e=>{const b=e.target.closest("[data-act],[data-card],[data-in],[data-outq],[data-adjq],[data-edit],[data-deltx],[data-go]");if(!b)return;
  if(b.dataset.act==="add")return itemForm();
  if(b.dataset.act==="demo"){if(confirm("ใส่ข้อมูลตัวอย่างร้านค้าย้อนหลัง 3 เดือน ให้ทุกระบบ?\n(เปิดบิล · ภาษี · สต๊อก · ซื้อสินค้า · ค่าใช้จ่าย · บัญชี)\n\nข้อมูลเดิมในเครื่องนี้จะถูกแทนที่ ถ้ามีข้อมูลจริง ให้สำรองก่อน"))location.href="/account/?v=38#demo&back=/stock/";return}
  if(b.dataset.go){ui.v=b.dataset.go;svU();render();return}
