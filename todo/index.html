<style>
:root{color-scheme:light;--bg:#FFF6F9;--card:#fff;--ink:#2B1A22;--muted:#7A6670;--line:#F0D3DE;--grid:#F4DCE5;--a:#D6457A;--a-ink:#fff;--a2:#FBE3EC;--a3:#F6C3D5;--head:#E8779F;--ok:#2E8B57;--okbg:#E3F4EA;--late:#C62828;--latebg:#FDE7E7;--soon:#B26A00;--soonbg:#FFF2D9;--hol:#C62828}
:root[data-skin="beige"]{--bg:#FAF5EE;--ink:#2E2219;--muted:#7B6A5B;--line:#E8DAC8;--grid:#EFE3D3;--a:#8B5E3C;--a2:#F3E7D8;--a3:#E4CCAF;--head:#A9805E}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.55 "IBM Plex Sans Thai","Noto Sans Thai",Tahoma,system-ui,sans-serif}
a{color:inherit}button,input,select,textarea{font:inherit;color:inherit}
header.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
.top .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:700;text-decoration:none;display:flex;align-items:center;gap:6px;color:var(--a)}.brand small{font-weight:500;color:var(--muted)}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:8px;padding:7px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;background:var(--a2);color:var(--ink);font-size:.88rem;min-height:38px}
.btn.main{background:var(--a);color:var(--a-ink)}[hidden]{display:none!important}.btn.buy{background:#FFE08A;color:#5A3443}.ic{width:1.35em;height:1.35em;flex:none;vertical-align:-.3em;display:inline-block}.ic.s{width:1.15em;height:1.15em;vertical-align:-.22em}.ic.xs{width:1em;height:1em;vertical-align:-.15em}.brand .ic{width:1.6em;height:1.6em}.stabs .ic{width:1.6em;height:1.6em}.stabs button{display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}.btn.sm{padding:4px 10px;font-size:.82rem;min-height:32px}.btn.danger{color:var(--late)}
main{max-width:1180px;margin:0 auto;padding:14px 16px 110px;display:flex;flex-direction:column;gap:14px}
.band{background:var(--head);color:#fff;border-radius:10px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.band h1{margin:0;font-size:1.25rem;letter-spacing:.06em}.band small{opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}

.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:1.6rem;line-height:1.2;color:var(--a)}.kpi span{font-size:.82rem;color:var(--muted)}
.kpi.late b{color:var(--late)}.kpi.ok b{color:var(--ok)}
.dash{display:grid;grid-template-columns:300px minmax(0,1fr) minmax(0,1fr);gap:12px}
.donut{width:170px;height:170px;border-radius:50%;margin:6px auto 4px;display:grid;place-items:center;background:conic-gradient(var(--a) calc(var(--p)*1%),var(--a2) 0)}

.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:.8rem}
.mini .h{font-weight:600;color:var(--muted);padding:2px 0}
.mini button{border:0;background:none;padding:5px 0;border-radius:6px;cursor:pointer;position:relative;min-height:32px}
.mini button.o{opacity:.35}.mini button.td{outline:2px solid var(--a);outline-offset:-2px}.mini button.sel{background:var(--a);color:#fff}
.mini button.hol{color:var(--hol)}.mini button.sel.hol{color:#fff}
.mini button i{position:absolute;left:50%;bottom:2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--a)}.mini button.sel i{background:#fff}
.mhd{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:6px}
.dlist{display:flex;flex-direction:column;gap:4px;margin-top:8px;font-size:.88rem}
.dlist input{accent-color:var(--a);width:18px;height:18px}.dlist div{display:flex;gap:6px;align-items:baseline;border-bottom:1px dashed var(--line);padding:3px 0}

.qa{display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--a);border-radius:10px;padding:4px 4px 4px 12px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select,.filters input[type=search]{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px;max-width:100%}
.filters input[type=search]{flex:1;min-width:150px}
.prog{display:flex;align-items:center;gap:10px;font-size:.88rem}.prog .tr{flex:1;height:12px;background:var(--a2);border-radius:999px;overflow:hidden}.prog .tr i{display:block;height:100%;background:var(--a)}
.tw{overflow-x:auto;border:1px solid var(--grid);border-radius:8px;background:var(--card)}
table.sh{border-collapse:collapse;width:100%;min-width:860px;font-size:.9rem}
.sh th{background:var(--head);color:#fff;font-weight:600;padding:8px 6px;text-align:left;white-space:nowrap;position:sticky;top:0}
.sh td{border-top:1px solid var(--grid);border-left:1px solid var(--grid);padding:0;height:40px;vertical-align:middle}
.sh td:first-child{border-left:0}
.sh tr:nth-child(even) td{background:#FFFBFD}
:root[data-skin="beige"] .sh tr:nth-child(even) td{background:#FDFAF6}
.sh .ix{width:38px;text-align:center;color:var(--muted);font-size:.78rem;background:#FAFAFA!important}
.sh .ck{width:44px;text-align:center}.sh .ck input{width:20px;height:20px;accent-color:var(--a);cursor:pointer;vertical-align:middle}
.sh input.cell,.sh select.cell{width:100%;border:0;background:transparent;padding:8px;min-height:40px;outline:none;border-radius:0}
.sh input.cell:focus,.sh select.cell:focus{box-shadow:inset 0 0 0 2px var(--a);background:#fff}
.sh select.cell{cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#999 50%),linear-gradient(135deg,#999 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 8px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:22px}
.sh tr.done input.ti{text-decoration:line-through;color:var(--muted)}
.sh tr.done td{background:#F7F7F7!important}
.sh .dt{position:relative;min-width:120px}.sh .dt span{display:block;padding:8px;white-space:nowrap}.sh .dt span.ph{color:#bbb}
.sh .dt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0}
.sh .left{white-space:nowrap;padding:0 8px;font-weight:600;font-size:.84rem;text-align:center}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:600;white-space:nowrap}
.p-late{background:var(--latebg);color:var(--late)}.p-soon{background:var(--soonbg);color:var(--soon)}.p-ok{background:var(--okbg);color:var(--ok)}.p-n{background:var(--a2);color:var(--ink)}
.pr-0{color:var(--late);font-weight:700}.pr-1{color:var(--soon);font-weight:600}.pr-2{color:var(--ok)}
.sh .del{width:40px;text-align:center}.sh .del button{border:0;background:none;cursor:pointer;color:#bbb;font-size:1rem;min-width:36px;min-height:36px}.sh .del button:hover{color:var(--late)}
.sh tr.new td{background:#FFFDF2!important}.sh tr.new input.ti::placeholder{color:#c9a}
.empty{padding:22px;text-align:center;color:var(--muted)}
/* big calendar */
.calbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.calbar select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--grid);border-radius:8px;overflow:hidden;background:var(--card)}
.cal .h{background:var(--head);color:#fff;font-weight:600;text-align:center;padding:6px 2px;font-size:.86rem}
.cal .c{border-top:1px solid var(--grid);border-left:1px solid var(--grid);min-height:calc(30px + var(--ln)*20px);padding:4px 5px;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:1px;background:var(--card);text-align:left;border-right:0;border-bottom:0}
.cal .c:nth-child(7n+1){border-left:0}
.cal .c.o{background:#FAFAFA;color:#aaa}.cal .c.td{box-shadow:inset 0 0 0 2px var(--a)}
.cal .c .dn{font-weight:700;font-size:.86rem;display:flex;justify-content:space-between;gap:4px}
.cal .c.hol .dn,.cal .c.wk .dn{color:var(--hol)}
.cal .c .hn{font-size:.66rem;color:var(--hol);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.cal .c .t{font-size:.76rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:20px;padding:0 4px;border-radius:4px;background:var(--a2)}
.cal .c .t.dn2{text-decoration:line-through;color:#999;background:#F1F1F1}.cal .c .t.lt{background:var(--latebg);color:var(--late)}
.cal .c .more{font-size:.72rem;color:var(--late);font-weight:700}

.lists{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lst{display:flex;flex-direction:column;gap:6px}
.lst .r{display:flex;gap:6px;align-items:center}.lst .r input[type=text]{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:36px}
.lst .r input[type=color]{width:36px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 8px;min-height:36px}
.skins{display:flex;gap:10px;flex-wrap:wrap}.skin{border:2px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer;background:var(--card);font-weight:600;display:flex;gap:8px;align-items:center}.skin.on{border-color:var(--a)}.skin i{width:22px;height:22px;border-radius:6px;display:inline-block}
.banner{background:var(--soonbg);color:var(--soon);border-radius:10px;padding:10px 14px;font-size:.88rem;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner .btn{background:var(--card)}
.info{background:var(--a2);border-radius:10px;padding:10px 12px;font-size:.86rem;line-height:1.6}
dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);box-shadow:0 30px 80px rgba(0,0,0,.3)}

.dlg{padding:16px;display:flex;flex-direction:column;gap:10px}.dlg h3{margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--a)}
.dlg .it{display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:6px 0}.dlg .it input{width:20px;height:20px;accent-color:var(--a)}.dlg .it.done span{text-decoration:line-through;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;z-index:70;max-width:calc(100vw - 32px);display:flex;gap:12px;align-items:center}
.toast[hidden]{display:none}.toast button{border:0;background:none;color:var(--a3);font-weight:700;cursor:pointer;padding:0}
@media (max-width:900px){.dash{grid-template-columns:1fr 1fr}.dash>.card:first-child{grid-column:1/-1}.lists{grid-template-columns:1fr 1fr}}

  .cal .c{padding:3px 2px;min-height:calc(26px + var(--ln)*16px)}.cal .c .t{font-size:.64rem;line-height:16px;padding:0 2px}.cal .c .hn{display:none}.cal .h{font-size:.74rem}
  .top .brand small{display:none}
  .stabs{padding-left:0;padding-right:0;gap:0}.stabs button{flex:1 1 0;padding:8px 2px;font-size:.84rem;min-width:0}}

.pr{font-family:"IBM Plex Sans Thai",Tahoma,sans-serif;color:#000;font-size:9.5pt;background:#fff}.pr h1{font-size:14pt;margin:0}
.pr .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px}

.pr .s{text-decoration:line-through;color:#777}.pr .cl td{height:78px;width:14.28%;font-size:8pt}.pr .cl td b{display:block}

 x=\"3.5\" y=\"8\" width=\"17\" height=\"9\" rx=\"3\" fill=\"#F9B8CF\"/><rect x=\"7\" y=\"14\" width=\"10\" height=\"6.5\" rx=\"1.2\" fill=\"#fff\"/><circle cx=\"17\" cy=\"11\" r=\".9\" fill=\"#5A3443\" stroke=\"none\"/>", "cart": "<path d=\"M4 10h16l-1.6 8.3a2.5 2.5 0 0 1-2.5 2H8.1a2.5 2.5 0 0 1-2.5-2z\" fill=\"#FFE08A\"/><path d=\"M8.5 10L11 5M15.5 10L13 5M9 13.5V17M12 13.5V17M15 13.5V17\"/>", "hol": "<path d=\"M6 21V4\"/><path d=\"M6 4.5h11l-2.5 3.5 2.5 3.5H6z\" fill=\"#FF8FB1\"/>", "warn": "<circle cx=\"12\" cy=\"12\" r=\"8.5\" fill=\"#FFE08A\"/><path d=\"M12 7.5V13\" stroke-width=\"2\"/><circle cx=\"12\" cy=\"16.3\" r=\"1.1\" fill=\"#5A3443\" stroke=\"none\"/>", "star": "<path d=\"M12 3.5l2.3 5 5.2.6-3.9 3.6 1.1 5.3L12 15.4 7.3 18l1.1-5.3-3.9-3.6 5.2-.6z\" fill=\"#FFE08A\"/><path d=\"M19.5 15.5v3M18 17h3\"/>"};
const ic=(n,c)=>`<svg class="ic${c?" "+c:""}" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="#5A3443" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICO[n]||""}</svg>`;
const DONE="เสร็จสิ้น";
const CFG0={cats:[{n:"งาน",c:"#E8779F"},{n:"การเงิน",c:"#5BA37A"},{n:"ลูกค้า",c:"#5B8BD6"},{n:"ส่วนตัว",c:"#B07CC6"}],pris:["สูง","ปานกลาง","ต่ำ"],sts:["รอดำเนินการ","กำลังแก้ไข","รอข้อมูลเพิ่ม","ยกเลิก"],lines:3,start:0,skin:"pink",title:"TO-DO LIST",soon:3};
let cfg=Object.assign({},CFG0,LS.get(K.cfg,{}));
let items=LS.get(K.items,[]);
let ui=Object.assign({tab:"dash",fp:"",fc:"",fs:"",q:"",hide:false,sort:"",ym:today().slice(0,7),sel:today()},LS.get(K.ui,{}));
const sv=()=>LS.set(K.items,items),svCfg=()=>LS.set(K.cfg,cfg),svUi=()=>LS.set(K.ui,ui);

function toast(m,undo){const t=$("#toast");t.innerHTML=esc(m)+(undo?' <button type="button" id="undo">เลิกทำ</button>':"");t.hidden=false;if(undo)$("#undo").onclick=()=>{undo();t.hidden=true};clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,undo?5000:2400)}
function openDlg(h){const d=$("#dlg");$("#dlgBody").innerHTML=h;$$("#dlgBody [data-x]").forEach(b=>b.onclick=closeDlg);if(!d.open)d.showModal()}

/* ---------- ข้อมูล ---------- */
const catOf=n=>cfg.cats.find(c=>c.n===n);
const priIx=p=>{const i=cfg.pris.indexOf(p);return i<0?9:i};
const stOf=i=>i.done?DONE:(i.st||cfg.sts[0]||"");
const live=()=>items.filter(i=>i.t&&stOf(i)!=="ยกเลิก");
const daysLeft=i=>i.due?Math.round((TH.dt(i.due)-TH.dt(today()))/864e5):null;
const isLate=i=>!i.done&&i.due&&i.due<today()&&stOf(i)!=="ยกเลิก";
function leftPill(i){if(i.done)return`<span class="pill p-ok">✓ เสร็จแล้ว</span>`;if(stOf(i)==="ยกเลิก")return`<span class="pill p-n">ยกเลิก</span>`;const n=daysLeft(i);if(n==null)return`<span class="muted">–</span>`;
  if(n<0)return`<span class="pill p-late">เลย ${-n} วัน</span>`;if(n===0)return`<span class="pill p-soon">วันนี้</span>`;if(n<=cfg.soon)return`<span class="pill p-soon">เหลือ ${n} วัน</span>`;return`<span class="pill p-n">เหลือ ${n} วัน</span>`}
function newItem(o){const it=Object.assign({id:uid(),t:"",pri:cfg.pris[1]||cfg.pris[0]||"",cat:"",due:"",st:cfg.sts[0]||"",done:false,c:Date.now()},o);items.push(it);sv();return it}
function setDone(it,v){if(ro())return;it.done=v;if(v)it.doneAt=Date.now();else delete it.doneAt;sv()}

/* ---------- แดชบอร์ด ---------- */
function bars(rows){const mx=Math.max(1,...rows.map(r=>r[1]));return`<div class="bars">${rows.map(r=>`<div class="bar"><span class="nm" title="${esc(r[0])}">${esc(r[0])}</span><span class="tr"><i style="width:${r[1]/mx*100}%;${r[2]?"background:"+r[2]:""}"></i></span><span class="v">${r[1]}</span></div>`).join("")}</div>`}
function miniCal(){const [y,m]=ui.ym.split("-").map(Number),first=new Date(y,m-1,1),off=(first.getDay()-cfg.start+7)%7,s=TH.add(TH.ymd(first),-off),t=today(),has={};
  items.forEach(i=>{if(i.t&&i.due)has[i.due]=1});
  let h="";for(let k=0;k<7;k++)h+=`<span class="h">${DS[(k+cfg.start)%7]}</span>`;
  for(let k=0;k<42;k++){const d=TH.add(s,k),x=TH.dt(d),o=x.getMonth()!==m-1;if(k===35&&o)break;const H=TH.hol(d);
    h+=`<button type="button" data-d="${d}" class="${o?"o ":""}${d===t?"td ":""}${d===ui.sel?"sel ":""}${H||x.getDay()===0?"hol":""}" title="${esc(H)}">${x.getDate()}${has[d]?"<i></i>":""}</button>`}
  return`<div class="mhd"><button class="btn sm ghost" data-mv="-1" type="button" aria-label="เดือนก่อน">‹</button><b>${MONTHS[m-1]} ${y+543}</b><button class="btn sm ghost" data-mv="1" type="button" aria-label="เดือนถัดไป">›</button></div><div class="mini">${h}</div>`}
function dayList(d){const L=items.filter(i=>i.t&&i.due===d).sort((a,b)=>priIx(a.pri)-priIx(b.pri)),H=TH.hol(d);
  return`<div class="dlist"><b>${thDL(d)}</b>${H?`<span class="small" style="color:var(--hol)">${ic("hol","s")} ${esc(H)}</span>`:""}${L.length?L.map(i=>`<div><input type="checkbox" data-ck="${i.id}" ${i.done?"checked":""} aria-label="เสร็จ"><span style="${i.done?"text-decoration:line-through;color:var(--muted)":""}">${esc(i.t)}</span><span class="small pr-${Math.min(priIx(i.pri),2)}" style="margin-left:auto">${esc(i.pri)}</span></div>`).join(""):`<span class="muted small">ไม่มีงานวันนี้</span>`}</div>`}
function vDash(){const L=live(),dn=L.filter(i=>i.done).length,tot=L.length,p=tot?Math.round(dn/tot*100):0,late=items.filter(isLate).length,wait=tot-dn,t=today();
  const soon=items.filter(i=>i.t&&!i.done&&i.due&&stOf(i)!=="ยกเลิก").sort((a,b)=>a.due<b.due?-1:1).slice(0,6);
  return demoBanner()+`<div class="band"><h1>${esc(cfg.title)}</h1><small>${thDL(t)}</small></div>
  <div class="kpis"><div class="kpi"><b>${tot}</b><span>งานทั้งหมด</span></div><div class="kpi ok"><b>${dn}</b><span>เสร็จสิ้น</span></div><div class="kpi"><b>${wait}</b><span>รอดำเนินการ</span></div><div class="kpi late"><b>${late}</b><span>เกินกำหนด</span></div></div>
  <div class="dash">
   <section class="card"><h2>ปฏิทิน <small class="muted">แตะวันเพื่อดูงาน</small></h2>${miniCal()}${dayList(ui.sel)}</section>
   <section class="card"><h2>ความคืบหน้ารวม</h2><div class="donut" style="--p:${p}"><div><span><b>${p}%</b><br><small>${dn} จาก ${tot} งาน</small></span></div></div>
     ${bars([["เสร็จสิ้น",dn,"var(--ok)"],["รอดำเนินการ",wait],["งานทั้งหมด",tot,"var(--head)"]])}
     <h2 style="margin-top:14px">ความสำคัญ <small class="muted">งานที่ยังไม่เสร็จ</small></h2>${bars(cfg.pris.map((n,k)=>[n,L.filter(i=>!i.done&&i.pri===n).length,["var(--late)","var(--soon)","var(--ok)"][k]]))}</section>
   <section class="card"><h2>สถานะ</h2>${bars(cfg.sts.map(n=>[n,items.filter(i=>i.t&&!i.done&&(i.st||cfg.sts[0])===n).length]).concat([[DONE,items.filter(i=>i.t&&i.done).length,"var(--ok)"]]))}
     <h2 style="margin-top:14px">หมวดหมู่</h2>${bars(cfg.cats.map(c=>[c.n,L.filter(i=>i.cat===c.n).length,c.c]).concat(L.some(i=>!i.cat)?[["ไม่ระบุ",L.filter(i=>!i.cat).length,"#bbb"]]:[]))}
     <h2 style="margin-top:14px">ใกล้ถึงกำหนด</h2>${soon.length?`<div class="dlist">${soon.map(i=>`<div><span>${esc(i.t)}</span><span style="margin-left:auto">${leftPill(i)}</span></div>`).join("")}</div>`:`<span class="muted small">ไม่มีงานค้าง ${ic("star","s")}</span>`}</section>
  </div>`}
function bindDash(){$$("[data-mv]").forEach(b=>b.onclick=()=>{mvMonth(+b.dataset.mv)});$$(".mini [data-d]").forEach(b=>b.onclick=()=>{ui.sel=b.dataset.d;svUi();render()});bindChecks()}
function bindChecks(){$$("[data-ck]").forEach(c=>c.onchange=()=>{const it=items.find(x=>x.id===c.dataset.ck);if(it){setDone(it,c.checked);render()}})}
function mvMonth(n){let [y,m]=ui.ym.split("-").map(Number);m+=n;if(m<1){m=12;y--}if(m>12){m=1;y++}ui.ym=y+"-"+String(m).padStart(2,"0");svUi();render()}

/* ---------- ตารางรายการ ---------- */
const opts=(L,v,blank)=>(blank!=null?`<option value="">${blank}</option>`:"")+L.map(n=>`<option ${n===v?"selected":""}>${esc(n)}</option>`).join("")+(v&&L.indexOf(v)<0?`<option selected>${esc(v)}</option>`:"");
function filtered(){const q=ui.q.trim().toLowerCase();let L=items.filter(i=>i.t&&(!ui.fp||i.pri===ui.fp)&&(!ui.fc||i.cat===ui.fc)&&(!ui.fs||stOf(i)===ui.fs)&&(!ui.hide||!i.done)&&(!q||i.t.toLowerCase().includes(q)));
  if(ui.sort==="due")L=L.slice().sort((a,b)=>(a.due||"9999")<(b.due||"9999")?-1:(a.due||"9999")>(b.due||"9999")?1:0);
  if(ui.sort==="pri")L=L.slice().sort((a,b)=>priIx(a.pri)-priIx(b.pri));
  if(ui.sort==="left")L=L.slice().sort((a,b)=>(a.done-b.done)||((a.due||"9999")<(b.due||"9999")?-1:1));
  return L}
function row(i,n){const c=catOf(i.cat);return`<tr data-id="${i.id}" class="${i.done?"done":""}">
  <td class="ix">${n}</td><td class="ck"><input type="checkbox" data-f="done" ${i.done?"checked":""} aria-label="เสร็จ"></td>
  <td style="min-width:220px"><input class="cell ti" data-f="t" value="${esc(i.t)}" aria-label="รายการ"></td>
  <td style="width:120px"><select class="cell pr-${Math.min(priIx(i.pri),2)}" data-f="pri" aria-label="ความสำคัญ">${opts(cfg.pris,i.pri,"–")}</select></td>
  <td style="width:130px"><select class="cell" data-f="cat" aria-label="หมวดหมู่" style="${c?"box-shadow:inset 4px 0 0 "+c.c:""}">${opts(cfg.cats.map(c=>c.n),i.cat,"–")}</select></td>
  <td class="dt" style="width:130px"><span class="${i.due?"":"ph"}">${i.due?thD(i.due):"เลือกวันที่"}</span><input type="date" data-f="due" value="${i.due||""}" aria-label="วันที่กำหนดเสร็จ"></td>
  <td style="width:140px">${i.done?`<span style="padding:8px;display:block;color:var(--ok);font-weight:600">${DONE}</span>`:`<select class="cell" data-f="st" aria-label="สถานะ">${opts(cfg.sts,i.st||cfg.sts[0])}</select>`}</td>
  <td class="left" style="width:110px">${leftPill(i)}</td>
  <td class="del"><button type="button" data-del="${i.id}" title="ลบแถว" aria-label="ลบแถว">✕</button></td></tr>`}
function vList(){const L=filtered(),A=live(),dn=A.filter(i=>i.done).length,p=A.length?Math.round(dn/A.length*100):0;
  return demoBanner()+`<div class="band"><h1>รายการสิ่งที่ต้องทำ</h1><small>${A.length} งาน · เสร็จ ${dn} · เกินกำหนด ${items.filter(isLate).length}</small></div>
  <div class="qa"><input id="qa" autocomplete="off" enterkeyhint="done" placeholder="พิมพ์งานแล้วกด Enter เช่น ส่งใบเสนอราคา พรุ่งนี้ ด่วน #ลูกค้า" aria-label="เพิ่มงาน"><button class="btn main" id="qaGo" type="button">+ เพิ่ม</button></div>
  <div class="prog"><span>ความคืบหน้า</span><span class="tr"><i style="width:${p}%"></i></span><b>${p}%</b></div>
  <div class="filters">
   <input type="search" id="q" placeholder="ค้นหารายการ" value="${esc(ui.q)}">
   <select id="fp" aria-label="กรองความสำคัญ">${opts(cfg.pris,ui.fp,"ความสำคัญ: ทั้งหมด")}</select>
   <select id="fc" aria-label="กรองหมวดหมู่">${opts(cfg.cats.map(c=>c.n),ui.fc,"หมวดหมู่: ทั้งหมด")}</select>
   <select id="fs" aria-label="กรองสถานะ">${opts(cfg.sts.concat([DONE]),ui.fs,"สถานะ: ทั้งหมด")}</select>
   <select id="so" aria-label="เรียงลำดับ"><option value="">เรียง: ตามที่เพิ่ม</option><option value="due" ${ui.sort==="due"?"selected":""}>เรียง: วันที่กำหนด</option><option value="pri" ${ui.sort==="pri"?"selected":""}>เรียง: ความสำคัญ</option><option value="left" ${ui.sort==="left"?"selected":""}>เรียง: ยังไม่เสร็จก่อน</option></select>
   <label class="small" style="display:flex;gap:6px;align-items:center;cursor:pointer"><input type="checkbox" id="hide" ${ui.hide?"checked":""} style="accent-color:var(--a)"> ซ่อนงานที่เสร็จ</label>
  </div>
  <div class="tw"><table class="sh"><thead><tr><th></th><th>✓</th><th>รายการ</th><th>ความสำคัญ</th><th>หมวดหมู่</th><th>วันที่กำหนดเสร็จ</th><th>สถานะ</th><th>วันคงเหลือ</th><th></th></tr></thead>
  <tbody>${L.map((i,k)=>row(i,k+1)).join("")}
  <tr class="new"><td class="ix">${L.length+1}</td><td class="ck"></td><td colspan="7"><input class="cell ti" id="newRow" placeholder="+ พิมพ์งานใหม่ในแถวนี้แล้วกด Enter" aria-label="แถวใหม่"></td></tr></tbody></table></div>
  ${L.length||!items.some(i=>i.t)?"":`<div class="empty">ไม่พบงานตามตัวกรอง</div>`}
  <p class="small muted" style="margin:0">แตะช่องเพื่อแก้ได้เลยเหมือนตาราง Excel · ติ๊ก ✓ แล้วรายการถูกขีดฆ่าให้อัตโนมัติ · ช่องวันคงเหลือนับให้เอง เลยกำหนดขึ้นสีแดง</p>`}
function quickAdd(v,el){v=(v||"").trim();if(!v||ro())return;const r=TH.parse(v);let cat="";const m=/#(\S+)/.exec(r.t);let t=r.t;if(m){cat=m[1];t=t.replace(m[0],"").trim();if(!catOf(cat)){cfg.cats.push({n:cat,c:"#E8779F"});svCfg()}}
  const it=newItem({t:t||v,due:r.d||"",cat,pri:r.pri?cfg.pris[0]:(cfg.pris[1]||cfg.pris[0])});toast("เพิ่มแล้ว: "+it.t+(it.due?" · "+thD(it.due):""));render();const n=$(el);if(n)n.focus()}
function bindList(){
  const qa=$("#qa");qa.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();const v=qa.value;qa.value="";quickAdd(v,"#qa")}};$("#qaGo").onclick=()=>{const v=qa.value;qa.value="";quickAdd(v,"#qa")};
  const nr=$("#newRow");nr.onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();const v=nr.value;nr.value="";quickAdd(v,"#newRow")}};nr.onblur=()=>{const v=nr.value;if(v.trim()){nr.value="";quickAdd(v)}};
  const q=$("#q");q.oninput=()=>{ui.q=q.value;svUi();const p=q.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)};
  [["fp","fp"],["fc","fc"],["fs","fs"],["so","sort"]].forEach(([id,k])=>$("#"+id).onchange=e=>{ui[k]=e.target.value;svUi();render()});
  $("#hide").onchange=e=>{ui.hide=e.target.checked;svUi();render()};
  $$(".sh tr[data-id]").forEach(tr=>{const it=items.find(x=>x.id===tr.dataset.id);if(!it)return;
    tr.querySelectorAll("[data-f]").forEach(el=>{const f=el.dataset.f;
      if(f==="t"){el.onchange=()=>{if(ro())return;const v=el.value.trim();if(!v){el.value=it.t;return}it.t=v;sv()};el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();el.blur()}};return}
      el.onchange=()=>{if(ro()){render();return}if(f==="done"){setDone(it,el.checked);if(el.checked)toast("เสร็จแล้ว ✓ "+it.t)}else{it[f]=el.value;sv()}render()}})});
  $$("[data-del]").forEach(b=>b.onclick=()=>{if(ro())return;const k=items.findIndex(x=>x.id===b.dataset.del);if(k<0)return;const [it]=items.splice(k,1);sv();render();toast("ลบแล้ว: "+it.t,()=>{items.splice(k,0,it);sv();render()})})}

/* ---------- ปฏิทินใหญ่ ---------- */
function calCells(){const [y,m]=ui.ym.split("-").map(Number),first=new Date(y,m-1,1),off=(first.getDay()-cfg.start+7)%7,s=TH.add(TH.ymd(first),-off),out=[];
  for(let k=0;k<42;k++){const d=TH.add(s,k),o=TH.dt(d).getMonth()!==m-1;if(k===35&&o)break;out.push({d,o})}return out}
const byDay=d=>items.filter(i=>i.t&&i.due===d&&stOf(i)!=="ยกเลิก").sort((a,b)=>(a.done-b.done)||priIx(a.pri)-priIx(b.pri));
function vCal(){const [y,m]=ui.ym.split("-").map(Number),t=today(),ln=cfg.lines,ys=[];for(let k=y-2;k<=y+3;k++)ys.push(k);
  let h="";for(let k=0;k<7;k++)h+=`<div class="h">${DW[(k+cfg.start)%7]}</div>`;
  calCells().forEach(({d,o})=>{const x=TH.dt(d),H=TH.hol(d),L=byDay(d),sh=L.slice(0,ln),more=L.length-sh.length;
    h+=`<button type="button" class="c${o?" o":""}${d===t?" td":""}${H?" hol":""}${x.getDay()===0||x.getDay()===6?" wk":""}" data-day="${d}"><span class="dn"><span>${x.getDate()}</span>${L.length?`<span class="small muted">${L.filter(i=>i.done).length}/${L.length}</span>`:""}</span>${H?`<span class="hn">${esc(H)}</span>`:""}${sh.map(i=>`<span class="t${i.done?" dn2":isLate(i)?" lt":""}" title="${esc(i.t)}" style="${!i.done&&!isLate(i)&&catOf(i.cat)?"box-shadow:inset 3px 0 0 "+catOf(i.cat).c:""}">${esc(i.t)}</span>`).join("")}${more>0?`<span class="more">${ic("warn","xs")} อีก ${more} งาน</span>`:""}</button>`});
  return`<div class="band"><h1>ปฏิทินงาน ${MONTHS[m-1]} ${y+543}</h1><small>แตะช่องวันเพื่อดู / เพิ่มงาน</small></div>
  <div class="calbar"><button class="btn sm ghost" data-mv="-1" type="button">‹ เดือนก่อน</button>
   <select id="cm" aria-label="เดือน">${MONTHS.map((n,k)=>`<option value="${k+1}" ${k+1===m?"selected":""}>${n}</option>`).join("")}</select>
   <select id="cy" aria-label="ปี พ.ศ.">${ys.map(k=>`<option value="${k}" ${k===y?"selected":""}>${k+543}</option>`).join("")}</select>
   <button class="btn sm ghost" data-mv="1" type="button">เดือนถัดไป ›</button>
   <button class="btn sm" id="cToday" type="button">เดือนนี้</button>
   <span class="small muted" style="margin-left:auto">เริ่มสัปดาห์ <select id="cs">${[0,1].map(k=>`<option value="${k}" ${cfg.start===k?"selected":""}>${DW[k]}</option>`).join("")}</select> · แสดง <select id="cl">${[1,2,3,4,5].map(k=>`<option ${cfg.lines===k?"selected":""}>${k}</option>`).join("")}</select> บรรทัด/วัน</span></div>
  <div class="cal" style="--ln:${ln}">${h}</div>
  <p class="small muted" style="margin:0">งานเกินจำนวนบรรทัดจะขึ้น <b style="color:var(--late)">${ic("warn","xs")} อีก N งาน</b> สีแดง · วันหยุดราชการไทยแสดงให้อัตโนมัติ</p>`}
function dayDlg(d){const L=byDay(d),H=TH.hol(d);
  openDlg(`<h3>${thDL(d)} <button class="btn sm ghost" data-x type="button">ปิด</button></h3>${H?`<div class="info">${ic("hol","s")} ${esc(H)}</div>`:""}
  <div>${L.length?L.map(i=>`<label class="it${i.done?" done":""}"><input type="checkbox" data-ck="${i.id}" ${i.done?"checked":""}><span>${esc(i.t)}</span><span class="small pr-${Math.min(priIx(i.pri),2)}" style="margin-left:auto">${esc(i.pri)}</span></label>`).join(""):`<p class="muted small" style="margin:0">ยังไม่มีงานวันนี้</p>`}</div>
  <div class="qa"><input id="dqa" placeholder="เพิ่มงานวันนี้ เช่น โทรหาลูกค้า ด่วน" autocomplete="off"><button class="btn main" id="dqaGo" type="button">เพิ่ม</button></div>`);
  $$("#dlgBody [data-ck]").forEach(c=>c.onchange=()=>{const it=items.find(x=>x.id===c.dataset.ck);if(it){setDone(it,c.checked);render();dayDlg(d)}});
  const add=()=>{const v=$("#dqa").value.trim();if(!v||ro())return;const r=TH.parse(v);newItem({t:r.t||v,due:d,pri:r.pri?cfg.pris[0]:(cfg.pris[1]||cfg.pris[0])});render();dayDlg(d);$("#dqa").focus()};
  $("#dqaGo").onclick=add;$("#dqa").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();add()}}}
function bindCal(){$$("[data-mv]").forEach(b=>b.onclick=()=>mvMonth(+b.dataset.mv));
  const go=()=>{ui.ym=$("#cy").value+"-"+String($("#cm").value).padStart(2,"0");svUi();render()};$("#cm").onchange=go;$("#cy").onchange=go;
  $("#cToday").onclick=()=>{ui.ym=today().slice(0,7);svUi();render()};
  $("#cs").onchange=e=>{cfg.start=+e.target.value;svCfg();render()};$("#cl").onchange=e=>{cfg.lines=+e.target.value;svCfg();render()};
  $$("[data-day]").forEach(b=>b.onclick=()=>dayDlg(b.dataset.day))}

/* ---------- ตั้งค่า ---------- */
function lst(k,label,hint){const L=cfg[k];return`<div class="card lst"><h2>${label}</h2>${L.map((v,j)=>{const n=k==="cats"?v.n:v;return`<div class="r">${k==="cats"?`<input type="color" value="${esc(v.c)}" data-lc="${j}" aria-label="สี">`:""}<input type="text" value="${esc(n)}" data-lk="${k}" data-lj="${j}" aria-label="${label}"><button class="btn sm ghost danger" data-ld="${k}" data-lj="${j}" type="button" aria-label="ลบ">✕</button></div>`}).join("")}
  <button class="btn sm" data-la="${k}" type="button">+ เพิ่ม</button><span class="small muted">${hint}</span></div>`}
function vSet(){return`<div class="band"><h1>ตั้งค่า (TO-DO LIST TAB)</h1><small>แก้รายการตัวเลือกได้เองเหมือนในไฟล์</small></div>
  <section class="card"><h2>หัวเรื่องและหน้าตา</h2><div class="row"><input type="text" id="ttl" value="${esc(cfg.title)}" style="border:1px solid var(--line);border-radius:8px;padding:6px 10px;min-height:36px;flex:1;min-width:180px" aria-label="ชื่อหัวเรื่อง">
   <span class="small">เตือนใกล้ถึงกำหนดล่วงหน้า <select id="soon">${[1,2,3,5,7].map(k=>`<option ${cfg.soon===k?"selected":""}>${k}</option>`).join("")}</select> วัน</span></div>
   <div class="skins" style="margin-top:10px"><button type="button" class="skin ${cfg.skin==="pink"?"on":""}" data-skin="pink"><i style="background:#E8779F"></i>โทนชมพู (แบบ Excel)</button><button type="button" class="skin ${cfg.skin==="beige"?"on":""}" data-skin="beige"><i style="background:#A9805E"></i>โทนน้ำตาล (แบบ Google Sheets)</button></div></section>
  <div class="lists">${lst("cats","หมวดหมู่","เพิ่มหมวดเร็ว ๆ ได้ด้วย #ชื่อหมวด ตอนพิมพ์งาน")}${lst("pris","ความสำคัญ","เรียงจากสำคัญมาก → น้อย · คำว่า “ด่วน” = อันดับแรก")}${lst("sts","สถานะ","สถานะ “เสร็จสิ้น” ใช้การติ๊ก ✓ · “ยกเลิก” ไม่นับในความคืบหน้า")}</div>
  <section class="card"><h2>${ic("cart","s")} ซื้อใช้งานต่อเนื่อง</h2><div class="row"><button class="btn sm buy" data-buy="m" type="button">รายเดือน 49 บาท</button><button class="btn sm main" data-buy="y" type="button">รายปี 490 บาท · ฟรี 2 เดือน</button></div>
   <p class="small muted" style="margin:8px 0 0">โอนแล้วแนบสลิปในหน้าถัดไป ใช้งานต่อได้ทันที 24 ชม. ระหว่างร้านตรวจยอด แล้วได้อีเมลแจ้งวันใช้งานเต็มแพ็ก</p></section>
  <section class="card"><h2>ข้อมูล</h2><div class="row"><button class="btn sm" id="demo" type="button">ใส่งานตัวอย่าง</button><button class="btn sm" id="clrDone" type="button">ลบงานที่เสร็จแล้ว</button><button class="btn sm ghost danger" id="wipe" type="button">ล้างข้อมูลทั้งหมด</button></div>
   <p class="small muted" style="margin:8px 0 0">ข้อมูลเก็บในเครื่องนี้ สมาชิกที่เข้าสู่ระบบจะสำรองขึ้นคลาวด์และใช้ได้หลายเครื่อง · กด ${ic("dl","s")} Excel ด้านบนเพื่อดาวน์โหลดเก็บไว้ในเครื่องกันพลาด (ไฟล์เป็นข้อมูลอย่างเดียว ไม่มีสูตร)</p></section>`}
function bindSet(){
  $("#ttl").onchange=e=>{cfg.title=e.target.value.trim()||"TO-DO LIST";svCfg()};$("#soon").onchange=e=>{cfg.soon=+e.target.value;svCfg()};
  $$("[data-skin]").forEach(b=>b.onclick=()=>{cfg.skin=b.dataset.skin;svCfg();document.documentElement.dataset.skin=cfg.skin;render()});
  $$("[data-lk]").forEach(el=>el.onchange=()=>{const k=el.dataset.lk,j=+el.dataset.lj,v=el.value.trim();if(!v){render();return}
    const old=k==="cats"?cfg.cats[j].n:cfg[k][j];if(cfg[k].some((x,q)=>q!==j&&(k==="cats"?x.n:x)===v)){toast("มีชื่อนี้แล้ว");render();return}
    if(k==="cats")cfg.cats[j].n=v;else cfg[k][j]=v;const f={cats:"cat",pris:"pri",sts:"st"}[k];items.forEach(i=>{if(i[f]===old)i[f]=v});sv();svCfg();toast("บันทึกแล้ว")});
  $$("[data-lc]").forEach(el=>el.onchange=()=>{cfg.cats[+el.dataset.lc].c=el.value;svCfg()});
  $$("[data-ld]").forEach(b=>b.onclick=()=>{const k=b.dataset.ld;if(cfg[k].length<=1){toast("ต้องมีอย่างน้อย 1 รายการ");return}cfg[k].splice(+b.dataset.lj,1);svCfg();render()});
  $$("[data-la]").forEach(b=>b.onclick=()=>{const k=b.dataset.la,base=k==="cats"?"หมวดใหม่":k==="pris"?"ระดับใหม่":"สถานะใหม่";let n=base,c=2;const has=x=>cfg[k].some(v=>(k==="cats"?v.n:v)===x);while(has(n))n=base+" "+c++;cfg[k].push(k==="cats"?{n,c:"#E8779F"}:n);svCfg();render();const L=$$(`[data-lk="${k}"]`);const e=L[L.length-1];e.focus();e.select()});
  $$("[data-buy]").forEach(b=>b.onclick=()=>{const M=window.EDM_MEMBER;if(M&&M.buyUrl)window.open(M.buyUrl("todo",b.dataset.buy),"_blank","noopener")});
  $("#demo").onclick=()=>{seed();ui.tab="list";svUi();render();toast("ใส่งานตัวอย่างแล้ว")};
  $("#clrDone").onclick=()=>{const n=items.filter(i=>i.done).length;if(!n){toast("ยังไม่มีงานที่เสร็จ");return}if(!confirm("ลบงานที่เสร็จแล้ว "+n+" รายการ?"))return;items=items.filter(i=>!i.done);sv();render()};
  $("#wipe").onclick=()=>{if(!confirm("ล้างงานทั้งหมดในเครื่องนี้? กู้คืนไม่ได้"))return;items=[];cfg.demo=false;sv();svCfg();render()}}

/* ---------- ตัวอย่าง / พิมพ์ / CSV ---------- */
function seed(){const t=today(),A=n=>TH.add(t,n),P=cfg.pris,S=cfg.sts,C=cfg.cats.map(c=>c.n);
  [["ส่งใบเสนอราคาให้ลูกค้า",P[0],C[2]||C[0],A(1),S[1]],["ยื่น ภ.พ.30 และนำส่งภาษี",P[0],C[1]||C[0],A(3),S[0]],["โอนเงินเดือนพนักงาน",P[0],C[1]||C[0],A(5),S[0]],["ตามเอกสารจากซัพพลายเออร์",P[1],C[0],A(-1),S[2]||S[0]],["ประชุมทีมประจำสัปดาห์",P[1],C[0],t,S[0]],["อัปเดตสต๊อกสินค้า",P[2]||P[1],C[0],A(2),S[0]],["ต่อประกันรถ",P[1],C[3]||C[0],A(9),S[0]],["นัดหมอฟัน",P[2]||P[1],C[3]||C[0],A(12),S[0]]]
  .forEach(r=>newItem({t:r[0],pri:r[1],cat:r[2],due:r[3],st:r[4]}));
  newItem({t:"สรุปยอดขายเดือนก่อน",pri:P[1],cat:C[0],due:A(-3),done:true});newItem({t:"จ่ายค่าไฟสำนักงาน",pri:P[0],cat:C[1]||C[0],due:A(-2),done:true});
  cfg.demo=true;svCfg()}
function demoBanner(){return cfg.demo?`<div class="banner"><span>${ic("star","s")} นี่คือ<b>งานตัวอย่าง</b> ลองติ๊ก แก้ หรือเพิ่มงานได้เลย</span><button class="btn sm" id="demoClr" type="button">ล้างตัวอย่าง เริ่มใช้จริง</button></div>`:""}
function printNow(){const t=today(),pa=$("#printArea");
  if(ui.tab==="cal"){const [y,m]=ui.ym.split("-").map(Number),cells=calCells();let rows="";for(let r=0;r<cells.length;r+=7)rows+="<tr>"+cells.slice(r,r+7).map(({d,o})=>{const L=byDay(d),H=TH.hol(d);return`<td style="${o?"color:#aaa":""}"><b>${TH.dt(d).getDate()}</b>${H?`<span style="color:#c00">${esc(H)}</span><br>`:""}${L.map(i=>`<span class="${i.done?"s":""}">• ${esc(i.t)}</span>`).join("<br>")}</td>`}).join("")+"</tr>";
    pa.innerHTML=`<div class="pr"><div class="hd"><h1>ปฏิทินงาน ${MONTHS[m-1]} ${y+543}</h1><span>${esc(cfg.title)}</span></div><table class="cl"><thead><tr>${[0,1,2,3,4,5,6].map(k=>`<th>${DW[(k+cfg.start)%7]}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;window.EDM_DOCNAME="ปฏิทินงาน-"+MONTHS[m-1]+"-"+(y+543)}
  else{const L=ui.tab==="list"?filtered():items.filter(i=>i.t),A=live(),dn=A.filter(i=>i.done).length;
    pa.innerHTML=`<div class="pr"><div class="hd"><h1>${esc(cfg.title)}</h1><span>พิมพ์ ${thD(t)} · เสร็จ ${dn}/${A.length} (${A.length?Math.round(dn/A.length*100):0}%) · เกินกำหนด ${items.filter(isLate).length}</span></div>
    <table><thead><tr><th>#</th><th>✓</th><th>รายการ</th><th>ความสำคัญ</th><th>หมวดหมู่</th><th>กำหนดเสร็จ</th><th>สถานะ</th><th>วันคงเหลือ</th></tr></thead><tbody>${L.map((i,k)=>{const n=daysLeft(i);return`<tr><td>${k+1}</td><td>${i.done?"☑":"☐"}</td><td class="${i.done?"s":""}">${esc(i.t)}</td><td>${esc(i.pri)}</td><td>${esc(i.cat)}</td><td>${thD(i.due)}</td><td>${esc(stOf(i))}</td><td>${i.done||n==null?"":n<0?"เลย "+(-n)+" วัน":n===0?"วันนี้":"เหลือ "+n+" วัน"}</td></tr>`}).join("")}</tbody></table></div>`;window.EDM_DOCNAME="ToDo-"+t}
  window.print()}
function loadXLSX(){return window.XLSX?Promise.resolve(window.XLSX):new Promise((ok,no)=>{const s=document.createElement("script");s.src="/assets/vendor/xlsx.full.min.js";s.onload=()=>ok(window.XLSX);s.onerror=no;document.head.appendChild(s)})}
function xlsx(){const L=items.filter(i=>i.t),A=live(),dn=A.filter(i=>i.done).length,t=today();toast("กำลังสร้างไฟล์ Excel...");
  loadXLSX().then(X=>{const rows=L.map((i,k)=>{const n=daysLeft(i);return[k+1,i.done?"✓":"",i.t,i.pri,i.cat,i.due?thD(i.due):"",stOf(i),i.done||n==null?"":n<0?"เลย "+(-n)+" วัน":n===0?"วันนี้":"เหลือ "+n+" วัน"]});
    const ws=X.utils.aoa_to_sheet([[cfg.title+" · ข้อมูล ณ "+thDL(t)],["งานทั้งหมด "+A.length+" · เสร็จ "+dn+" ("+(A.length?Math.round(dn/A.length*100):0)+"%) · เกินกำหนด "+items.filter(isLate).length],[],["#","เสร็จ","รายการ","ความสำคัญ","หมวดหมู่","วันที่กำหนดเสร็จ","สถานะ","วันคงเหลือ"]].concat(rows));
    ws["!cols"]=[{wch:5},{wch:6},{wch:42},{wch:12},{wch:14},{wch:16},{wch:16},{wch:14}];ws["!merges"]=[{s:{r:0,c:0},e:{r:0,c:7}},{s:{r:1,c:0},e:{r:1,c:7}}];
    const cnt=(f,v)=>L.filter(i=>f(i)===v).length,S=[["สรุป ณ "+thDL(t)],[],["ความสำคัญ","จำนวนงานที่ยังไม่เสร็จ"]].concat(cfg.pris.map(p=>[p,A.filter(i=>!i.done&&i.pri===p).length]),[[],["สถานะ","จำนวน"]],cfg.sts.concat([DONE]).map(x=>[x,cnt(stOf,x)]),[[],["หมวดหมู่","จำนวน"]],cfg.cats.map(c=>[c.n,cnt(i=>i.cat,c.n)]));
    const ws2=X.utils.aoa_to_sheet(S);ws2["!cols"]=[{wch:22},{wch:22}];
    const wb=X.utils.book_new();X.utils.book_append_sheet(wb,ws,"รายการ");X.utils.book_append_sheet(wb,ws2,"สรุป");X.writeFile(wb,"ToDo-"+t+".xlsx");toast("ดาวน์โหลดไฟล์ Excel แล้ว")}).catch(()=>toast("โหลดตัวสร้าง Excel ไม่สำเร็จ ลองใหม่อีกครั้ง"))}

/* ---------- render ---------- */
const V={dash:[vDash,bindDash],list:[vList,bindList],cal:[vCal,bindCal],set:[vSet,bindSet]};
function render(){if(!V[ui.tab])ui.tab="dash";{const bb=$("#buyBtn"),M=window.EDM_MEMBER;if(bb)bb.hidden=!!(M&&M.me&&M.me.paid)}const late=items.filter(isLate).length;
  $$("[data-tab]").forEach(b=>{b.classList.toggle("on",b.dataset.tab===ui.tab);b.setAttribute("aria-selected",b.dataset.tab===ui.tab);if(b.dataset.tab==="list")b.innerHTML=ic("list")+"รายการ"+(late?`<span class="n">${late}</span>`:"")});
  $("#main").innerHTML=V[ui.tab][0]();V[ui.tab][1]();
  const dc=$("#demoClr");if(dc)dc.onclick=()=>{items=[];cfg.demo=false;sv();svCfg();render();toast("ล้างตัวอย่างแล้ว เริ่มเพิ่มงานจริงได้เลย")}}
$$("[data-ic]").forEach(e=>{e.outerHTML=ic(e.dataset.ic)});
$("#buyBtn").onclick=e=>{const M=window.EDM_MEMBER;if(M&&M.buyUrl){e.preventDefault();window.open(M.buyUrl("todo"),"_blank","noopener")}};
$$("[data-tab]").forEach(b=>b.onclick=()=>{ui.tab=b.dataset.tab;svUi();render();window.scrollTo(0,0)});
$("#prBtn").onclick=printNow;$("#csvBtn").onclick=xlsx;
window.addEventListener("storage",e=>{if(e.key===K.items){items=LS.get(K.items,[]);render()}if(e.key===K.cfg){cfg=Object.assign({},CFG0,LS.get(K.cfg,{}));document.documentElement.dataset.skin=cfg.skin;render()}});
(function migrate(){if(items.length||LS.get(K.cfg,null))return;const old=LS.get("edm_todo_items",[]),oc=LS.get("edm_todo_cfg",{});if(!old.length||oc.demo)return;
  old.forEach(o=>{if(!o||!o.t)return;if(o.cat&&!catOf(o.cat))cfg.cats.push({n:o.cat,c:"#E8779F"});items.push({id:o.id||uid(),t:o.t,pri:o.pri?cfg.pris[0]:cfg.pris[1],cat:o.cat||"",due:o.d||"",st:cfg.sts[0],done:!!o.done,c:o.c||Date.now()})});sv();svCfg()})();
if(!items.length&&!LS.get(K.cfg,null)){seed()}
render();
})();
</script>
